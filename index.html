function applyLineWeight(){
  try{
    const mode=localStorage.getItem('suite_lineW')||'thick';
    const f=mode==='thin'?0.38:1;
    const root=document.getElementById('cv')||document.querySelector('svg.canvas')||document.querySelector('svg');
    if(!root) return;
    root.querySelectorAll('[stroke-width]').forEach(el=>{
      if(el.dataset.sw0==null) el.dataset.sw0=el.getAttribute('stroke-width')||'1';
      const base=parseFloat(el.dataset.sw0);
      if(!isFinite(base)) return;
      el.setAttribute('stroke-width', String(Math.max(0.25, base*f)));
    });
  }catch(e){}
}

/* ===== Frentes esquemáticos SM6 (SVG) ===== */
function faceSVG(it, x, y, w, h){
  const c=cat(it.type);
  const face = c.face||'generic';
  const ink = cvar('--ink'), mut=cvar('--mut');
  const sel = S.sel===it.id;
  const col=itemColor(it);
  const solid = it.fill!=='transparent';
  const op = solid ? 1.0 : 0.22;
  let g = '';
  // Sólido = plano de color; transparente = solo contorno/ligero relleno
  g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${col}" fill-opacity="${op}" stroke="${sel?cvar('--amber'):cvar('--ink')}" stroke-width="${sel?2.8:2.2}" stroke-opacity="${solid?0.95:0.55}"/>`;

  // Unifilar en planta (siempre al lado si hay imagen)
  if(it.uniData){
    const uw = Math.max(36, w*0.9), uh = Math.max(h*0.85, 40);
    const ux = x+w+6, uy = y;
    g += `<rect x="${ux}" y="${uy}" width="${uw}" height="${uh}" rx="2" fill="${cvar('--panel2')}" stroke="${col}" stroke-width="1" stroke-dasharray="3 2"/>`;
    g += `<image href="${it.uniData}" xlink:href="${it.uniData}" x="${ux+2}" y="${uy+2}" width="${uw-4}" height="${uh-4}" preserveAspectRatio="xMidYMid meet"/>`;
  }

  // Solo en transparente: dibujar figura/esquema SM6 interior
  if(!solid && !it.uniData){
    const band = Math.max(10, h*0.22);
    g += `<rect x="${x+2}" y="${y+2}" width="${w-4}" height="${band}" fill="#3a3f4a" fill-opacity="0.5"/>`;
    if(['im','imc','qm','dm1a','dm1d','ats'].includes(face)){
      g += `<circle cx="${x+w*0.35}" cy="${y+2+band*0.45}" r="${Math.min(4,band*0.2)}" fill="#f5b301" fill-opacity="0.8"/>`;
    }
    if(['gbca','gbcb','gbcc','gam2'].includes(face)){
      g += `<text x="${x+w/2}" y="${y+2+band*0.65}" text-anchor="middle" font-size="${Math.max(8,band*0.35)}" fill="#f5b301">⚠</text>`;
    }
    const midY = y+band+4, midH = h*0.35;
    if(['dm1a','dm1d'].includes(face)){
      g += `<rect x="${x+w*0.2}" y="${midY}" width="${w*0.6}" height="${midH}" rx="2" fill="none" stroke="${ink}" stroke-width="1.2" opacity="0.7"/>`;
    }
    const bot = y+h-Math.max(12,h*0.2);
    if(!['gbca','gbcb','gbcc'].includes(face)){
      g += `<rect x="${x+w*0.25}" y="${bot}" width="${w*0.2}" height="${Math.max(6,h*0.08)}" fill="#1a1d24" fill-opacity="0.5"/>`;
      g += `<rect x="${x+w*0.55}" y="${bot}" width="${w*0.2}" height="${Math.max(6,h*0.08)}" fill="#1a1d24" fill-opacity="0.5"/>`;
    }
    if(w>28) g += drawMiniUni(face, x+w-10, y+band+8, mut);
  }

  // etiqueta (sólido o transparente)
  if(S.showNames) g += `<text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" font-size="${Math.max(9,Math.min(13,w*0.2))}" font-weight="800" fill="${solid?'#fff':col}" opacity="${solid?0.95:0.9}">${it.name||c.ref||c.name}</text>`;
  return g;
}
function drawMiniUni(face, ux, uy, col){
  let g=`<line x1="${ux}" y1="${uy}" x2="${ux}" y2="${uy+28}" stroke="${col}" stroke-width="1"/>`;
  if(face==='qm') g+=`<rect x="${ux-4}" y="${uy+8}" width="8" height="4" fill="none" stroke="${col}" stroke-width="1"/>`;
  else if(face.startsWith('dm1')){ g+=`<circle cx="${ux}" cy="${uy+12}" r="4" fill="none" stroke="${col}" stroke-width="1"/>`; g+=`<line x1="${ux-3}" y1="${uy+12}" x2="${ux+3}" y2="${uy+12}" stroke="${col}" stroke-width="1"/>`; }
  else if(face.startsWith('gbc')){ g+=`<circle cx="${ux}" cy="${uy+10}" r="3" fill="none" stroke="${col}" stroke-width="1"/>`; g+=`<circle cx="${ux}" cy="${uy+18}" r="3" fill="none" stroke="${col}" stroke-width="1"/>`; }
  else if(face==='gam2') g+=`<path d="M${ux-4} ${uy+14} h8" stroke="${col}" stroke-width="1.2"/>`;
  else g+=`<line x1="${ux-4}" y1="${uy+10}" x2="${ux+4}" y2="${uy+10}" stroke="${col}" stroke-width="1.2"/>`;
  return g;
}

function renderPlanta(){
  $("viewHelp").innerHTML=S.placing
    ?(isWallItem(S.placing)
      ?`<b>Colocando:</b> ${cat(S.placing).name}. Clic cerca de un muro para anclar. Esc cancela.`
      :`<b>Colocando:</b> ${cat(S.placing).name}. Clic en la planta para ubicar. Esc cancela.`)
    :`<b>Planta de la sala.</b> Arrastra para mover · doble-clic elimina · puertas/ventanas se anclan al muro. Pasillo mín. ${es(room().pas,2)} m.`;
  $("legend").innerHTML=CATALOG.filter(c=>c.kind==='AR').concat(CATALOG.filter(c=>c.kind!=='AR').slice(0,4)).map(c=>`<div class="row"><span class="lg-s" style="background:${c.color}"></span>${c.name}</div>`).join('');

  const R=room();
  let g='';
  // grid
  const v=S.view, step=1;
  const[wx0,wz0]=S2W(0,VBH),[wx1,wz1]=S2W(VBW,0);
  for(let x=Math.ceil(wx0);x<=wx1;x+=step){const[px]=W2S(x,0);g+=`<line x1="${px}" y1="0" x2="${px}" y2="${VBH}" stroke="${cvar(Math.abs(x)<1e-9?'--grid2':'--grid')}" stroke-width="1"/>`;}
  for(let z=Math.ceil(wz0);z<=wz1;z+=step){const[,pz]=W2S(0,z);g+=`<line x1="0" y1="${pz}" x2="${VBW}" y2="${pz}" stroke="${cvar(Math.abs(z)<1e-9?'--grid2':'--grid')}" stroke-width="1"/>`;}

  // room
  const[a0,a1]=W2S(0,0),[b0,b1]=W2S(R.L,R.W);
  const rx=Math.min(a0,b0), ry=Math.min(a1,b1), rw=Math.abs(b0-a0), rh=Math.abs(b1-a1);
  g+=`<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="${cvar('--panel')}" fill-opacity=".35" stroke="${cvar('--amber')}" stroke-width="2.5"/>`;
  // cotas
  g+=`<text x="${rx+rw/2}" y="${ry+rh+18}" text-anchor="middle" font-size="12" fill="${cvar('--mut')}" font-family="var(--mono)">L = ${es(R.L,1)} m</text>`;
  g+=`<text x="${rx-12}" y="${ry+rh/2}" text-anchor="end" font-size="12" fill="${cvar('--mut')}" font-family="var(--mono)">W = ${es(R.W,1)} m</text>`;

  // items (equipos + puertas/ventanas en muro)
  for(const it of S.items){
    const c=cat(it.type), r=itemRect(it);
    const[p0,p1]=W2S(r.x0,r.z0),[p2,p3]=W2S(r.x1,r.z1);
    const x=Math.min(p0,p2), y=Math.min(p1,p3), w=Math.abs(p2-p0), h=Math.abs(p3-p1);
    const sel=S.sel===it.id;
    if(isWallItem(it)){
      // símbolo de vano en el muro
      const thick = Math.max(4, (it.d||0.08)*S.view.s);
      const isDoor = (it.type||'').indexOf('puerta')>=0;
      const col=itemColor(it); const op=it.fill==='transparent'?0.25:0.95;
      g+=`<rect x="${x}" y="${y}" width="${Math.max(w,2)}" height="${Math.max(h,2)}" rx="1" fill="${col}" fill-opacity="${op}" stroke="${sel?cvar('--amber'):col}" stroke-width="${sel?2.5:2}"/>`;
      if(isDoor){
        // arco de apertura esquemático
        const cx = x+w/2, cy = y+h/2;
        g+=`<path d="M ${x} ${y} Q ${cx} ${y-18} ${x+w} ${y}" fill="none" stroke="${c.color}" stroke-width="1.2" stroke-dasharray="3 2" opacity=".7"/>`;
      }
      const label=(it.name||c.name);
      const lx = x+w/2, ly = y - 8;
      if(S.showNames) g+=`<text x="${lx}" y="${ly}" text-anchor="middle" font-size="9" font-weight="700" fill="${c.color}">${label}</text>`;
      continue;
    }
    const cl=clearanceOK(it);
    const out=!insideRoom(it);
    // frente esquemático (o imagen cargada)
    if(w>=18 && h>=24 && c.kind!=='AR'){
      g+=faceSVG(it, x, y, w, h);
    } else {
      const col=itemColor(it); const op=it.fill==='transparent'?0.18:(sel?0.95:0.9);
      const stroke=out?cvar('--red'):(sel?cvar('--amber'):col);
      g+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${col}" fill-opacity="${op}" stroke="${stroke}" stroke-width="${sel?2.5:1.6}"/>`;
      const label=(it.name||c.ref||c.name);
      if(S.showNames&&w>20) g+=`<text x="${x+w/2}" y="${y+h/2+3}" text-anchor="middle" font-size="9" font-weight="700" fill="${cvar('--ink')}">${(label+'').slice(0,10)}</text>`;
    }
    if(out||!cl.okWall||!cl.okEq){
      g+=`<circle cx="${x+w-6}" cy="${y+6}" r="4" fill="${cvar('--red')}"/>`;
    }
  }

  // ghost placing
  if(S.placing && S.drag && S.drag.t==='ghost'){
    const c=cat(S.placing);
    const[p0,p1]=W2S(S.drag.x,S.drag.z),[p2,p3]=W2S(S.drag.x+c.w,S.drag.z+c.d);
    const x=Math.min(p0,p2), y=Math.min(p1,p3), w=Math.abs(p2-p0), h=Math.abs(p3-p1);
    g+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${c.color}" fill-opacity=".25" stroke="${c.color}" stroke-width="1.5" stroke-dasharray="5 3"/>`;
  }

  cv.innerHTML=g;
  try{applyLineWeight();}catch(e){}
  try{snapshotView(typeof S!=='undefined'?(S.tab||'main'):'main');}catch(e){}
  try{applyLineWeight();}catch(e){}
  cv.classList.toggle('placing',!!S.placing);
}


/* ===== 3D ===== */
function proj(x,y,z){
  const R=room(), cx=R.L/2, cy=R.H/2, cz=R.W/2;
  const az=S.cam.az*Math.PI/180, el=S.cam.el*Math.PI/180, s=S.cam.s;
  let X=x-cx, Y=y-cy, Z=z-cz;
  let x1=X*Math.cos(az)+Z*Math.sin(az);
  let z1=-X*Math.sin(az)+Z*Math.cos(az);
  let y1=Y;
  let y2=y1*Math.cos(el)-z1*Math.sin(el);
  let depth=y1*Math.sin(el)+z1*Math.cos(el);
  return [VBW/2+x1*s, VBH/2+50-y2*s, depth];
}

/** Frente operativo del gabinete según rotación (0°=-Z, 90°=+X, 180°=+Z, 270°=-X) */
function cabinetFront(it, r, Y0, Y1){
  const rot=((it.rot||0)%360+360)%360;
  if(rot<45 || rot>=315)
    return {nx:0,nz:-1, A:[r.x0,Y0,r.z0], B:[r.x1,Y0,r.z0], C:[r.x1,Y1,r.z0], D:[r.x0,Y1,r.z0]};
  if(rot<135)
    return {nx:1,nz:0, A:[r.x1,Y0,r.z0], B:[r.x1,Y0,r.z1], C:[r.x1,Y1,r.z1], D:[r.x1,Y1,r.z0]};
  if(rot<225)
    return {nx:0,nz:1, A:[r.x1,Y0,r.z1], B:[r.x0,Y0,r.z1], C:[r.x0,Y1,r.z1], D:[r.x1,Y1,r.z1]};
  return {nx:-1,nz:0, A:[r.x0,Y0,r.z1], B:[r.x0,Y0,r.z0], C:[r.x0,Y1,r.z0], D:[r.x0,Y1,r.z1]};
}
function viewDir(){
  const az=S.cam.az*Math.PI/180, el=S.cam.el*Math.PI/180;
  return {x:Math.sin(az)*Math.cos(el), y:Math.sin(el), z:Math.cos(az)*Math.cos(el)};
}

function render3D(){
  $("viewHelp").innerHTML=`<b>Vista 3D.</b> Arrastra para rotar. Sala y equipos Schneider con altura real.`;
  $("legend").innerHTML=CATALOG.filter(c=>c.kind!=='OT').slice(0,7).map(c=>`<div class="row"><span class="lg-s" style="background:${c.color}"></span>${c.ref}</div>`).join('');
  const R=room();
  let g='';
  // floor grid
  const step=1;
  for(let x=0;x<=R.L+0.01;x+=step){
    const a=proj(x,0,0), b=proj(x,0,R.W);
    g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--grid')}" stroke-width="1"/>`;
  }
  for(let z=0;z<=R.W+0.01;z+=step){
    const a=proj(0,0,z), b=proj(R.L,0,z);
    g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--grid')}" stroke-width="1"/>`;
  }
  // room box (wireframe)
  const corners=[[0,0,0],[R.L,0,0],[R.L,0,R.W],[0,0,R.W],[0,R.H,0],[R.L,R.H,0],[R.L,R.H,R.W],[0,R.H,R.W]];
  const edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  for(const [i,j] of edges){
    const a=proj(...corners[i]), b=proj(...corners[j]);
    g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--amber')}" stroke-width="1.5" opacity=".7"/>`;
  }
  // floor
  const fl=[[0,0,0],[R.L,0,0],[R.L,0,R.W],[0,0,R.W]].map(p=>proj(...p));
  g+=`<polygon points="${fl.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="${cvar('--panel')}" fill-opacity=".25" stroke="none"/>`;

  // equipment boxes with painter's algorithm
  const faces=[];
  for(const it of S.items){
    const c=cat(it.type), r=itemRect(it);
    const isWin = isWallItem(it) && (it.type||'').indexOf('ventana')>=0;
    const sill = isWin ? 0.9 : (it.y!=null?it.y:0);
    const X0=r.x0,X1=r.x1,Z0=r.z0,Z1=r.z1,Y0=sill,Y1=sill+(it.h||c.h);
    const pts=[
      [X0,Y0,Z0],[X1,Y0,Z0],[X1,Y0,Z1],[X0,Y0,Z1],
      [X0,Y1,Z0],[X1,Y1,Z0],[X1,Y1,Z1],[X0,Y1,Z1]
    ];
    const F=[[0,1,2,3,'bot'],[4,5,6,7,'top'],[0,1,5,4,'s'],[1,2,6,5,'s'],[2,3,7,6,'s'],[3,0,4,7,'s']];
    for(const f of F){
      const P=f.slice(0,4).map(k=>proj(...pts[k]));
      const depth=(P[0][2]+P[1][2]+P[2][2]+P[3][2])/4;
      faces.push({P, depth, kind:f[4], color:itemColor(it), fill:it.fill, sel:S.sel===it.id, label:f[4]==='top'? (it.name||c.ref||c.name):null});
    }
    // Cara frontal fija del gabinete: solo si mira a la cámara (no se ve desde atrás)
    if(it.faceData && !isWallItem(it)){
      const fr=cabinetFront(it, r, Y0, Y1);
      const vd=viewDir();
      const facing=fr.nx*vd.x + fr.nz*vd.z;
      if(facing > 0.12){
        const A=proj(...fr.A), B=proj(...fr.B), C=proj(...fr.C), D=proj(...fr.D);
        const depth=(A[2]+B[2]+C[2]+D[2])/4 + 0.02; // ligeramente delante de la cara del sólido
        faces.push({kind:'img', depth, A, B, C, D, href:it.faceData, sel:S.sel===it.id, color:itemColor(it)});
      }
    }
  }
  faces.sort((a,b)=>a.depth-b.depth);
  for(const f of faces){
    if(f.kind==='img'){
      // Imagen solo en el frente, orientada y ocluida por profundidad
      const W=200, H=200;
      const TL=f.D, TR=f.C, BL=f.A; // D arriba-izq, C arriba-der, A abajo-izq
      const a11=(TR[0]-TL[0])/W, a21=(TR[1]-TL[1])/W;
      const a12=(BL[0]-TL[0])/H, a22=(BL[1]-TL[1])/H;
      g+=`<image href="${f.href}" xlink:href="${f.href}" x="0" y="0" width="${W}" height="${H}" transform="matrix(${a11} ${a21} ${a12} ${a22} ${TL[0]} ${TL[1]})" preserveAspectRatio="none" opacity="0.97"/>`;
      g+=`<polygon points="${f.A[0]},${f.A[1]} ${f.B[0]},${f.B[1]} ${f.C[0]},${f.C[1]} ${f.D[0]},${f.D[1]}" fill="none" stroke="${f.sel?cvar('--amber'):cvar('--ink')}" stroke-width="${f.sel?2.2:1.4}"/>`;
      continue;
    }
    const pts=f.P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const op=f.fill==='transparent'?(f.kind==='top'?.15:(f.kind==='bot'?.05:.12)):(f.kind==='top'?.92:(f.kind==='bot'?.75:.88));
    const sw=f.sel?2.4:1.6;
    g+=`<polygon points="${pts}" fill="${f.color}" fill-opacity="${op}" stroke="${f.sel?cvar('--amber'):cvar('--ink')}" stroke-width="${sw}" stroke-opacity="${f.fill==='transparent'?0.5:0.95}"/>`;
    if(S.showNames && f.label){
      const cx=(f.P[0][0]+f.P[1][0]+f.P[2][0]+f.P[3][0])/4;
      const cy=(f.P[0][1]+f.P[1][1]+f.P[2][1]+f.P[3][1])/4;
      const lab=f.label.length>16?f.label.slice(0,15)+'…':f.label;
      g+=`<text x="${cx}" y="${cy}" text-anchor="middle" font-size="9" font-weight="700" fill="${cvar('--ink')}" opacity=".9">${lab}</text>`;
    }
  }


  // axes
  const o=proj(0,0,0), ax=proj(Math.min(2,R.L),0,0), ay=proj(0,Math.min(2,R.H),0), az=proj(0,0,Math.min(2,R.W));
  g+=`<line x1="${o[0]}" y1="${o[1]}" x2="${ax[0]}" y2="${ax[1]}" stroke="${cvar('--red')}" stroke-width="2"/><text x="${ax[0]}" y="${ax[1]}" font-size="11" fill="${cvar('--red')}" font-weight="800">L</text>`;
  g+=`<line x1="${o[0]}" y1="${o[1]}" x2="${ay[0]}" y2="${ay[1]}" stroke="${cvar('--green')}" stroke-width="2"/><text x="${ay[0]-4}" y="${ay[1]-3}" font-size="11" fill="${cvar('--green')}" font-weight="800">H</text>`;
  g+=`<line x1="${o[0]}" y1="${o[1]}" x2="${az[0]}" y2="${az[1]}" stroke="${cvar('--cyan')}" stroke-width="2"/><text x="${az[0]}" y="${az[1]}" font-size="11" fill="${cvar('--cyan')}" font-weight="800">W</text>`;
  cv.innerHTML=g;
  try{applyLineWeight();}catch(e){}
  try{snapshotView(typeof S!=='undefined'?(S.tab||'main'):'main');}catch(e){}
  try{applyLineWeight();}catch(e){}
}

/* actions */
function startPlace(id){S.placing=S.placing===id?null:id;S.sel=null;render();}
function selectItem(id){S.sel=id;S.placing=null;render();}
function delItem(id){S.items=S.items.filter(x=>x.id!==id);if(S.sel===id)S.sel=null;render();toast('Equipo eliminado');}
function clearAll(){if(!S.items.length)return;S.items=[];S.sel=null;render();toast('Sala vacía');}
function updSel(k,v){
  const it=S.items.find(x=>x.id===S.sel);if(!it)return;
  if(k==='name') it.name=v;
  else if(k==='rot') it.rot=parseInt(v)||0;
  else it[k]=parseFloat(v)||0;
  render();
}
function rotateSel(){
  const it=S.items.find(x=>x.id===S.sel);if(!it)return;
  // Mantener el centro fijo al intercambiar ancho/fondo
  const r0=itemRect(it);
  const cx=(r0.x0+r0.x1)/2, cz=(r0.z0+r0.z1)/2;
  it.rot=((it.rot||0)+90)%360; // 0→90→180→270→0 (frente y cara 3D giran juntos)
  const r1=itemRect(it);
  it.x=+(it.x + cx - (r1.x0+r1.x1)/2).toFixed(3);
  it.z=+(it.z + cz - (r1.z0+r1.z1)/2).toFixed(3);
  render();
  toast('Girado '+it.rot+'°');
}
function setTab(t){S.tab=t;render();if(t==='planta')fitView();

(function(){
  const bl=document.getElementById('btnLineW');
  if(bl){
    const mode=localStorage.getItem('suite_lineW')||'thick';
    bl.textContent=mode==='thin'?'┄ Línea fina':'━ Línea gruesa';
    bl.onclick=function(){toggleLineW();};
  }
})();
}

function fitView(){
  const R=room();
  if(S.tab==='v3d'){
    const span=Math.max(R.L,R.W,R.H,4);
    S.cam.s=Math.max(10, Math.min(50, (VBW*0.45)/span));
    render();return;
  }
  const pad=1.2;
  const sx=(VBW-ML-MR)/(R.L+2*pad), sy=(VBH-MB-MT)/(R.W+2*pad);
  S.view.s=Math.max(8,Math.min(sx,sy));
  S.view.x0=-pad;S.view.y0=-pad;
  render();
}
function zoom(f){
  if(S.tab==='v3d'){
    S.cam.s=Math.max(8,Math.min(80,S.cam.s*f));render();return;
  }
  const c=S2W(VBW/2,VBH/2);
  S.view.s=Math.max(8,Math.min(120,S.view.s*f));
  const n=S2W(VBW/2,VBH/2);
  S.view.x0+=c[0]-n[0];S.view.y0+=c[1]-n[1];
  render();
}
function toggleTheme(){
  const d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';
  d.dataset.theme=t;$("themeBtn").textContent=t==='dark'?'🌙':'☀️';
  try{localStorage.setItem('sub_theme',t);}catch(e){}
  render();
}
let tt;function toast(m){const e=$("toast");e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1600);}

/* interaction */
cv.addEventListener('mousedown',down);cv.addEventListener('touchstart',down,{passive:false});
window.addEventListener('mousemove',move);window.addEventListener('touchmove',move,{passive:false});
window.addEventListener('mouseup',up);window.addEventListener('touchend',up);
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  if(S.tab==='v3d'){S.cam.s=Math.max(8,Math.min(80,S.cam.s*(e.deltaY<0?1.1:1/1.1)));render();return;}
  const[vx,vy]=evtVB(e),[wx,wy]=S2W(vx,vy),f=e.deltaY<0?1.12:1/1.12;
  S.view.s=Math.max(8,Math.min(120,S.view.s*f));
  const[nx,ny]=S2W(vx,vy);S.view.x0+=wx-nx;S.view.y0+=wy-ny;render();
},{passive:false});
cv.addEventListener('dblclick',e=>{
  if(S.tab!=='planta')return;
  const[vx,vy]=evtVB(e),[wx,wz]=S2W(vx,vy);
  for(let i=S.items.length-1;i>=0;i--){
    const r=hitRect(S.items[i]);
    if(wx>=r.x0&&wx<=r.x1&&wz>=r.z0&&wz<=r.z1){delItem(S.items[i].id);return;}
  }
});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){S.placing=null;S.drag=null;render();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateSel();}});

function down(e){
  if(S.tab==='v3d'){
    const[vx,vy]=evtVB(e);
    S.drag={t:'rot',sx:vx,sy:vy,az:S.cam.az,el:S.cam.el};
    cv.classList.add('grabbing');e.preventDefault();return;
  }
  if(S.tab!=='planta')return;
  const[vx,vy]=evtVB(e),[wx,wz]=S2W(vx,vy);
  if(S.placing){
    const c=cat(S.placing);
    let it;
    if(c.wall || c.kind==='AR'){
      const sn=snapToWall(wx, wz, c.w);
      it={id:uid(),type:S.placing,x:sn.x,z:sn.z,w:c.w,d:c.d,h:c.h,rot:sn.rot,name:c.name,wall:sn.wall,along:sn.along};
    } else {
      it={id:uid(),type:S.placing,x:+(wx-c.w/2).toFixed(2),z:+(wz-c.d/2).toFixed(2),y:0,w:c.w,d:c.d,h:c.h,rot:0,name:c.name,fill:'solid'};
      it.x=Math.max(0,Math.min(room().L-itemRect(it).w,it.x));
      it.z=Math.max(0,Math.min(room().W-itemRect(it).d,it.z));
    }
    S.items.push(it);S.sel=it.id;S.placing=null;render();toast(c.name+' ubicada');e.preventDefault();return;
  }
  // hit item
  for(let i=S.items.length-1;i>=0;i--){
    const it=S.items[i], r=hitRect(it);
    if(wx>=r.x0&&wx<=r.x1&&wz>=r.z0&&wz<=r.z1){
      S.sel=it.id;S.drag={t:'move',id:it.id,ox:wx-it.x,oz:wz-it.z};cv.classList.add('grabbing');render();e.preventDefault();return;
    }
  }
  // pan
  S.drag={t:'pan',sx:vx,sy:vy,x0:S.view.x0,y0:S.view.y0};cv.classList.add('grabbing');e.preventDefault();
}
function move(e){
  if(!S.drag)return;e.preventDefault();
  const[vx,vy]=evtVB(e);
  if(S.drag.t==='rot'){
    S.cam.az=S.drag.az+(vx-S.drag.sx)*0.4;
    S.cam.el=Math.max(5,Math.min(80,S.drag.el+(vy-S.drag.sy)*0.35));
    render();return;
  }
  const[wx,wz]=S2W(vx,vy);
  if(S.drag.t==='pan'){
    const[ox,oy]=S2W(S.drag.sx,S.drag.sy);
    S.view.x0=S.drag.x0+(ox-wx);S.view.y0=S.drag.y0+(oy-wz);render();return;
  }
  if(S.drag.t==='move'){
    const it=S.items.find(x=>x.id===S.drag.id);if(!it)return;
    if(isWallItem(it)){
      const sn=snapToWall(wx, wz, it.w);
      it.x=sn.x; it.z=sn.z; it.rot=sn.rot; it.wall=sn.wall; it.along=sn.along;
    } else {
      it.x=+(wx-S.drag.ox).toFixed(2);it.z=+(wz-S.drag.oz).toFixed(2);
    }
    render();return;
  }
}
function up(){S.drag=null;cv.classList.remove('grabbing');}

/* resumen */
function openMat(){
  const R=room();
  $("matSub").textContent=`Sala ${es(R.L,1)}×${es(R.W,1)}×${es(R.H,1)} m · pasillo mín. ${es(R.pas,2)} m · ${S.items.length} equipos`;
  const byKind={};
  for(const it of S.items){const c=cat(it.type);byKind[c.kind]=(byKind[c.kind]||0)+1;}
  let h=`<table class="mt"><thead><tr><th>Equipo</th><th>Tipo</th><th>Posición (X,Z)</th><th class="n">w×d×h (m)</th></tr></thead><tbody>`;
  const kinds=['AR','MT','TR','BT','OT'];
  for(const k of kinds){
    const list=S.items.filter(it=>cat(it.type).kind===k);
    if(!list.length)continue;
    h+=`<tr class="grp"><td colspan="4">${k==='AR'?'Puertas y ventanas':k==='MT'?'Media tensión':k==='TR'?'Transformación':k==='BT'?'Baja tensión':'Otros'} (${list.length})</td></tr>`;
    for(const it of list){
      const c=cat(it.type), r=itemRect(it);
      h+=`<tr><td>${it.name||c.name}<br><small style="color:var(--mut)">${c.brand||''} · ${c.ref||''}</small></td><td>${c.kind}</td><td style="font-family:var(--mono)">${es(it.x,2)}, ${es(it.z,2)}</td><td class="n">${es(r.w,2)}×${es(r.d,2)}×${es(it.h,2)}</td></tr>`;
    }
  }
  if(!S.items.length) h+=`<tr><td colspan="4">Sin equipos</td></tr>`;
  h+=`</tbody></table>`;
  const used=S.items.reduce((s,it)=>{const r=itemRect(it);return s+r.w*r.d;},0);
  h+=`<div class="kv"><span class="k">Área de sala</span><b>${es(R.L*R.W,1)} m²</b></div>`;
  h+=`<div class="kv"><span class="k">Área ocupada por equipos</span><b>${es(used,1)} m² (${es(used/(R.L*R.W)*100,0)}%)</b></div>`;
  $("matBody").innerHTML=h;
  $("matNote").innerHTML=`Dimensiones de celdas y tableros son <b>orientativas</b> para layout preliminar. Verificar catálogo del fabricante, distancias de seguridad RETIE / NTC 2050 Art. 110, ventilación, drenaje de fosos de transformador y accesos de operación/mantenimiento. El pasillo mínimo configurado (${es(R.pas,2)} m) es un criterio de diseño editable.`;
  $("matov").classList.add('show');
}
function closeMat(){$("matov").classList.remove('show');}

/* init */
$("themeBtn").textContent=document.documentElement.dataset.theme==='dark'?'🌙':'☀️';
['rL','rW','rH','rPas'].forEach(id=>$(id).addEventListener('input',()=>{syncRoom();render();}));
$("rL").value=S.room.L;$("rW").value=S.room.W;$("rH").value=S.room.H;$("rPas").value=S.room.pas;
render();fitView();

(function(){
  const d=$("btnDup"), p=$("btnPrint");
  const bn=$("btnNames"); if(bn) bn.onclick=function(){toggleNames();};

function toggleNames(){
  S.showNames=!S.showNames;
  render();
  toast(S.showNames?'Nombres visibles':'Nombres ocultos');
}
function toggleGlobalFill(){
  S.globalFill = S.globalFill==='solid'?'transparent':'solid';
  S.items.forEach(it=>{ it.fill=S.globalFill; });
  render();
  toast(S.globalFill==='solid'?'Relleno sólido':'Relleno transparente');
}
function duplicateSel(){
  const it=S.items.find(x=>x.id===S.sel);
  if(!it){toast('Selecciona una pieza para duplicar');return;}
  const copy=JSON.parse(JSON.stringify(it));
  copy.id=uid();
  // offset so it is visible next to original
  if(isWallItem(copy)){
    // slide along wall
    if(copy.wall==='S'||copy.wall==='N') copy.x=+(copy.x+0.35).toFixed(2);
    else copy.z=+(copy.z+0.35).toFixed(2);
  } else {
    copy.x=+(copy.x+0.4).toFixed(2);
    copy.z=+(copy.z+0.25).toFixed(2);
  }
  if(copy.name && !/\(copia\)/i.test(copy.name)) copy.name=copy.name+' (copia)';
  S.items.push(copy);
  S.sel=copy.id;
  render();
  toast('Pieza duplicada');
}
function printView(){
  // ensure current view is painted, then print
  render();
  setTimeout(()=>window.print(), 120);
}

(function(){
const $=id=>document.getElementById(id);
const R3=Math.sqrt(3);
const es=(x,d=2)=>Number(x).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});

const VOLT_MAP={

const WIRES=[

  {id:'1/0',label:'1/0 AWG',cu75:150,cu90:170,al75:120,al90:135},
  {id:'2/0',label:'2/0 AWG',cu75:175,cu90:195,al75:135,al90:150},
  {id:'3/0',label:'3/0 AWG',cu75:200,cu90:225,al75:155,al90:175},
  {id:'4/0',label:'4/0 AWG',cu75:230,cu90:260,al75:180,al90:205},
  {id:'250',label:'250 kcmil',cu75:255,cu90:290,al75:205,al90:230},
  {id:'300',label:'300 kcmil',cu75:285,cu90:320,al75:230,al90:260},
  {id:'350',label:'350 kcmil',cu75:310,cu90:350,al75:250,al90:280},
  {id:'400',label:'400 kcmil',cu75:335,cu90:380,al75:270,al90:305},
  {id:'500',label:'500 kcmil',cu75:380,cu90:430,al75:310,al90:350},
  {id:'600',label:'600 kcmil',cu75:420,cu90:475,al75:340,al90:385},
  {id:'750',label:'750 kcmil',cu75:475,cu90:535,al75:385,al90:435}
];
const BREAKERS=[15,20,25,30,35,40,45,50,60,70,80,90,100,110,125,150,175,200,225,250,300,350,400,450,500,600,700,800,1000,1200];
const CIRCUITS=['Alumbrado','Tomas generales','Tomas dedicadas','Fuerza motriz','Aire acondicionado','Cocina / estufa','Calentador','Ascensor','Bomba','UPS / regulador','Carga especial','Reserva','Alimentador principal','Subalimentador'];
const NORMS=['NTC 2050 Art. 210 — Circuitos derivados','NTC 2050 Art. 215 — Alimentadores','NTC 2050 Art. 220 — Cálculo de cargas','NTC 2050 Art. 240 — Protección contra sobrecorriente','NTC 2050 Art. 250 — Puesta a tierra','NTC 2050 Art. 310 — Conductores','NTC 2050 Art. 430 — Motores','NTC 2050 Art. 440 — Aire acondicionado','RETIE Art. 27 — Protecciones','RETIE Art. 28 — Conductores y canalizaciones'];

function defaultRows(){return [
  {desc:'Alumbrado general',nInst:1,P:20990,fp:0.95,phases:'ABC',wire:'',gnd:'',brk:0,circ:'Alumbrado',norm:NORMS[0],circN:1,poles:3},
  {desc:'Tomas generales',nInst:1,P:6060,fp:0.95,phases:'A',wire:'',gnd:'',brk:0,circ:'Tomas generales',norm:NORMS[0],circN:4,poles:1},
  {desc:'Fuerza motriz',nInst:1,P:8400,fp:0.85,phases:'ABC',wire:'',gnd:'',brk:0,circ:'Fuerza motriz',norm:NORMS[6],circN:5,poles:3},
  {desc:'Aire acondicionado',nInst:1,P:15200,fp:0.90,phases:'AB',wire:'',gnd:'',brk:0,circ:'Aire acondicionado',norm:NORMS[7],circN:8,poles:2},
  {desc:'Cargas varias',nInst:1,P:12100,fp:0.95,phases:'C',wire:'',gnd:'',brk:0,circ:'Carga especial',norm:NORMS[2],circN:10,poles:1},
  {desc:'Reserva',nInst:1,P:12100,fp:0.95,phases:'A',wire:'',gnd:'',brk:0,circ:'Reserva',norm:NORMS[2],circN:11,poles:1}
];}
function newBoard(name){
  return {name:name||('Tablero '+(S.boards.length+1)), qty:1, sys:3, v:'208', mat:'cu', aisl:'90', nCirc:12, rows:defaultRows()};
}

let S={active:0, boards:[]};
try{
  const j=JSON.parse(localStorage.getItem('cc_state3'));
  if(j&&j.boards&&j.boards.length){S.boards=j.boards;S.active=Math.min(j.active||0,j.boards.length-1);}
}catch(e){}
if(!S.boards.length) S.boards=[newBoard('TABLERO GENERAL T.G.B / CELDA BT - PRINCIPAL')];

function B(){return S.boards[S.active];}
function save(){try{localStorage.setItem('cc_state3',JSON.stringify(S));}catch(e){}}

function volt(){return VOLT_MAP[B().v]||VOLT_MAP['208'];}
/** Ampacidad usable: terminales 75 °C (NTC 2050 / NEC 110.14) + límite conductores pequeños 240.4(D) */
function ampOf(w){
  if(!w) return 0;
  const mat=B().mat||'cu';
  // Siempre dimensionar con columna 75 °C (más conservador que 90 °C de aislamiento)
  let a = w[(mat==='cu'?'cu':'al')+'75']||0;
  if(mat==='cu'){
    if(w.id==='14') a=Math.min(a,15);
    else if(w.id==='12') a=Math.min(a,20);
    else if(w.id==='10') a=Math.min(a,30);
  } else if(mat==='al'){
    if(w.id==='12') a=Math.min(a,15);
    else if(w.id==='10') a=Math.min(a,25);
  }
  return a;
}
/** Ampacidad "de catálogo" 90 °C solo informativa */
function ampOfRaw(w){
  if(!w) return 0;
  const mat=B().mat||'cu', aisl=B().aisl||'75';
  return w[(mat==='cu'?'cu':'al')+aisl]||0;
}
function pickWire(I){
  // Carga continua: conductor ≥ 125% (Art. 210-19 / 215-2)
  const need=Math.max(0, (+I||0)*1.25);
  for(const w of WIRES){
    const a=ampOf(w);
    if(a<=0) continue;
    if(a+1e-6>=need) return w.id;
  }
  return WIRES[WIRES.length-1].id;
}
function pickBrk(I){
  const need=(+I||0)*1.25;
  for(const b of BREAKERS) if(b>=need-1e-6) return b;
  return BREAKERS[BREAKERS.length-1];
}
function pickGnd(phaseId){const map={'14':'14','12':'12','10':'10','8':'8','6':'8','4':'8','2':'6','1':'6','1/0':'6','2/0':'4','3/0':'4','4/0':'4','250':'2','300':'2','350':'2','400':'2','500':'2','600':'1/0','750':'1/0'};return map[phaseId]||'6';}
function wireLabel(id){const w=WIRES.find(x=>x.id===id);return w?w.label:id;}


/** Fase del espacio de circuito n (1-based) según configuración del sistema */
/** Paso entre polos en el tablero.
 *  Monofásico: consecutivos (1,2,3…).
 *  Bi/trifásico: columnas impar/par — multipolar baja por la misma columna
 *  (2P: 1-3, 3P: 1-3-5; lado par: 2-4, 2-4-6). */
function poleStep(sys, poles){
  poles=Math.max(1, parseInt(poles)||1);
  if(poles<=1) return 1;
  if((sys||1)===1) return 1;
  return 2;
}
/** Fase del espacio n (1-based) según barraje en columnas.
 *  Bi: fila 1 (esp.1 y 2)→A, fila 2 (3 y 4)→B, fila 3→A…
 *  Tri: fila 1→A, 2→B, 3→C, 4→A… */
function phaseOfCircuit(n, sys){
  n=Math.max(1, parseInt(n)||1);
  sys=sys||1;
  if(sys===1) return 'A';
  const row=Math.ceil(n/2); // 1,2→1 · 3,4→2 · 5,6→3
  if(sys===2) return (row%2===1)?'A':'B';
  return ['A','B','C'][(row-1)%3];
}
/** Fases cubiertas por un multipolar anclado en circN */
function phasesFromCirc(circN, poles, sys){
  poles=Math.max(1, Math.min(3, parseInt(poles)||1));
  sys=sys||B().sys||1;
  if(sys===1) return 'A';
  if(sys===2) poles=Math.min(poles,2);
  const step=poleStep(sys, poles);
  const start=parseInt(circN)||1;
  const set=[];
  for(let i=0;i<poles;i++){
    const ph=phaseOfCircuit(start+i*step, sys);
    if(set.indexOf(ph)<0) set.push(ph);
  }
  const order=['A','B','C'];
  set.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  return set.join('')||'A';
}
function circuitLabel(circN, poles){
  poles=Math.max(1,parseInt(poles)||1);
  circN=parseInt(circN)||1;
  if(poles<=1) return String(circN);
  const sys=(typeof B==='function'&&B())?B().sys:3;
  const step=poleStep(sys, poles);
  const nums=[];
  for(let i=0;i<poles;i++) nums.push(circN+i*step);
  return nums.join('-');
}

/** Espacios ocupados: 1P → [n]; 2P bi/tri → [n,n+2]; 3P → [n,n+2,n+4] */
function spacesOf(r){
  const n=Math.max(1,parseInt(r.circN)||1);
  const p=Math.max(1,parseInt(r.poles)||1);
  const sys=(typeof B==='function'&&B())?B().sys:1;
  const step=poleStep(sys, p);
  const a=[];
  for(let i=0;i<p;i++) a.push(n+i*step);
  return a;
}
/** Mapa espacio -> índice de fila que lo ocupa (excluyendo excludeIdx) */
function occupancyMap(excludeIdx){
  const map={};
  const rows=B().rows||[];
  rows.forEach((r,i)=>{
    if(excludeIdx!=null && i===excludeIdx) return;
    spacesOf(r).forEach(s=>{ map[s]=i; });
  });
  return map;
}
/** Primer circN libre que quepa 'poles' espacios hasta nCirc */
function nextFreeCirc(poles, prefer){
  const nCirc=B().nCirc||12;
  const sys=B().sys||1;
  poles=Math.max(1,parseInt(poles)||1);
  const step=poleStep(sys, poles);
  const occ=occupancyMap(null);
  function fits(n){
    for(let i=0;i<poles;i++){
      const s=n+i*step;
      if(s>nCirc || occ[s]!=null) return false;
    }
    return true;
  }
  const start=Math.max(1, parseInt(prefer)||1);
  for(let n=start;n<=nCirc;n++) if(fits(n)) return n;
  for(let n=1;n<=nCirc;n++) if(fits(n)) return n;
  return null;
}
function spacesConflict(circN, poles, excludeIdx){
  const occ=occupancyMap(excludeIdx);
  const sys=B().sys||1;
  poles=Math.max(1,parseInt(poles)||1);
  const step=poleStep(sys, poles);
  const start=parseInt(circN)||1;
  const bad=[];
  for(let i=0;i<poles;i++){
    const s=start+i*step;
    if(occ[s]!=null) bad.push(s);
  }
  return bad;
}

function phaseMapHelp(sys, nCirc){
  nCirc=nCirc||12;
  if(sys===1) return 'Monofásico: todos los espacios son fase <b>A</b>. Multipolares ocupan espacios consecutivos.';
  if(sys===2){
    let s='Bifásico (columnas): fila 1 (esp.1 y 2)→<b>A</b>, fila 2 (3 y 4)→<b>B</b>, fila 3→A… ';
    for(let i=1;i<=Math.min(8,nCirc);i++) s+=i+'='+phaseOfCircuit(i,2)+(i<Math.min(8,nCirc)?', ':'');
    return s+'. <b>2P no usa 1-2</b> (misma fila / misma fase): usa <b>1-3</b> o <b>2-4</b> (baja por la columna, A+B).';
  }
  let s='Trifásico (columnas): fila 1→<b>A</b>, 2→<b>B</b>, 3→<b>C</b>, 4→A… ';
  for(let i=1;i<=Math.min(9,nCirc);i++) s+=i+'='+phaseOfCircuit(i,3)+(i<Math.min(9,nCirc)?', ':'');
  return s+'. <b>2P:</b> 1-3 o 2-4 · <b>3P:</b> <b>1-3-5</b> o <b>2-4-6</b> (no consecutivos 1-2-3).';
}

function Iof(P,fp,Voverride){
  const v=volt();
  const V = (Voverride && +Voverride>0) ? +Voverride : v.V;
  const Sva=P/(fp||1); const n=B().sys;
  if(n===1) return Sva/V;
  if(n===2) return Sva/V;
  return Sva/(R3*V);
}
function rowVolt(r){
  if(r && r.vRow!=null && r.vRow!=='' && +r.vRow>0) return +r.vRow;
  return volt().V;
}
function rowVn(r){
  if(r && r.vRow!=null && r.vRow!=='' && +r.vRow>0){
    const V=+r.vRow;
    // neutro estimado
    if(V===208||V===220||V===380||V===480) return V/Math.sqrt(3);
    if(V===240) return 120;
    return V;
  }
  return volt().Vn||volt().V;
}
function rowCalc(r){
  const Ptot=(r.P||0)*(r.nInst||1), fp=r.fp||1, Sva=Ptot/fp, ph=(r.phases||'ABC').toUpperCase();
  const V=rowVolt(r), Vn=rowVn(r);
  const Ia=Iof(Ptot,fp,V); let a=0,b=0,c=0;
  if(B().sys===1) a=Ia;
  else if(B().sys===2){if(ph.indexOf('A')>=0||ph==='AB'||ph==='ABC')a=Ia;if(ph.indexOf('B')>=0||ph==='AB'||ph==='ABC')b=Ia;}
  else{
    if(ph==='ABC'){a=Ia;b=Ia;c=Ia;}
    else if(ph==='A') a=Sva/Vn;
    else if(ph==='B') b=Sva/Vn;
    else if(ph==='C') c=Sva/Vn;
    else if(ph==='AB'){a=Sva/V;b=Sva/V;}
    else if(ph==='BC'){b=Sva/V;c=Sva/V;}
    else if(ph==='AC'){a=Sva/V;c=Sva/V;}
    else{a=Ia;b=Ia;c=Ia;}
  }
  return {Ptot,Sva,a,b,c,Imax:Math.max(a,b,c)};
}

function renderTable(){
  const b=B();
  const showB=b.sys>=2, showC=b.sys>=3;
  let html='<thead><tr>'+
    '<th style="min-width:72px" title="Nombre corto del circuito">Nombre</th><th style="min-width:120px">Descripción</th><th>Carga inst.</th><th>Carga total (W)</th><th>F.P.</th><th>Carga total (VA)</th>'+
    '<th class="phA">F1(A)</th>'+(showB?'<th class="phB">F1(B)</th>':'')+(showC?'<th class="phC">F1(C)</th>':'')+
    '<th title="Circuito inicial en el tablero">N° circ.</th><th title="1P / 2P / 3P">Polos</th><th>Espacios</th><th>Fases</th>'+
    '<th>Conductor fase / neutro</th><th>Conductor protección</th><th>Breaker</th><th>Categoría</th><th>Referencia normativa</th><th>Tensión</th><th></th>'+
    '</tr></thead><tbody>';

  let totP=0,totS=0,totA=0,totB=0,totC=0,nInst=0;
  b.rows.forEach((r,i)=>{
    // sync phases from circuit number first
    if(r.circN==null) r.circN=i+1;
    if(r.poles==null){
      const ph=String(r.phases||'ABC').toUpperCase();
      r.poles = ph==='ABC'?3:(ph.length===2?2:1);
    }
    r.phases = phasesFromCirc(r.circN, r.poles, b.sys);
    const c=rowCalc(r);
    if(!r.brk) r.brk=pickBrk(c.Imax);
    if(!r.wire) r.wire=pickWire(c.Imax);
    if(r.wire && r.brk){
      let w=WIRES.find(x=>x.id===r.wire); let guard=0;
      while(w && ampOf(w)<r.brk && guard++<20){
        const ix=WIRES.indexOf(w); if(ix<0||ix>=WIRES.length-1) break;
        r.wire=WIRES[ix+1].id; w=WIRES[ix+1];
      }
    }
    if(!r.gnd) r.gnd=pickGnd(r.wire);
    totP+=c.Ptot;totS+=c.Sva;totA+=c.a;totB+=c.b;totC+=c.c;nInst+=(r.nInst||0);
    const nCircMax=b.nCirc||12;
    const occ=occupancyMap(i);
    // Si hay conflicto residual, reubicar automáticamente
    const conf0=spacesConflict(r.circN, r.poles, i);
    if(conf0.length){
      const nf=nextFreeCirc(r.poles, r.circN);
      if(nf!=null){ r.circN=nf; r.phases=phasesFromCirc(r.circN,r.poles,b.sys); }
    }
    const polesNow=Math.max(1, parseInt(r.poles)||1);
    const stepN=poleStep(b.sys, polesNow);
    const mySpaces=spacesOf(r);
    const circOpts=Array.from({length:nCircMax},(_,k)=>k+1).map(n=>{
      const span=[];
      for(let i=0;i<polesNow;i++) span.push(n+i*stepN);
      const outOfRange=span.some(s=>s>nCircMax);
      let conflict=false;
      span.forEach(s=>{ if(occ[s]!=null && mySpaces.indexOf(s)<0) conflict=true; });
      const dis=(outOfRange||conflict)?' disabled':'';
      let lab=polesNow<=1?String(n):span.join('-');
      if(outOfRange) lab+=' (no cabe)';
      else if(conflict) lab+=' (ocupado)';
      return '<option value="'+n+'" '+(Number(r.circN)===n?'selected':'')+dis+'>'+lab+'</option>';
    }).join('');
    const maxPoles=b.sys===1?1:(b.sys===2?2:3);
    const poleOpts=Array.from({length:maxPoles},(_,k)=>k+1).map(n=>{
      // deshabilitar polos si no hay hueco desde circN actual
      const need=n;
      let ok=true;
      for(let j=0;j<need;j++){
        const s=(Number(r.circN)||1)+j;
        if(s>nCircMax){ok=false;break;}
        if(occ[s]!=null && spacesOf(r).indexOf(s)<0){ok=false;break;}
      }
      return '<option value="'+n+'" '+(Number(r.poles)===n?'selected':'')+(ok?'':' disabled')+'>'+n+'P</option>';
    }).join('');

    const vOpts=['120','208','220','240','277','380','440','480'].map(v=>{
      const sel=String(r.vRow||B().v||'208').indexOf(v)===0 || String(r.vRow)===v || ( !r.vRow && String(volt().V)===v);
      // match by numeric display voltage
      const boardV=String(volt().V);
      const cur=r.vRow!=null && r.vRow!=='' ? String(r.vRow) : boardV;
      return '<option value="'+v+'" '+(cur===v?'selected':'')+'>'+v+' V</option>';
    }).join('');
    html+='<tr>'+
      '<td><input data-i="'+i+'" data-k="nombre" value="'+(r.nombre||('C'+r.circN)).toString().replace(/"/g,'&quot;')+'" style="width:72px;font-weight:800" placeholder="C'+(r.circN||'')+'"></td>'+
      '<td><input data-i="'+i+'" data-k="desc" value="'+(r.desc||'').replace(/"/g,'&quot;')+'"></td>'+
      '<td><input data-i="'+i+'" data-k="nInst" type="number" step="1" min="0" value="'+r.nInst+'" style="width:52px;text-align:center"></td>'+
      '<td><input data-i="'+i+'" data-k="P" type="number" step="1" min="0" value="'+r.P+'" style="text-align:right"></td>'+
      '<td><input data-i="'+i+'" data-k="fp" type="number" step="0.01" min="0.1" max="1" value="'+r.fp+'" style="width:58px;text-align:center"></td>'+
      '<td class="num">'+es(c.Sva,0)+'</td>'+
      '<td class="num phA">'+es(c.a,2)+'</td>'+
      (showB?'<td class="num phB">'+es(c.b,2)+'</td>':'')+
      (showC?'<td class="num phC">'+es(c.c,2)+'</td>':'')+
      '<td><select data-i="'+i+'" data-k="circN">'+circOpts+'</select></td>'+
      '<td><select data-i="'+i+'" data-k="poles">'+poleOpts+'</select></td>'+
      '<td class="num" style="white-space:nowrap;font-weight:800">'+circuitLabel(r.circN,r.poles)+'</td>'+
      '<td style="text-align:center;font-weight:800;color:var(--blue2)">'+r.phases+'</td>'+
      '<td><select data-i="'+i+'" data-k="wire">'+wireOpts(r.wire)+'</select></td>'+
      '<td><select data-i="'+i+'" data-k="gnd">'+wireOpts(r.gnd)+'</select></td>'+
      '<td><select data-i="'+i+'" data-k="brk">'+brkOpts(r.brk)+'</select></td>'+
      '<td><select data-i="'+i+'" data-k="circ">'+CIRCUITS.map(x=>'<option '+(r.circ===x?'selected':'')+'>'+x+'</option>').join('')+'</select></td>'+
      '<td><select data-i="'+i+'" data-k="norm">'+NORMS.map(x=>'<option '+(r.norm===x?'selected':'')+'>'+x+'</option>').join('')+'</select></td>'+
      '<td><select data-i="'+i+'" data-k="vRow" style="min-width:72px">'+vOpts+'</select></td>'+
      '<td><button type="button" class="del" data-del="'+i+'">✕</button></td>'+
      '</tr>';
  });

  const qty=b.qty||1;
  html+='<tr class="tot"><td colspan="2">TOTALES (1 tablero)</td><td class="num">'+nInst+'</td><td class="num">'+es(totP,0)+'</td><td></td><td class="num">'+es(totS,0)+'</td>'+
    '<td class="num phA">'+es(totA,2)+'</td>'+(showB?'<td class="num phB">'+es(totB,2)+'</td>':'')+(showC?'<td class="num phC">'+es(totC,2)+'</td>':'')+
    '<td colspan="11"></td></tr>';
  if(qty>1){
    html+='<tr class="tot"><td colspan="2">TOTALES × '+qty+' tableros</td><td class="num">'+nInst*qty+'</td><td class="num">'+es(totP*qty,0)+'</td><td></td><td class="num">'+es(totS*qty,0)+'</td>'+
      '<td class="num phA">'+es(totA*qty,2)+'</td>'+(showB?'<td class="num phB">'+es(totB*qty,2)+'</td>':'')+(showC?'<td class="num phC">'+es(totC*qty,2)+'</td>':'')+
      '<td colspan="11"></td></tr>';
  }
  html+='</tbody>';
  $("tbl").innerHTML=html;

  // bind row inputs without destroying voltage select
  // IMPORTANTE: campos de texto (desc) NO re-renderizan en cada tecla (pierde el foco)
  $("tbl").querySelectorAll('input[data-k],select[data-k]').forEach(el=>{
    function applyRowField(el, doRender){
      const i=+el.getAttribute('data-i');
      const k=el.getAttribute('data-k');
      const r=B().rows[i];
      if(!r) return;
      if(['nInst','P','fp'].indexOf(k)>=0) r[k]=parseFloat(el.value)||0;
      else if(k==='brk'||k==='circN'||k==='poles') r[k]=parseInt(el.value)||0;
      else r[k]=el.value;
      if(k==='circN'||k==='poles'){
        const bad=spacesConflict(r.circN, r.poles, i);
        if(bad.length){
          const nf=nextFreeCirc(r.poles, r.circN);
          if(nf!=null){
            r.circN=nf;
            if(typeof toast==='function') toast('Espacios '+bad.join(',')+' ocupados → reasignado a '+nf);
          } else {
            if(typeof toast==='function') toast('No hay espacios libres para '+r.poles+'P');
          }
        }
        r.phases=phasesFromCirc(r.circN,r.poles,B().sys);
      }
      if(['P','fp','phases','nInst','circN','poles','vRow'].indexOf(k)>=0){
        const c=rowCalc(r); r.brk=pickBrk(c.Imax); r.wire=pickWire(c.Imax);
        // Asegurar que la ampacidad del conductor (75°C + 240.4(D)) no quede por debajo del breaker
        (function(){ let w=WIRES.find(x=>x.id===r.wire); let guard=0;
          while(w && ampOf(w)<r.brk && guard++<20){
            const idx=WIRES.indexOf(w); if(idx<0||idx>=WIRES.length-1) break;
            r.wire=WIRES[idx+1].id; w=WIRES[idx+1];
          }
        })();
        r.gnd=pickGnd(r.wire);
      }
      // Solo texto libre: guardar sin reconstruir la tabla mientras se escribe
      if(!doRender && (k==='desc' || k==='nombre' || k==='cat' || k==='ref' || k==='note' || k==='name')){
        save();
        return;
      }
      if(doRender) renderTable();
      save();
    }
    el.oninput=function(){
      const k=this.getAttribute('data-k');
      // texto: actualizar modelo sin render; numéricos/select: render al vuelo
      if(k==='desc' || k==='nombre' || k==='cat' || k==='ref' || k==='note' || k==='name'){
        applyRowField(this, false);
      } else {
        applyRowField(this, true);
      }
    };
    el.onchange=function(){
      applyRowField(this, true);
    };
  });
  $("tbl").querySelectorAll('button[data-del]').forEach(btn=>{
    btn.onclick=function(){B().rows.splice(+this.getAttribute('data-del'),1);renderTable();save();};
  });

  const Imax=Math.max(totA,totB,totC);
  $("notes").innerHTML='<b>Circuitos exclusivos:</b> cada espacio solo lo usa un ítem. En bi/trifásico el multipolar baja por columna: <b>2P → 1-3</b> (no 1-2); <b>3P → 1-3-5</b> (no 1-2-3). Lado par: 2-4 / 2-4-6.<br>'
    +'<b>Resumen (1 tablero):</b> I máx. = <b>'+es(Imax,2)+' A</b> · conductor sugerido <b>'+wireLabel(pickWire(Imax))+'</b> · breaker sugerido <b>'+pickBrk(Imax)+' A</b>. '
    +'Cantidad de tableros iguales: <b>'+qty+'</b>'+(qty>1?' · carga instalada total <b>'+es(totP*qty,0)+' W</b>':'')+'.';
  if(typeof buildTechNotes==='function') buildTechNotes({Imax:Imax, totP:totP, totS:totS, totA:totA, totB:totB, totC:totC, qty:qty, nInst:nInst});
  if(typeof buildPrintConfig==='function') buildPrintConfig({Imax:Imax, totP:totP, totS:totS, qty:qty});
}

function buildTechNotes(sum){
  const body=$("techNotesBody"); if(!body) return;
  const b=B();
  const v=volt();

    const vals=b.sys===1?[sum.totA]:(b.sys===2?[sum.totA,sum.totB]:[sum.totA,sum.totB,sum.totC]);
    const mx=Math.max.apply(null,vals.concat([0.01]));

    return ((mx-mn)/mx*100);
  })();
  let html='';
  html+='<p><b>1. Alcance y referencias.</b> Este cuadro de cargas se elabora como herramienta de diseño conforme al <b>Código Eléctrico Colombiano NTC 2050</b> (Art. 210 circuitos derivados, Art. 215 alimentadores, Art. 220 cálculo de cargas, Art. 240 protección contra sobrecorriente, Art. 250 puesta a tierra y conductores de protección, Art. 310 conductores, Art. 440 equipos de aire acondicionado cuando aplique) y a los criterios generales del <b>RETIE</b> en materia de protecciones, conductores y canalizaciones. No sustituye la memoria de cálculo firmada ni la inspección oficial.</p>';
  html+='<p><b>2. Configuración eléctrica del tablero.</b> Sistema <b>'+sysLabel(b.sys)+'</b>, tensión de referencia <b>'+((VOLT_MAP[b.v]&&VOLT_MAP[b.v].label)||(v.V+" V"))+'</b>. '
    +'En tableros bi/trifásicos el barraje va por <b>columnas</b> (impar/par): un <b>2P</b> reserva espacios <b>n y n+2</b> (p. ej. 1-3 o 2-4), no consecutivos 1-2; un <b>3P</b> reserva <b>n, n+2, n+4</b> (p. ej. 1-3-5). Así se toman fases distintas A-B o A-B-C. En monofásico los espacios son consecutivos y todos fase A.</p>';
  html+='<p><b>3. Cargas unitarias y tomas (Art. 220).</b> Para tomacorrientes de uso general se adopta por defecto <b>180 VA por salida</b> (práctica del Art. 220 / NEC 220.14). Los circuitos de pequeño electrodoméstico (SA) de cocina se estiman en <b>1500 VA por circuito</b> (Art. 210-11 / 220-52). Las lámparas se cargan por potencia de punto (60 / 100 / 150 W u otra indicada). Las cargas fijas (horno, ducha, estufa, etc.) usan la <b>potencia de placa</b>. El aire acondicionado de plantilla usa 1500 VA solo como referencia de edición; el equipo real debe dimensionarse con <b>placa y Art. 440</b> (MCA, MOP, FLA).</p>';
  html+='<p><b>4. Corriente por fase y factor de potencia.</b> La corriente se obtiene de la potencia aparente S = P / FP. En monofásico o bifásico se usa la tensión de línea del sistema; en trifásico equilibrado I = S / (√3 · V<sub>L</sub>) y en cargas 1P sobre sistema 3φ se usa la tensión fase-neutro cuando aplica. Un FP menor a 1 aumenta la corriente para la misma potencia activa y puede obligar a subir calibre y protección.</p>';
  html+='<p><b>5. Conductores (Art. 310 y 110-14).</b> La ampacidad de diseño se toma de la columna de <b>75 °C</b> (temperatura típica de terminales), aunque el aislamiento sea 90 °C (THHN). Además se aplican los límites de <b>conductores pequeños Art. 240-4(D)</b>: cobre 14 AWG ≤ 15 A, 12 AWG ≤ 20 A, 10 AWG ≤ 30 A. El calibre del ramal se selecciona para una corriente no menor al <b>125 % de la carga continua</b> (Art. 210-19, 215-2). El conductor de protección (EGC) se orienta con el Art. 250-122 según el calibre de fase.</p>';
  html+='<p><b>6. Protecciones (Art. 240).</b> El interruptor termomagnético se selecciona para cubrir al menos el 125 % de la corriente de carga continua y debe ser compatible con la ampacidad del conductor que protege. No se debe dejar un breaker de mayor capacidad que la ampacidad usable del conductor sin justificar excepción normativa.</p>';
  html+='<p><b>7. Balance de fases.</b> En sistemas 2φ/3φ se recomienda repartir las cargas 1P entre fases para minimizar desequilibrio. El desequilibrio orientativo actual del tablero es ≈ <b>'+es(unbal,1)+' %</b> '
    +'(I<sub>A</sub> = '+es(sum.totA,2)+' A'
    +(b.sys>=2?('; I<sub>B</sub> = '+es(sum.totB,2)+' A'):'')
    +(b.sys>=3?('; I<sub>C</sub> = '+es(sum.totC,2)+' A'):'')
    +'). Valores prolongados elevados de desequilibrio aumentan pérdidas y pueden sobrecargar el neutro.</p>';
  html+='<p><b>8. Demanda y diversidad (Art. 220).</b> Este cuadro registra <b>carga instalada</b>. La demanda máxima del alimentador o del transformador puede aplicar factores de demanda o diversidad según el tipo de ocupación (Art. 220 y tablas asociadas); esos factores se consolidan en el módulo de demanda de la Suite y no sustituyen el criterio del diseñador.</p>';
  html+='<p><b>9. Caída de tensión.</b> Los límites habituales de diseño (del orden del 3 % en ramales y 5 % total alimentador+ramal, según Art. 210-19 / 215-2 y buenas prácticas) deben verificarse con la longitud real, el material y el tipo de canalización en el módulo de caída de tensión.</p>';
  html+='<p><b>10. Responsabilidad profesional.</b> Los resultados son de asistencia al diseño. Deben verificarse con planos, fichas de equipo, condiciones de instalación y la firma del ingeniero eléctrico responsable, de acuerdo con el RETIE y la NTC 2050.</p>';
  html+='<p style="margin-top:8px"><b>Resumen numérico:</b> carga instalada '+es(sum.totP,0)+' W · '+es(sum.totS,0)+' VA · I máx. '+es(sum.Imax,2)+' A · '
    +'conductor sugerido a nivel tablero: '+wireLabel(pickWire(sum.Imax))+' · breaker sugerido: '+pickBrk(sum.Imax)+' A'
    +(sum.qty>1?(' · ×'+sum.qty+' tableros iguales'):'')+'.</p>';
  body.innerHTML=html;
}

$("sysSeg").onclick=function(e){
  const btn=e.target.closest('button[data-s]');
  if(!btn) return;
  B().sys=+btn.getAttribute('data-s');
  // Reubicar multipolares al cambiar 1φ/2φ/3φ (paso de polos distinto)
  (B().rows||[]).forEach((r,i)=>{
    r.poles=Math.max(1, Math.min(B().sys===1?1:3, parseInt(r.poles)||1));
    if(B().sys===1) r.poles=1;
    if(B().sys===2 && r.poles>2) r.poles=2;
    const bad=spacesConflict(r.circN, r.poles, i);
    const span=spacesOf(Object.assign({},r));
    const nCirc=B().nCirc||12;
    if(bad.length || span.some(s=>s>nCirc)){
      const nf=nextFreeCirc(r.poles, r.circN);
      if(nf!=null) r.circN=nf;
    }
    r.phases=phasesFromCirc(r.circN, r.poles, B().sys);
  });
  render();
  save();
};

/* ===== Plantilla puntos cuadro de carga (Excel + NTC 2050) ===== */
const QA_ITEMS = [
  {id:'60',   n:'qa_n60',   va:'qa_va60',   def:60,   tag:'Lámparas 60 W'},
  {id:'100',  n:'qa_n100',  va:'qa_va100',  def:100,  tag:'Lámparas 100 W'},
  {id:'150',  n:'qa_n150',  va:'qa_va150',  def:150,  tag:'Lámparas 150 W'},
  {id:'180',  n:'qa_n180',  va:'qa_va180',  def:180,  tag:'Tomas 180 VA'},
  {id:'1000', n:'qa_n1000', va:'qa_va1000', def:1000, tag:'Tomas GFCI 1000 W'},
  {id:'1500', n:'qa_n1500', va:'qa_va1500', def:1500, tag:'Refri/Lava/Plancha 1500 W'},
  {id:'4000', n:'qa_n4000', va:'qa_va4000', def:4000, tag:'Horno 4000 W'},
  {id:'4500', n:'qa_n4500', va:'qa_va4500', def:4500, tag:'Ducha 4500 W'},
  {id:'8000', n:'qa_n8000', va:'qa_va8000', def:8000, tag:'Estufa 8000 W'},
  {id:'AC', n:'qa_nAC', va:'qa_vaAC', def:1500, tag:'Aire acondicionado 1500 VA'}
];
function qaRead(){
  const parts=[];
  let tot=0;
  QA_ITEMS.forEach(it=>{
    const n=Math.max(0, parseInt(($(it.n)||{}).value,10)||0);
    const va=Math.max(0, parseFloat(($(it.va)||{}).value)||it.def);
    if(n>0){ parts.push({tag:it.tag, n:n, va:va, sub:n*va}); tot+=n*va; }
  });
  return {parts, tot:Math.round(tot)};
}
function qaUpdateTot(){
  const {tot}=qaRead();
  const el=$("qaTotShow"); if(el) el.textContent=String(tot);
}
function qaRestoreNorm(){
  QA_ITEMS.forEach(it=>{ const el=$(it.va); if(el) el.value=it.def; });
  qaUpdateTot();
}
function qaClearQty(){
  QA_ITEMS.forEach(it=>{ const el=$(it.n); if(el) el.value=0; });
  qaUpdateTot();
}
function qaNextCirc(){
  const nb=B();
  try{
    const used={};
    (nb.rows||[]).forEach(r=>{
      const s=typeof spacesOf==='function'?spacesOf(r):[r.circN];
      (s||[]).forEach(x=>{ if(x) used[x]=1; });
    });
    for(let c=1;c<=(nb.nCirc||12);c++) if(!used[c]) return c;
  }catch(e){}
  return (nb.rows||[]).length+1;
}
function qaAddToBoard(){
  const {parts, tot}=qaRead();
  if(!parts.length || tot<=0){
    alert('Indique al menos un punto (cantidad > 0).');
    return;
  }
  const fp=Math.min(1, Math.max(0.1, parseFloat(($("qaFp")||{}).value)||1));
  const poles=parseInt(($("qaPoles")||{}).value,10)||1;
  const nb=B();
  const circN=Math.min(qaNextCirc(), nb.nCirc||12);
  const phases=typeof phasesFromCirc==='function'?phasesFromCirc(circN, poles, nb.sys):'A';
  const desc=parts.map(p=>p.n+'×'+p.tag.replace(/^Lámparas |^Tomas /,'')).join(' + ');
  // Clasificación normativa
  let circ='Carga mixta', norm='NTC 2050 Art. 210/220';
  const onlyLum=parts.every(p=>/Lámparas/.test(p.tag));
  const onlyToma=parts.every(p=>/Tomas 180|GFCI/.test(p.tag));
  const onlyEsp=parts.every(p=>/Refri|Horno|Ducha|Estufa|Aire acond/.test(p.tag));
  if(onlyLum){ circ='Alumbrado'; norm='NTC 2050 Art. 210/220 — Alumbrado por puntos'; }
  else if(onlyToma){ circ='Tomas'; norm='NTC 2050 Art. 220 — 180 VA/toma · GFCI Art. 210'; }
  else if(onlyEsp){ circ='Carga especial'; norm='NTC 2050 Art. 220 — Cargas fijas / cocina'; }
  nb.rows.push({
    desc: desc,
    nInst:1,
    P: tot,       // W ≈ VA con el FP indicado en el cálculo de S
    fp: fp,
    phases: phases,
    wire:'', gnd:'', brk:0,
    circ: circ,
    norm: norm,
    circN: circN,
    poles: poles
  });
  renderTable(); save();
  qaClearQty();
  if(typeof toast==='function') toast('Circuito '+circN+': '+tot+' VA · '+desc);
}
(function bindQa(){
  QA_ITEMS.forEach(it=>{
    const n=$(it.n), v=$(it.va);
    if(n){ n.oninput=n.onchange=qaUpdateTot; }
    if(v){ v.oninput=v.onchange=qaUpdateTot; }
  });
  const fp=$("qaFp"); if(fp) fp.oninput=qaUpdateTot;
  const add=$("btnQaAdd"); if(add) add.onclick=function(e){ e.preventDefault(); qaAddToBoard(); };
  const clr=$("btnQaClear"); if(clr) clr.onclick=function(e){ e.preventDefault(); qaClearQty(); };
  const rn=$("btnQaNorm"); if(rn) rn.onclick=function(e){ e.preventDefault(); qaRestoreNorm(); };
  qaUpdateTot();
})();

function phaseTotals(){
  let A=0,B=0,C=0;
  const items=[];
  B().rows.forEach((r,i)=>{
    const c=rowCalc(r);
    A+=c.a;B+=c.b;C+=c.c;
    items.push({i,r,c});
  });
  return {A,B,C,items,max:Math.max(A,B,C,0.01),sum:A+B+C};
}

/** Balance: ordena por kVA y asigna a la fase con menor corriente */
function toast(msg){
  let el=document.getElementById('ccToast');
  if(!el){
    el=document.createElement('div');
    el.id='ccToast';
    el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;font-weight:700;z-index:99;opacity:0;transition:.2s;pointer-events:none';
    document.body.appendChild(el);
  }
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(toast._t); toast._t=setTimeout(()=>{el.style.opacity='0';},2200);
}

function autoBalance(){
  const b=B();
  if(!b || !b.rows || !b.rows.length){
    toast('No hay circuitos para balancear');
    return;
  }
  if(b.sys===1){
    toast('Sistema monofásico: no hay varias fases que equilibrar');
    return;
  }
  const phaseList = b.sys===2 ? ['A','B'] : ['A','B','C'];
  const nCirc = b.nCirc||12;
  // Solo se reasignan circuitos 1P (la fase sale del N° de espacio en el tablero)
  const movable=[];
  b.rows.forEach((r,idx)=>{
    const poles=Math.max(1, parseInt(r.poles)||1);
    if(poles!==1) return;
    const c=rowCalc(r);
    movable.push({idx, Sva:c.Sva||0, oldCirc:r.circN});
  });
  if(!movable.length){
    toast('No hay circuitos 1P para reasignar (2P/3P se dejan fijos)');
    return;
  }
  // Liberar espacios de los 1P movibles
  movable.forEach(m=>{ b.rows[m.idx].circN=null; });
  const load={A:0,B:0,C:0};
  b.rows.forEach((r,idx)=>{
    if(movable.some(m=>m.idx===idx)) return;
    if(r.circN==null) return;
    const c=rowCalc(r);
    load.A+=c.a; load.B+=c.b; load.C+=c.c;
  });
  function freeSlots(ph){
    const occ=occupancyMap(null);
    const slots=[];
    for(let n=1;n<=nCirc;n++){
      if(occ[n]!=null) continue;
      if(phaseOfCircuit(n,b.sys)===ph) slots.push(n);
    }
    return slots;
  }
  movable.sort((a,b)=>b.Sva-a.Sva);
  let assigned=0, failed=0;
  movable.forEach(m=>{
    const ordered=phaseList.slice().sort((p1,p2)=>(load[p1]||0)-(load[p2]||0));
    let placed=false;
    for(const ph of ordered){
      const slots=freeSlots(ph);
      if(!slots.length) continue;
      const r=b.rows[m.idx];
      r.circN=slots[0];
      r.poles=1;
      r.phases=phasesFromCirc(r.circN,1,b.sys);
      const c=rowCalc(r);
      load.A+=c.a; load.B+=c.b; load.C+=c.c;
      r.brk=pickBrk(c.Imax);
      r.wire=pickWire(c.Imax);
      let w=WIRES.find(x=>x.id===r.wire), guard=0;
      while(w && ampOf(w)<r.brk && guard++<20){
        const ix=WIRES.indexOf(w); if(ix<0||ix>=WIRES.length-1) break;
        r.wire=WIRES[ix+1].id; w=WIRES[ix+1];
      }
      r.gnd=pickGnd(r.wire);
      assigned++;
      placed=true;
      break;
    }
    if(!placed){
      // restaurar
      b.rows[m.idx].circN=m.oldCirc!=null?m.oldCirc:1;
      b.rows[m.idx].phases=phasesFromCirc(b.rows[m.idx].circN,1,b.sys);
      failed++;
    }
  });
  const tot=typeof phaseTotals==='function'?phaseTotals():{A:load.A,B:load.B,C:load.C,max:Math.max(load.A,load.B,load.C)};
  const minI=Math.min(tot.A,tot.B,b.sys>=3?tot.C:tot.B);
  const unbal=tot.max>0?((tot.max-minI)/tot.max*100):0;
  renderTable();
  if(typeof renderBalance==='function') renderBalance();
  save();
  toast('Balance: '+assigned+' circuito(s) 1P reasignados'
    +(failed?(' · '+failed+' sin espacio libre'):'')
    +' · deseq. ≈ '+es(unbal,1)+' % (A '+es(tot.A,1)+' · B '+es(tot.B,1)
    +(b.sys>=3?(' · C '+es(tot.C,1)):'')+' A)');
}

function resetPhasesABC(){
  const b=B();
  if(!b||!b.rows) return;
  let n=0;
  b.rows.forEach(r=>{
    const ph=String(r.phases||'').toUpperCase();
    if(ph==='AB'||ph==='BC'||ph==='AC') return;
    if(r.phases!=='ABC'){ r.phases='ABC'; n++; }
    else r.phases='ABC';
  });
  renderTable();
  if(typeof renderBalance==='function') renderBalance();
  save();
  toast(n?('Restauradas '+n+' cargas a ABC (trifásico equilibrado)'):'Todas las cargas movibles ya están en ABC');
}

function renderBalance(){
  const b=B();
  const t=phaseTotals();
  const qty=b.qty||1;
  const pct=x=>(100*x/t.max).toFixed(0);
  const unbal=t.max>0?((t.max-Math.min(t.A,t.B,t.C))/t.max*100):0;

  $("balCards").innerHTML=
    '<div class="bal-card"><h3>Fase A</h3><div class="big">'+es(t.A,2)+' A</div>'+
    '<div class="bal-bar"><span class="phA-bg" style="width:'+pct(t.A)+'%"></span></div>'+
    '<div class="sub">'+es(t.A*qty,2)+' A × '+qty+' tablero(s)</div></div>'+
    (b.sys>=2?
    '<div class="bal-card"><h3>Fase B</h3><div class="big">'+es(t.B,2)+' A</div>'+
    '<div class="bal-bar"><span class="phB-bg" style="width:'+pct(t.B)+'%"></span></div>'+
    '<div class="sub">'+es(t.B*qty,2)+' A × '+qty+' tablero(s)</div></div>':'')+
    (b.sys>=3?
    '<div class="bal-card"><h3>Fase C</h3><div class="big">'+es(t.C,2)+' A</div>'+
    '<div class="bal-bar"><span class="phC-bg" style="width:'+pct(t.C)+'%"></span></div>'+
    '<div class="sub">'+es(t.C*qty,2)+' A × '+qty+' tablero(s)</div></div>':'')+
    '<div class="bal-card"><h3>Desequilibrio</h3><div class="big">'+es(unbal,1)+' %</div>'+
    '<div class="sub">'+(unbal<=5?'Bien equilibrado':unbal<=15?'Aceptable — se puede mejorar':'Desbalanceado — balancear')+'</div></div>';

  let rows='<thead><tr><th>#</th><th>Circuito</th><th>kW</th><th>kVA</th><th>Fase</th><th class="n">IA</th>'+
    (b.sys>=2?'<th class="n">IB</th>':'')+(b.sys>=3?'<th class="n">IC</th>':'')+'</tr></thead><tbody>';
  t.items.forEach((it,n)=>{
    rows+='<tr><td>'+(n+1)+'</td><td>'+(it.r.desc||'')+'</td><td class="n">'+es(it.c.Ptot/1000,2)+'</td>'+
      '<td class="n">'+es(it.c.Sva/1000,2)+'</td><td><b>'+(it.r.phases||'')+'</b></td>'+
      '<td class="n">'+es(it.c.a,2)+'</td>'+
      (b.sys>=2?'<td class="n">'+es(it.c.b,2)+'</td>':'')+
      (b.sys>=3?'<td class="n">'+es(it.c.c,2)+'</td>':'')+'</tr>';
  });
  rows+='<tr style="font-weight:800;background:var(--amberbg)"><td></td><td>TOTAL</td><td class="n">'+es(t.items.reduce((s,it)=>s+it.c.Ptot,0)/1000,2)+'</td>'+
    '<td class="n">'+es(t.items.reduce((s,it)=>s+it.c.Sva,0)/1000,2)+'</td><td></td>'+
    '<td class="n">'+es(t.A,2)+'</td>'+
    (b.sys>=2?'<td class="n">'+es(t.B,2)+'</td>':'')+
    (b.sys>=3?'<td class="n">'+es(t.C,2)+'</td>':'')+'</tr></tbody>';
  $("balTbl").innerHTML=rows;
  $("balNotes").innerHTML='Algoritmo: ordena circuitos por kVA (mayor a menor) y asigna cada uno a la fase con menor corriente acumulada. Las cargas bifásicas (AB/BC/AC) no se mueven. Objetivo: desequilibrio &lt; 10–15 %.';
}

// subtabs
$("subTabs").onclick=function(e){
  const btn=e.target.closest('button[data-view]');
  if(!btn) return;
  setView(btn.getAttribute('data-view'));
};
(function(){
  const ba=$("btnAutoBal"), br=$("btnResetBal");
  if(ba) ba.onclick=function(e){e.preventDefault(); autoBalance();};
  if(br) br.onclick=function(e){e.preventDefault(); resetPhasesABC();};
})();

  .side{overflow-y:auto;padding:13px;border-right:1px solid var(--line);background:var(--panel2)}
  .side h3{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800;margin:14px 2px 7px}.side h3:first-child{margin-top:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:8px 11px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;width:100%;text-align:center}
  .btn:hover{border-color:var(--cyan)}.btn.red:hover{border-color:var(--red);color:var(--red)}
  .brow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
  .brow.b3{grid-template-columns:1fr 1fr 1fr}
  .f{margin-bottom:8px}.f:last-child{margin-bottom:0}
  .f label{display:block;font-size:10px;font-weight:650;color:var(--mut);margin-bottom:3px}
  .f input,.f select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--ink);font-size:12.5px}
  .f input:focus,.f select:focus{outline:0;border-color:var(--cyan)}
  .hint{font-size:10.5px;color:var(--mut);line-height:1.45}
  .roomtabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .roomtabs button{border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-weight:700;font-size:11px;padding:6px 10px;border-radius:8px;cursor:pointer}
  .roomtabs button.on{background:var(--cyan);color:#0a1520;border-color:transparent}
  .roomtabs .add{border-style:dashed;color:var(--cyan)}
  .palette{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:240px;overflow-y:auto}
  .pbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 6px;cursor:pointer;text-align:center;font-size:10.5px;font-weight:700}
  .pbtn:hover{border-color:var(--cyan)}.pbtn .ico{font-size:14px;margin-bottom:2px}
  .pbtn small{display:block;font-weight:600;color:var(--mut);font-size:9.5px;margin-top:2px}
  .clist{display:flex;flex-direction:column;gap:5px;max-height:160px;overflow-y:auto}
  .citem{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:11.5px}
  .citem.on{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,transparent)}
  .citem .sw{width:12px;height:12px;border-radius:3px;flex:none}.citem .nm{flex:1;font-weight:700}
  .citem .del{border:0;background:transparent;color:var(--red);cursor:pointer}
  .stage{position:relative;overflow:hidden;background:var(--bg)}
  svg.canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  svg.canvas.grabbing{cursor:grabbing}svg.canvas.placing{cursor:crosshair}
  .legend{position:absolute;left:12px;bottom:11px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:10px;color:var(--mut);max-width:260px}
  .legend .row{display:flex;align-items:center;gap:7px;margin:2px 0}.lg-s{width:11px;height:11px;border-radius:2px}
  .hud{position:absolute;right:12px;top:11px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:10.5px;color:var(--mut);font-family:var(--mono)}.hud b{color:var(--ink)}
  .zoombar{position:absolute;right:12px;bottom:11px;display:flex;flex-direction:column;gap:6px}
  .zoombar button{width:33px;height:33px;border-radius:9px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 90%,transparent);color:var(--ink);cursor:pointer;font-weight:700}
  .viewhelp{position:absolute;left:12px;top:11px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:11px;color:var(--mut);font-weight:600;max-width:360px}.viewhelp b{color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:9px;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;transition:.18s;z-index:90}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .stat{border-radius:10px;padding:9px 11px;font-size:12px;font-weight:700}
  .stat.ok{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M3 10.5L12 3l9 7.5V21a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1v-10.5z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg></div>
  <div><h1>Casa / Apto tipo</h1><div class="sub">Cuartos · vanos · puntos EL con altura · planta y 3D general</div><div class="nm">Ing. Alexander Espinosa</div></div>
  <div class="sp"></div>
  <div class="tabs" id="tabs">
    <button data-t="planta" class="on">⬒ Cuarto</button>
    <button data-t="general">◫ General</button>
    <button data-t="v3d">◰ 3D general</button>
  </div>
  <button class="btnT" type="button" id="btnNames">Aa Nombres</button>
  <button class="btnT" type="button" id="btnFillMode">◐ Relleno</button>
  <button class="btnT" type="button" id="btnDup">⧉ Duplicar</button>
  <button class="btnT" type="button" id="btnLineW" title="Grosor de línea">─ Línea</button>
  <button class="btnT" type="button" id="btnPrint">🖨 Imprimir</button>
  <button class="ib" id="themeBtn" onclick="toggleTheme()">🌙</button>
</header>
<div class="wrap">
  <aside class="side">
    <h3>Proyecto</h3>
    <div class="card"><div class="f"><label>Nombre</label><input id="projName" value="Apto tipo"></div></div>
    <h3>Cuartos</h3>
    <div class="card">
      <div class="roomtabs" id="roomTabs"></div>
      <div class="brow">
        <div class="f"><label>Largo L (m)</label><input id="rL" type="number" step="0.1"></div>
        <div class="f"><label>Ancho W (m)</label><input id="rW" type="number" step="0.1"></div>
      </div>
      <div class="brow">
        <div class="f"><label>Alto H (m)</label><input id="rH" type="number" step="0.1"></div>
        <div class="f"><label>Tipo</label>
          <select id="rType"><option>Sala</option><option>Cocina</option><option>Alcoba</option><option>Baño</option><option>Estudio</option><option>Comedor</option><option>Lavandería</option><option>Garaje</option><option>Otro</option></select>
        </div>
      </div>
      <div class="f"><label>Nombre</label><input id="rName"></div>
      <div class="brow">
        <div class="f"><label>Pos. X sitio (m)</label><input id="rGx" type="number" step="0.1" title="Origen del cuarto en planta general"></div>
        <div class="f"><label>Pos. Z sitio (m)</label><input id="rGz" type="number" step="0.1"></div>
      </div>
      <div class="hint">Pos. X/Z ubican el cuarto en la planta general (como bloques en SIPRA).</div>
      <button class="btn red" style="margin-top:6px" id="btnDelRoom">Eliminar cuarto</button>
    </div>
    <h3>Estado</h3>
    <div id="statusBox"></div>
    <h3>Agregar</h3>
    <div class="card">
      <div class="palette" id="palette"></div>
      <div class="hint" style="margin-top:8px">Vanos y puntos de muro se anclan a la pared. Usa <b>Y (m)</b> para la altura del elemento.</div>
    </div>
    <h3>Seleccionado</h3>
    <div class="card" id="selCard"><div class="hint">Selecciona un elemento en planta o en la lista.</div></div>
    <h3>Elementos del cuarto</h3>
    <div class="card"><div class="clist" id="clist"></div>
      <button class="btn" style="margin-top:6px" id="btnFit">Centrar vista</button>
    </div>
    <h3>Lista de materiales</h3>
    <div class="card"><div id="matList" class="hint">—</div></div>
  </aside>
  <div class="stage">
    <svg class="canvas" id="cv" viewBox="0 0 1040 600" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="viewhelp" id="viewHelp"></div>
    <div class="hud" id="hud"></div>
    <div class="legend" id="legend"></div>
    <div class="zoombar"><button id="zIn">＋</button><button id="zOut">－</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const VBW=1040,VBH=600,ML=40,MB=40,MT=40,MR=40;
const cv=$("cv");
const es=(x,d=2)=>Number(x).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});
function cvar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';}

const CATALOG=[
  {id:'puerta', name:'Puerta', w:0.90, d:0.10, h:2.10, color:'#34d399', kind:'AR', wall:true, y0:0},
  {id:'puerta_d', name:'Puerta doble', w:1.60, d:0.10, h:2.10, color:'#10b981', kind:'AR', wall:true, y0:0},
  {id:'ventana', name:'Ventana', w:1.20, d:0.10, h:1.20, color:'#38bdf8', kind:'AR', wall:true, y0:0.90},
  {id:'ventana_f', name:'Ventana fija', w:1.50, d:0.10, h:1.00, color:'#0ea5e9', kind:'AR', wall:true, y0:0.90},
  {id:'toma', name:'Toma 15A', w:0.12, d:0.08, h:0.12, color:'#f5b301', kind:'EL', wall:true, y0:0.30},
  {id:'toma_esp', name:'Toma especial', w:0.12, d:0.08, h:0.12, color:'#e07a2a', kind:'EL', wall:true, y0:0.30},
  {id:'switch', name:'Interruptor', w:0.10, d:0.08, h:0.12, color:'#a78bfa', kind:'EL', wall:true, y0:1.20},
  {id:'lum_techo', name:'Luminaria techo', w:0.30, d:0.30, h:0.08, color:'#fbbf24', kind:'EL', wall:false, y0:null},
  {id:'lum_pared', name:'Aplique pared', w:0.15, d:0.10, h:0.25, color:'#f59e0b', kind:'EL', wall:true, y0:1.80},
  {id:'tv', name:'Punto TV/datos', w:0.10, d:0.08, h:0.10, color:'#22d3ee', kind:'EL', wall:true, y0:0.40},
  {id:'mueble', name:'Mueble / cama', w:1.60, d:0.90, h:0.50, color:'#94a3b8', kind:'EQ', wall:false, y0:0},
  {id:'mesada', name:'Mesada cocina', w:1.80, d:0.60, h:0.90, color:'#64748b', kind:'EQ', wall:false, y0:0},
  // Tuberías / conduit (longitud ≈ w en planta)
  {id:'libre', name:'Elemento libre', w:0.40, d:0.40, h:0.40, color:'#f59e0b', kind:'FR', wall:false, y0:0, categoria:'Personalizado'},
  {id:'tub_pvc', name:'Tubería PVC', w:1.00, d:0.05, h:0.05, color:'#94a3b8', kind:'TB', wall:false, y0:2.2, calibre:'3/4"', material:'PVC'},
  {id:'tub_emt', name:'Tubería EMT', w:1.00, d:0.05, h:0.05, color:'#64748b', kind:'TB', wall:false, y0:2.2, calibre:'3/4"', material:'EMT'},
  {id:'tub_imc', name:'Tubería IMC', w:1.00, d:0.05, h:0.05, color:'#475569', kind:'TB', wall:false, y0:2.2, calibre:'1"', material:'IMC'},
  {id:'tub_flex', name:'Tubería flexible', w:1.00, d:0.05, h:0.05, color:'#a78bfa', kind:'TB', wall:false, y0:2.2, calibre:'3/4"', material:'Flexible'},
  {id:'tub_ent', name:'Tubería enterrada', w:1.00, d:0.08, h:0.08, color:'#78716c', kind:'TB', wall:false, y0:0.0, calibre:'1"', material:'PVC enterrado'},
];

function defaultY(c, roomH){
  if(c.y0!=null) return c.y0;
  if(c.id==='lum_techo') return Math.max(0, (roomH||2.4)-0.12);
  return 0;
}

function newRoom(name, type, gx, gz){
  return {id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),
    name:name||'Cuarto', type:type||'Otro', L:4, W:3.5, H:2.4, gx:gx||0, gz:gz||0, items:[]};
}

let S={tab:'planta', projName:'Apto tipo 2 alcobas', rooms:[], active:0, sel:null, placing:null,
  view:{x0:-1,y0:-1,s:50}, cam:{az:35,el:28,s:22}, drag:null, showNames:true, globalFill:'solid'};
try{
  const j=JSON.parse(localStorage.getItem('casa_state4'));
  if(j&&j.rooms&&j.rooms.length){
    S.rooms=j.rooms; S.active=Math.min(j.active||0,j.rooms.length-1);
    S.projName=j.projName||S.projName; S.tab=j.tab||'planta';
  }
}catch(e){}
if(!S.rooms.length){
  S.rooms=[
    Object.assign(newRoom('Sala comedor','Sala',0,0),{L:5,W:4}),
    Object.assign(newRoom('Cocina','Cocina',5.3,0),{L:3,W:2.5}),
    Object.assign(newRoom('Alcoba 1','Alcoba',0,4.3),{L:3.5,W:3}),
    Object.assign(newRoom('Baño','Baño',3.7,4.3),{L:2.2,W:1.8})
  ];
}
function save(){try{localStorage.setItem('casa_state4',JSON.stringify({rooms:S.rooms,active:S.active,projName:S.projName,tab:S.tab}));}catch(e){}}
function R(){return S.rooms[S.active];}
function cat(id){return CATALOG.find(c=>c.id===id)||CATALOG[0];}
function isWall(t){const id=typeof t==='string'?t:(t&&t.type);return !!(cat(id).wall);}
function itemColor(it){return it.color||cat(it.type).color||'#4f8cff';}
function itemFill(it){return it.fill||S.globalFill||'solid';}
function itemOp(it){return itemFill(it)==='transparent'?0.22:0.92;}
const CALIBRES=['1/2"','3/4"','1"','1-1/4"','1-1/2"','2"','2-1/2"','3"','4"'];

function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

function itemRect(it){
  const w=it.rot%180===0?it.w:it.d, d=it.rot%180===0?it.d:it.w;
  return {x0:it.x, z0:it.z, x1:it.x+w, z1:it.z+d, w, d};
}
/** Hit box ampliado: vanos delgados (puerta doble, ventana fija) siguen seleccionables */
function hitRect(it){
  const r=itemRect(it);
  // mínimo 0.45 m en cada eje para clic fácil
  const minSpan=0.45;
  let x0=r.x0, x1=r.x1, z0=r.z0, z1=r.z1;
  if(x1-x0 < minSpan){ const m=(x0+x1)/2; x0=m-minSpan/2; x1=m+minSpan/2; }
  if(z1-z0 < minSpan){ const m=(z0+z1)/2; z0=m-minSpan/2; z1=m+minSpan/2; }
  if(isWall(it)){ x0-=0.08; x1+=0.08; z0-=0.08; z1+=0.08; }
  return {x0, z0, x1, z1};
}
function snapToWall(x,z,width,depth){
  const rm=R(), half=(width||0.9)/2, dep=depth||0.10;
  const dS=z, dN=rm.W-z, dW=x, dE=rm.L-x, m=Math.min(dS,dN,dW,dE);
  let wall,nx,nz,rot;
  if(m===dS){wall='S';rot=0;const a=Math.max(half,Math.min(rm.L-half,x));nx=a-half;nz=0;}
  else if(m===dN){wall='N';rot=0;const a=Math.max(half,Math.min(rm.L-half,x));nx=a-half;nz=rm.W-dep;}
  else if(m===dW){wall='W';rot=90;const a=Math.max(half,Math.min(rm.W-half,z));nx=0;nz=a-half;}
  else{wall='E';rot=90;const a=Math.max(half,Math.min(rm.W-half,z));nx=rm.L-dep;nz=a-half;}
  return {wall,x:+nx.toFixed(3),z:+nz.toFixed(3),rot};
}

function W2S(x,z){const v=S.view;return [ML+(x-v.x0)*v.s, VBH-MB-(z-v.y0)*v.s];}
function S2W(px,pz){const v=S.view;return [v.x0+(px-ML)/v.s, v.y0+(VBH-MB-pz)/v.s];}
function evtVB(e){const r=cv.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX),cy=(e.touches?e.touches[0].clientY:e.clientY);return [(cx-r.left)/r.width*VBW,(cy-r.top)/r.height*VBH];}

function siteBounds(){
  let minX=0,minZ=0,maxX=1,maxZ=1;
  S.rooms.forEach(rm=>{
    minX=Math.min(minX,rm.gx); minZ=Math.min(minZ,rm.gz);
    maxX=Math.max(maxX,rm.gx+rm.L); maxZ=Math.max(maxZ,rm.gz+rm.W);
  });
  return {minX,minZ,maxX,maxZ, L:maxX-minX, W:maxZ-minZ};
}

function syncUI(){
  const r=R();
  $("rL").value=r.L; $("rW").value=r.W; $("rH").value=r.H;
  $("rName").value=r.name; $("rType").value=r.type;
  $("rGx").value=r.gx; $("rGz").value=r.gz;
  $("projName").value=S.projName||'';
}
function onRoomMeta(){
  const r=R();
  r.name=$("rName").value; r.type=$("rType").value;
  r.L=parseFloat($("rL").value)||r.L;
  r.W=parseFloat($("rW").value)||r.W;
  r.H=parseFloat($("rH").value)||r.H;
  r.gx=parseFloat($("rGx").value)||0;
  r.gz=parseFloat($("rGz").value)||0;
  render();
}

function renderTabs(){
  $("tabs").querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  $("roomTabs").innerHTML=S.rooms.map((r,i)=>`<button class="${i===S.active?'on':''}" data-i="${i}">${r.name}</button>`).join('')
    +`<button class="add" id="btnAddRoom">＋ Cuarto</button>`;
  $("roomTabs").querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{S.active=+b.dataset.i;S.sel=null;render();});
  $("btnAddRoom").onclick=()=>{
    const sb=siteBounds();
    S.rooms.push(newRoom('Cuarto '+(S.rooms.length+1),'Otro', sb.maxX+0.3, 0));
    S.active=S.rooms.length-1;S.sel=null;render();
  };
}

function renderPalette(){
  $("palette").innerHTML=CATALOG.map(c=>`
    <button class="pbtn ${S.placing===c.id?'on':''}" data-p="${c.id}" style="${S.placing===c.id?'border-color:'+c.color:''}">
      <div class="ico" style="color:${c.color}">${c.kind==='AR'?'▭':c.kind==='EL'?'●':c.kind==='TB'?'═':c.kind==='FR'?'◇':'▣'}</div>
      ${c.name}<small>${c.wall?'Muro · ':''}Y≈${c.y0!=null?es(c.y0,2):'techo'} m</small>
    </button>`).join('');
  $("palette").querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{
    S.placing=S.placing===b.dataset.p?null:b.dataset.p;S.sel=null;render();
  });
}

function renderList(){
  const items=R().items;
  if(!items.length){$("clist").innerHTML='<div class="hint">Sin elementos.</div>';return;}
  $("clist").innerHTML=items.map(it=>{
    const c=cat(it.type);
    return `<div class="citem ${S.sel===it.id?'on':''}" data-id="${it.id}">
      <span class="sw" style="background:${c.color}"></span>
      <span class="nm">${it.name||c.name}<br><small style="color:var(--mut);font-weight:600">Y=${es(it.y||0,2)} m</small></span>
      <button class="del" data-del="${it.id}">✕</button>
    </div>`;
  }).join('');
  $("clist").querySelectorAll('.citem').forEach(el=>el.onclick=()=>{S.sel=el.dataset.id;S.placing=null;render();});
  $("clist").querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();R().items=R().items.filter(x=>x.id!==b.dataset.del);if(S.sel===b.dataset.del)S.sel=null;render();});
}

function renderSel(){
  const it=R().items.find(x=>x.id===S.sel);
  if(!it){$("selCard").innerHTML='<div class="hint">Selecciona un elemento.</div>';return;}
  const c=cat(it.type);
  const isTb=c.kind==='TB';
  $("selCard").innerHTML=`
    <div class="f"><label>Nombre</label><input id="sName" value="${(it.name||c.name).replace(/"/g,'&quot;')}"></div>
    <div class="brow b3">
      <div class="f"><label>X (m)</label><input id="sX" type="number" step="0.05" value="${Number(it.x).toFixed(2)}"></div>
      <div class="f"><label>Z (m)</label><input id="sZ" type="number" step="0.05" value="${Number(it.z).toFixed(2)}"></div>
      <div class="f"><label>Y altura (m)</label><input id="sY" type="number" step="0.05" min="0" value="${Number(it.y||0).toFixed(2)}"></div>
    </div>
    <div class="brow">
      <div class="f"><label>${isTb?'Longitud (m)':'Ancho w'}</label><input id="sW" type="number" step="0.05" value="${it.w}"></div>
      <div class="f"><label>Alto h</label><input id="sH" type="number" step="0.05" value="${it.h}"></div>
    </div>
    <div class="brow">
      <div class="f"><label>Color</label><input type="color" id="sColor" value="${itemColor(it)}" style="width:100%;height:34px;padding:2px;border-radius:7px;border:1px solid var(--line)"></div>
