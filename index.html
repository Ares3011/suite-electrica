</script>
<script type="text/html" id="src-riesgo">
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis de Riesgo SIPRA (NTC 4552-2)</title>
<style>
  :root{
    --ink:#141a24; --ink-soft:#3d4859; --line:#d9dee6; --line-soft:#eaedf2;
    --paper:#ffffff; --panel:#f5f7fa; --panel-2:#eef1f6;
    --brand:#123a63;         /* azul institucional */
    --brand-soft:#e7eef6;
    --bolt:#e0a010;          /* ámbar rayo (acento) */
    --ok:#0f7a4d; --ok-bg:#e7f5ee;
    --bad:#b02a1f; --bad-bg:#fdecea;
    --mono:'SFMono-Regular',ui-monospace,'Cascadia Mono','Consolas',monospace;
    --sans:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#e8ebf0;color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact}

  /* ---------- CONTROL PANEL (pantalla) ---------- */
  .controls{max-width:1180px;margin:22px auto 0;padding:0 18px}
  .cbar{background:var(--brand);color:#fff;border-radius:12px 12px 0 0;padding:14px 20px;
    display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
  .cbar h2{margin:0;font-size:16px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
  .cbar .bolt{color:var(--bolt);font-size:20px}
  .cbar .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font-family:var(--sans);font-size:13px;font-weight:600;border:0;border-radius:8px;
    padding:9px 14px;cursor:pointer;transition:.15s}
  .btn-print{background:var(--bolt);color:#20160a}
  .btn-print:hover{filter:brightness(1.06)}
  .btn-ghost{background:rgba(255,255,255,.14);color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,.24)}
  .cpanel{background:var(--panel);border:1px solid var(--line);border-top:0;
    border-radius:0 0 12px 12px;padding:6px 20px 20px;margin-bottom:26px}
  details.grp{border-bottom:1px solid var(--line-soft);padding:8px 0}
  details.grp:last-child{border-bottom:0}
  details.grp>summary{cursor:pointer;font-weight:600;color:var(--brand);font-size:13.5px;
    list-style:none;padding:6px 0;display:flex;align-items:center;gap:8px}
  details.grp>summary::-webkit-details-marker{display:none}
  details.grp>summary::before{content:"▸";color:var(--bolt);transition:.15s}
  details.grp[open]>summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px 16px;padding:10px 0 4px}
  .fld{display:flex;flex-direction:column;gap:3px}
  .fld label{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:none}
  .fld .hint{font-size:10.5px;color:#8a93a3;font-weight:400}
  .fld input,.fld select{font-family:var(--sans);font-size:13px;padding:7px 9px;border:1px solid var(--line);
    border-radius:7px;background:#fff;color:var(--ink)}
  .fld input:focus,.fld select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  .flag{border-left:3px solid var(--bolt)!important;background:#fffdf6}

  /* ---------- DOCUMENT ---------- */
  .doc{max-width:1180px;margin:0 auto 60px;background:var(--paper);
    box-shadow:0 2px 24px rgba(20,26,36,.10);border-radius:4px;overflow:hidden}
  .sheet{padding:46px 60px}
  /* Encabezado membrete */
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;
    border-bottom:3px solid var(--brand);padding-bottom:18px}
  .head .id .kicker{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--bolt);font-weight:700}
  .head .id h1{margin:4px 0 2px;font-size:26px;line-height:1.12;color:var(--brand);font-weight:700;letter-spacing:-.3px}
  .head .id .sub{font-size:13.5px;color:var(--ink-soft);font-weight:500}
  .head .stamp{text-align:right;font-size:11.5px;color:var(--ink-soft);min-width:190px}
  .head .stamp .op{display:inline-block;border:1.5px solid var(--brand);color:var(--brand);
    font-weight:700;border-radius:6px;padding:4px 10px;letter-spacing:1px;margin-bottom:6px}
  .metarow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);
    border-radius:8px;overflow:hidden;margin-top:18px}
  .metarow .m{padding:9px 12px;border-right:1px solid var(--line-soft)}
  .metarow .m:last-child{border-right:0}
  .metarow .m .k{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:#8a93a3;font-weight:700}
  .metarow .m .v{font-size:13px;font-weight:600;color:var(--ink);margin-top:1px}

  section.blk{margin-top:30px}
  h2.sec{font-size:15px;color:#fff;background:var(--brand);margin:0 0 14px;
    padding:8px 14px;border-radius:6px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
  h2.sec .n{font-family:var(--mono);background:var(--bolt);color:#20160a;font-weight:700;
    border-radius:4px;padding:1px 8px;font-size:13px}
  h3.sub{font-size:13.5px;color:var(--brand);margin:16px 0 7px;font-weight:700}
  p{margin:8px 0}
  .note{font-size:12.5px;color:var(--ink-soft);background:var(--panel);border-left:3px solid var(--brand);
    padding:9px 13px;border-radius:0 6px 6px 0;margin:10px 0}
  .warn{font-size:12.5px;background:#fffaf0;border-left:3px solid var(--bolt);
    padding:9px 13px;border-radius:0 6px 6px 0;margin:10px 0}
  .warn b{color:#8a6200}

  table.t{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.8px}
  table.t th,table.t td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  table.t th{background:var(--panel-2);color:var(--brand);font-weight:700;font-size:11.5px;letter-spacing:.2px}
  table.t td.num,table.t th.num{text-align:right;font-family:var(--mono);white-space:nowrap}
  table.t tr:nth-child(even) td{background:#fbfcfe}
  table.t caption{caption-side:bottom;font-size:10.5px;color:#8a93a3;text-align:right;padding-top:4px}

  .formula{font-family:var(--mono);font-size:13px;background:#0f1620;color:#e8eef6;
    padding:11px 14px;border-radius:8px;margin:9px 0;overflow-x:auto;line-height:1.7}
  .formula .var{color:var(--bolt)}
  .formula .res{color:#6fe0a2;font-weight:700}
  .val{font-family:var(--mono);font-weight:700;color:var(--brand)}
  .ref{font-family:var(--mono);font-size:10.5px;color:#7d8794;text-align:right;margin:-3px 0 11px;letter-spacing:.2px}
  table.t td.rf,table.t th.rf{font-family:var(--mono);font-size:10.3px;color:#5a6675;white-space:nowrap;text-align:left}
  table.t th.rf{color:var(--brand)}

  /* Veredicto */
  .verdict{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .verdict .vhead{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 22px;flex-wrap:wrap}
  .verdict.ok .vhead{background:var(--ok-bg)} .verdict.bad .vhead{background:var(--bad-bg)}
  .verdict .vlabel{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:800}
  .verdict.ok .vlabel{color:var(--ok)} .verdict.bad .vlabel{color:var(--bad)}
  .verdict .vmain{font-size:22px;font-weight:800;line-height:1.15}
  .verdict.ok .vmain{color:var(--ok)} .verdict.bad .vmain{color:var(--bad)}
  .verdict .vbadge{text-align:center;padding:10px 18px;border-radius:10px;background:#fff;border:1px solid var(--line)}
  .verdict .vbadge .bk{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#8a93a3;font-weight:700}
  .verdict .vbadge .bv{font-size:26px;font-weight:800;color:var(--brand);font-family:var(--mono)}
  .verdict .vbody{padding:14px 22px;background:#fff;font-size:12.8px}
  .cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin:6px 0 2px}
  .cmp .cell{background:var(--panel);border-radius:8px;padding:10px 14px;text-align:center}
  .cmp .cell .cl{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#8a93a3;font-weight:700}
  .cmp .cell .cv{font-size:19px;font-weight:800;font-family:var(--mono)}
  .cmp .op{font-size:22px;font-weight:800;color:var(--ink-soft)}

  .sigs{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:26px}
  .sigbox .sigrole{font-weight:800;color:var(--brand);font-size:11px;letter-spacing:1.2px;
    text-transform:uppercase;border-bottom:1.5px solid var(--brand);padding-bottom:5px;margin-bottom:30px}
  .sigin{width:100%;border:none;border-bottom:1.4px solid var(--ink);background:transparent;
    font-family:inherit;font-size:14px;color:var(--ink);font-weight:600;padding:2px 3px 5px;outline:none}
  .sigin:focus{border-bottom-color:var(--brand);background:#fafcff}
  .sigin.sm{width:130px;font-size:13px}
  .sigcap{font-size:10px;color:#8a93a3;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .sigfields{display:flex;gap:26px;margin-top:16px;align-items:baseline;flex-wrap:wrap}
  .sigfields .fl{font-size:12px;color:var(--ink-soft);white-space:nowrap}
  .docfoot{margin-top:30px;border-top:1px solid var(--line);padding-top:12px;
    font-size:10.8px;color:#8a93a3;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  .badge-lvl{display:inline-block;font-family:var(--mono);font-weight:800;background:var(--bolt);
    color:#20160a;border-radius:6px;padding:2px 12px;font-size:15px}

  /* ---------- PRINT ---------- */
  @page{size:Letter portrait;margin:14mm 13mm}
  @media print{
    html,body{background:#fff;font-size:11px}
    .controls{display:none!important}
    .doc{max-width:none;margin:0;box-shadow:none;border-radius:0}
    .sheet{padding:0}
    section.blk{break-inside:avoid}
    table.t,.formula,.verdict,.metarow{break-inside:avoid}
    h2.sec{break-after:avoid}
    .pgbreak{break-before:page}
    a[href]:after{content:""}
    .sigin{border-bottom:1.4px solid #000;color:#000;font-size:13px}
    .sigin::placeholder{color:transparent}
    .sigs{break-inside:avoid}
  }
</style>
</head>
<body>

<!-- ============ PANEL DE PARÁMETROS (solo pantalla) ============ -->
<div class="controls">
  <div class="cbar">
    <h2><span class="bolt">⚡</span> Parámetros de entrada — recalcula en vivo</h2>
    <div class="actions">
      <button class="btn btn-print" onclick="window.print()">⭳ Generar informe PDF</button>
      <button class="btn btn-ghost" onclick="resetDefaults()">Restablecer factores de cálculo</button>
    </div>
  </div>
  <div class="cpanel">
    <p style="font-size:12px;color:#8a93a3;margin:8px 0 2px">
      Los campos marcados con <span style="color:var(--bolt);font-weight:700">borde ámbar</span>
      son estimaciones o clasificaciones que <b>debe confirmar</b> el ingeniero: geometría de planos, DDT de red
      local, y las clasificaciones de incendio r<sub>f</sub> y de pérdida L<sub>f</sub> que determinan el veredicto.
      Todos los factores provienen de las tablas de la NTC 4552-2; ajústelos según el proyecto.
    </p>

    <details class="grp" open>
      <summary>Identificación del proyecto (encabezado del informe)</summary>
      <div class="grid">
        <div class="fld"><label>Nombre del proyecto</label><input id="i_proj" type="text" value="VIVE SUIZA"></div>
        <div class="fld"><label>Suscriptor / propietario</label><input id="i_sub" type="text" value="INVERSIONES VIBE S.A.S."></div>
        <div class="fld"><label>NIT / C.C.</label><input id="i_nit" type="text" value="901.969.692-4"></div>
        <div class="fld"><label>Operador de red (sigla)</label><input id="i_opb" type="text" value="EMCALI"></div>
        <div class="fld"><label>Operador de red (razón social)</label><input id="i_opf" type="text" value="EMCALI EICE ESP"></div>
        <div class="fld"><label>Uso / ocupación</label><input id="i_use" type="text" value="Residencial · 42 apartamentos"></div>
        <div class="fld"><label>Ubicación</label><input id="i_loc" type="text" value="Calle 14 Oeste, Cali (V.)"></div>
        <div class="fld"><label>Código de documento</label><input id="i_doc" type="text" value="AR-RAYO-VS-001"></div>
        <div class="fld"><label>Revisión</label><input id="i_rev" type="text" value="0"></div>
        <div class="fld"><label>Transformador de servicio</label><input id="i_trafo" type="text" value="112,5 kVA en poste (reserva de red 150 kVA) — devanados MV/BT desacoplados"></div>
        <div class="fld"><label>Tensión de suministro</label><input id="i_volt" type="text" value="208 V (EMCALI)"></div>
      </div>
    </details>

    <details class="grp" open>
      <summary>Geometría de la estructura y entorno</summary>
      <div class="grid">
        <div class="fld"><label>Largo L (m) <span class="hint">planta</span></label><input class="flag" id="L" type="number" step="0.1"></div>
        <div class="fld"><label>Ancho W (m) <span class="hint">planta</span></label><input class="flag" id="W" type="number" step="0.1"></div>
        <div class="fld"><label>Altura H (m) <span class="hint">nivel más alto</span></label><input class="flag" id="H" type="number" step="0.1"></div>
        <div class="fld"><label>C<sub>d</sub> — localización relativa <span class="hint">Tabla 10</span></label>
          <select id="Cd">
            <option value="0.25">0,25 — rodeada de objetos/árboles más altos</option>
            <option value="0.5">0,50 — objetos de igual o menor altura</option>
            <option value="1">1,00 — aislada, sin objetos vecinos</option>
            <option value="2">2,00 — en cima de colina/elevación</option>
          </select></div>
      </div>
    </details>

    <details class="grp" open>
      <summary>Densidad de descargas a tierra (DDT)</summary>
      <div class="grid">
        <div class="fld"><label>DDT (rayos/km²·año) <span class="hint">NTC 4552-1 Tabla A.6</span></label><input class="flag" id="DDT" type="number" step="0.1"></div>
        <div class="fld"><label>N<sub>c</sub> días tormentosos/año <span class="hint">opcional → Ec.(4)</span></label><input id="Nc" type="number" step="1" placeholder="(opcional)"></div>
        <div class="fld" style="justify-content:flex-end"><button class="btn" style="background:var(--brand-soft);color:var(--brand)" onclick="applyNc()">Calcular DDT = 0,0017·N<sub>c</sub><sup>1,56</sup></button></div>
      </div>
    </details>

    <details class="grp">
      <summary>Riesgo de incendio y pérdidas (componentes R<sub>B</sub>, R<sub>V</sub>)</summary>
      <div class="grid">
        <div class="fld"><label>r<sub>f</sub> — riesgo de incendio <span class="hint">Tabla 29</span></label>
          <select id="rf" class="flag">
            <option value="1">1 — Explosión</option>
            <option value="0.1">0,1 — Alto (&gt;800 MJ/m²)</option>
            <option value="0.01">0,01 — Ordinario (400–800 MJ/m²)</option>
            <option value="0.001">0,001 — Bajo (&lt;400 MJ/m²)</option>
            <option value="0">0 — Ninguno</option>
          </select></div>
        <div class="fld"><label>L<sub>f</sub> — pérdida por daño físico <span class="hint">Tabla 26</span></label>
          <select id="Lf" class="flag">
            <option value="0.1">0,1 — Hosp./hoteles/edificios civiles</option>
            <option value="0.05">0,05 — Industrial/comercial/escuelas</option>
            <option value="0.01">0,01 — Residencial / otros (IEC 62305-2)</option>
            <option value="0.002">0,002 — Público/iglesias/museos</option>
          </select></div>
        <div class="fld"><label>r<sub>p</sub> — prevención de fuego <span class="hint">Tabla 28</span></label>
          <select id="rp">
            <option value="1">1 — Sin medidas</option>
            <option value="0.5">0,5 — Extintores/alarma manual + rutas</option>
            <option value="0.2">0,2 — Extinción/alarma automática</option>
          </select></div>
        <div class="fld"><label>h<sub>z</sub> — peligro especial <span class="hint">Tabla 30</span></label>
          <select id="hz">
            <option value="1">1 — Sin riesgo especial</option>
            <option value="2">2 — Pánico bajo</option>
            <option value="5">5 — Difícil evacuación / pánico medio</option>
            <option value="10">10 — Pánico alto</option>
          </select></div>
      </div>
    </details>

    <details class="grp">
      <summary>Lesiones a seres vivos (componentes R<sub>A</sub>, R<sub>U</sub>)</summary>
      <div class="grid">
        <div class="fld"><label>P<sub>A</sub> — tensión paso/contacto exterior <span class="hint">Tabla 14</span></label>
          <select id="PA">
            <option value="1">1 — Sin medidas</option>
            <option value="0.1">0,1 — Avisos de advertencia</option>
            <option value="0.01">0,01 — Equipotencialización del suelo (SPT)</option>
            <option value="0.00001">≈0 — Refuerzos estructurales como bajantes</option>
          </select></div>
        <div class="fld"><label>r<sub>a</sub> — superficie exterior <span class="hint">Tabla 27</span></label>
          <select id="ra">
            <option value="0.01">0,01 — Agrícola/concreto</option>
            <option value="0.001">0,001 — Mármol/cerámica</option>
            <option value="0.0001">0,0001 — Gravilla/tapete</option>
            <option value="0.00001">0,00001 — Asfalto/madera</option>
          </select></div>
        <div class="fld"><label>r<sub>u</sub> — piso interior <span class="hint">Tabla 27</span></label>
          <select id="ru">
            <option value="0.01">0,01 — Concreto</option>
            <option value="0.001">0,001 — Mármol/cerámica</option>
            <option value="0.0001">0,0001 — Tapete/madera</option>
          </select></div>
      </div>
    </details>

    <details class="grp">
      <summary>Sistema de protección (SIPRA) y DPS</summary>
      <div class="grid">
        <div class="fld"><label>Nivel SIPRA → P<sub>B</sub> <span class="hint">Tabla 15</span></label>
          <select id="PB">
            <option value="1">1 — Sin protección</option>
            <option value="0.2">0,2 — Nivel IV</option>
            <option value="0.1">0,1 — Nivel III</option>
            <option value="0.05">0,05 — Nivel II</option>
            <option value="0.02">0,02 — Nivel I</option>
            <option value="0.01">0,01 — Nivel I + bajante natural</option>
            <option value="0.001">0,001 — Techo metálico + bajante natural</option>
          </select></div>
        <div class="fld"><label>DPS coordinado → P<sub>U</sub>,P<sub>V</sub> <span class="hint">Tablas 16/19</span></label>
          <select id="PDPS">
            <option value="1">1 — Sin DPS</option>
            <option value="0.03">0,03 — DPS Nivel III–IV</option>
            <option value="0.02">0,02 — DPS Nivel II</option>
            <option value="0.01">0,01 — DPS Nivel I</option>
          </select></div>
      </div>
    </details>

    <details class="grp">
      <summary>Acometida eléctrica (componentes R<sub>U</sub>, R<sub>V</sub>)</summary>
      <div class="grid">
        <div class="fld"><label>Tipo de acometida</label>
          <select id="linetype"><option value="over">Aérea</option><option value="under">Subterránea</option></select></div>
        <div class="fld"><label>L<sub>c</sub> longitud tramo (m) <span class="hint">a 1<sup>er</sup> nodo, máx 1000</span></label><input id="Lc" type="number" step="1"></div>
        <div class="fld"><label>H<sub>a</sub> altura estruct. origen (m)</label><input id="Ha" type="number" step="0.1"></div>
        <div class="fld"><label>H<sub>b</sub> altura de entrada (m)</label><input id="Hb" type="number" step="0.1"></div>
        <div class="fld"><label>H<sub>c</sub> altura conductores (m)</label><input id="Hc" type="number" step="0.1"></div>
        <div class="fld"><label>ρ resistividad terreno (Ω·m) <span class="hint">máx 500</span></label><input id="rho" type="number" step="1"></div>
        <div class="fld"><label>C<sub>t</sub> — transformador AT/BT <span class="hint">Tabla 11</span></label>
          <select id="Ct"><option value="0.2">0,2 — Trafo con devanados desacoplados</option><option value="1">1 — Sin transformador / autotrafo</option></select></div>
        <div class="fld"><label>N<sub>Da</sub> eventos estruct. adyacente <span class="hint">Ec.(7), 0 si no aplica</span></label><input id="NDa" type="number" step="0.0001" placeholder="0"></div>
      </div>
    </details>
  </div>
</div>

<!-- ==================== INFORME ==================== -->
<div class="doc"><div class="sheet">

  <div class="head">
    <div class="id">
      <div class="kicker">Análisis de Riesgo por Descargas Atmosféricas</div>
      <h1><span id="h_proj"></span></h1>
      <div class="sub">Evaluación de riesgo por rayo conforme a NTC 4552-2 · Requisito RETIE 2024</div>
    </div>
    <div class="stamp">
      <div class="op" id="h_opb">EMCALI</div><br>
      <b>Operador de red:</b> <span id="h_opf"></span><br>
      <b>Documento:</b> <span id="h_doc"></span><br>
      <b>Rev.:</b> <span id="h_rev"></span> &nbsp;·&nbsp; <span id="today"></span><br>
      <b>Norma:</b> NTC 4552-2 (IEC 62305-2)
    </div>
  </div>

  <div class="metarow">
    <div class="m"><div class="k">Suscriptor</div><div class="v" id="m_sub"></div></div>
    <div class="m"><div class="k">NIT</div><div class="v" id="m_nit"></div></div>
    <div class="m"><div class="k">Uso</div><div class="v" id="m_use"></div></div>
    <div class="m"><div class="k">Ubicación</div><div class="v" id="m_loc"></div></div>
  </div>

  <!-- 1 -->
  <section class="blk">
    <h2 class="sec"><span class="n">1</span> Objeto y alcance</h2>
    <p>El presente documento evalúa la necesidad de protección contra descargas eléctricas atmosféricas
    de la edificación <b><span id="o_proj"></span></b>, mediante el cálculo del <b>riesgo de pérdida de vida
    humana R₁</b> y su comparación con el riesgo tolerable R<sub>T</sub>, siguiendo la metodología de gestión
    del riesgo de la <b>NTC 4552-2</b>. El resultado sustenta la decisión sobre la instalación de un Sistema
    Integral de Protección contra Rayos (SIPRA) y su nivel, como parte del expediente de aprobación
    <b>RETIE 2024</b>.</p>
    <p>El alcance comprende: la estructura, sus instalaciones internas y las personas dentro de ella o en la
    franja de 3 m a su alrededor. No incluye la protección de los equipos de usuario ni de los servicios
    fuera de la estructura (NTC 4552-2, num. 5.2).</p>

<script>
const $=id=>document.getElementById(id);
const PI=Math.PI;

const DEFAULTS={
  L:30, W:18, H:38, Cd:"0.5", DDT:1, Nc:"",
  rf:"0.01", Lf:"0.1", rp:"0.5", hz:"1",
  PA:"0.01", ra:"0.01", ru:"0.001",
  PB:"1", PDPS:"0.02",
  linetype:"over", Lc:26, Ha:9, Hb:3, Hc:6, rho:100, Ct:"0.2", NDa:0
};
const CD_TXT={"0.25":"0,25 — rodeada de objetos más altos","0.5":"0,50 — objetos de igual o menor altura","1":"1,00 — aislada","2":"2,00 — cima de colina"};
const PB_LEVEL=[["0.2","IV"],["0.1","III"],["0.05","II"],["0.02","I"],["0.01","I + bajante natural"],["0.001","Techo metálico + bajante"]];
const RT=1e-5;
const IDS=Object.keys(DEFAULTS);

function resetDefaults(){for(const k of IDS){$(k).value=DEFAULTS[k];} $("Nc").value=""; compute();}
function applyNc(){const nc=parseFloat($("Nc").value); if(nc>0){$("DDT").value=(0.0017*Math.pow(nc,1.56)).toFixed(3); compute();}}

// formato científico "1,31 × 10⁻⁵"
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function sup(n){return String(n).split("").map(c=>SUP[c]||c).join("");}
function sci(x,dig=2){
  if(x===0) return "0";
  const e=Math.floor(Math.log10(Math.abs(x)));
  const m=x/Math.pow(10,e);
  return m.toFixed(dig).replace(".",",")+" × 10"+sup(e);
}
function es(x,d=2){return Number(x).toFixed(d).replace(".",",");}

function compute(){
  const g=id=>parseFloat($(id).value)||0;
  const L=g("L"),W=g("W"),H=g("H"),Cd=g("Cd"),DDT=g("DDT");
  const rf=g("rf"),Lf=g("Lf"),rp=g("rp"),hz=g("hz");
  const PA=g("PA"),ra=g("ra"),ru=g("ru"),PB=g("PB"),PDPS=g("PDPS");
  const over=$("linetype").value==="over";
  const Lc=g("Lc"),Ha=g("Ha"),Hb=g("Hb"),Hc=g("Hc"),rho=Math.min(g("rho"),500),Ct=g("Ct"),NDa=g("NDa");

  // Áreas
  const Ad=L*W+6*H*(L+W)+9*PI*H*H;
  const seg=Math.max(Lc-3*(Ha+Hb),0);
  const Al=over? seg*6*Hc : seg*Math.sqrt(rho);

  // Eventos
  const ND=DDT*Ad*Cd*1e-6;
  const NL=DDT*Al*Cd*Ct*1e-6;

  // Pérdidas (Tabla 26)
  const Lt_out=1e-2, Lt_in=1e-4;
  const LA=ra*Lt_out;
  const LB=rp*hz*rf*Lf;
  const LU=ru*Lt_in;
  const LV=rp*hz*rf*Lf;

  // Prob acometida: min(PDPS, PLD) con PLD=1 (cable no apantallado)
  const PU=Math.min(PDPS,1), PV=Math.min(PDPS,1);

  // Componentes (residencial: R1 = RA+RB+RU+RV)
  const RA=ND*PA*LA;
  const RB=ND*PB*LB;
  const RU=(NL+NDa)*PU*LU;
  const RV=(NL+NDa)*PV*LV;
  const R1=RA+RB+RU+RV;

  // ---- Salидas ----
  $("today").textContent=new Date().toLocaleDateString("es-CO",{year:"numeric",month:"long",day:"numeric"});

  // Encabezado, descripción y pie dinámicos (archivo genérico para cualquier proyecto)
  const T=id=>{const el=$(id);return el?el.value:"";};
  const put=(id,val)=>{const el=$(id);if(el)el.textContent=val;};
  put("h_proj",T("i_proj")); put("o_proj",T("i_proj")); put("f_proj",T("i_proj"));
  put("h_opb",T("i_opb")); put("f_opb",T("i_opb")); put("h_opf",T("i_opf"));
  put("h_doc",T("i_doc")); put("f_doc",T("i_doc")); put("h_rev",T("i_rev"));
  put("m_sub",T("i_sub")); put("f_sub",T("i_sub")); put("m_nit",T("i_nit"));
  put("m_use",T("i_use")); put("s3_use",T("i_use"));
  put("m_loc",T("i_loc")); put("f_loc",T("i_loc"));
  put("s3_trafo",T("i_trafo")); put("s3_volt",T("i_volt"));
  document.title = "Análisis de Riesgo SIPRA (NTC 4552-2)" + (T("i_proj")? " — "+T("i_proj") : "");
  $("d_LWH").textContent=`${es(L,1)} m × ${es(W,1)} m × ${es(H,1)} m`;
  $("d_Cd").textContent=CD_TXT[$("Cd").value]||Cd;
  $("d_DDT").textContent=es(DDT,2);

  if(over){

  }else{
    $("f_Al_expr").textContent=`(${es(Lc,0)} − 3(${es(Ha,0)}+${es(Hb,0)}))·√${es(rho,0)}`;
  }
  $("f_Al").textContent=es(Al,1);
  $("f_Al_note").innerHTML = seg<=0
    ? `Como 3·(H<sub>a</sub>+H<sub>b</sub>) ≥ L<sub>c</sub>, el tramo de acometida es demasiado corto para captar impactos directos: A<sub>l</sub> = 0 y por tanto N<sub>L</sub> ≈ 0. Esto es coherente con una bajante corta desde el transformador de poste ubicado junto a la edificación; las componentes R<sub>U</sub> y R<sub>V</sub> resultan despreciables.`
    : `Tramo de acometida con longitud efectiva ${es(seg,1)} m para captación de impactos directos.`;

  $("r_ND").textContent=sci(ND);
  $("r_NL").textContent=sci(NL);
  $("r_NDa").textContent=sci(NDa);

  const PB_txt={"1":"Sin protección","0.2":"SIPRA Nivel IV","0.1":"SIPRA Nivel III","0.05":"SIPRA Nivel II","0.02":"SIPRA Nivel I","0.01":"Nivel I + bajante natural","0.001":"Techo metálico + bajante natural"};
  const PA_txt={"1":"Sin medidas","0.1":"Avisos de advertencia","0.01":"Equipotencialización del suelo (SPT)","0.00001":"Bajantes naturales (refuerzos)"};
  const DPS_txt={"1":"Sin DPS","0.03":"DPS Nivel III–IV","0.02":"DPS Nivel II","0.01":"DPS Nivel I"};
  $("p_PA_d").textContent=PA_txt[$("PA").value]; $("p_PA").textContent=es(PA,5);
  $("p_PB_d").textContent=PB_txt[$("PB").value]; $("p_PB").textContent=es(PB,3);
  $("p_PU_d").textContent="mín("+DPS_txt[$("PDPS").value]+", cable no apant.)"; $("p_PU").textContent=es(PU,3);
  $("p_PV_d").textContent="mín("+DPS_txt[$("PDPS").value]+", cable no apant.)"; $("p_PV").textContent=es(PV,3);

  $("l_LA_f").textContent=`r_a=${es(ra,5)} · L_t=10⁻²`;
  $("l_LB_f").textContent=`r_p=${es(rp,1)} · h_z=${es(hz,0)} · r_f=${es(rf,3)} · L_f=${es(Lf,3)}`;
  $("l_LU_f").textContent=`r_u=${es(ru,4)} · L_t=10⁻⁴`;
  $("l_LV_f").textContent=`r_p=${es(rp,1)} · h_z=${es(hz,0)} · r_f=${es(rf,3)} · L_f=${es(Lf,3)}`;
  $("l_LA").textContent=sci(LA); $("l_LB").textContent=sci(LB); $("l_LU").textContent=sci(LU); $("l_LV").textContent=sci(LV);

  const set=(a,N,P,Lx,R)=>{$(`c_${a}_N`).textContent=sci(N);$(`c_${a}_P`).textContent=es(P,5);$(`c_${a}_L`).textContent=sci(Lx);$(`c_${a}_R`).textContent=sci(R);};
  set("A",ND,PA,LA,RA); set("B",ND,PB,LB,RB); set("U",NL+NDa,PU,LU,RU); set("V",NL+NDa,PV,LV,RV);
  $("c_R1").textContent=sci(R1);

  // Nivel SIPRA mínimo requerido (variando PB, con las demás condiciones fijas)
  let reqLabel="—", need=false;
  const R1_at=pb=>RA+ (ND*pb*LB) + RU + RV;
  if(R1<=RT){ reqLabel = (PB<1? PB_txt[$("PB").value] : "No requiere"); need=false; }
  else{
    need=true; reqLabel="Insuficiente";

  }

  const v=$("verdict"), ok=R1<=RT;

    var lvlPush = ok ? (PB<1? PB_level_short($("PB").value) : null) : (reqLabel.split(" ")[0]);
    if(lvlPush && lvlPush!=="—") pushLevelToSipra(lvlPush);
    else if(!ok) pushLevelToSipra(reqLabel);
    else pushLevelToSipra($("v_level").textContent);
  }catch(e){}
  $("v_text").innerHTML = ok
    ? `Con las medidas declaradas, el riesgo de pérdida de vida humana R₁ = <b>${sci(R1)}</b> no supera el riesgo tolerable R<sub>T</sub> = 1,0 × 10⁻⁵. <b>La configuración evaluada satisface la NTC 4552-2 para efectos de aprobación RETIE.</b>${PB<1?" El nivel de SIPRA indicado es el considerado en el cálculo.":" No se requiere SIPRA externo por riesgo; se mantienen SPT y DPS por RETIE."}`
    : `El riesgo R₁ = <b>${sci(R1)}</b> supera R<sub>T</sub> = 1,0 × 10⁻⁵. Debe adoptarse un <b>SIPRA de nivel ${reqLabel}</b> (o una combinación de medidas equivalente) para que R₁ ≤ R<sub>T</sub>.`;

  // Conclusiones
  $("concl").innerHTML = ok
    ? `<p><b>1.</b> El riesgo de pérdida de vida humana R₁ = <span class="val">${sci(R1)}</span> es <b>inferior</b> al riesgo tolerable R<sub>T</sub> = 1,0 × 10⁻⁵. La edificación <b>cumple</b> el criterio de la NTC 4552-2.</p>
       <p><b>2.</b> La componente dominante es R<sub>B</sub> (daño físico por impacto directo) = <span class="val">${sci(RB)}</span>; las componentes por acometida son despreciables por la corta longitud del tramo de servicio.</p>
       <p><b>3.</b> Se conservan como medidas obligatorias RETIE el SPT con equipotencialización y los DPS coordinados.</p>`
    : `<p><b>1.</b> El riesgo R₁ = <span class="val">${sci(R1)}</span> <b>supera</b> R<sub>T</sub> = 1,0 × 10⁻⁵: la edificación <b>requiere protección adicional</b>.</p>
       <p><b>2.</b> Se requiere instalar un <b>SIPRA de nivel ${reqLabel}</b> conforme a la NTC 4552-3 (sistema de captación, bajantes — preferiblemente refuerzos estructurales naturales — y puesta a tierra), con lo cual R₁ desciende por debajo de R<sub>T</sub>.</p>
       <p><b>3.</b> La componente crítica es R<sub>B</sub> = <span class="val">${sci(RB)}</span>; reducir P<sub>B</sub> mediante el SIPRA es la vía directa de mitigación.</p>`;

  $("c_sipra").innerHTML = ok
    ? (PB<1? `SIPRA nivel <b>${PB_txt[$("PB").value].replace("SIPRA ","")}</b> según lo evaluado (NTC 4552-3).`
            : `No requerido por riesgo. Opcional según decisión del propietario; de instalarse, cumplir NTC 4552-3.`)
    : `<b>Requerido — nivel ${reqLabel}</b> (NTC 4552-3): captación, bajantes y puesta a tierra dedicada, integrados a la barra equipotencial.`;

  $("v_op").textContent=ok?"≤":">";
}
function PB_level_short(v){return ({"0.2":"IV","0.1":"III","0.05":"II","0.02":"I","0.01":"I","0.001":"I"})[v]||"—";}

        el.value=String(dem.kvaTx).replace('.',',')+' kVA (selección demanda)';
    }
  }catch(e){}
})();
function pushLevelToSipra(levelLabel){
  try{
    var map={I:'I',II:'II',III:'III',IV:'IV'};
    var lv=null;
    var s=String(levelLabel||'');
    if(/\bI\b/.test(s) && !/II|III|IV/.test(s)) lv='I';
    else if(/II/.test(s) && !/III/.test(s)) lv='II';
    else if(/III/.test(s)) lv='III';
    else if(/IV/.test(s)) lv='IV';
    if(!lv && s.indexOf('No')>=0) lv='IV'; // mínimo documental si no requiere
    var st={};
    try{st=JSON.parse(localStorage.getItem('rs3_state')||'{}');}catch(e){}
    if(lv){ st.level=lv; localStorage.setItem('rs3_state',JSON.stringify(st)); }
    localStorage.setItem('sipra_risk', JSON.stringify({level:lv||s, ts:Date.now(), source:'riesgo'}));
  }catch(e){}
}

  @media print{.top,.side,.zoombar,.legend,.hud,.viewhelp,.matbtns,.matclose{display:none!important}.matov{position:static;display:block!important;background:#fff;padding:0}.matcard{box-shadow:none;border:0;max-width:none}body{background:#fff;overflow:visible}}

<script>
const $=id=>document.getElementById(id);const PI=Math.PI;
const NTC={I:{r:35,mesh:5,down:10,ki:0.08,a0:70},II:{r:40,mesh:10,down:10,ki:0.06,a0:72},III:{r:50,mesh:15,down:15,ki:0.04,a0:74},IV:{r:55,mesh:20,down:20,ki:0.04,a0:77}};
const IEC={I:{r:20,mesh:5,down:10},II:{r:30,mesh:10,down:10},III:{r:45,mesh:15,down:15},IV:{r:60,mesh:20,down:20}};
const IEC_R={I:20,II:30,III:45,IV:60},ROM=['I','II','III','IV'];
const SPE_P=()=>(S.norm==='IEC'?IEC[S.level]:NTC[S.level]);
const RT=1e-5, VBW=1040,VBH=600,ML=8,MB=8,MT=8,MR=8;
const cv=$("cv");

let S={
  tab:'v3d',level:'IV',norm:'NTC',mode:'roll',showExp:true,addMast:false,showSPE:true, showCover:false,
  blocks:[{x:0,y:0,w:30,h:14,z:0,d:18},{x:9,y:14,w:12,h:4,z:5,d:9},{x:34,y:0,w:12,h:9,z:3,d:12}],
  masts:[],
  removedDowns:[],
  speFrozen:false,

  sphere:{cx:15,cy:0},frozen:[],
  views:{alzado:{x0:-6,y0:-3,s:6},planta:{x0:-6,y0:-6,s:6}},
  cam:{az:32,el:20,s:6},
  drag:null
};
try{const j=JSON.parse(localStorage.getItem('rs3_state'));if(j&&j.blocks){S=Object.assign(S,j);if(!S.removedDowns)S.removedDowns=[];S.drag=null; try{const rr=JSON.parse(localStorage.getItem('sipra_risk')||'{}'); if(rr.level&&['I','II','III','IV'].indexOf(rr.level)>=0) S.level=rr.level;}catch(e2){} }}catch(e){} S.tab='v3d';
function save(){try{localStorage.setItem('rs3_state',JSON.stringify({level:S.level,norm:S.norm,blocks:S.blocks,masts:S.masts,tab:S.tab,showSPE:S.showSPE,removedDowns:S.removedDowns||[],speFrozen:!!S.speFrozen}));}catch(e){}}

const R=()=>(S.norm==='IEC'?IEC_R[S.level]:NTC[S.level].r);
const es=(x,d=1)=>Number(x).toFixed(d).replace('.',',');
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
const sup=n=>String(n).split("").map(c=>SUP[c]||c).join("");
function sci(x,d=2){if(!isFinite(x)||x===0)return "0";const e=Math.floor(Math.log10(Math.abs(x)));const m=x/Math.pow(10,e);return m.toFixed(d).replace(".",",")+"·10"+sup(e);}
const rpOf=dh=>{const r=R(),v=2*r*dh-dh*dh;return v>0?Math.sqrt(v):0;};
function cvar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';}

/* ===== transform 2D ===== */
function VW(){return S.views[S.tab];}
function W2S(x,y){const v=VW();return [ML+(x-v.x0)*v.s, VBH-MB-(y-v.y0)*v.s];}
function S2W(px,py){const v=VW();return [v.x0+(px-ML)/v.s, v.y0+(VBH-MB-py)/v.s];}
function evtVB(e){const r=cv.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX),cy=(e.touches?e.touches[0].clientY:e.clientY);return [(cx-r.left)/r.width*VBW,(cy-r.top)/r.height*VBH];}

/* ===== geometría ===== */
function bbox(){let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9,hm=0;for(const b of S.blocks){x0=Math.min(x0,b.x);x1=Math.max(x1,b.x+b.w);z0=Math.min(z0,b.z);z1=Math.max(z1,b.z+b.d);hm=Math.max(hm,b.y+b.h);}if(x0>x1){x0=0;x1=30;z0=0;z1=18;hm=14;}return {x0,x1,z0,z1,hm,L:x1-x0,W:z1-z0,H:hm};}
function hProfile(x){let h=0;for(const b of S.blocks)if(x>=b.x&&x<=b.x+b.w)h=Math.max(h,b.y+b.h);return h;}
function topAt(x,z){let h=0;for(const b of S.blocks)if(x>=b.x&&x<=b.x+b.w&&z>=b.z&&z<=b.z+b.d)h=Math.max(h,b.y+b.h);return h;}
function domainX(){const bb=bbox(),r=R();return [bb.x0-r*1.1,bb.x1+r*1.1];}
function obstacles(){const [x0,x1]=domainX();const p=[];const step=Math.max(0.3,(x1-x0)/500);for(let x=x0;x<=x1;x+=step)p.push([x,hProfile(x),'prof']);for(const m of S.masts)p.push([m.x,topAt(m.x,m.z)+m.dh,'mast']);return p;}
function restAt(cx,pts){const r=R();let best=-1e9,con=[];for(const p of pts){const dx=cx-p[0];if(Math.abs(dx)<=r){const y=p[1]+Math.sqrt(r*r-dx*dx);if(y>best+1e-4){best=y;con=[p];}else if(Math.abs(y-best)<0.03&&(!con.length||Math.abs(p[0]-con[con.length-1][0])>0.2))con.push(p);}}return {cy:best,con};}
function argContact(cx,pts){const r=R();let best=-1e9,c=null;for(const p of pts){const dx=cx-p[0];if(Math.abs(dx)<=r){const y=p[1]+Math.sqrt(r*r-dx*dx);if(y>best){best=y;c=p;}}}return {c};}
function exposureX(){const pts=obstacles(),[x0,x1]=domainX(),res=0.4,exp=new Set();for(let cx=x0;cx<=x1;cx+=res){const {c}=argContact(cx,pts);if(c&&c[2]==='prof'&&c[1]>0.05)exp.add(Math.round(c[0]/res));}
  const segs=[];for(const b of S.blocks){const top=b.y+b.h;let cur=null;for(let x=b.x;x<=b.x+b.w+1e-6;x+=res){if(Math.abs(hProfile(x)-top)>0.01){if(cur){segs.push(cur);cur=null;}continue;}const e=exp.has(Math.round(x/res));if(!cur||cur.e!==e){if(cur)segs.push(cur);cur={e,y:top,x0:x,x1:x};}else cur.x1=x;}if(cur)segs.push(cur);}
  return {segs,nExp:segs.filter(s=>s.e).length};}

function computeRisk(){
  const bb=bbox(),L=bb.L,W=bb.W,H=bb.H;
  const DDT=parseFloat($("rDDT").value)||0,Cd=parseFloat($("rCd").value)||0.5,rf=parseFloat($("rRf").value)||0,Lf=parseFloat($("rLf").value)||0;
  const Ad=L*W+6*H*(L+W)+9*PI*H*H, ND=DDT*Ad*Cd*1e-6;
  const PA=0.01,ra=0.01,rp=0.5,hz=1; const LA=ra*1e-2, LB=rp*hz*rf*Lf;
  const RA=ND*PA*LA;
  const R1_0=RA+ND*1*LB;
  const pbMap=[[0.2,'IV'],[0.1,'III'],[0.05,'II'],[0.02,'I']];
  let req=null;for(const [pb,lab] of pbMap){if(RA+ND*pb*LB<=RT){req=lab;break;}}
  const ok=R1_0<=RT;
  return {L,W,H,Ad,ND,R1_0,ok,req:ok?null:(req||'IV')};
}

function protectedAt(x,z){
  const top=topAt(x,z),dh0=parseFloat($("mastDh").value)||1,rp=rpOf(dh0);
  for(const b of S.blocks){if(x>=b.x&&x<=b.x+b.w&&z>=b.z&&z<=b.z+b.d&&(b.y+b.h)>top+0.01)return true;}
  for(const m of S.masts){const mt=topAt(m.x,m.z);if(Math.abs(mt-top)<0.5){if(Math.hypot(x-m.x,z-m.z)<=rp)return true;}}
  return false;
}

function autoMasts(){
  const dh=parseFloat($("mastDh").value)||1;
  const r=R();
  const downMax=SPE_P().down||20;
  const ms=[];
  // Puntas = posiciones de bajantes (perímetro según nivel).
  // No se rellena malla interior: solo tendría sentido con muchas estructuras sobre techo.
  try{
    const spe=speGeom();
    for(const d of (spe.downs||[])){
      const top=topAt(d.x, d.z);
      if(top < 0.1) continue;
      ms.push({x:+(+d.x).toFixed(2), z:+(+d.z).toFixed(2), dh});
    }
  }catch(e){}
  // Deduplicar
  const out=[];
  for(const m of ms){
    if(!out.some(o=>Math.hypot(o.x-m.x,o.z-m.z)<0.4 && Math.abs(topAt(o.x,o.z)-topAt(m.x,m.z))<0.5))
      out.push(m);
  }
  S.masts=out; render();
  toast(out.length+' puntas en bajantes · sep.≤'+es(downMax,0)+' m · Nivel '+S.level+' · R='+es(r,0)+' m');
}

function speGeom(){
  const meshStep = (S.norm==='NTC' ? SPE_P().mesh : 1e9); // IEC: sin malla de cubierta (solo anillo/bajantes)
  const rodLen = 2.4;
  const meshLines = [];
  const rings = [];
  const downs = [];
  const rods = [];
  const boxes = [];
  const links = []; // uniones anillo superior → anillo inferior (punto más cercano)

  function ptsForLevel(isLongFace){
    if(S.level === 'I') return 4;
    if(S.level === 'II') return 3;
    if(S.level === 'III') return isLongFace ? 3 : 2;
    return 2; // IV: solo extremos
  }

  const usedDown = [];
  function addDown(x, z, yTop){
    if(yTop < 0.15) return;
    if(usedDown.some(p => Math.hypot(p[0]-x, p[1]-z) < 0.3)) return;
    usedDown.push([x, z]);
    downs.push({x, z, yTop, yBot: 0});
    rods.push({x, z, yTop: 0, yBot: -rodLen});
    boxes.push({x, z, y: 0});
  }

  function addRingOnBlock(b, top){
    rings.push({x1:b.x,     y1:top, z1:b.z,     x2:b.x+b.w, y2:top, z2:b.z});
    rings.push({x1:b.x+b.w, y1:top, z1:b.z,     x2:b.x+b.w, y2:top, z2:b.z+b.d});
    rings.push({x1:b.x+b.w, y1:top, z1:b.z+b.d, x2:b.x,     y2:top, z2:b.z+b.d});
    rings.push({x1:b.x,     y1:top, z1:b.z+b.d, x2:b.x,     y2:top, z2:b.z});
  }

  // Bloques que se apoyan sobre el techo de b (estructura superior sobre b)
  function uppersOn(b){
    const top = b.y + b.h;
    return S.blocks.filter(o => {
      if(o === b) return false;
      if(Math.abs(o.y - top) > 0.2) return false; // base de o ≈ techo de b
      // solape en planta
      const ox0 = Math.max(b.x, o.x), ox1 = Math.min(b.x+b.w, o.x+o.w);
      const oz0 = Math.max(b.z, o.z), oz1 = Math.min(b.z+b.d, o.z+o.d);
      return ox1 > ox0 + 0.05 && oz1 > oz0 + 0.05;
    });
  }

  // ¿punto (x,z) queda bajo alguna estructura superior apoyada en b?
  function underUpper(b, x, z){
    for(const o of uppersOn(b)){
      if(x >= o.x - 0.02 && x <= o.x + o.w + 0.02 && z >= o.z - 0.02 && z <= o.z + o.d + 0.02) return true;
    }
    return false;
  }

  // Punto más cercano en el perímetro del rectángulo de soporte
  function nearestOnPerimeter(px, pz, rx, rz, rw, rd){
    // clamp al rectángulo y luego proyectar al borde si está dentro
    let x = Math.min(Math.max(px, rx), rx + rw);
    let z = Math.min(Math.max(pz, rz), rz + rd);
    const dl = Math.abs(x - rx), dr = Math.abs(x - (rx+rw));
    const db = Math.abs(z - rz), dt = Math.abs(z - (rz+rd));
    const inside = px > rx && px < rx+rw && pz > rz && pz < rz+rd;
    if(inside){
      const m = Math.min(dl, dr, db, dt);
      if(m === dl) x = rx;
      else if(m === dr) x = rx + rw;
      else if(m === db) z = rz;
      else z = rz + rd;
    }
    return [x, z];
  }

  // Malla en planta baja, recortada donde hay volumen superior
  function addMeshOnBlock(b, top){
    const nx = Math.max(2, Math.ceil(b.w / meshStep) + 1);
    const nz = Math.max(2, Math.ceil(b.d / meshStep) + 1);
    const xs = [], zs = [];
    for(let i = 0; i < nx; i++) xs.push(b.x + b.w * i / (nx - 1));
    for(let j = 0; j < nz; j++) zs.push(b.z + b.d * j / (nz - 1));

    // líneas en X (constante x, z varía): partir en tramos que no entren bajo superiores
    for(const x of xs){
      let segStart = null;
      for(let j = 0; j < zs.length; j++){
        const z = zs[j];
        const blocked = underUpper(b, x, z);
        if(!blocked){
          if(segStart === null) segStart = z;
        } else {
          if(segStart !== null && Math.abs(z - segStart) > 0.05){
            // cerrar tramo hasta el z anterior
            const zPrev = zs[j-1];
            meshLines.push({x1:x, y1:top, z1:segStart, x2:x, y2:top, z2:zPrev});
          }
          segStart = null;
        }
      }
      if(segStart !== null && Math.abs(zs[zs.length-1] - segStart) > 0.05){
        meshLines.push({x1:x, y1:top, z1:segStart, x2:x, y2:top, z2:zs[zs.length-1]});
      }
    }
    // líneas en Z (constante z, x varía)
    for(const z of zs){
      let segStart = null;
      for(let i = 0; i < xs.length; i++){
        const x = xs[i];
        const blocked = underUpper(b, x, z);
        if(!blocked){
          if(segStart === null) segStart = x;
        } else {
          if(segStart !== null && Math.abs(x - segStart) > 0.05){
            const xPrev = xs[i-1];
            meshLines.push({x1:segStart, y1:top, z1:z, x2:xPrev, y2:top, z2:z});
          }
          segStart = null;
        }
      }
      if(segStart !== null && Math.abs(xs[xs.length-1] - segStart) > 0.05){
        meshLines.push({x1:segStart, y1:top, z1:z, x2:xs[xs.length-1], y2:top, z2:z});
      }
    }

    // Anillo interior alrededor de cada superior (para que la malla “aborde” el volumen)
    for(const o of uppersOn(b)){
      // perímetro del superior a la cota del techo inferior (anillo que sigue)
      rings.push({x1:o.x,     y1:top, z1:o.z,     x2:o.x+o.w, y2:top, z2:o.z});
      rings.push({x1:o.x+o.w, y1:top, z1:o.z,     x2:o.x+o.w, y2:top, z2:o.z+o.d});
      rings.push({x1:o.x+o.w, y1:top, z1:o.z+o.d, x2:o.x,     y2:top, z2:o.z+o.d});
      rings.push({x1:o.x,     y1:top, z1:o.z+o.d, x2:o.x,     y2:top, z2:o.z});
    }
  }

  /**
   * Bajantes + varilla en base según nivel (NTC 4552 / IEC 62305 · SPE_P().down):
   *  IV  → solo 4 esquinas
   *  III → esquinas + intermedios en lados LARGOS (sep. ≤ down)
   *  II  → esquinas + intermedios en todos los lados (sep. ≤ down)
   *  I   → igual que II con malla de bajantes más densa (down menor)
   * Orden fijo (CCW), sin posiciones aleatorias. Cada bajante lleva varilla (addDown).
   */
  function addBajantesOnBlock(b, top){
    const Lw = b.w, Dw = b.d;
    const downMax = (SPE_P().down || 20);
    const almostSq = Math.abs(Lw - Dw) < 0.12 * Math.max(Lw, Dw, 1);
    // Lados en sentido antihorario desde (x,z) mínimo
    const sides = [
      {x0:b.x,    z0:b.z,    x1:b.x+Lw, z1:b.z,    len:Lw, long: Lw >= Dw || almostSq}, // sur (largo si Lw≥Dw)
      {x0:b.x+Lw, z0:b.z,    x1:b.x+Lw, z1:b.z+Dw, len:Dw, long: Dw >  Lw || almostSq}, // este
      {x0:b.x+Lw, z0:b.z+Dw, x1:b.x,    z1:b.z+Dw, len:Lw, long: Lw >= Dw || almostSq}, // norte
      {x0:b.x,    z0:b.z+Dw, x1:b.x,    z1:b.z,    len:Dw, long: Dw >  Lw || almostSq}  // oeste
    ];
    // 1) Esquinas siempre (una sola vez; addDown deduplica)
    addDown(b.x,    b.z,    top);
    addDown(b.x+Lw, b.z,    top);
    addDown(b.x+Lw, b.z+Dw, top);
    addDown(b.x,    b.z+Dw, top);

    // 2) Intermedios según nivel — prioridad lados largos
    if(S.level === 'IV') return;

    for(const s of sides){
      // III: solo lados largos; II e I: todos los lados
      if(S.level === 'III' && !s.long) continue;
      // cantidad de tramos para no superar downMax
      const nSeg = Math.max(1, Math.ceil(s.len / downMax));
      const nInt = nSeg - 1; // puntos intermedios (sin esquinas)
      for(let i = 1; i <= nInt; i++){
        const t = i / (nInt + 1);
        const x = s.x0 + (s.x1 - s.x0) * t;
        const z = s.z0 + (s.z1 - s.z0) * t;
        addDown(x, z, top);
      }
    }
  }

  // Estructura superior: conectar cada esquina (y medios si aplica) al punto más cercano del anillo inferior
  function linkUpperToNearestRing(b, top){
    // buscar soporte (bloque cuyo techo ≈ base de b)
    let support = null, bestArea = 0;
    for(const o of S.blocks){
      if(o === b) continue;
      if(Math.abs((o.y + o.h) - b.y) > 0.25) continue;
      const ox0 = Math.max(b.x, o.x), ox1 = Math.min(b.x+b.w, o.x+o.w);
      const oz0 = Math.max(b.z, o.z), oz1 = Math.min(b.z+b.d, o.z+o.d);
      const area = Math.max(0, ox1-ox0) * Math.max(0, oz1-oz0);
      if(area > bestArea){ bestArea = area; support = o; }
    }
    if(!support) return;
    const sTop = support.y + support.h;

    // puntos del anillo superior a conectar: esquinas siempre; si nivel < IV también medios de lados
    const pts = [
      [b.x, b.z], [b.x+b.w, b.z], [b.x+b.w, b.z+b.d], [b.x, b.z+b.d]
    ];
    if(S.level !== 'IV'){
      pts.push([b.x + b.w/2, b.z], [b.x + b.w/2, b.z+b.d], [b.x, b.z+b.d/2], [b.x+b.w, b.z+b.d/2]);
    }

    for(const [px, pz] of pts){
      const [nx, nz] = nearestOnPerimeter(px, pz, support.x, support.z, support.w, support.d);
      // L sobre superficies (no en el aire):
      // 1) vertical por la fachada de la superior hasta el techo inferior
      links.push({x1:px, y1:top, z1:pz, x2:px, y2:sTop, z2:pz, kind:'v'});
      // 2) horizontal sobre el techo inferior hasta el punto más cercano del anillo
      if(Math.hypot(px - nx, pz - nz) > 0.05){
        links.push({x1:px, y1:sTop, z1:pz, x2:nx, y2:sTop, z2:nz, kind:'h'});
      }
    }
  }

  for(const b of S.blocks){
    const top = b.y + b.h;
    const isUpper = b.y > 0.15;

    addRingOnBlock(b, top);

    if(isUpper){
      // sin malla; conectar al anillo que sigue (punto más cercano)
      linkUpperToNearestRing(b, top);
    } else {
      if(S.norm==='NTC') addMeshOnBlock(b, top); // malla solo con NTC
      addBajantesOnBlock(b, top);
    }
  }

  if(!S.removedDowns) S.removedDowns=[];
  const rem=new Set(S.removedDowns);
  function _dk(x,z){return (Math.round(x*10)/10)+','+(Math.round(z*10)/10);}
  const keepD=downs.filter(d=>!rem.has(_dk(d.x,d.z)));
  const keepR=rods.filter(r=>!rem.has(_dk(r.x,r.z)));
  const keepB=boxes.filter(b=>!rem.has(_dk(b.x,b.z)));
  return {meshLines, rings, downs:keepD, rods:keepR, boxes:keepB, links, mesh: meshStep, nDown: keepD.length};
}

/** Radio de protección de punta (método esfera rodante simplificado) */





function coverRp(){
  try{
    const el=$("mastDh");
    const dh=parseFloat(el&&el.value)||1;
    const r=R();
    if(dh>=r) return Math.max(r*0.55, 2);
    return Math.sqrt(Math.max(0.5, dh*(2*r-dh)));
  }catch(e){ return 10; }
}
/**
 * Arco de esfera desde la punta HASTA EL PISO (cóncavo hacia abajo).
 * y(d) = h - R + sqrt(R² - d²)  → en d=0 vale h (punta); en d=rp llega a 0.
 * No sube por encima de la punta.
 */
function coverYFromTip(x, z, mx, mz, tipH, r){
  const d=Math.hypot(x-mx, z-mz);
  const rp = tipH>=r ? r*0.95 : Math.sqrt(Math.max(0.5, tipH*(2*r-tipH)));
  if(d >= rp - 1e-9) return 0;
  // Arco esférico clásico (cóncavo hacia abajo) medido desde el BORDE hacia la punta
  const delta = rp - d;
  const yOld = tipH - r + Math.sqrt(Math.max(0, r*r - Math.min(delta, r)*Math.min(delta, r)));
  // Invertir: cóncavo HACIA ARRIBA, pico en punta, piso en el borde
  let y = tipH - Math.max(0, Math.min(tipH, yOld));
  return Math.max(0, Math.min(tipH, y));
}
function coverSurfaceY(x, z){
  const r=R();
  const bb=bbox();
  const masts=(S.masts&&S.masts.length)?S.masts:[{x:(bb.x0+bb.x1)/2,z:(bb.z0+bb.z1)/2,dh:1}];
  // dominio = radio de protección alrededor de cada punta (hasta el piso)
  let yBest=null;
  let inRange=false;
  for(const m of masts){
    const tip=topAt(m.x,m.z)+(m.dh||1);
    const d=Math.hypot(x-m.x, z-m.z);
    if(d > r*1.02) continue;
    inRange=true;
    const y=coverYFromTip(x, z, m.x, m.z, tip, r);
    if(yBest==null || y>yBest) yBest=y;
  }
  if(!inRange) return null;
  return yBest==null ? 0 : yBest;
}
function coverSurfaceYSmooth(x, z, step){
  const s=step||Math.max(0.4, R()*0.025);
  let acc=0, n=0;
  for(let di=-1; di<=1; di++){
    for(let dj=-1; dj<=1; dj++){
      const w=(di===0&&dj===0)?5:1;
      const y=coverSurfaceY(x+di*s, z+dj*s);
      if(y==null) continue;
      acc+=y*w; n+=w;
    }
  }
  if(n===0) return null;
  return acc/n;
}
/** Pares de puntas vecinas (arco de esfera r_SC entre puntas) */
function tipMasts(){
  const bb=bbox();
  return (S.masts&&S.masts.length)?S.masts.slice():[{x:(bb.x0+bb.x1)/2,z:(bb.z0+bb.z1)/2,dh:1}];
}
function tipPairs(){
  const masts=tipMasts(), r=R(), mesh=(SPE_P().mesh||20);
  // Unir puntas a distancia ≤ malla del nivel (o hasta ~1.6·mesh) y siempre < 2R
  const lim=Math.min(2*r-0.05, Math.max(mesh*1.6, mesh+2));
  const pairs=[];
  for(let i=0;i<masts.length;i++){
    for(let j=i+1;j<masts.length;j++){
      const a=masts[i], b=masts[j];
      const d=Math.hypot(a.x-b.x, a.z-b.z);
      if(d>0.05 && d<=lim) pairs.push({a,b,d});
    }
  }
  if(pairs.length>48){
    pairs.sort((p,q)=>p.d-q.d);
    const used=new Map(), out=[];
    for(const p of pairs){
      const ka=p.a.x.toFixed(2)+','+p.a.z.toFixed(2);
      const kb=p.b.x.toFixed(2)+','+p.b.z.toFixed(2);
      const ca=used.get(ka)||0, cb=used.get(kb)||0;
      if(ca>=5||cb>=5) continue;
      out.push(p); used.set(ka,ca+1); used.set(kb,cb+1);
    }
    return out;
  }
  return pairs;
}
/**
 * Arco de la esfera de radio R (nivel I–IV) apoyada DESDE EL CIELO sobre dos puntas.
 * Centro por encima de las puntas; el arco inferior une punta→punta.
 * Si el techo corta este arco, la esfera tocaría la estructura.
 * Misma R que la sábana/perímetro de cada punta (R()).
 */
function sphereArcPts(a,b,n){
  n=n||32;
  const r=R();
  const ya=topAt(a.x,a.z)+(a.dh||1);
  const yb=topAt(b.x,b.z)+(b.dh||1);
  const dx=b.x-a.x, dz=b.z-a.z, d=Math.hypot(dx,dz);
  if(d<1e-3 || d>=2*r-1e-6) return null;
  const ux=dx/d, uz=dz/d;
  // Plano vertical del segmento: A'=(0,ya), B'=(d,yb). Círculos de radio r.
  const D=d;
  const aa=D/2; // (r²-r²+D²)/(2D)
  const h2=r*r - aa*aa;
  if(h2<=0) return null;
  const h=Math.sqrt(h2);
  // Punto en la cuerda A'B'
  const mx=aa, my=ya+(yb-ya)*(aa/D);
  // Vector perpendicular a A'B' en el plano 2D (x_along, y)
  const pdx=-(yb-ya)/D, pdy=1; // approx unit perpendicular in (along, y) — better:
  // A'B' direction (D, yb-ya); unit (D/L, dy/L) with L=hypot(D,dy)
  const dy=yb-ya, L=Math.hypot(D,dy);
  const ux2=D/L, uy2=dy/L;
  // perpendicular unit (-uy2, ux2)
  const px=-uy2, py=ux2;
  // Dos centros candidatos; elegir el de MAYOR altura (esfera desde el cielo)
  let cx=mx+px*h, cy=my+py*h;
  const cx2=mx-px*h, cy2=my-py*h;
  if(cy2>cy){ cx=cx2; cy=cy2; }
  // Ángulos de A' y B' desde el centro (eje along, eje y)
  const angA=Math.atan2(ya-cy, 0-cx);
  const angB=Math.atan2(yb-cy, d-cx);
  function sample(a0,a1){
    let from=a0, to=a1;
    // tomar el arco cuyo punto medio tenga MENOR y (arco inferior, hacia el techo)
    let best=null, bestMidY=1e99;
    for(const dir of [1,-1]){
      let t0=from, t1=to;
      if(dir>0){ while(t1<t0) t1+=2*Math.PI; if(t1-t0>Math.PI*1.02) t1-=2*Math.PI; }
      else { while(t1>t0) t1-=2*Math.PI; if(t0-t1>Math.PI*1.02) t1+=2*Math.PI; }
      const pts=[];
      let midY=0;
      for(let i=0;i<=n;i++){
        const t=i/n;
        const ang=t0+(t1-t0)*t;
        const lx=cx+r*Math.cos(ang);
        const ly=cy+r*Math.sin(ang);
        pts.push({x:a.x+ux*lx, y:ly, z:a.z+uz*lx});
        if(i===Math.floor(n/2)) midY=ly;
      }
      if(midY<bestMidY){ bestMidY=midY; best=pts; }
    }
    return best;
  }
  return sample(angA, angB);
}

    if(!S.showCover) return '';
    const r=R(); let s='';
    const bb=bbox();
    const masts=(S.masts&&S.masts.length)?S.masts:[{x:(bb.x0+bb.x1)/2,z:(bb.z0+bb.z1)/2,dh:1}];
    for(const m of masts){
      const tip=topAt(m.x,m.z)+(m.dh||1);
      const rp = tip>=r ? r*0.95 : Math.sqrt(Math.max(0.5, tip*(2*r-tip)));
      // arco punta → piso (cóncavo hacia abajo), cerrado en el suelo
      let d2='';
      for(let i=0;i<=48;i++){
        const t=i/48, dist=-rp+2*rp*t;
        const y=coverYFromTip(m.x+dist, m.z, m.x, m.z, tip, r);
        const[px,py]=W2S(m.x+dist, y);
        d2+=(i===0?'M':'L')+px.toFixed(1)+' '+py.toFixed(1)+' ';
      }
      const[rx,ry]=W2S(m.x+rp,0);
      const[lx,ly]=W2S(m.x-rp,0);
      d2+=`L${rx.toFixed(1)} ${ry.toFixed(1)} L${lx.toFixed(1)} ${ly.toFixed(1)} Z`;
      s+=`<path d="${d2}" fill="#3b82f6" fill-opacity=".12" stroke="#1d4ed8" stroke-opacity=".85" stroke-width="2" stroke-linejoin="round"/>`;
    }
    // perfil global suavizado a lo largo de X hasta el piso
    const x0=bb.x0-r*0.3, x1=bb.x1+r*0.3;
    const n=56; const raw=[];
    for(let i=0;i<=n;i++){
      const x=x0+(x1-x0)*i/n;
      let yM=null;
      for(let zi=0;zi<=8;zi++){
        const z=bb.z0+(bb.W)*zi/8;
        const y=coverSurfaceY(x,z);
        if(y==null) continue;
        if(yM==null || y>yM) yM=y;
      }
      raw.push([x, yM==null?0:yM]);
    }
    const sm=raw.map((p,i)=>{
      let a=0,c=0;
      for(let k=-2;k<=2;k++){
        const j=Math.max(0,Math.min(raw.length-1,i+k));
        a+=raw[j][1]; c++;
      }
      return [p[0], a/c];
    });
    let dP='';
    sm.forEach((p,i)=>{
      const[px,py]=W2S(p[0], p[1]);
      dP+=(i===0?'M':'L')+px.toFixed(1)+' '+py.toFixed(1)+' ';
    });
    const[xe,ye]=W2S(sm[sm.length-1][0], 0);
    const[xs,ys]=W2S(sm[0][0], 0);
    dP+=`L${xe.toFixed(1)} ${ye.toFixed(1)} L${xs.toFixed(1)} ${ys.toFixed(1)} Z`;
    s+=`<path d="${dP}" fill="#60a5fa" fill-opacity=".08" stroke="#3b82f6" stroke-opacity=".55" stroke-width="1.5" stroke-linejoin="round"/>`;
    s+=drawTipLinksAlzado();
    return s;
  }catch(e){ console.warn('cover alzado',e); return ''; }
}
function drawCover3D(){
  try{
    if(!S.showCover) return '';
    let s='';
    const bb=bbox();
    const r=R();
    const masts=(S.masts&&S.masts.length)?S.masts:[{x:(bb.x0+bb.x1)/2,z:(bb.z0+bb.z1)/2,dh:1}];
    // dominio hasta radio de piso de cada punta
    let x0=bb.x0, x1=bb.x1, z0=bb.z0, z1=bb.z1;
    for(const m of masts){
      const tip=topAt(m.x,m.z)+(m.dh||1);
      const rp=tip>=r?r*0.95:Math.sqrt(Math.max(0.5,tip*(2*r-tip)));
      x0=Math.min(x0, m.x-rp); x1=Math.max(x1, m.x+rp);
      z0=Math.min(z0, m.z-rp); z1=Math.max(z1, m.z+rp);
    }
    const nx=30, nz=24;
    const step=Math.max(0.3, Math.min(x1-x0, z1-z0)/50);
    const pts=[];
    for(let i=0;i<=nx;i++){
      pts[i]=[];
      for(let j=0;j<=nz;j++){
        const x=x0+(x1-x0)*i/nx;
        const z=z0+(z1-z0)*j/nz;
        let y=coverSurfaceYSmooth(x,z, step);
        if(y==null) y=0;
        pts[i][j]=proj(x, y, z);
      }
    }
    for(let i=0;i<nx;i++){
      for(let j=0;j<nz;j++){
        const a=pts[i][j],b=pts[i+1][j],c=pts[i+1][j+1],d=pts[i][j+1];
        if(!a||!b||!c||!d) continue;
        // omitir cuadros casi planos en el piso (opcional: dibujar todos para ver falda)
        const poly=a[0].toFixed(1)+','+a[1].toFixed(1)+' '+b[0].toFixed(1)+','+b[1].toFixed(1)+' '+c[0].toFixed(1)+','+c[1].toFixed(1)+' '+d[0].toFixed(1)+','+d[1].toFixed(1);
        s+=`<polygon points="${poly}" fill="#3b82f6" fill-opacity="0.1" stroke="#93c5fd" stroke-opacity="0.32" stroke-width="0.35"/>`;
      }
    }
    // meridianos: punta → piso (misma curva coverYFromTip — NO se baja al cambiar nivel)
    // Más puntas (nivel I/II) ⇒ más cortinas; la forma por punta se mantiene
    const nMer = Math.min(28, Math.max(14, 10 + Math.floor(masts.length/2)));
    const nSeg = 32;
    for(const m of masts){
      const tip=topAt(m.x,m.z)+(m.dh||1);
      const rp=tip>=r?r*0.95:Math.sqrt(Math.max(0.5,tip*(2*r-tip)));
      for(let k=0;k<nMer;k++){
        const th=k/nMer*Math.PI*2;
        let d='';
        for(let i=0;i<=nSeg;i++){
          const t=i/nSeg;
          const dist=t*rp;
          const x=m.x+Math.cos(th)*dist, z=m.z+Math.sin(th)*dist;
          const y=coverYFromTip(x, z, m.x, m.z, tip, r);
          const P=proj(x, y, z);
          d+=(i===0?'M':'L')+P[0].toFixed(1)+' '+P[1].toFixed(1)+' ';
        }
        if(d) s+=`<path d="${d}" fill="none" stroke="#1d4ed8" stroke-opacity=".5" stroke-width="1.05" stroke-linejoin="round"/>`;
      }
    }
    s+=drawTipLinks3D();
    return s;
  }catch(e){ console.warn('cover 3d',e); return ''; }
}

/* ===== proyección 3D ===== */
function proj(x,y,z){const bb=bbox(),cx=(bb.x0+bb.x1)/2,cz=(bb.z0+bb.z1)/2,cy=bb.H/2;
  const az=S.cam.az*PI/180,el=S.cam.el*PI/180,s=S.cam.s;
  let X=x-cx,Y=y-cy,Z=z-cz;
  let x1=X*Math.cos(az)+Z*Math.sin(az), z1=-X*Math.sin(az)+Z*Math.cos(az), y1=Y;
  let y2=y1*Math.cos(el)-z1*Math.sin(el), depth=y1*Math.sin(el)+z1*Math.cos(el);
  return [VBW/2+x1*s, VBH/2+70-y2*s, depth];}

  const pts=obstacles();

    const rows=Math.max(1,Math.floor(b.h/4)),cols=Math.max(1,Math.floor(b.w/4));for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const wx=b.x+(j+0.5)*b.w/cols,wy=b.y+b.h-(i+0.7)*b.h/rows;const[px,py]=W2S(wx,wy);if(py<by-6)g+=`<rect x="${px-3}" y="${py-4}" width="6" height="7" fill="${cvar('--line2')}" stroke="${cvar('--line')}" stroke-width=".6"/>`;}}
  const[g0x,g0y]=W2S(dx0,0),[g1x]=W2S(dx1,0);g+=`<line x1="${Math.min(g0x,0)}" y1="${g0y}" x2="${Math.max(g1x,VBW)}" y2="${g0y}" stroke="${cvar('--mut')}" stroke-width="2"/>`;
  for(let x=g0x-14;x<Math.max(g1x,VBW);x+=13)g+=`<line x1="${x}" y1="${g0y}" x2="${x-8}" y2="${g0y+8}" stroke="${cvar('--faint')}" stroke-width="1"/>`;
  for(const f of S.frozen)g+=sphereSVG(f.cx,f.cy,true,f.con);
  // SPE conductors (alambrón rojo + bajantes + varillas)
  if(S.showSPE){

function sphereSVG(cx,cy,ghost,con){
  const[px,py]=W2S(cx,cy),rp=R()*VW().s,col=ghost?cvar('--faint'):cvar('--sky');
  let g=`<circle cx="${px}" cy="${py}" r="${rp}" fill="${ghost?'none':cvar('--sky')}" fill-opacity="${ghost?0:.05}" stroke="${col}" stroke-width="${ghost?1.2:2}" stroke-dasharray="${ghost?'5 5':'none'}"/>`;
  if(!ghost){const ang=-PI/3.2,ex=px+rp*Math.cos(ang),ey=py+rp*Math.sin(ang);g+=`<line x1="${px}" y1="${py}" x2="${ex}" y2="${ey}" stroke="${col}" stroke-width="1.2" stroke-dasharray="4 3"/><text x="${(px+ex)/2+4}" y="${(py+ey)/2-3}" font-size="11" fill="${col}" font-weight="800">R</text>`;}
  g+=`<circle cx="${px}" cy="${py}" r="${ghost?2.5:5}" fill="${col}"/>`;if(!ghost)g+=`<circle cx="${px}" cy="${py}" r="10" fill="none" stroke="${col}" stroke-width="1" opacity=".5"/>`;
  if(con)for(const c of con){const[qx,qy]=W2S(c[0],c[1]);const isM=c[2]==='mast',cc=isM?cvar('--green'):(c[1]>0.05?cvar('--red'):cvar('--mut'));g+=`<circle cx="${qx}" cy="${qy}" r="${ghost?3:5}" fill="${cc}" stroke="${cvar('--panel')}" stroke-width="1"/>`;}
  return g;
}

/* ---------- PLANTA ---------- */
function plantaExposed(){
  const res=1.2;let exp=0;
  for(const b of S.blocks){const top=b.y+b.h;for(let x=b.x+res/2;x<b.x+b.w;x+=res)for(let z=b.z+res/2;z<b.z+b.d;z+=res){if(Math.abs(topAt(x,z)-top)>0.01)continue;if(!protectedAt(x,z))exp++;}}
  return exp;
}
function renderPlanta(){
  $("viewHelp").innerHTML=`<b>Planta (X-Z).</b> Vista superior de cubiertas. Cada punta protege un círculo r_p; zonas <span style="color:var(--red)">rojas</span> = expuestas. Agrega/mueve puntas aquí.`;
  $("legend").innerHTML=`<div class="row"><span class="lg-s" style="background:var(--stroke)"></span>Cubierta</div><div class="row"><span class="lg-l" style="border-color:var(--red)"></span>Alambrón malla/anillo</div><div class="row"><span class="lg-d" style="background:var(--red)"></span>Bajante + caja + varilla</div><div class="row"><span class="lg-d" style="background:var(--amber)"></span>Punta captación</div><div class="row"><span class="lg-s" style="background:var(--green);opacity:.5"></span>Protegido / <span style="color:var(--red)">expuesto</span></div><div class="row"><span class="lg-l" style="border-color:#1d4ed8"></span>Arco R entre puntas (mismo radio nivel)</div>`;
  let g=gridSVG();
  const order=[...S.blocks].sort((a,b)=>(a.y+a.h)-(b.y+b.h));
  const res=1.4;
  for(const b of order){const top=b.y+b.h;
    const[ax,ay]=W2S(b.x,b.z+b.d),[bx,by]=W2S(b.x+b.w,b.z);
    const shade=Math.min(.9,.35+(top/Math.max(1,bbox().H))*0.5);
    g+=`<rect x="${ax}" y="${ay}" width="${bx-ax}" height="${by-ay}" fill="${cvar('--stroke')}" fill-opacity="${0.10+shade*0.12}" stroke="${cvar('--stroke')}" stroke-width="1.4"/>`;
    g+=`<text x="${(ax+bx)/2}" y="${(ay+by)/2}" text-anchor="middle" font-size="10" fill="${cvar('--mut')}" font-weight="700">techo ${es(top)} m</text>`;
    for(let x=b.x+res/2;x<b.x+b.w;x+=res)for(let z=b.z+res/2;z<b.z+b.d;z+=res){if(Math.abs(topAt(x,z)-top)>0.01)continue;const[px,pz]=W2S(x,z);const ok=protectedAt(x,z);g+=`<circle cx="${px}" cy="${pz}" r="2.1" fill="${ok?cvar('--green'):cvar('--red')}" opacity="${ok?.5:.85}"/>`;}
  }
  // SPE: malla + anillo + posición de bajantes/varillas
  if(S.showSPE){
    const spe=speGeom();
    for(const ln of spe.meshLines){
      const[a0,a1]=W2S(ln.x1, ln.z1),[b0,b1]=W2S(ln.x2, ln.z2);
      g+=`<line x1="${a0}" y1="${a1}" x2="${b0}" y2="${b1}" stroke="${cvar('--red')}" stroke-width="1.6" opacity=".85"/>`;
    }
    for(const ln of spe.rings){
      const[a0,a1]=W2S(ln.x1, ln.z1),[b0,b1]=W2S(ln.x2, ln.z2);
      g+=`<line x1="${a0}" y1="${a1}" x2="${b0}" y2="${b1}" stroke="${cvar('--red')}" stroke-width="2.4" opacity=".95"/>`;
    }
    for(const d of spe.downs){
      const[px,pz]=W2S(d.x, d.z);
      g+=`<circle cx="${px}" cy="${pz}" r="4" fill="none" stroke="${cvar('--red')}" stroke-width="2"/>`;
      g+=`<circle cx="${px}" cy="${pz}" r="2" fill="${cvar('--red')}"/>`;
    }
    for(const bx of spe.boxes){
      const[px,pz]=W2S(bx.x, bx.z);
      g+=`<rect x="${px-4}" y="${pz-4}" width="8" height="8" rx="1" fill="#1a2336" stroke="${cvar('--red')}" stroke-width="1.3"/>`;
    }
  }
  const dh0=parseFloat($("mastDh").value)||1,rp=rpOf(dh0);

  for(const m of S.masts){const[px,pz]=W2S(m.x,m.z);g+=`<circle cx="${px}" cy="${pz}" r="4.5" fill="${cvar('--amber')}" stroke="${cvar('--panel')}" stroke-width="1.2"/>`;}

/* ---------- 3D ---------- */
function render3D(){
  $("viewHelp").innerHTML=`<b>Vista 3D.</b> Arrastra para rotar. Estructuras apiladas + puntas de captación. Combina alzado (Y) y planta (Z).`;
  $("legend").innerHTML=`<div class="row"><span class="lg-s" style="background:var(--blue)"></span>Estructura</div><div class="row"><span class="lg-l" style="border-color:var(--red)"></span>Alambrón / bajante</div><div class="row"><span class="lg-l" style="border-color:#c45c2a"></span>Varilla + caja conexión</div><div class="row"><span class="lg-l" style="border-color:var(--amber)"></span>Punta de captación</div>`;
  let g='';
  const bb=bbox(),pad=6;const gx0=bb.x0-pad,gx1=bb.x1+pad,gz0=bb.z0-pad,gz1=bb.z1+pad;
  for(let x=Math.floor(gx0/5)*5;x<=gx1;x+=5){const a=proj(x,0,gz0),b=proj(x,0,gz1);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--grid')}" stroke-width="1"/>`;}
  for(let z=Math.floor(gz0/5)*5;z<=gz1;z+=5){const a=proj(gx0,0,z),b=proj(gx1,0,z);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--grid')}" stroke-width="1"/>`;}
  const faces=[];
  for(const b of S.blocks){const X0=b.x,X1=b.x+b.w,Y0=b.y,Y1=b.y+b.h,Z0=b.z,Z1=b.z+b.d;
    const c=[[X0,Y0,Z0],[X1,Y0,Z0],[X1,Y0,Z1],[X0,Y0,Z1],[X0,Y1,Z0],[X1,Y1,Z0],[X1,Y1,Z1],[X0,Y1,Z1]];
    const F=[[0,1,2,3,'bot'],[4,5,6,7,'top'],[0,1,5,4,'s'],[1,2,6,5,'s'],[2,3,7,6,'s'],[3,0,4,7,'s']];
    for(const f of F){const P=f.slice(0,4).map(k=>proj(c[k][0],c[k][1],c[k][2]));const depth=(P[0][2]+P[1][2]+P[2][2]+P[3][2])/4;faces.push({P,depth,kind:f[4]});}}
  faces.sort((a,b)=>a.depth-b.depth);
  for(const f of faces){const pts=f.P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');const top=f.kind==='top';const fill=top?cvar('--sky'):cvar('--blue');const op=top?.4:(f.kind==='bot'?.15:.28);g+=`<polygon points="${pts}" fill="${fill}" fill-opacity="${op}" stroke="${cvar('--blue')}" stroke-width="1.1" stroke-opacity=".8" stroke-linejoin="round"/>`;}
  // SPE conductors in 3D
  if(S.showSPE){
    const spe=speGeom();
    const speSegs=[];
    for(const ln of spe.meshLines){
      const a=proj(ln.x1,ln.y1,ln.z1), b=proj(ln.x2,ln.y2,ln.z2);
      speSegs.push({a,b,depth:(a[2]+b[2])/2, kind:'mesh'});
    }
    for(const ln of spe.rings){
      const a=proj(ln.x1,ln.y1,ln.z1), b=proj(ln.x2,ln.y2,ln.z2);
      speSegs.push({a,b,depth:(a[2]+b[2])/2, kind:'ring'});
    }
    for(const ln of (spe.links||[])){
      const a=proj(ln.x1,ln.y1,ln.z1), b=proj(ln.x2,ln.y2,ln.z2);
      speSegs.push({a,b,depth:(a[2]+b[2])/2, kind:'link'});
    }
    for(const d of spe.downs){
      const a=proj(d.x,d.yTop,d.z), b=proj(d.x,d.yBot,d.z);
      speSegs.push({a,b,depth:(a[2]+b[2])/2, kind:'down'});
    }
    for(const r of spe.rods){
      const a=proj(r.x,r.yTop,r.z), b=proj(r.x,r.yBot,r.z);
      speSegs.push({a,b,depth:(a[2]+b[2])/2, kind:'rod'});
    }
    speSegs.sort((x,y)=>x.depth-y.depth);
    for(const s of speSegs){
      if(s.kind==='mesh') g+=`<line x1="${s.a[0]}" y1="${s.a[1]}" x2="${s.b[0]}" y2="${s.b[1]}" stroke="${cvar('--red')}" stroke-width="1.5" opacity=".8"/>`;
      else if(s.kind==='ring') g+=`<line x1="${s.a[0]}" y1="${s.a[1]}" x2="${s.b[0]}" y2="${s.b[1]}" stroke="${cvar('--red')}" stroke-width="2.3" opacity=".95"/>`;
      else if(s.kind==='link') g+=`<line x1="${s.a[0]}" y1="${s.a[1]}" x2="${s.b[0]}" y2="${s.b[1]}" stroke="${cvar('--red')}" stroke-width="2" stroke-dasharray="4 3"/>`;
      else if(s.kind==='down') g+=`<line x1="${s.a[0]}" y1="${s.a[1]}" x2="${s.b[0]}" y2="${s.b[1]}" stroke="${cvar('--red')}" stroke-width="2.2"/>`;
      else if(s.kind==='rod'){ g+=`<line x1="${s.a[0]}" y1="${s.a[1]}" x2="${s.b[0]}" y2="${s.b[1]}" stroke="#c45c2a" stroke-width="3"/><circle cx="${s.b[0]}" cy="${s.b[1]}" r="3.2" fill="#c45c2a"/>`; }
    }
    // cajas de conexión a nivel de piso
    for(const bx of spe.boxes){
      const s = 0.35;
      const corners = [
        proj(bx.x-s, 0, bx.z-s), proj(bx.x+s, 0, bx.z-s),
        proj(bx.x+s, 0, bx.z+s), proj(bx.x-s, 0, bx.z+s)
      ];
      const pts = corners.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
      g+=`<polygon points="${pts}" fill="#1a2336" stroke="${cvar('--red')}" stroke-width="1.3" fill-opacity=".9"/>`;
    }
  }
  const rods=[];for(const m of S.masts){const base=topAt(m.x,m.z),a=proj(m.x,base,m.z),t=proj(m.x,base+m.dh,m.z);rods.push({a,t,depth:(a[2]+t[2])/2});}
  rods.sort((x,y)=>x.depth-y.depth);
  for(const r of rods){g+=`<line x1="${r.a[0]}" y1="${r.a[1]}" x2="${r.t[0]}" y2="${r.t[1]}" stroke="${cvar('--amber')}" stroke-width="2.4"/><circle cx="${r.t[0]}" cy="${r.t[1]}" r="3.6" fill="${cvar('--amber')}"/>`;}
  const o=proj(bb.x0,0,bb.z0),ax=proj(bb.x0+8,0,bb.z0),ay=proj(bb.x0,8,bb.z0),az=proj(bb.x0,0,bb.z0+8);
  g+=`<line x1="${o[0]}" y1="${o[1]}" x2="${ax[0]}" y2="${ax[1]}" stroke="${cvar('--red')}" stroke-width="2"/><text x="${ax[0]}" y="${ax[1]}" font-size="11" fill="${cvar('--red')}" font-weight="800">X</text>`;
  g+=`<line x1="${o[0]}" y1="${o[1]}" x2="${ay[0]}" y2="${ay[1]}" stroke="${cvar('--green')}" stroke-width="2"/><text x="${ay[0]-4}" y="${ay[1]-3}" font-size="11" fill="${cvar('--green')}" font-weight="800">Y</text>`;
  g+=`<line x1="${o[0]}" y1="${o[1]}" x2="${az[0]}" y2="${az[1]}" stroke="${cvar('--cyan')}" stroke-width="2"/><text x="${az[0]}" y="${az[1]}" font-size="11" fill="${cvar('--cyan')}" font-weight="800">Z</text>`;
  try{ if(S.showCover) g+=drawCover3D(); }catch(e){console.warn(e);}
  cv.innerHTML=g;
  try{applyLineWeight();}catch(e){}
}

function gridSVG(){let g='';const v=VW(),s=v.s;let step=1,target=42;while(step*s<target)step*=(step===1?5:2);while(step*s>target*2.6)step/=(step===2?2:2.5);
  const[wx0,wy0]=S2W(0,VBH),[wx1,wy1]=S2W(VBW,0);
  for(let x=Math.ceil(wx0/step)*step;x<=wx1;x+=step){const[px]=W2S(x,0);g+=`<line x1="${px}" y1="0" x2="${px}" y2="${VBH}" stroke="${cvar(Math.abs(x)<1e-6?'--grid2':'--grid')}" stroke-width="1"/>`;if(px>28)g+=`<text x="${px+2}" y="${VBH-4}" font-size="9" fill="${cvar('--faint')}">${x}</text>`;}
  for(let y=Math.ceil(wy0/step)*step;y<=wy1;y+=step){const[,py]=W2S(0,y);g+=`<line x1="0" y1="${py}" x2="${VBW}" y2="${py}" stroke="${cvar(Math.abs(y)<1e-6?'--grid2':'--grid')}" stroke-width="1"/>`;if(py>12&&py<VBH-8)g+=`<text x="3" y="${py-2}" font-size="9" fill="${cvar('--faint')}">${y}</text>`;}
  return g;}

function pxdist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}

function down(e){
  const[vx,vy]=evtVB(e),tol=15;
  if(S.tab==='v3d'){S.drag={t:'rot',sx:vx,sy:vy,az:S.cam.az,el:S.cam.el};e.preventDefault();return;}
  if(S.addMast){const[wx,wz]=S2W(vx,vy);const dh=parseFloat($("mastDh").value)||1;if(S.tab==='alzado'){const z=bbox().z0+bbox().W/2;S.masts.push({x:+wx.toFixed(2),z:+z.toFixed(2),dh});}else{S.masts.push({x:+wx.toFixed(2),z:+wz.toFixed(2),dh});}S.addMast=false;render();e.preventDefault();return;}
  for(let i=0;i<S.masts.length;i++){const m=S.masts[i];const base=topAt(m.x,m.z);const p=S.tab==='alzado'?W2S(m.x,base+m.dh):W2S(m.x,m.z);if(pxdist([vx,vy],p)<tol){S.drag={t:'mast',i};e.preventDefault();return;}}
  if(S.tab==='alzado'){const sc=W2S(S.sphere.cx,S.sphere.cy);if(pxdist([vx,vy],sc)<16){S.drag={t:'sphere'};cv.classList.add('grabbing');e.preventDefault();return;}}
  const v=VW();S.drag={t:'pan',sx:vx,sy:vy,x0:v.x0,y0:v.y0};cv.classList.add('grabbing');e.preventDefault();
}
function move(e){
  if(!S.drag)return;e.preventDefault();const[vx,vy]=evtVB(e);
  if(S.drag.t==='rot'){S.cam.az=S.drag.az+(vx-S.drag.sx)*0.4;S.cam.el=Math.max(-8,Math.min(80,S.drag.el+(vy-S.drag.sy)*0.4));render();return;}
  const[wx,wy]=S2W(vx,vy);
  if(S.drag.t==='pan'){const v=VW(),[ox,oy]=S2W(S.drag.sx,S.drag.sy);v.x0=S.drag.x0+(ox-wx);v.y0=S.drag.y0+(oy-wy);render();return;}
  if(S.drag.t==='mast'){const m=S.masts[S.drag.i];m.x=+wx.toFixed(2);if(S.tab==='planta')m.z=+wy.toFixed(2);render();return;}
  if(S.drag.t==='sphere'){S.sphere.cx=wx;if(S.mode==='free'){const rr=restAt(wx,obstacles()).cy;S.sphere.cy=Math.max(rr,wy);}render();return;}
}

function addShape(kind){
  const bb=bbox();
  const ox=+bb.x1.toFixed(0)+2;
  const oz=0;
  const H=9;
  const gid='Forma '+kind+' '+(S.blocks.filter(b=>(b.group||'').indexOf('Forma '+kind)>=0).length+1);
  const parts=[];
  if(kind==='L'){
    // barra horizontal + vertical
    parts.push({x:ox,y:0,w:18,h:H,z:oz,d:8,group:gid});
    parts.push({x:ox,y:0,w:8,h:H,z:oz,d:18,group:gid});
  } else if(kind==='T'){
    parts.push({x:ox,y:0,w:20,h:H,z:oz,d:8,group:gid});
    parts.push({x:ox+6,y:0,w:8,h:H,z:oz,d:16,group:gid});
  } else if(kind==='U'){
    parts.push({x:ox,y:0,w:8,h:H,z:oz,d:16,group:gid});
    parts.push({x:ox+16,y:0,w:8,h:H,z:oz,d:16,group:gid});
    parts.push({x:ox,y:0,w:24,h:H,z:oz,d:8,group:gid});
  } else if(kind==='C'){
    parts.push({x:ox,y:0,w:8,h:H,z:oz,d:18,group:gid});
    parts.push({x:ox,y:0,w:20,h:H,z:oz,d:8,group:gid});
    parts.push({x:ox,y:0,w:20,h:H,z:oz+10,d:8,group:gid});
  } else {
    parts.push({x:ox,y:0,w:12,h:H,z:oz,d:12,group:gid});
  }
  parts.forEach(p=>S.blocks.push(p));
  render();
  try{toast(gid+' · '+parts.length+' cajas combinadas');}catch(e){}
}

function bom(){
  const bb=bbox(),L=bb.L,W=bb.W,H=bb.H,P=NTC[S.level],dh=parseFloat($("mastDh").value)||1,rp=rpOf(dh);
  const perim=2*(L+W), sGrid=Math.max(1,rp*Math.SQRT2);
  let nPuntas=S.masts.length;
  const nx=Math.max(2,Math.ceil(L/sGrid)+1),nz=Math.max(2,Math.ceil(W/sGrid)+1);
  const nGrid=nx*nz;if(!nPuntas)nPuntas=nGrid;
  const roofArea=S.blocks.reduce((s,b)=>s+b.w*b.d,0);
  const meshLen=Math.round((Math.ceil(L/P.mesh)+1)*W+(Math.ceil(W/P.mesh)+1)*L);
  const nDown=Math.max(4,Math.ceil(perim/P.down));
  const downLen=Math.round(nDown*H);
  const ringLen=Math.round(perim);
  return {L,W,H,rp,dh,perim,nPuntas,nGrid,nDown,meshLen,downLen,ringLen,roofArea,mesh:P.mesh};
}
function openMat(){
  const c=bom();
  $("matSub").textContent=`Nivel ${S.level} (r_SC ${R()} m) · envolvente ${es(c.L)}×${es(c.W)}×${es(c.H)} m · SPE externo NTC 4552-3`;
  const G=t=>`<tr class="grp"><td colspan="4">${t}</td></tr>`;
  const row=(d,sub,q,u,ref)=>`<tr><td class="desc">${d}${sub?`<br><small>${sub}</small>`:''}</td><td class="ref">${ref||''}</td><td class="n">${q}</td><td>${u}</td></tr>`;
  let h=`<table class="mt"><thead><tr><th>Descripción</th><th>Ref. DEHN / equivalente CO</th><th class="n">Cant.</th><th>Un</th></tr></thead><tbody>`;
  h+=G('Captación');
  h+=row('Punta captadora Ø16/10 mm AlMgSi, L≈'+es(Math.max(1,c.dh))+' m, con base y grapa','DEHN varilla captadora Al · equiv. CO: punta Cu/Al 5/8" con base','+'+c.nPuntas,'Un','ref. 103xxx');
  h+=row('Conductor de cubierta Rd 8 mm (alambrón)','DEHN Rd8 Al · equiv. CO: alambrón Al/Cu 8 mm (Centelsa/Procables)',c.meshLen+c.ringLen,'m','ref. 840xxx');
  h+=row('Soporte de conductor para cubierta plana (con base de concreto)','DEHN FB2 / DEHNgrip · equiv. CO: soporte con dado de concreto','≈'+Math.round((c.meshLen+c.ringLen)),'Un','ref. 253xxx');
  h+=row('Grapa de unión multiuso (cruz/T/paralelo) 200 kA','DEHN MV clamp MVK 200 8.10 · equiv. CO: conector bimetálico',Math.round(c.nPuntas*2+c.nDown+12),'Un','ref. 390209');
  h+=G('Bajantes y equipotencialización');
  h+=row('Conductor bajante Rd 8 mm en tubería','DEHN Rd8 · equiv. CO: alambrón/cable Cu 8 mm en PVC/IMC 1"',c.downLen,'m','ref. 840xxx');
  h+=row('Número de bajantes','separación ≤ '+NTC[S.level].down+' m (Nivel '+S.level+')',c.nDown,'Un','—');
  h+=row('Junta de medición / desconexión','DEHN UNI clamp UTK 200 · equiv. CO: caja + conector medición',c.nDown,'Un','ref. 459200');
  h+=row('Conector KS conductor-pletina / refuerzo','DEHN KSV 200 · equiv. CO: conector bimetálico Cu-Al',c.nDown+8,'Un','ref. 301209');
  h+=G('Puesta a tierra');
  h+=row('Electrodo de tierra Cu-bonded 5/8" × 2,4 m','DEHN earth rod · equiv. CO: varilla cobre-bonded 5/8"×2,4 m',c.nDown,'Un','ref. 620xxx');
  h+=row('Conductor de tierra Cu desnudo 2/0 AWG','anillo perimetral / puentes · Centelsa/Procables',c.ringLen,'m','—');
  h+=row('Soldadura exotérmica (molde + carga) / conector certificado','Cadweld (nVent Erico) · o conector a compresión certificado',c.nDown+8,'Un','—');
  h+=row('Caja de inspección 30×30 cm con tapa','equiv. CO: caja de inspección PVC/concreto',c.nDown,'Un','—');
  h+=G('Protección contra sobretensiones (DPS)');
  h+=row('DPS Tipo 1+2 combinado, spark-gap 100 kA (10/350), acometida','DEHNventil DV M TNC/TNS · equiv. CO: Citel DS Tipo 1+2',1,'Un','EN 61643-11');
  h+=row('DPS Tipo 2 varistor 275 V, tablero(s) secundario(s)','DEHNguard DG M TNC/TNS 275 · equiv. CO: Citel/Legrand T2',Math.max(1,S.blocks.length),'Un','ref. 952xxx');
  h+=row('DPS Tipo 3 en equipos sensibles','DEHNflex / DEHNcord · equiv. CO: T3 tomacorriente',2,'Un','—');
  h+=G('Señalización y varios');
  h+=row('Señalización de bajante (acrílico/aluminio)','placa "no remover - SIPRA"',c.nDown,'Un','—');
  h+=row('Tornillería, abrazaderas y menudencias','acero inoxidable/galvanizado','1','glb','—');
  h+=`</tbody></table>`;
  $("matBody").innerHTML=h;
  $("matNote").innerHTML=`Cantidades <b>estimadas para presupuesto preliminar</b> a partir de la geometría (envolvente ${es(c.L)}×${es(c.W)}×${es(c.H)} m, retícula Nivel ${S.level} ${c.mesh}×${c.mesh} m, ${c.nDown} bajantes) y de las ${S.masts.length? 'puntas colocadas':'puntas estimadas por retícula ('+c.nGrid+')'}. <b>Las referencias DEHN son orientativas — verificar el número de artículo y el precio en el catálogo DEHN vigente o con el distribuidor.</b> DEHN se distribuye en Colombia; se indican equivalentes locales (Cadweld/nVent, Citel, Centelsa/Procables, varilla cobre-bonded). Verificar todo en obra según NTC 4552 y RETIE.`;
  $("matov").classList.add('show');
}
function closeMat(){$("matov").classList.remove('show');}

$("themeBtn").textContent=document.documentElement.dataset.theme==='dark'?'🌙':'☀️';
['rDDT','rCd','rRf','rLf','mastDh'].forEach(id=>$(id)&&$(id).addEventListener('input',render));
render();fitView();

/** Proyecta (x,z) al muro más cercano; retorna {wall, x, z, rot, along} */
function snapToWall(x, z, width){
  const R = room();
  const half = (width||0.9)/2;
  // distancias a cada muro
  const dS = z;           // sur z=0
  const dN = R.W - z;     // norte z=W
  const dW = x;           // oeste x=0
  const dE = R.L - x;     // este x=L
  const m = Math.min(dS, dN, dW, dE);
  let wall, nx, nz, rot, along;
  if(m===dS){ wall='S'; rot=0;  along=Math.max(half, Math.min(R.L-half, x)); nx=along-half; nz=0; }
  else if(m===dN){ wall='N'; rot=0;  along=Math.max(half, Math.min(R.L-half, x)); nx=along-half; nz=R.W-0.08; }
  else if(m===dW){ wall='W'; rot=90; along=Math.max(half, Math.min(R.W-half, z)); nx=0; nz=along-half; }
  else { wall='E'; rot=90; along=Math.max(half, Math.min(R.W-half, z)); nx=R.L-0.08; nz=along-half; }
  return {wall, x:+nx.toFixed(3), z:+nz.toFixed(3), rot, along:+along.toFixed(3)};
}

/* transform */
function W2S(x,z){const v=S.view;return [ML+(x-v.x0)*v.s, VBH-MB-(z-v.y0)*v.s];}
function S2W(px,pz){const v=S.view;return [v.x0+(px-ML)/v.s, v.y0+(VBH-MB-pz)/v.s];}
function evtVB(e){const r=cv.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX),cy=(e.touches?e.touches[0].clientY:e.clientY);return [(cx-r.left)/r.width*VBW,(cy-r.top)/r.height*VBH];}

function itemRect(it){
  const w=it.rot%180===0?it.w:it.d, d=it.rot%180===0?it.d:it.w;
  return {x0:it.x, z0:it.z, x1:it.x+w, z1:it.z+d, w, d};
}
function hitRect(it){
  const r=itemRect(it);
  const minSpan=0.45;
  let x0=r.x0, x1=r.x1, z0=r.z0, z1=r.z1;
  if(x1-x0 < minSpan){ const m=(x0+x1)/2; x0=m-minSpan/2; x1=m+minSpan/2; }
  if(z1-z0 < minSpan){ const m=(z0+z1)/2; z0=m-minSpan/2; z1=m+minSpan/2; }
  if(isWallItem(it)){ x0-=0.08; x1+=0.08; z0-=0.08; z1+=0.08; }
  return {x0, z0, x1, z1};
}
function overlaps(a,b){
  const A=itemRect(a),B=itemRect(b);
  return A.x0<B.x1-0.01&&A.x1>B.x0+0.01&&A.z0<B.z1-0.01&&A.z1>B.z0+0.01;
}
function insideRoom(it){
  if(isWallItem(it)) return true;
  const R=room(), r=itemRect(it);
  return r.x0>=-0.01&&r.z0>=-0.01&&r.x1<=R.L+0.01&&r.z1<=R.W+0.01;
}
function clearanceOK(it){
  const R=room(), r=itemRect(it), pas=R.pas;
  // distancia a paredes
  const toWall=Math.min(r.x0, r.z0, R.L-r.x1, R.W-r.z1);
  // a otros equipos
  let toEq=1e9;
  for(const o of S.items){if(o.id===it.id)continue;const b=itemRect(o);
    const dx=Math.max(0, Math.max(b.x0-r.x1, r.x0-b.x1));
    const dz=Math.max(0, Math.max(b.z0-r.z1, r.z0-b.z1));
    if(dx===0&&dz===0) toEq=0;
    else if(dx===0) toEq=Math.min(toEq,dz);
    else if(dz===0) toEq=Math.min(toEq,dx);
  }
  return {toWall, toEq, okWall:toWall>=pas-0.02||toWall<0, okEq:toEq>=pas-0.02||toEq>1e8};
}
