</script>
<script type="text/html" id="src-aisl">
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordinación de aislamiento</title>
<style>
  :root{--bg:#eef1f6;--panel:#fff;--panel2:#f4f7fb;--ink:#12233d;--mut:#5a6b85;--line:#dbe3ee;--blue:#123a63;--blue2:#1f5fd0;--amber:#c07d00;--green:#0f9d63;
    --font:"Times New Roman",Times,serif}
  *{box-sizing:border-box}body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13px}
  h1,h2,h3{font-weight:700;font-style:normal} .sub,.desc,.hint,label{font-weight:700;font-style:italic}
  .wrap{max-width:980px;margin:0 auto;padding:16px 14px 48px}
  header.top{background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff;padding:14px 18px;border-radius:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header.top h1{margin:0;font-size:16px} header.top .sub{font-size:11px;opacity:.92;margin-top:2px}
  .sp{flex:1}.htbtn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;font-family:var(--font)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
  .card h2{margin:0 0 8px;font-size:14px;color:var(--blue)}
  .desc{font-size:12px;color:var(--mut);margin-bottom:10px;line-height:1.5}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .f label{display:block;font-size:11px;margin-bottom:4px}
  .f input,.f select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-family:var(--font);font-size:13px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  th{text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);font-size:10px;text-transform:uppercase;color:var(--mut)}
  td{padding:6px 8px;border-bottom:1px solid var(--line)}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  table.t3 th{background:#e8eef6;color:var(--blue);text-transform:none;font-size:11px}
  table.t3 td{font-size:12px}
  tr.hl td{background:#eef6ff;font-weight:700}
  .memo{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;line-height:1.55;font-size:12.5px;white-space:pre-wrap}
  .ok{color:var(--green);font-weight:700}.warn{color:var(--amber);font-weight:700}
  .norm{margin-top:10px;font-size:11.5px;background:#fff6e2;border-left:3px solid #f0c257;padding:8px 10px;line-height:1.45}
  .chk{display:flex;align-items:center;gap:8px;padding:4px 0;font-style:normal;font-weight:600}
  .chk input{width:16px;height:16px}
  @media print{.htbtn{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Coordinación de aislamiento eléctrico</h1>
      <div class="sub">Tabla E.3 (BIL por categoría) · RETIE Cap. 13 · NTC 2050 Secc. 110 · NTC 4552-1</div>
    </div>
    <div class="sp"></div>
    <button class="htbtn" type="button" id="btnSync">↻ Leer proyecto / trafo</button>
    <button class="htbtn" type="button" onclick="window.print()">🖨 Imprimir</button>
  </header>

  <section class="card">
    <h2>Datos del sistema (selección)</h2>
    <div class="desc">El BIL <b>no es fijo</b>: depende de la tensión de operación y de la categoría del equipo (Tabla E.3). Elija la tensión de la instalación y los equipos que aplican.</div>
    <div class="grid">
      <div class="f"><label>Tensión de operación BT (sistema)</label>
        <select id="vBT">
          <option value="208">120/208 V (trifásico)</option>
          <option value="220" selected>127/220 V</option>
          <option value="240">120/240 V</option>
          <option value="480">277/480 V</option>
        </select>
      </div>
      <div class="f"><label>Rango Tabla E.3</label>
        <select id="rango">
          <option value="low">120–240 / 120/208 V</option>
          <option value="high">254/440 · 277/480 V</option>
        </select>
      </div>
      <div class="f"><label>Tensión nominal MT (kV)</label>
        <select id="vMT"><option value="13.2" selected>13,2</option><option value="11.4">11,4</option><option value="34.5">34,5</option><option value="7.6">7,62</option></select>
      </div>
      <div class="f"><label>Transformador (kVA)</label><input id="kva" type="number" step="0.1" value="112.5"></div>
      <div class="f"><label>Tipo subestación</label>
        <select id="tipoSE"><option>Poste</option><option>Pedestal</option><option>Piso / local</option><option>Interior</option></select>
      </div>
      <div class="f"><label>Altitud (m s.n.m.)</label><input id="alt" type="number" value="1000"></div>
    </div>
  </section>

  <section class="card">
    <h2>Tabla E.3 — Tensión al impulso que deben soportar los equipos (BIL)</h2>
    <div class="desc">Valores de referencia según nivel de tensión de operación y categoría del equipo (memoria de cálculo / coordinación de aislamiento). La fila del rango seleccionado se resalta.</div>
    <table class="t3">
      <thead>
        <tr>
          <th rowspan="2">Nivel de tensión de operación de los equipos (V)</th>
          <th colspan="4" class="n" style="text-align:center">BIL requerido (kV)</th>
        </tr>
        <tr>
          <th class="n">Contadores<br><span style="font-weight:600">Categoría IV</span></th>
          <th class="n">Tableros, interruptores, cables, etc.<br><span style="font-weight:600">Categoría III</span></th>
          <th class="n">Electrodomésticos, herramientas portátiles<br><span style="font-weight:600">Categoría II</span></th>
          <th class="n">Equipo electrónico<br><span style="font-weight:600">Categoría I</span></th>
        </tr>
      </thead>
      <tbody>
        <tr id="rowLow"><td>120 – 240 ; 120/208</td><td class="n">4</td><td class="n">2,5</td><td class="n">1,5</td><td class="n">0,8</td></tr>
        <tr id="rowHigh"><td>254/440 ; 277/480</td><td class="n">6</td><td class="n">4</td><td class="n">2,5</td><td class="n">1,5</td></tr>
      </tbody>
    </table>
    <div class="norm"><b>Categorías de sobretensión (resumen):</b> <b>IV</b> origen de la instalación / acometida · <b>III</b> distribución y tableros · <b>II</b> cargas · <b>I</b> electrónica sensible (tras DPS / coordinación).</div>
  </section>

  <section class="card">
    <h2>Equipos en la instalación (como en memoria de cálculo)</h2>
    <div class="desc">Marque lo que aplica. La tensión y el BIL se asignan según la Tabla E.3 y el rango de tensión elegido.</div>
    <div id="eqList"></div>
    <table class="t3" style="margin-top:12px" id="eqTable">
      <thead>
        <tr>
          <th>Descripción de equipos en la instalación</th>
          <th>Aplica</th>
          <th>No aplica</th>
          <th class="n">Tensión de operación (V)</th>
          <th>Categoría</th>
          <th class="n">BIL (kV)</th>
        </tr>
      </thead>
      <tbody id="eqBody"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>Tabla A — Niveles de aislamiento en MT (referencia)</h2>
    <table class="t3">
      <thead><tr><th>Tensión nominal del sistema (kV)</th><th class="n">Tensión máxima equipo (kV)</th><th class="n">BIL típico (kV cresta)</th><th class="n">Tensión soportada a freq. industrial (kV)</th></tr></thead>
      <tbody>
        <tr><td>7,62 / 13,2</td><td class="n">15</td><td class="n">95</td><td class="n">34</td></tr>
        <tr><td>13,2 / 13,8</td><td class="n">15</td><td class="n">95</td><td class="n">34</td></tr>
        <tr><td>34,5</td><td class="n">36</td><td class="n">150 / 170</td><td class="n">70</td></tr>
      </tbody>
    </table>
  </section>

  <section class="card">
    <h2>Tabla B — Distancias de aislamiento en aire (orientativas, ≤ 1000 m)</h2>
    <table class="t3">
      <thead><tr><th>Tensión nominal (kV)</th><th class="n">Fase–fase (mm)</th><th class="n">Fase–tierra (mm)</th><th>Trabajo / aproximación</th></tr></thead>
      <tbody>
        <tr><td>≤ 1 (BT)</td><td class="n">—</td><td class="n">—</td><td>NTC 2050 Art. 110-26</td></tr>
        <tr><td>13,2 / 15</td><td class="n">160</td><td class="n">150</td><td>≥ 700 mm acceso</td></tr>
        <tr><td>34,5</td><td class="n">320</td><td class="n">300</td><td>≥ 1000 mm</td></tr>
      </tbody>
    </table>
  </section>

  <section class="card">
    <h2>Tabla C — Espacios de trabajo BT (NTC 2050 Art. 110-26)</h2>
    <table class="t3">
      <thead><tr><th>Tensión a tierra</th><th class="n">Condición 1 (mm)</th><th class="n">Condición 2 (mm)</th><th class="n">Condición 3 (mm)</th></tr></thead>
      <tbody>
        <tr><td>0–150 V</td><td class="n">900</td><td class="n">900</td><td class="n">900</td></tr>
        <tr><td>151–600 V</td><td class="n">900</td><td class="n">1000</td><td class="n">1200</td></tr>
      </tbody>
    </table>
  </section>

  <section class="card">
    <h2>Verificación del proyecto</h2>
    <div id="verif"></div>
  </section>

  <section class="card">
    <h2>Memoria descriptiva (texto para informe)</h2>
    <div class="memo" id="memo"></div>
  </section>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const es=(x,d=1)=>Number(x).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});

/** Tabla E.3 — BIL (kV) por rango y categoría */
const E3 = {
  low:  { IV:4,   III:2.5, II:1.5, I:0.8 },
  high: { IV:6,   III:4,   II:2.5, I:1.5 }
};
const EQS = [
  {id:'cont',  name:'CONTADORES',              cat:'IV',  vLow:208, vHigh:480},
  {id:'tab',   name:'TABLEROS DE DISTRIBUCIÓN', cat:'III', vLow:208, vHigh:480},
  {id:'prot',  name:'PROTECCIONES EN BT',       cat:'III', vLow:208, vHigh:480},
  {id:'cable', name:'CONDUCTORES (CABLES)',     cat:'III', vLow:208, vHigh:480},
  {id:'elec',  name:'ELECTRODOMÉSTICOS',        cat:'II',  vLow:120, vHigh:120},
  {id:'herr',  name:'HERRAMIENTAS PORTÁTILES',  cat:'II',  vLow:120, vHigh:120},
  {id:'elect', name:'EQUIPOS ELECTRÓNICOS',     cat:'I',   vLow:120, vHigh:120}
];
const apply = {};
EQS.forEach(e=>apply[e.id]=true);

function bilMT(v){ const x=parseFloat(v); if(x<=15) return 95; if(x<=36) return 170; return 95; }
function rangoFromVbt(){
  const v=parseFloat($("vBT").value)||220;
  return (v>=254 || v===480) ? 'high' : 'low';
}
function syncRango(){
  $("rango").value = rangoFromVbt();
}

function bilFor(cat){
  const r=$("rango").value||'low';
  return E3[r][cat];
}
function vOp(eq){
  const r=$("rango").value||'low';
  if(eq.cat==='II'||eq.cat==='I') return 120;
  return r==='high' ? (parseFloat($("vBT").value)>=400?480:277) : (parseFloat($("vBT").value)||208);
}

function load(){
  try{
    const dem=JSON.parse(localStorage.getItem('dem_state')||'{}');
    if(dem.kvaTx) $("kva").value=dem.kvaTx;
  }catch(e){}
  try{
    const P=JSON.parse(localStorage.getItem('suite_proyecto')||'{}');
    window._P=P;
  }catch(e){ window._P={}; }
  syncRango();
  render();
}

function render(){
  const r=$("rango").value||'low';
  $("rowLow").classList.toggle('hl', r==='low');
  $("rowHigh").classList.toggle('hl', r==='high');

  let body='';
  EQS.forEach(eq=>{
    const on=!!apply[eq.id];
    const bil=bilFor(eq.cat);
    const vo=vOp(eq);
    body+='<tr class="'+(on?'':'')+'">'
      +'<td>'+eq.name+'</td>'
      +'<td style="text-align:center">'+(on?'X':'')+'</td>'
      +'<td style="text-align:center">'+(on?'':'X')+'</td>'
      +'<td class="n">'+(on?es(vo,0):'—')+'</td>'
      +'<td style="text-align:center">'+eq.cat+'</td>'
      +'<td class="n">'+(on?String(bil).replace('.',','):'—')+'</td>'
      +'</tr>';
  });
  $("eqBody").innerHTML=body;

  // checkboxes
  let chk='';
  EQS.forEach(eq=>{
    chk+='<label class="chk"><input type="checkbox" data-eq="'+eq.id+'" '+(apply[eq.id]?'checked':'')+'> '+eq.name+' (Cat. '+eq.cat+')</label>';
  });
  $("eqList").innerHTML=chk;
  $("eqList").querySelectorAll('input').forEach(inp=>{
    inp.onchange=()=>{ apply[inp.dataset.eq]=inp.checked; render(); };
  });

  const vMT=parseFloat($("vMT").value)||13.2;
  const vBT=parseFloat($("vBT").value)||220;
  const kva=parseFloat($("kva").value)||0;
  const alt=parseFloat($("alt").value)||0;
  const tipo=$("tipoSE").value;
  const bilM=bilMT(vMT);
  const P=window._P||{};
  const nombre=P.projName||'el presente proyecto';
  const cliente=P.client||'';

  const rows=EQS.filter(e=>apply[e.id]).map(e=>{
    return e.name+': Cat. '+e.cat+', BIL '+String(bilFor(e.cat)).replace('.',',')+' kV';
  });

  $("verif").innerHTML=
    '<table><thead><tr><th>Verificación</th><th>Resultado</th></tr></thead><tbody>'
    +'<tr><td>Rango Tabla E.3</td><td class="ok">'+(r==='low'?'120–240 / 120/208 V':'254/440 · 277/480 V')+'</td></tr>'
    +'<tr><td>BIL Cat. IV (contadores / origen)</td><td class="ok">'+String(E3[r].IV).replace('.',',')+' kV</td></tr>'
    +'<tr><td>BIL Cat. III (tableros / protecciones / cables)</td><td class="ok">'+String(E3[r].III).replace('.',',')+' kV</td></tr>'
    +'<tr><td>BIL Cat. II (cargas)</td><td class="ok">'+String(E3[r].II).replace('.',',')+' kV</td></tr>'
    +'<tr><td>BIL Cat. I (electrónica)</td><td class="ok">'+String(E3[r].I).replace('.',',')+' kV</td></tr>'
    +'<tr><td>BIL MT (trafo / SE '+es(vMT,1)+' kV)</td><td class="ok">'+es(bilM,0)+' kV cresta (referencia)</td></tr>'
    +'<tr><td>Espacios de trabajo BT</td><td class="ok">Art. 110-26 (≥ 900 mm según tensión a tierra)</td></tr>'
    +'<tr><td>Altitud</td><td>'+es(alt,0)+' m'+(alt>1000?' — evaluar corrección de distancias':'')+'</td></tr>'
    +'</tbody></table>';

  $("memo").textContent=
'De acuerdo con el Anexo E de la NTC 4552-1, el aislamiento se define como la separación de dos o más superficies conductoras mediante un material dieléctrico (incluyendo el aire), con el propósito de ofrecer una alta resistencia al paso de la corriente eléctrica y garantizar la seguridad de las personas y de la instalación.\n\n'
+'Para '+nombre+', la coordinación de aislamiento se realizó considerando el sistema de distribución en '+es(vMT,1)+' kV, la subestación tipo '+tipo.toLowerCase()+' con transformador trifásico de '+es(kva,1)+' kVA y las redes de baja tensión asociadas ('+es(vBT,0)+' V)'
+(cliente? ', a cargo de '+cliente : '')+'.\n\n'
+'La verificación de la tensión al impulso (BIL) de los equipos en BT se efectuó conforme a la Tabla E.3 (tensión al impulso que deben soportar los equipos), según el nivel de tensión de operación y la categoría de sobretensión:\n'
+rows.map(x=>'• '+x).join('\n')+'\n\n'
+'La verificación se complementó con el Capítulo 13 del RETIE 2024, la Sección 110 de la NTC 2050 y los criterios de la NTC 4552-1, comprobando niveles de aislamiento adecuados para la tensión nominal, sobretensiones temporales y de origen atmosférico o de maniobra. En MT se adoptó BIL de referencia '+es(bilM,0)+' kV para el nivel '+es(vMT,1)+' kV.\n\n'
+'Adicionalmente, se verificó que los equipos dispongan de envolventes apropiados y grados de protección requeridos, garantizando distancias de aislamiento en aire, distancias de fuga y condiciones de seguridad de la reglamentación vigente. Los detalles constructivos y las especificaciones técnicas se presentan en los planos del proyecto y en las fichas técnicas de los equipos.';

  try{
    localStorage.setItem('aisl_state', JSON.stringify({
      vMT,vBT,kva,alt,tipo,rango:r, bil:E3[r], bilMT:bilM,
      equipos: EQS.filter(e=>apply[e.id]).map(e=>({name:e.name,cat:e.cat,bil:bilFor(e.cat),v:vOp(e)}))
    }));
  }catch(e){}
}

$("vBT").addEventListener('change',()=>{ syncRango(); render(); });
$("rango").addEventListener('change', render);
['vMT','kva','alt','tipoSE'].forEach(id=>{
  $(id).addEventListener('change', render);
  $(id).addEventListener('input', render);
});
$("btnSync").onclick=load;
load();
})();
@@CLOSE_SCRIPT@@
</body>
</html>

</script>
<script type="text/html" id="src-dem">
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demanda y selección de transformador · NTC 2050 / EMCALI</title>

<style>
  :root{--bg:#eef1f6;--panel:#fff;--panel2:#f4f7fb;--ink:#12233d;--mut:#5a6b85;--faint:#8a97ac;
    --line:#dbe3ee;--blue:#123a63;--blue2:#1f5fd0;--amber:#c07d00;--amberbg:#fff6e2;--amberln:#f0c257;
    --green:#0f9d63;--greenbg:#e7f7ef;--red:#d8434f;--redbg:#fde8ea;
    --mono:ui-monospace,Consolas,monospace;--sans:Inter,Segoe UI,system-ui,Arial,sans-serif;
    --sh:0 1px 2px rgba(20,35,61,.06),0 12px 32px -18px rgba(20,35,61,.28)}
  [data-theme="dark"]{--bg:#0b1120;--panel:#111a2c;--panel2:#0c1526;--ink:#e8eefb;--mut:#96a3ba;--faint:#5d6b83;
    --line:#22304a;--blue:#8fb4e8;--blue2:#5b90e6;--amber:#f2b530;--amberbg:#2a2410;--amberln:#5c4a13;
    --green:#3ddc97;--greenbg:#0f2a20;--red:#f4626f;--redbg:#3a1518}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
  .wrap{max-width:1100px;margin:0 auto;padding:16px 14px 48px}
  header.top{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff;padding:14px 18px;border-radius:14px;box-shadow:var(--sh)}
  .logo{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:900;font-size:11px}
  header.top h1{margin:0;font-size:16px;font-weight:800}
  header.top .sub{font-size:11px;opacity:.9;margin-top:2px}
  .sp{flex:1}
  .htbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:9px;cursor:pointer;padding:8px 12px;font-weight:700;font-size:12.5px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:16px 18px;margin-top:14px}
  .card h2{margin:0 0 4px;font-size:14px;font-weight:800;color:var(--blue)}
  .card .desc{font-size:11.5px;color:var(--mut);margin-bottom:12px;line-height:1.45}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .f label{display:block;font-size:10px;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase}
  .f input,.f select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:13px;font-weight:600}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer}
  .btn.pri{background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff;border:0}
  table.w{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  table.w th{text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);font-size:10px;text-transform:uppercase;color:var(--mut)}
  table.w td{padding:7px 8px;border-bottom:1px solid var(--line)}
  table.w td.n{text-align:right;font-family:var(--mono);font-weight:700}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
  .kpi .box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .kpi .box .n{font-size:20px;font-weight:800;font-family:var(--mono)}
  .kpi .box .l{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;margin-top:2px}
  .ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
  .res{border-radius:10px;padding:12px 14px;margin-top:10px;font-size:12.5px;line-height:1.55}
  .res.ok{background:var(--greenbg);color:var(--green)}.res.warn{background:var(--amberbg);color:var(--amber)}.res.bad{background:var(--redbg);color:var(--red)}
  .res b{color:var(--ink)}
  .disc{margin-top:14px;font-size:11px;color:var(--mut);background:var(--amberbg);border-left:3px solid var(--amberln);border-radius:0 8px 8px 0;padding:10px 12px;line-height:1.5}
  .foot{text-align:center;font-size:10.5px;color:var(--faint);margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">D+T</div>
    <div>
      <h1>Demanda y selección de transformador</h1>
      <div class="sub">NTC 2050 Art. 220 · EMCALI DF 2020 Cap. 5 · Tabla 15 · Z% NTC 818</div>
    </div>
    <div class="sp"></div>
    <button class="htbtn" type="button" id="btnSync">↻ Leer cuadros de carga</button>
    <button class="htbtn" type="button" onclick="window.print()">PDF</button>
    <button class="htbtn" type="button" id="themeBtn">🌙</button>
  </header>

  <section class="card">
    <h2>1. Carga desde cuadros de carga</h2>
    <div class="desc"><b>Paso 2 del flujo.</b> Suma y diversifica la carga de los tableros del <b>Paso 1 (Cuadros de carga)</b>. Con D<sub>MAX</sub> se selecciona el transformador (Tabla 15). Ajuste factor de demanda y carga adicional si aplica.</div>
    <div class="grid">
      <div class="f"><label>Factor de demanda global</label>
        <input id="fd" type="number" step="0.01" min="0.1" max="1" value="0.85">
      </div>
      <div class="f"><label>Factor de potencia de demanda</label>
        <input id="fp" type="number" step="0.01" min="0.5" max="1" value="0.90">
      </div>
      <div class="f"><label>Carga adicional (kVA)</label>
        <input id="addKva" type="number" step="0.1" min="0" value="0">
      </div>
      <div class="f"><label>Tipo de transformador</label>
        <select id="tipo" onchange="render()">
          <option value="3">Trifásico</option>
          <option value="1">Monofásico</option>
        </select>
      </div>
      <div class="f"><label>Sector</label>
        <select id="sector" onchange="render()">
          <option value="urb">Urbano</option>
          <option value="rur">Rural</option>
        </select>
      </div>
      <div class="f"><label>Montaje</label>
        <select id="montajeTipo" onchange="render()">
          <option value="poste">Poste (red aérea)</option>
          <option value="piso">Subestación sobre piso</option>
          <option value="pedestal">Pedestal / jardín</option>
          <option value="seco">Seco (interior)</option>
        </select>
      </div>
      <div class="f"><label>Serie AT</label>
        <select id="serieAT" onchange="render()">
          <option value="15">≤ 15 kV (13,2 kV)</option>
          <option value="34">15–34,5 kV</option>
        </select>
      </div>
      <div class="f"><label>Urbanización abierta</label>
        <select id="urbOpen" onchange="render()">
          <option value="0">No</option>
          <option value="1">Sí · límite ≤70 %</option>
        </select>
      </div>
    </div>
    <div class="scroll" style="overflow-x:auto"><table class="w" id="tbl"></table></div>
    <div class="kpi" id="kpiCarga"></div>
  </section>

  <section class="card">
    <h2>2. Demanda máxima D<sub>MAX</sub></h2>
    <div class="desc">D<sub>MAX</sub> = (Σ kVA conectados × factor de demanda) + carga adicional. Validación frente a la suma de cuadros.</div>
    <div class="kpi" id="kpiDem"></div>
    <div id="valCC" class="res"></div>
  </section>

  <section class="card">
    <h2>3. Selección de transformador (Tabla 15 · DF 2020)</h2>
    <div class="desc">Capacidad inmediatamente superior a D<sub>MAX</sub> (EMCALI DF 2020 Cap. 5). Máx. residencial 630 kVA. Conexión: <b>DYn5</b> (3φ) / <b>Ii0</b> (1φ), neutro a tierra. Cargabilidad eficiente Tablas 16/17; urbanización abierta ≤70&nbsp;%.</div>
    <div class="kpi" id="kpiTx"></div>
    <div id="txDetail" class="res"></div>
    <div class="desc" style="margin-top:12px"><b>Montaje orientativo (EMCALI / RETIE):</b></div>
    <div id="montaje" class="res"></div>
  </section>

  
  <section class="card">
    <h2>4. Datos eléctricos del transformador (NTC 818 / DF 2020)</h2>
    <div class="desc">Impedancia de cortocircuito U<sub>z</sub> % y corriente de vacío I<sub>o</sub> % (Tablas 2 y 3). Alimentan cortocircuito y protecciones.</div>
    <div class="kpi" id="kpiZ"></div>
    <div id="zDetail" class="res"></div>
  </section>

  <section class="card">
    <h2>5. Cargabilidad eficiente y notas DF 2020</h2>
    <div id="cargaEff" class="res"></div>
  </section>

<div class="disc">Asistencia técnica. D<sub>MAX</sub> y Tabla 15 son orientativos según EMCALI DF-2020 Cap. 5 y NTC 2050 Art. 220. Factores de demanda reales dependen del tipo de ocupación. No sustituye memoria firmada ni criterios del operador de red.</div>
  <div class="foot">Demanda + transformador · Cuadros de carga · NTC 2050 / EMCALI</div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const es=(x,d=2)=>Number(x).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});

/* Tabla 15 EMCALI — selección transformadores particulares */
const TAB15=[
  {max:10, mono:10, tri:30},
  {max:15, mono:15, tri:30},
  {max:25, mono:25, tri:30},
  {max:30, mono:37.5, tri:30},
  {max:37.5, mono:37.5, tri:45},
  {max:45, mono:50, tri:45},
  {max:50, mono:50, tri:75},
  {max:75, mono:75, tri:75},
  {max:112.5, mono:null, tri:112.5},
  {max:150, mono:null, tri:150},
  {max:225, mono:null, tri:225},
  {max:300, mono:null, tri:300},
  {max:400, mono:null, tri:400},
  {max:500, mono:null, tri:500},
  {max:630, mono:null, tri:630},
  {max:800, mono:null, tri:800},
  {max:1000, mono:null, tri:1000},
  {max:1250, mono:null, tri:1250},
  {max:1600, mono:null, tri:1600},
  {max:2000, mono:null, tri:2000}
];
const STD_TRI=[15,30,45,75,112.5,150,225,300,400,500,630,800,1000,1250,1600,2000,2500];
const STD_MONO=[5,10,15,25,37.5,50,75,100,167];
const Z_MONO={5:{io15:2.5,uz15:3.0,io34:null,uz34:null},10:{io15:2.5,uz15:3.0,io34:null,uz34:null},15:{io15:2.4,uz15:3.0,io34:null,uz34:null},25:{io15:2.0,uz15:3.0,io34:2.4,uz34:4.0},37.5:{io15:2.0,uz15:3.0,io34:2.0,uz34:4.0},50:{io15:1.9,uz15:3.0,io34:2.0,uz34:4.0},75:{io15:1.7,uz15:3.0,io34:1.9,uz34:4.0},100:{io15:1.6,uz15:3.0,io34:1.7,uz34:4.0},167:{io15:1.5,uz15:3.0,io34:1.6,uz34:4.0}};
const Z_TRI={15:{io15:4.4,uz15:3.0,io34:null,uz34:null},30:{io15:3.6,uz15:3.0,io34:null,uz34:null},45:{io15:3.5,uz15:3.0,io34:null,uz34:null},75:{io15:3.0,uz15:3.5,io34:3.5,uz34:6.0},112.5:{io15:2.6,uz15:3.5,io34:2.6,uz34:6.0},150:{io15:2.4,uz15:4.0,io34:2.5,uz34:6.0},225:{io15:2.1,uz15:4.0,io34:2.5,uz34:6.0},300:{io15:2.0,uz15:4.5,io34:2.0,uz34:6.0},400:{io15:1.9,uz15:4.5,io34:2.0,uz34:6.0}};
function zOf(kva, tri, serie34){
  const tab=tri?Z_TRI:Z_MONO;
  let best=null, bd=1e9;
  Object.keys(tab).forEach(k=>{ const d=Math.abs(parseFloat(k)-kva); if(d<bd){bd=d; best=tab[k];} });
  if(!best) return {io:3, uz:4};
  if(serie34) return {io:best.io34!=null?best.io34:best.io15, uz:best.uz34!=null?best.uz34:best.uz15};
  return {io:best.io15, uz:best.uz15};
}

function pickTx(dmax, tri){
  for(const r of TAB15){
    if(dmax<=r.max){
      const k=tri?r.tri:r.mono;
      if(k!=null) return k;
    }
  }
  // inmediatamente superior en lista estándar
  const list=tri?STD_TRI:STD_MONO;
  for(const k of list){ if(k>=dmax) return k; }
  return list[list.length-1];
}

function voltOf(v){
  const m={
    '120':120,'120240':240,'208':208,'220':220,'220127':220,'240':240,'380':380,'440':440,'480':480
  };
  return m[v]||208;
}

function boardKva(b){
  let Sva=0;
  (b.rows||[]).forEach(r=>{
    const P=(Number(r.P)||0)*(Number(r.nInst)||1);
    const fp=Number(r.fp)||1;
    Sva += P/fp;
  });
  const qty=Math.max(1, Number(b.qty)||1);
  return (Sva/1000)*qty;
}

let boards=[];

function loadCC(){
  try{
    const j=JSON.parse(localStorage.getItem('cc_state3'));
    boards=(j&&j.boards)||[];
  }catch(e){ boards=[]; }
  render();
}

function render(){
  const fd=parseFloat($("fd").value)||0.85;
  const fp=parseFloat($("fp").value)||0.90;
  const add=parseFloat($("addKva").value)||0;
  const tri=$("tipo").value==='3';

  let html='<thead><tr><th>Tablero</th><th class="n">Cant.</th><th class="n">kVA conectados</th><th class="n">Sistema</th><th class="n">V</th></tr></thead><tbody>';
  let sumConn=0;
  if(!boards.length){
    html+='<tr><td colspan="5" style="text-align:center;color:var(--mut)">No hay cuadros de carga. Diseñe en el módulo 5 y pulse «Leer cuadros de carga».</td></tr>';
  } else {
    boards.forEach((b,i)=>{
      const kva=boardKva(b);
      sumConn+=kva;
      const sys=b.sys===1?'1φ':b.sys===2?'2φ':'3φ';
      html+='<tr><td>'+(b.name||('Tablero '+(i+1)))+'</td><td class="n">'+(b.qty||1)+'</td><td class="n">'+es(kva,2)+'</td><td class="n">'+sys+'</td><td class="n">'+es(voltOf(b.v),0)+'</td></tr>';
    });
    html+='<tr style="font-weight:800;background:var(--amberbg)"><td>TOTAL conectado</td><td></td><td class="n">'+es(sumConn,2)+'</td><td colspan="2"></td></tr>';
  }
  html+='</tbody>';
  $("tbl").innerHTML=html;

  const dmax = sumConn*fd + add;
  $("kpiCarga").innerHTML=
    '<div class="box"><div class="n">'+es(sumConn,1)+'</div><div class="l">kVA conectados</div></div>'+
    '<div class="box"><div class="n">'+es(fd,2)+'</div><div class="l">Factor demanda</div></div>'+
    '<div class="box"><div class="n">'+es(add,1)+'</div><div class="l">Adicional kVA</div></div>';

  $("kpiDem").innerHTML=
    '<div class="box"><div class="n" style="color:var(--blue2)">'+es(dmax,2)+'</div><div class="l">D<sub>MAX</sub> kVA</div></div>'+
    '<div class="box"><div class="n">'+es(dmax*fp,2)+'</div><div class="l">kW @ FP demanda</div></div>';

  if(!boards.length){
    $("valCC").className='res warn';
    $("valCC").innerHTML='<b>Sin datos de cuadros de carga.</b> La demanda solo refleja carga adicional manual.';
  } else {
    $("valCC").className='res ok';
    $("valCC").innerHTML='<b>Validado con cuadros de carga:</b> '+boards.length+' tablero(s), Σ conectada '+es(sumConn,2)+' kVA → D<sub>MAX</sub> = '+es(sumConn,2)+' × '+es(fd,2)+' + '+es(add,1)+' = <b>'+es(dmax,2)+' kVA</b>.';
  }

  const kvaTx = pickTx(dmax, tri);
  const loadPct = kvaTx>0 ? (dmax/kvaTx*100) : 0;
  const sector = ($("sector")&&$("sector").value)||'urb';
  const montajeTipo = ($("montajeTipo")&&$("montajeTipo").value)||'poste';
  const serie34 = ($("serieAT")&&$("serieAT").value)==='34';
  const urbOpen = ($("urbOpen")&&$("urbOpen").value)==='1';
  let cls='ok', msg='';
  if(loadPct>100){ cls='bad'; msg='D<sub>MAX</sub> supera la capacidad elegida; subir al siguiente comercial.'; }
  else if(urbOpen && loadPct>70){ cls='warn'; msg='Urbanización abierta: cargabilidad &gt;70 % (num. 6.9.1 DF 2020). Considere el siguiente calibre comercial.'; }
  else if(loadPct>90){ cls='warn'; msg='Cargabilidad alta (&gt;90 %). Revisar margen y posible ampliación.'; }
  else if(loadPct<40 && dmax>0){ cls='warn'; msg='Cargabilidad baja (&lt;40 %). Puede sobredimensionar pérdidas en vacío (criterio eficiencia EMCALI).'; }
  else { cls='ok'; msg='Cargabilidad dentro de rango habitual de diseño.'; }

  $("kpiTx").innerHTML=
    '<div class="box"><div class="n" style="color:var(--blue2)">'+es(kvaTx,1)+'</div><div class="l">kVA transformador</div></div>'+
    '<div class="box"><div class="n '+(loadPct>100?'bad':(urbOpen&&loadPct>70)||loadPct>90?'warn':'ok')+'">'+es(loadPct,0)+'%</div><div class="l">Cargabilidad</div></div>'+
    '<div class="box"><div class="n">'+(tri?'3φ':'1φ')+'</div><div class="l">Tipo</div></div>'+
    '<div class="box"><div class="n">'+(tri?'DYn5':'Ii0')+'</div><div class="l">Grupo conexión</div></div>';

  $("txDetail").className='res '+cls;
  $("txDetail").innerHTML='<b>Seleccionado:</b> '+es(kvaTx,1)+' kVA '+(tri?'trifásico':'monofásico')+
    ' (Tabla 15 DF 2020 / inmediatamente superior a D<sub>MAX</sub> = '+es(dmax,2)+' kVA).<br>'+msg+
    '<br><span style="font-size:11px;opacity:.85">Grupo de conexión: '+(tri?'<b>DYn5</b>':'<b>Ii0</b>')+' · neutro sólidamente a tierra · DF 2020 §6.1 · RETIE.</span>';

  let mont='';
  if(montajeTipo==='poste'){
    if(kvaTx<=112.5) mont='<b>Poste:</b> potencias ≤112,5 kVA habituales. Verificar peso, RETIE Art. 24.3 y Anexo postes (Canalizaciones).';
    else if(kvaTx<=150) mont='<b>Poste / H:</b> hasta ~150 kVA según peso. EMCALI exige apoyos de mayor rotura si hay trafo + equipos (p. ej. 14×1050 / 16×1050).';
    else mont='<b>Poste no recomendado</b> para '+es(kvaTx,1)+' kVA. Preferir piso o pedestal.';
  } else if(montajeTipo==='pedestal'){
    mont='<b>Pedestal / jardín:</b> verificar Tabla 11/14 DF 2020 (fusibles, conectores premoldeados). Protección y cercado según RETIE.';
  } else if(montajeTipo==='seco'){
    mont='<b>Seco:</b> interior / celda. ≥112,5 kVA: bóveda o requisitos RISE / NTC 2050. No aplicar foso de aceite.';
  } else {
    mont='<b>Subestación sobre piso:</b> aceite mineral → foso/sumidero ≥100 % del volumen del líquido (típico ≥112,5 kVA). Accesos, ventilación y DPS según DF 2020 §6.5 y §6.11.';
  }
  $("montaje").className='res ok';
  $("montaje").innerHTML=mont;

  const zv=zOf(kvaTx, tri, serie34);
  if($("kpiZ")){
    $("kpiZ").innerHTML=
      '<div class="box"><div class="n">'+es(zv.uz,1)+' %</div><div class="l">U<sub>z</sub> (Z%)</div></div>'+
      '<div class="box"><div class="n">'+es(zv.io,1)+' %</div><div class="l">I<sub>o</sub> vacío</div></div>'+
      '<div class="box"><div class="n">'+(serie34?'15–34,5':'≤15')+' kV</div><div class="l">Serie AT</div></div>';
    $("zDetail").className='res ok';
    $("zDetail").innerHTML='Valores orientativos NTC 818 / Tablas 2–3 DF 2020 para aceite. Usar en cálculo de I<sub>cc</sub> del secundario: I<sub>cc</sub> ≈ I<sub>n</sub> / (U<sub>z</sub>/100). Confirmar placa del fabricante.';
  }
  if($("cargaEff")){
    let ce='<b>Cargabilidad actual:</b> '+es(loadPct,1)+' % de '+es(kvaTx,1)+' kVA · sector <b>'+(sector==='urb'?'urbano':'rural')+'</b>.';
    ce+='<br>Tablas 16/17 DF 2020: rango eficiente típico ~65–120 % según capacidad (evitar extremos de vacío o sobrecarga prolongada).';
    if(urbOpen) ce+='<br><b>Urbanización abierta / ampliación 2.º–3.er piso:</b> no superar <b>70 %</b> de cargabilidad (num. 6.9.1).';
    ce+='<br><b>Potencias normalizadas EMCALI (Tabla 10):</b> mono 15–75 kVA · tri 45–150 kVA en redes de uso general 13,2 kV; particulares según demanda.';
    ce+='<br><b>Protecciones:</b> cortacircuitos MT, fusibles dual, termomagnético BT y DPS según §6.10–6.11 (coordinar con módulo Cortocircuito).';
    $("cargaEff").className='res ok';
    $("cargaEff").innerHTML=ce;
  }

  try{
localStorage.setItem('dem_state',JSON.stringify({fd,fp,add,tipo:$("tipo").value,dmax,kvaTx,sector:($("sector")&&$("sector").value)||'urb',montaje:($("montajeTipo")&&$("montajeTipo").value)||'poste',serieAT:($("serieAT")&&$("serieAT").value)||'15',urbOpen:($("urbOpen")&&$("urbOpen").value)||'0',uz:(typeof zv!=='undefined'?zv.uz:null),io:(typeof zv!=='undefined'?zv.io:null)}));}catch(e){}
}

['fd','fp','addKva','tipo','sector','montajeTipo','serieAT','urbOpen'].forEach(id=>{
  const el=$(id); if(!el) return;

<div class="wrap">

  <section class="card">

          <option value="cu">Cobre</option>
          <option value="al">Aluminio</option>
        </select>
      </div>
    </div>

    <h2>Conductores en la tubería</h2>

      <b>1 conductor → 53 %</b> · <b>2 → 31 %</b> · <b>≥3 → 40 %</b> del área interna (valores habituales Cap. 9).</div>
    <div style="margin-bottom:8px">

  <section class="card" id="emcaliSec">
    <h2>Selección de conductores EMCALI · MT / BT (primario y secundario)</h2>
    <div class="desc">Según <b>COND 2020 Cap. Conductores</b> y Cap. 2 Conductores (EMCALI ND-002). Desplegables según tablas normalizadas. Criterios: ampacidad (≥80&nbsp;% I<sub>n</sub> trafo en ramales BT), regulación, cortocircuito y pérdidas. Material preferente en redes de uso general: <b>Aluminio</b> (AAC / AAAC / ACSR); cobre solo donde la norma lo permite.</div>
    <div class="grid" style="margin-bottom:12px">

          <option value="aerea">Aérea</option>
          <option value="subt">Subterránea</option>

      </div>

        <select id="emSys" onchange="emRender()">
          <option value="3u">Trifásico urbano</option>
          <option value="2u">Bifásico urbano</option>
          <option value="3r">Trifásico rural</option>
          <option value="2r">Bifásico rural</option>
        </select>
      </div>
      <div class="f"><label>Capacidad trafo (kVA)</label>
        <select id="emKva" onchange="emRender()"></select>
      </div>

        <select id="emVsec" onchange="emRender()">
          <option value="208">208</option>
          <option value="220" selected>220</option>
          <option value="240">240</option>
          <option value="440">440</option>
        </select>
      </div>
      <div class="f"><label>Tensión primaria MT</label>
        <select id="emVmt" onchange="emRender()">
          <option value="13.2" selected>13,2 kV (Nivel 2)</option>
          <option value="34.5">34,5 kV (Nivel 3)</option>

        <input id="emNram" type="number" min="1" max="6" value="2" onchange="emRender()">
      </div>
      <div class="f"><label>Longitud tramo / vano (m)</label>
        <input id="emLen" type="number" step="1" value="36" onchange="emRender()">
      </div>
      <div class="f"><label>FP de la carga</label>
        <input id="emFp" type="number" step="0.01" min="0.7" max="1" value="0.90" onchange="emRender()">
      </div>
    </div>
    <div id="emResult"></div>
    <div id="emTable" style="margin-top:12px;overflow:auto"></div>
    <div class="rule" style="margin-top:14px">
      <b>Criterios EMCALI COND 2020 · selección de conductores</b><br>
      <b>1. Capacidad de conducción (RETIE / NTC 2050):</b> ampacidad ≥ corriente de diseño; en ramales BT del secundario, el conductor debe soportar al menos el <b>80&nbsp;% de la I<sub>n</sub> del transformador</b>.<br>
      <b>2. Regulación (Tabla 15 COND 2020):</b> BT urbana/rural/AP ≤ <b>3,0&nbsp;%</b>; acometidas BT ≤ <b>2,0&nbsp;%</b>. MT expansión ≤ <b>1&nbsp;%</b> desde barraje SE; acometida MT uso exclusivo ≤ <b>0,03&nbsp;%</b>.<br>
      <b>3. Cortocircuito:</b> soportar I²t hasta el despeje de la protección (tablas fabricante / anexos).<br>
      <b>4. Pérdidas / calibre económico:</b> tras ampacidad y regulación, criterio de pérdidas mínimas (CREG / anexos EMCALI).<br>
      <b>5. Material:</b> redes aéreas de uso general en <b>Aluminio</b> (AAC preensamblado BT; ACSR / semiaislado MT). Cobre no recomendado en redes de uso general.<br>
      <b>6. Calibres MT semiaislada (Tabla 4):</b> fases 1/0, 4/0, 266,8, 477 AWG con mensajero 2, 1/0 o 4/0 según fila.<br>
      <b>7. Neutro:</b> mismo calibre de fase o según Art. 250 / tablas de diseño.<br>
      <b>8. Cambio de calibre:</b> 4/0→1/0 solo si ≥2 tramos posteriores; 1/0→4 AWG si ≥3 tramos.<br>
      Referencia: EMCALI COND 2020; Cap. 2 Conductores ND-002; NTC 2050 Art. 310; RETIE.
    </div>
  </section>


  <section class="card" id="polesSec">
    <h2>Redes aéreas desnudas · Postes y estructuras (EMCALI LT 2020)</h2>
    <div class="desc">Selección orientativa de <b>apoyo en concreto (m × kg)</b> según Anexo No.1 y Cap. 3 — Redes de distribución aéreas desnudas MT/BT. Desplegables por zona, conductor MT, tipo de conjunto y condiciones de cruce. Complementa la selección de calibre de la sección anterior.</div>

          <option value="477">#477 kcmil</option>

      </div>
      <div class="f"><label>Tipo de conjunto MT</label>
        <select id="poConj" onchange="poRender()">
          <option value="susp">Suspensión (0°–3° sin retenida · 3°–30° con retenida)</option>
          <option value="ret">Retención sencillo/doble (con retenida · &gt;3°)</option>
          <option value="dterm">Doble terminal (sin retenida · &lt;3°)</option>

      </div>

          <option value="nivel">1 nivel · cercano a cruces</option>
          <option value="2niv">2 niveles · cercano a cruces</option>
        </select>
      </div>
      <div class="f"><label>Altura libre deseada (m) — opcional</label>
        <input id="poH" type="number" step="0.5" min="8" max="18" value="12" onchange="poRender()">
      </div>
      <div class="f"><label>Ángulo de deflexión (°)</label>
        <input id="poAng" type="number" step="0.5" min="0" max="90" value="0" onchange="poRender()">
      </div>
    </div>
    <div id="poResult"></div>
    <div id="poTable" style="margin-top:12px;overflow:auto"></div>
    <div class="rule" style="margin-top:14px">
      <b>Notas técnicas · LT 2020 / Anexo postes</b><br>
      <b>Empotramiento:</b> L<sub>E</sub> = 0,1·H + 0,6 (m), con H = altura total del poste.<br>
      <b>Carga de rotura:</b> se toma a 0,20 m de la punta. Trabajo ≈ rotura/2,5 · Diseño ≈ rotura/1,5 (criterio EMCALI).<br>
      <b>Suspensión:</b> 0°–3° puede ir sin retenida; 3°–30° con retenida. <b>Retención / terminal:</b> retenidas según cargas horizontales (directa a tierra, perfil U, pie de amigo, poste a poste).<br>
      <b>Vanos máximos de planeamiento (Anexo):</b> urbano ~60 m prim/sec; rural ~100 m prim / 50 m sec — verificar flecha, distancias RETIE y terreno.<br>
      <b>BT en el mismo apoyo:</b> típico 4/0 AWG preensamblado + luminaria LED ≤100 W según tabla del anexo.<br>
      <b>Transformador en poste:</b> el anexo exige apoyos de mayor capacidad (p. ej. 14×1050 / 16×1050) cuando hay trafo ≤112,5 o ≤150 kVA y equipos de control.<br>
      Referencia: EMCALI LT 2020 Cap. 3; Anexo No.1 selección de postes; RETIE (empotramiento, distancias, señalización).
    </div>
  </section>


  <div class="rule">
    <b>Notas NTC 2050:</b><br>
    • El % de llenado evita daño al aislar y facilita el jalado. Nipples ≤ 600 mm pueden llegar a 60 %.<br>
    • Conductores de tierra (EGC) y neutros cuentan en el llenado si van en la misma tubería.<br>
    • Art. 250-122: el EGC no debe ser inferior al de la tabla; si los fases se aumentan por ΔV, el EGC puede requerir ajuste proporcional.<br>
    • Áreas de conductor y de tubería son valores típicos de tablas; verifique la edición NTC 2050 / fabricante.
  </div>
  <div class="disc">Herramienta de <b>asistencia</b>. Confirmar tablas oficiales Capítulo 9 y 250-122 de la NTC 2050 vigente y condiciones reales (curvas, rozamiento, temperatura).</div>
  <div class="foot">Canalizaciones · llenado · EGC — Ing. Alexander Espinosa</div>
</div>

  imc:{

      '1/2':132,'3/4':222,'1':364,'1-1/4':622,'1-1/2':848,'2':1398,'2-1/2':1993,'3':3080,'3-1/2':4120,'4':5335

/* Área aproximada mm² conductor THHN/THWN-2 */
const WIRE_AREA={
  '14':8.97,'12':11.68,'10':15.52,'8':23.61,'6':32.71,'4':52.26,'3':62.77,'2':75.16,
  '1':94.84,'1/0':112.9,'2/0':134.2,'3/0':161.3,'4/0':192.9,
  '250':228.0,'300':266.5,'350':304.5,'400':342.6,'500':418.1,'600':495.5,'750':617.4
};

/* EGC mínimo Art 250-122 orientativo (AWG) */
const EGC_CU={15:'14',20:'12',30:'10',40:'10',60:'10',100:'8',200:'6',300:'4',400:'3',500:'2',600:'1',800:'1/0',1000:'2/0',1200:'3/0'};
const EGC_AL={15:'12',20:'10',30:'8',40:'8',60:'8',100:'6',200:'4',300:'2',400:'1',500:'1/0',600:'3/0',800:'4/0',1000:'250',1200:'350'};

function fillLimit(n){
  if(n<=0) return 0;
  if(n===1) return 0.53;
  if(n===2) return 0.31;
  return 0.40;
}

let wires=[{cal:'12',qty:3,role:'fase'},{cal:'12',qty:1,role:'neutro'},{cal:'12',qty:1,role:'tierra'}];
try{const j=JSON.parse(localStorage.getItem('can_wires'));if(j&&j.length)wires=j;}catch(e){}

function save(){
  try{localStorage.setItem('can_wires',JSON.stringify(wires));
    localStorage.setItem('can_cfg',JSON.stringify({tipo:$("tipo").value,size:$("size").value,len:$("len").value,mat:$("mat").value,brk:$("brk").value,egcMat:$("egcMat").value}));
  }catch(e){}
}
function toggleTheme(){
  const d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';
  d.dataset.theme=t;$("themeBtn").textContent=t==='dark'?'☀️':'🌙';
  try{localStorage.setItem('can_theme',t);}catch(e){}
}

function onTipo(){
  const t=$("tipo").value;
  const sizes=Object.keys(CONDUIT[t].sizes);
  const cur=$("size").value;
  $("size").innerHTML=sizes.map(s=>`<option value="${s}">${s}"</option>`).join('');
  if(sizes.includes(cur)) $("size").value=cur;
  else $("size").value=sizes.includes('3/4')?'3/4':sizes[0];
  calc();
}

function addWire(){
  wires.push({cal:'12',qty:1,role:'fase'});
  renderWires();calc();
}
function delWire(i){wires.splice(i,1);renderWires();calc();}

function renderWires(){
  let h='<thead><tr><th>Calibre</th><th>Cantidad</th><th>Función</th><th class="n">Área unit. (mm²)</th><th class="n">Área total (mm²)</th><th></th></tr></thead><tbody>';
  wires.forEach((w,i)=>{
    const a=WIRE_AREA[w.cal]||0;
    h+=`<tr>
      <td><select data-i="${i}" data-k="cal">${Object.keys(WIRE_AREA).map(k=>`<option value="${k}" ${k===w.cal?'selected':''}>${k} AWG/kcmil</option>`).join('')}</select></td>
      <td><input data-i="${i}" data-k="qty" type="number" min="1" step="1" value="${w.qty}" style="width:70px"></td>
      <td><select data-i="${i}" data-k="role">
        <option value="fase" ${w.role==='fase'?'selected':''}>Fase</option>
        <option value="neutro" ${w.role==='neutro'?'selected':''}>Neutro</option>
        <option value="tierra" ${w.role==='tierra'?'selected':''}>Tierra (EGC)</option>
        <option value="otro" ${w.role==='otro'?'selected':''}>Otro</option>
      </select></td>
      <td class="n">${es(a,2)}</td>
      <td class="n">${es(a*(w.qty||0),2)}</td>
      <td><button type="button" class="btn red" style="padding:4px 8px" data-del="${i}">✕</button></td>
    </tr>`;
  });
  h+='</tbody>';
  $("wireTbl").innerHTML=h;
  $("wireTbl").querySelectorAll('input[data-k],select[data-k]').forEach(el=>{
    el.onchange=el.oninput=function(){
      const i=+this.dataset.i,k=this.dataset.k;
      if(k==='qty') wires[i].qty=parseInt(this.value)||0;
      else wires[i][k]=this.value;
      calc();
    };
  });
  $("wireTbl").querySelectorAll('button[data-del]').forEach(b=>{
    b.onclick=function(){delWire(+this.dataset.del);};
  });
}

function calc(){
  const tipo=$("tipo").value;
  const size=$("size").value;
  const areaC=CONDUIT[tipo].sizes[size]||0;
  let nCond=0, areaW=0;
  wires.forEach(w=>{
    const q=parseInt(w.qty)||0;
    nCond+=q;
    areaW+=(WIRE_AREA[w.cal]||0)*q;
  });
  const lim=fillLimit(nCond);
  const maxArea=areaC*lim;
  const pct=areaC>0?(areaW/areaC)*100:0;
  const ok=areaW<=maxArea+0.1;

  // suggest next size if fail
  let suggest='';
  if(!ok){
    const sizes=Object.keys(CONDUIT[tipo].sizes);
    for(const s of sizes){
      const a=CONDUIT[tipo].sizes[s];
      if(areaW<=a*lim){suggest=s;break;}
    }
  }

  $("kpis").innerHTML=`
    <div class="box"><div class="lbl">Área tubería</div><div class="val">${es(areaC,0)}</div><div class="sub">mm² internos</div></div>
    <div class="box"><div class="lbl">Área conductores</div><div class="val">${es(areaW,1)}</div><div class="sub">mm²</div></div>
    <div class="box"><div class="lbl">Llenado</div><div class="val ${ok?'ok':'bad'}">${es(pct,1)}%</div><div class="sub">límite ${es(lim*100,0)}% (${nCond} cond.)</div></div>
    <div class="box"><div class="lbl">Conductores</div><div class="val">${nCond}</div><div class="sub">en el tramo</div></div>`;

  let html='';
  if(nCond===0){
    html='<div class="res warn"><b>Sin conductores.</b> Agrega calibres y cantidades.</div>';
  } else if(ok){
    html=`<div class="res ok"><b>✓ Llenado cumple</b><br>${es(areaW,1)} mm² de ${es(maxArea,1)} mm² permitidos (${es(lim*100,0)} % de ${size}" ${CONDUIT[tipo].label}).</div>`;
  } else {
    html=`<div class="res bad"><b>✗ Excede el llenado permitido</b><br>Usado ${es(pct,1)} % · permitido ${es(lim*100,0)} % (${es(areaW,1)} mm² &gt; ${es(maxArea,1)} mm²).
      ${suggest?`<br>Sugerencia: subir a tubería <b>${suggest}"</b> ${CONDUIT[tipo].label}.`:''}</div>`;
  }
  $("result").innerHTML=html;
  calcEGC();
  save();
}

function calcEGC(){
  const brk=parseInt($("brk").value)||100;
  const mat=$("egcMat").value;
  const table=mat==='al'?EGC_AL:EGC_CU;
  // find ceiling key
  const keys=Object.keys(table).map(Number).sort((a,b)=>a-b);
  let k=keys[keys.length-1];
  for(const x of keys) if(x>=brk){k=x;break;}
  const cal=table[k]||table[100];
  $("egcRes").innerHTML=`<div class="res ok"><b>EGC mínimo sugerido:</b> <span style="font-family:var(--mono);font-size:16px">${cal} ${mat==='al'?'Al':'Cu'}</span>
    &nbsp; para protección de <b>${brk} A</b> (Art. 250-122, tabla orientativa).<br>
    <span style="font-size:11.5px;color:var(--mut)">Si aumentó el calibre de fase por caída de tensión, evalúe aumentar el EGC en la misma proporción.</span></div>`;
}

function emGet(id){return document.getElementById(id);}
function emFillKva(){
  const scope=emGet('emScope').value, inst=emGet('emInst').value, sys=emGet('emSys').value;
  const sel=emGet('emKva');
  let opts=[];
  if(scope==='bt'){
    const tab=inst==='aerea'?EM_BT_AEREA:EM_BT_SUBT;
    const rows=tab[sys]||[];
    opts=rows.map(r=>r.kva);
  } else {
    opts=[15,30,45,75,112.5,150,225,300,400,500,630,750,1000];
  }
  // sync dem
  try{
    const dem=JSON.parse(localStorage.getItem('dem_state')||'{}');
    if(dem&&dem.kvaTx) opts=[...new Set([Number(dem.kvaTx),...opts])].sort((a,b)=>a-b);
  }catch(e){}
  const cur=sel.value;
  sel.innerHTML=opts.map(k=>'<option value="'+k+'">'+k+' kVA</option>').join('');
  if(opts.map(String).indexOf(String(cur))>=0) sel.value=cur;
  else if(opts.length) sel.value=opts[Math.min(2,opts.length-1)];
}
function emInTrafo(kva,vsec,sys){
  const ph=sys.charAt(0)==='2'?2:3;
  const k=ph===3?Math.sqrt(3):1;
  return (kva*1000)/(k*vsec);
}
function emPickBt(){
  const inst=emGet('emInst').value, sys=emGet('emSys').value;
  const kva=parseFloat(emGet('emKva').value)||75;
  const tab=inst==='aerea'?EM_BT_AEREA:EM_BT_SUBT;
  const rows=tab[sys]||[];
  let row=rows.find(r=>Math.abs(r.kva-kva)<0.1);
  if(!row){
    // nearest
    row=rows.slice().sort((a,b)=>Math.abs(a.kva-kva)-Math.abs(b.kva-kva))[0];
  }
  return row;
}
function emMm2(cal){
  const m=String(cal).match(/([\d.]+)\s*\(/);
  return m?parseFloat(m[1]):0;
}
function emRender(){
  if(!emGet('emScope')) return;
  emFillKva();
  const scope=emGet('emScope').value;
  const inst=emGet('emInst').value;
  const sys=emGet('emSys').value;
  const kva=parseFloat(emGet('emKva').value)||75;
  const vsec=parseFloat(emGet('emVsec').value)||220;
  const vmt=parseFloat(emGet('emVmt').value)||13.2;
  const nram=parseInt(emGet('emNram').value)||2;
  const len=parseFloat(emGet('emLen').value)||36;
  const fp=parseFloat(emGet('emFp').value)||0.9;
  const In=emInTrafo(kva,vsec,sys);
  const I80=0.8*In;
  const kvaRam=kva/Math.max(1,nram);
  let html='', tbl='';

  if(scope==='bt'){
    const row=emPickBt();
    const mat=inst==='aerea'?'AAC Aluminio (preensamblado)':'Cobre aislado (USE/RHH/THWN-2)';
    const cal=row?row.cal:'—';
    const mm=emMm2(cal);
    const ampKey=mm?mm.toFixed(2):'';
    const amp=(EM_AMP[ampKey]&&EM_AMP[ampKey][inst])||0;
    const ok80=amp>=I80;
    const limReg=sys.indexOf('r')>=0?3.0:3.0; // COND 2020 Tabla 15

    if(row&&row.cal2&&row.cal2!==row.cal) html+=' · tramo siguiente / rango: <b>'+row.cal2+'</b>';

    html+='<div class="b"><div class="n">'+(inst==='aerea'?'Semiaislado':'XLPE 100%')+'</div><div class="l">Tipo</div></div>';

  }

  emGet('emResult').innerHTML=html;
  emGet('emTable').innerHTML=tbl;
}

function poParse(poste){
  const m=String(poste).match(/(\d+)\s*[x×]\s*(\d+)/i);
  if(!m) return {H:12,R:510};
  return {H:parseInt(m[1],10), R:parseInt(m[2],10)};
}
function poPick(){
  const z=document.getElementById('poZona').value;
  const c=document.getElementById('poCond').value;
  const j=document.getElementById('poConj').value;
  const cruz=document.getElementById('poCruz').value;
  const rows=PO_TAB.filter(r=>r.z===z&&r.c===c&&r.j===j);
  let row=rows.find(r=>r.cruz.indexOf(cruz)>=0);
  if(!row && rows.length) row=rows[0];
  return row;
}
function poRender(){
  const el=document.getElementById('poResult');
  if(!el) return;
  const row=poPick();
  const ang=parseFloat(document.getElementById('poAng').value)||0;
  const zona=document.getElementById('poZona').value;
  const conj=document.getElementById('poConj').value;
  if(!row){
    el.innerHTML='<p>No hay fila de anexo para esa combinación. Revise zona / conductor / conjunto.</p>';
    document.getElementById('poTable').innerHTML='';
    return;
  }
  const p=poParse(row.poste);
  const LE=0.1*p.H+0.6;
  const trabajo=p.R/2.5;
  const diseno=p.R/1.5;
  const vanoMax=zona==='urb'?60:(document.getElementById('poCond').value==='2centro'?100:100);
  const vanoSec=zona==='urb'?60:50;
  let reten='';
  if(conj==='susp'){
    reten=ang<=3?'Suspensión ≤3°: puede ir <b>sin retenida</b> (verificar cargas).':'Suspensión 3°–30°: <b>con retenida</b> (directa a tierra o según cargas).';
  } else if(conj==='ret'){
    reten='Retención: <b>retenidas</b> que equilibren la tensión horizontal (directa a tierra, perfil U, pie de amigo o poste a poste).';
  } else {
    reten='Doble terminal &lt;3°: según anexo puede ir sin retenida; verificar momentos y cruces.';
  }
  if(ang>30 && conj==='susp') reten+=' <span style="color:var(--red)">Ángulo &gt;30°: valorar estructura de retención.</span>';

  let html='<div class="kpi">';
  html+='<div class="b"><div class="n">'+row.poste+'</div><div class="l">Poste concreto (m×kg)</div></div>';
  html+='<div class="b"><div class="n">'+LE.toFixed(2)+' m</div><div class="l">Empotramiento L<sub>E</sub></div></div>';
  html+='<div class="b"><div class="n">'+trabajo.toFixed(0)+' kg</div><div class="l">Carga trabajo (R/2,5)</div></div>';
  html+='<div class="b"><div class="n">'+diseno.toFixed(0)+' kg</div><div class="l">Carga diseño (R/1,5)</div></div>';
  html+='</div>';
  html+='<p style="margin:10px 0 6px;line-height:1.5"><b>Especificación de apoyo:</b> <span style="color:var(--blue);font-weight:800">'+row.poste+'</span>';
  html+=' &nbsp;·&nbsp; Altura total H = <b>'+p.H+' m</b> · Rotura = <b>'+p.R+' kg</b>';
  html+='<br>'+reten;
  html+='<br><b>Vano máx. planeamiento:</b> primario ≈ '+vanoMax+' m · secundario ≈ '+vanoSec+' m ('+(zona==='urb'?'urbano':'rural')+').';
  html+='<br><i>'+row.note+'</i></p>';
  html+='<p style="line-height:1.5">Libre teórico sobre terreno ≈ H − L<sub>E</sub> = <b>'+(p.H-LE).toFixed(2)+' m</b>. Verificar distancias verticales RETIE, flechas LT 2020 y ocupación de vía.</p>';
  el.innerHTML=html;

  // table of options for same zona+cond
  const z=document.getElementById('poZona').value;
  const c=document.getElementById('poCond').value;
  const list=PO_TAB.filter(r=>r.z===z&&r.c===c);
  let tbl='<table class="c"><thead><tr><th>Conjunto</th><th>Condición típica</th><th>Poste</th><th>Nota</th></tr></thead><tbody>';
  const jLab={susp:'Suspensión',ret:'Retención',dterm:'Doble terminal'};
  list.forEach(r=>{
    const on=r.j===conj?' style="background:var(--amberbg)"':'';
    tbl+='<tr'+on+'><td>'+jLab[r.j]+'</td><td>'+r.cruz.join(', ')+'</td><td><b>'+r.poste+'</b></td><td style="font-size:11px">'+r.note+'</td></tr>';
  });
  tbl+='</tbody></table>';
  tbl+='<p class="desc" style="margin-top:8px">Valores orientativos del Anexo No.1 EMCALI. La factibilidad y el cálculo de momentos (viento, ángulo, retenidas) priman sobre la tabla.</p>';
  document.getElementById('poTable').innerHTML=tbl;
}
try{ poRender(); }catch(e){}

<script>
(function() {
  // URL de PRODUCCIÓN de tu Webhook de n8n
  const N8N_WEBHOOK = "https://millancamilo92.app.n8n.cloud/webhook/memoria-calculo-electrico";

  function crearBotonEnviar() {
    if (document.getElementById('btnEnviarN8N')) return;

    const btn = document.createElement('button');
    btn.id = 'btnEnviarN8N';
    btn.innerHTML = '🚀 Generar Memoria Formal (n8n)';
    btn.style.cssText = `
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 99999;
      background: linear-gradient(135deg, #1f5fd0, #5b90e6);
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 12px;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(31,95,208,0.45);
      transition: transform 0.15s;
    `;
    btn.onmouseover = () => btn.style.transform = 'scale(1.05)';
    btn.onmouseout  = () => btn.style.transform = 'scale(1)';
    btn.onclick = enviarDatosAN8N;
    document.body.appendChild(btn);
  }

  async function enviarDatosAN8N() {
    try {
      const proyecto = JSON.parse(localStorage.getItem('suite_proyecto') || '{}');

      const payload = {
        origen: "Suite Eléctrica - Ing. Alexander Espinosa",
        fecha_envio: new Date().toISOString(),
        proyecto: proyecto
      };

      const btn = document.getElementById('btnEnviarN8N');
      btn.innerHTML = '⏳ Enviando...';
      btn.disabled = true;

      const response = await fetch(N8N_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        alert('✅ Datos enviados correctamente a n8n.\nRevisa el workflow para ver la memoria generada.');
      } else {
        throw new Error('Error HTTP ' + response.status);
      }
    } catch (error) {
      console.error(error);
      alert('❌ Error al enviar los datos:\n' + error.message + '\n\nVerifica que el workflow de n8n esté activo.');
    } finally {
      const btn = document.getElementById('btnEnviarN8N');
      if (btn) {
        btn.innerHTML = '🚀 Generar Memoria Formal (n8n)';
        btn.disabled = false;
      }
    }
  }

  // Crear el botón
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', crearBotonEnviar);
  } else {
    crearBotonEnviar();
  }
  setTimeout(crearBotonEnviar, 2000);
})();
</script>
</body>
</html>
