function tubeLen(it){
  const L=Number(it.w)||0;
  const rad=Number(it.rad)||0.25;
  const b=it.bend||'recta';
  if(b==='recta') return L;
  const ang=b==='curva90'?90:(b==='curva45'?45:180);
  return L + ang/180*Math.PI*rad;
}
function renderMat(){
  const box=$("matList"); if(!box) return;
  const all=[];
  S.rooms.forEach(rm=>rm.items.forEach(it=>all.push({it, room:rm.name})));
  if(!all.length){box.innerHTML='<div class="hint">Sin elementos.</div>';return;}
  // group tuberías by material+calibre
  const tub={};
  const otros={};
  all.forEach(({it,room})=>{
    const c=cat(it.type);
    if(c.kind==='TB'){
      const key=(it.material||c.material||'PVC')+' · '+(it.calibre||c.calibre||'3/4"');
      if(!tub[key]) tub[key]={m:0, n:0};
      tub[key].m += tubeLen(it);
      tub[key].n++;
    } else if(c.kind==='FR'){
      const key=(it.categoria||'Personalizado')+' · '+(it.name||c.name);
      if(!otros[key]) otros[key]=0;
      otros[key]++;
    } else {
      const key=(it.name||c.name);
      if(!otros[key]) otros[key]=0;
      otros[key]++;
    }
  });
  let h='';
  const tk=Object.keys(tub);
  if(tk.length){
    h+='<div style="font-weight:800;font-size:11px;margin-bottom:4px;color:var(--cyan)">Tuberías</div>';
    tk.forEach(k=>{
      h+=`<div style="display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:3px 0;border-bottom:1px solid var(--line2)">
        <span>${k}</span><b>${es(tub[k].m,1)} m</b></div>`;
    });
  }
  const ok=Object.keys(otros);
  if(ok.length){
    h+='<div style="font-weight:800;font-size:11px;margin:8px 0 4px;color:var(--cyan)">Otros</div>';
    ok.forEach(k=>{
      h+=`<div style="display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:3px 0;border-bottom:1px solid var(--line2)">
        <span>${k}</span><b>× ${otros[k]}</b></div>`;
    });
  }
  box.innerHTML=h||'<div class="hint">—</div>';
}

function drawRoomPlan(g, rm, ox, oz, active){
  const[a0,a1]=W2S(ox,oz),[b0,b1]=W2S(ox+rm.L,oz+rm.W);
  const x=Math.min(a0,b0),y=Math.min(a1,b1),w=Math.abs(b0-a0),h=Math.abs(b1-a1);
  g.s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${cvar('--panel')}" fill-opacity="${active?.45:.25}" stroke="${active?cvar('--cyan'):cvar('--mut')}" stroke-width="${active?2.5:1.4}"/>`;
  g.s+=`<text x="${x+w/2}" y="${y+h/2}" text-anchor="middle" font-size="11" font-weight="800" fill="${cvar('--ink')}" opacity=".4">${rm.name}</text>`;
  for(const it of rm.items){
    const c=cat(it.type), rc=itemRect(it);
    const[p0,p1]=W2S(ox+rc.x0, oz+rc.z0),[p2,p3]=W2S(ox+rc.x1, oz+rc.z1);
    const ix=Math.min(p0,p2),iy=Math.min(p1,p3),iw=Math.max(Math.abs(p2-p0),3),ih=Math.max(Math.abs(p3-p1),3);
    const sel=S.sel===it.id && rm===R();
    const col=itemColor(it), op=itemOp(it);
    const sw=sel?2.4:1.6;
    const st=sel?cvar('--amber'):cvar('--ink');
    if(c.kind==='TB'){
      // Tubería redonda + opcional curva en planta
      g.s+=drawTubeSVG(it, ox, oz, col, op, st, sw);
    } else if(c.kind==='FR' && it.shape==='circ'){
      const cx=(ix+iw/2), cy=(iy+ih/2), rr=Math.max(iw,ih)/2;
      g.s+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${col}" fill-opacity="${op}" stroke="${st}" stroke-width="${sw}"/>`;
      if(S.showNames) g.s+=`<text x="${cx}" y="${cy+3}" text-anchor="middle" font-size="9" font-weight="700" fill="${cvar('--ink')}">${(it.name||c.name).slice(0,10)}</text>`;
    } else {
      g.s+=`<rect x="${ix}" y="${iy}" width="${Math.max(iw,6)}" height="${Math.max(ih,6)}" rx="2" fill="${col}" fill-opacity="${op}" stroke="${st}" stroke-width="${sw}"/>`;
      if(S.showNames && iw>20) g.s+=`<text x="${ix+iw/2}" y="${iy+ih/2+3}" text-anchor="middle" font-size="9" font-weight="700" fill="${cvar('--ink')}">${(it.name||c.name).slice(0,10)}</text>`;
    }
  }
}

/** Dibuja tubería circular (stroke redondo) recta o con codo */
function drawTubeSVG(it, ox, oz, col, op, st, sw){
  const rot=((it.rot||0)%360+360)%360;
  const L=Number(it.w)||1;
  const diam=Math.max(0.04, Number(it.d)||0.05); // diámetro visual
  const rad=Math.max(0.08, Number(it.rad)||0.25);
  const bend=it.bend||'recta';
  // espesor en pantalla ≈ diámetro
  const[sx0,sy0]=W2S(ox+it.x, oz+it.z);
  const[sx1]=W2S(ox+it.x+0.1, oz+it.z);
  const scale=Math.abs(sx1-sx0)/0.1; // px por metro
  const strokeW=Math.max(3, diam*scale);
  const ang0=rot*Math.PI/180;
  // dirección principal
  const dx=Math.cos(ang0), dz=Math.sin(ang0);
  let path='';
  if(bend==='recta'){
    const x2=it.x+dx*L, z2=it.z+dz*L;
    const[a0,a1]=W2S(ox+it.x, oz+it.z),[b0,b1]=W2S(ox+x2, oz+z2);
    path=`M${a0} ${a1} L${b0} ${b1}`;
  } else {
    // tramo + arco
    const deg=bend==='curva90'?90:(bend==='curva45'?45:180);
    const straight=Math.max(0, L-rad);
    const xA=it.x, zA=it.z;
    const xB=it.x+dx*straight, zB=it.z+dz*straight;
    // centro del arco a la izquierda de la dirección (giro antihorario)
    const px=-dz, pz=dx; // perpendicular
    const cx=xB+px*rad, cz=zB+pz*rad;
    const a0ang=Math.atan2(zB-cz, xB-cx);
    const a1ang=a0ang + deg*Math.PI/180;
    const xC=cx+Math.cos(a1ang)*rad, zC=cz+Math.sin(a1ang)*rad;
    const[A0,A1]=W2S(ox+xA,oz+zA),[B0,B1]=W2S(ox+xB,oz+zB),[C0,C1]=W2S(ox+xC,oz+zC);
    const[K0,K1]=W2S(ox+cx,oz+cz);
    const rpx=Math.hypot(B0-K0, B1-K1);
    const large=deg>180?1:0;
    path=`M${A0} ${A1} L${B0} ${B1} A${rpx} ${rpx} 0 ${large} 1 ${C0} ${C1}`;
  }
  const selMark = S.sel===it.id ? ` stroke="${st}"` : '';
  let g=`<path d="${path}" fill="none" stroke="${col}" stroke-opacity="${Math.min(1,op+0.15)}" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round"/>`;
  g+=`<path d="${path}" fill="none" stroke="${st}" stroke-width="${Math.max(1,sw)}" stroke-linecap="round" opacity="0.85"/>`;
  if(S.showNames){
    const[tx,ty]=W2S(ox+it.x+dx*L*0.5, oz+it.z+dz*L*0.5);
    g+=`<text x="${tx}" y="${ty-6}" text-anchor="middle" font-size="9" font-weight="700" fill="${col}">${(it.name||cat(it.type).name).slice(0,12)}</text>`;
  }
  return g;
}

function proj(x,y,z){
  const sb=siteBounds();
  const cx=(sb.minX+sb.maxX)/2, cy=1.2, cz=(sb.minZ+sb.maxZ)/2;
  const az=S.cam.az*Math.PI/180, el=S.cam.el*Math.PI/180, s=S.cam.s;
  let X=x-cx, Y=y-cy, Z=z-cz;
  let x1=X*Math.cos(az)+Z*Math.sin(az);
  let z1=-X*Math.sin(az)+Z*Math.cos(az);
  let y2=Y*Math.cos(el)-z1*Math.sin(el);
  let depth=Y*Math.sin(el)+z1*Math.cos(el);
  return [VBW/2+x1*s, VBH/2+30-y2*s, depth];
}

function render3DGeneral(){
  $("viewHelp").innerHTML=`<b>3D general.</b> Todos los cuartos y elementos con su altura Y. Arrastra para rotar.`;
  $("legend").innerHTML=S.rooms.map(r=>`<div class="row"><span class="lg-s" style="background:var(--cyan)"></span>${r.name}</div>`).join('');
  let g='';
  const sb=siteBounds();
  // ground grid
  for(let x=Math.floor(sb.minX);x<=sb.maxX+0.01;x++){
    const a=proj(x,0,sb.minZ),b=proj(x,0,sb.maxZ);
    g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--grid')}" stroke-width="1"/>`;
  }
  for(let z=Math.floor(sb.minZ);z<=sb.maxZ+0.01;z++){
    const a=proj(sb.minX,0,z),b=proj(sb.maxX,0,z);
    g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--grid')}" stroke-width="1"/>`;
  }
  const faces=[];
  S.rooms.forEach((rm,ri)=>{
    const ox=rm.gx, oz=rm.gz, H=rm.H;
    // room wireframe
    const corners=[[0,0,0],[rm.L,0,0],[rm.L,0,rm.W],[0,0,rm.W],[0,H,0],[rm.L,H,0],[rm.L,H,rm.W],[0,H,rm.W]];
    const edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    const col=ri===S.active?cvar('--cyan'):cvar('--mut');
    for(const [i,j] of edges){
      const a=proj(ox+corners[i][0],corners[i][1],oz+corners[i][2]);
      const b=proj(ox+corners[j][0],corners[j][1],oz+corners[j][2]);
      g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="${ri===S.active?1.8:1.2}" opacity=".8"/>`;
    }
    // floor
    const fl=[[0,0,0],[rm.L,0,0],[rm.L,0,rm.W],[0,0,rm.W]].map(p=>proj(ox+p[0],p[1],oz+p[2]));
    g+=`<polygon points="${fl.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="${cvar('--panel')}" fill-opacity=".2" stroke="none"/>`;
    // label
    const lc=proj(ox+rm.L/2, H+0.15, oz+rm.W/2);
    g+=`<text x="${lc[0]}" y="${lc[1]}" text-anchor="middle" font-size="10" font-weight="800" fill="${col}">${rm.name}</text>`;

    for(const it of rm.items){
      const c=cat(it.type), rc=itemRect(it);
      const Y0=it.y!=null?it.y:defaultY(c,H);
      const Y1=Y0+(it.h||c.h);
      const pts=[
        [ox+rc.x0,Y0,oz+rc.z0],[ox+rc.x1,Y0,oz+rc.z0],[ox+rc.x1,Y0,oz+rc.z1],[ox+rc.x0,Y0,oz+rc.z1],
        [ox+rc.x0,Y1,oz+rc.z0],[ox+rc.x1,Y1,oz+rc.z0],[ox+rc.x1,Y1,oz+rc.z1],[ox+rc.x0,Y1,oz+rc.z1]
      ];
      const F=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];
      for(const f of F){
        const P=f.map(k=>proj(...pts[k]));
        const depth=(P[0][2]+P[1][2]+P[2][2]+P[3][2])/4;
        faces.push({P, depth, color:c.color, sel:S.sel===it.id && rm===R()});
      }
    }
  });
  faces.sort((a,b)=>a.depth-b.depth);
  for(const f of faces){
    const op=f.fill==='transparent'?0.15:0.88;
    g+=`<polygon points="${f.P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="${f.color}" fill-opacity="${op}" stroke="${f.sel?cvar('--amber'):cvar('--ink')}" stroke-width="${f.sel?2.2:1.5}"/>`;
  }
  cv.innerHTML=g;
  try{applyLineWeight();}catch(e){}
  try{snapshotView(typeof S!=='undefined'?(S.tab||'main'):'main');}catch(e){}
  try{applyLineWeight();}catch(e){}
}

function duplicateSel(){
  const it=R().items.find(x=>x.id===S.sel);
  if(!it){toast('Selecciona una pieza');return;}
  const copy=JSON.parse(JSON.stringify(it));
  copy.id=uid();
  if(isWall(copy)){
    if(copy.wall==='S'||copy.wall==='N') copy.x=+(copy.x+0.3).toFixed(2);
    else copy.z=+(copy.z+0.3).toFixed(2);
  } else {
    copy.x=+(copy.x+0.35).toFixed(2);
    copy.z=+(copy.z+0.25).toFixed(2);
  }
  if(copy.name&&!/\(copia\)/i.test(copy.name)) copy.name=copy.name+' (copia)';
  R().items.push(copy); S.sel=copy.id; render(); toast('Duplicado');
}
function printView(){render(); setTimeout(()=>window.print(),100);}
function fitView(){
  if(S.tab==='v3d'){
    const sb=siteBounds();
    const span=Math.max(sb.L, sb.W, 4);
    S.cam.s=Math.max(8, Math.min(45, (VBW*0.4)/span));
    render(); return;
  }
  let L,W,x0,y0;
  if(S.tab==='general'){
    const sb=siteBounds(); L=sb.L; W=sb.W; x0=sb.minX-0.8; y0=sb.minZ-0.8;
  } else {
    const r=R(); L=r.L; W=r.W; x0=-0.8; y0=-0.8;
  }
  const pad=0.8;
  const sx=(VBW-ML-MR)/(L+2*pad), sy=(VBH-MB-MT)/(W+2*pad);
  S.view.s=Math.max(8,Math.min(sx,sy));
  S.view.x0=x0; S.view.y0=y0;
  render();
}



function toggleLineW(){
  const cur=localStorage.getItem('suite_lineW')||'thick';
  const next=cur==='thick'?'thin':'thick';
  localStorage.setItem('suite_lineW', next);
  applyLineWeight();
  const b=document.getElementById('btnLineW');
  if(b) b.textContent=next==='thin'?'┄ Línea fina':'━ Línea gruesa';
  try{toast(next==='thin'?'Línea fina':'Línea gruesa');}catch(e){}
}
function applyLineWeight(){
  try{
    const mode=localStorage.getItem('suite_lineW')||'thick';
    const f=mode==='thin'?0.38:1;
    const root=document.getElementById('cv')||document.querySelector('svg.canvas')||document.querySelector('svg');
    if(!root) return;
    root.querySelectorAll('[stroke-width]').forEach(el=>{
      if(el.dataset.sw0==null) el.dataset.sw0=el.getAttribute('stroke-width')||'1';
      const base=parseFloat(el.dataset.sw0);
      if(!isFinite(base)) return;
      el.setAttribute('stroke-width', String(Math.max(0.25, base*f)));
    });
  }catch(e){}
}
window.addEventListener('storage',function(e){ if(e.key==='suite_lineW') applyLineWeight(); });
window.addEventListener('message',function(e){ if(e.data&&e.data.type==='suite_lineW') applyLineWeight(); });
function snapshotView(tab){
  try{
    const svg=document.getElementById('cv');
    if(!svg) return;
    const clone=svg.cloneNode(true);
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const ser=new XMLSerializer().serializeToString(clone);
    localStorage.setItem('casa_snap_'+(tab||'main'), ser);
  }catch(e){}
}
function render(){
  S.projName=$("projName").value||S.projName;
  renderTabs(); syncUI();
  renderPalette(); renderList(); renderSel(); renderStatus(); renderHud(); renderMat();
  if(S.tab==='planta') renderPlantaCuarto();
  else if(S.tab==='general') renderPlantaGeneral();
  else render3DGeneral();
  save();
}

// events
$("tabs").onclick=e=>{
  const b=e.target.closest('button[data-t]'); if(!b)return;
  S.tab=b.dataset.t; S.placing=null; fitView();

(function(){
  const bl=document.getElementById('btnLineW');
  if(bl){
    const mode=localStorage.getItem('suite_lineW')||'thick';
    bl.textContent=mode==='thin'?'┄ Línea fina':'━ Línea gruesa';
    bl.onclick=function(){toggleLineW();};
  }
})();

};
['rL','rW','rH','rName','rType','rGx','rGz'].forEach(id=>{
  $(id).addEventListener('change',onRoomMeta);
  $(id).addEventListener('input',onRoomMeta);
});
$("projName").onchange=$("projName").oninput=()=>{S.projName=$("projName").value;save();};
$("btnDelRoom").onclick=()=>{if(S.rooms.length<=1)return;S.rooms.splice(S.active,1);S.active=Math.max(0,S.active-1);S.sel=null;render();};
$("btnFit").onclick=fitView;
$("zIn").onclick=()=>{if(S.tab==='v3d')S.cam.s=Math.min(80,S.cam.s*1.15);else S.view.s=Math.min(140,S.view.s*1.15);render();};
$("zOut").onclick=()=>{if(S.tab==='v3d')S.cam.s=Math.max(6,S.cam.s/1.15);else S.view.s=Math.max(6,S.view.s/1.15);render();};
window.toggleTheme=function(){
  const d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';
  d.dataset.theme=t;$("themeBtn").textContent=t==='dark'?'🌙':'☀️';
  try{localStorage.setItem('casa_theme',t);}catch(e){}render();
};
$("themeBtn").textContent=document.documentElement.dataset.theme==='dark'?'🌙':'☀️';
let tt;function toast(m){const e=$("toast");e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1500);}

cv.addEventListener('mousedown',down);cv.addEventListener('touchstart',down,{passive:false});
window.addEventListener('mousemove',move);window.addEventListener('touchmove',move,{passive:false});
window.addEventListener('mouseup',up);window.addEventListener('touchend',up);
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  if(S.tab==='v3d'){S.cam.s=Math.max(6,Math.min(80,S.cam.s*(e.deltaY<0?1.1:1/1.1)));render();return;}
  const[vx,vy]=evtVB(e),[wx,wy]=S2W(vx,vy),f=e.deltaY<0?1.12:1/1.12;
  S.view.s=Math.max(6,Math.min(140,S.view.s*f));
  const[nx,ny]=S2W(vx,vy);S.view.x0+=wx-nx;S.view.y0+=wy-ny;render();
},{passive:false});
cv.addEventListener('dblclick',e=>{
  if(S.tab!=='planta')return;
  const[vx,vy]=evtVB(e),[wx,wz]=S2W(vx,vy);
  const items=R().items;
  for(let i=items.length-1;i>=0;i--){
    const h=hitRect(items[i]);
    if(wx>=h.x0&&wx<=h.x1&&wz>=h.z0&&wz<=h.z1){R().items.splice(i,1);S.sel=null;render();return;}
  }
});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){S.placing=null;S.drag=null;render();}});

function down(e){
  if(S.tab==='v3d'){
    const[vx,vy]=evtVB(e);S.drag={t:'rot',sx:vx,sy:vy,az:S.cam.az,el:S.cam.el};
    cv.classList.add('grabbing');e.preventDefault();return;
  }
  const[vx,vy]=evtVB(e),[wx,wz]=S2W(vx,vy);

  if(S.tab==='general'){
    // click room to activate
    for(let i=S.rooms.length-1;i>=0;i--){
      const rm=S.rooms[i];
      if(wx>=rm.gx&&wx<=rm.gx+rm.L&&wz>=rm.gz&&wz<=rm.gz+rm.W){
        S.active=i;S.sel=null;render();e.preventDefault();return;
      }
    }
    S.drag={t:'pan',sx:vx,sy:vy,x0:S.view.x0,y0:S.view.y0};cv.classList.add('grabbing');e.preventDefault();return;
  }

  // planta cuarto
  if(S.placing){
    const c=cat(S.placing); let it;
    const y=defaultY(c, R().H);
    if(c.wall){
      const sn=snapToWall(wx,wz,c.w,c.d);
      it={id:uid(),type:S.placing,x:sn.x,z:sn.z,y:y,w:c.w,d:c.d,h:c.h,rot:sn.rot,name:c.name,wall:sn.wall,fill:S.globalFill||'solid',color:c.color};
      if(c.kind==='TB'){it.calibre=c.calibre;it.material=c.material;it.bend='recta';it.rad=0.25;}
      if(c.kind==='FR'){it.categoria=c.categoria||'Personalizado';it.shape='rect';it.note='';}
    } else {
      it={id:uid(),type:S.placing,x:+(wx-c.w/2).toFixed(2),z:+(wz-c.d/2).toFixed(2),y:y,w:c.w,d:c.d,h:c.h,rot:0,name:c.name,fill:S.globalFill||'solid',color:c.color};
      if(c.kind==='TB'){it.calibre=c.calibre;it.material=c.material;it.bend='recta';it.rad=0.25;}
      if(c.kind==='FR'){it.categoria=c.categoria||'Personalizado';it.shape='rect';it.note='';}
      it.x=Math.max(0,Math.min(R().L-itemRect(it).w,it.x));
      it.z=Math.max(0,Math.min(R().W-itemRect(it).d,it.z));
    }
    R().items.push(it);S.sel=it.id;S.placing=null;render();toast(c.name+' · Y='+es(y,2)+' m');e.preventDefault();return;
  }
  const items=R().items;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i], h=hitRect(it);
    if(wx>=h.x0&&wx<=h.x1&&wz>=h.z0&&wz<=h.z1){
      S.sel=it.id;S.drag={t:'move',id:it.id,ox:wx-it.x,oz:wz-it.z};
      cv.classList.add('grabbing');render();e.preventDefault();return;
    }
  }
  S.drag={t:'pan',sx:vx,sy:vy,x0:S.view.x0,y0:S.view.y0};cv.classList.add('grabbing');e.preventDefault();
}
function move(e){
  if(!S.drag)return;e.preventDefault();
  const[vx,vy]=evtVB(e);
  if(S.drag.t==='rot'){
    S.cam.az=S.drag.az+(vx-S.drag.sx)*0.4;
    S.cam.el=Math.max(5,Math.min(80,S.drag.el+(vy-S.drag.sy)*0.35));
    render();return;
  }
  const[wx,wz]=S2W(vx,vy);
  if(S.drag.t==='pan'){
    const[ox,oy]=S2W(S.drag.sx,S.drag.sy);
    S.view.x0=S.drag.x0+(ox-wx);S.view.y0=S.drag.y0+(oy-wz);render();return;
  }
  if(S.drag.t==='move'){
    const it=R().items.find(x=>x.id===S.drag.id);if(!it)return;
    if(isWall(it)){const sn=snapToWall(wx,wz,it.w,it.d);it.x=sn.x;it.z=sn.z;it.rot=sn.rot;it.wall=sn.wall;}
    else{it.x=+(wx-S.drag.ox).toFixed(2);it.z=+(wz-S.drag.oz).toFixed(2);}
    render();
  }
}
function up(){S.drag=null;cv.classList.remove('grabbing');}

fitView();

(function(){
  const n=$("btnNames"), f=$("btnFillMode"), d=$("btnDup"), p=$("btnPrint");
  if(n) n.onclick=toggleNames;
  if(f) f.onclick=toggleGlobalFill;
  if(d) d.onclick=duplicateSel;
  if(p) p.onclick=printView;
})();

})();

<script>
(function(){
const $=id=>document.getElementById(id);
const es=(x,d=2)=>Number(x).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});
let filter='all';
let findings=[];

const WIRES={
  '14':{cu75:20,cu90:25},'12':{cu75:25,cu90:30},'10':{cu75:35,cu90:40},'8':{cu75:50,cu90:55},
  '6':{cu75:65,cu90:75},'4':{cu75:85,cu90:95},'2':{cu75:115,cu90:130},'1':{cu75:130,cu90:145},
  '1/0':{cu75:150,cu90:170},'2/0':{cu75:175,cu90:195},'3/0':{cu75:200,cu90:225},'4/0':{cu75:230,cu90:260},
  '250':{cu75:255,cu90:290},'300':{cu75:285,cu90:320},'350':{cu75:310,cu90:350},'400':{cu75:335,cu90:380},
  '500':{cu75:380,cu90:430},'600':{cu75:420,cu90:475},'750':{cu75:475,cu90:535}
};

function loadJSON(key){
  try{return JSON.parse(localStorage.getItem(key));}catch(e){return null;}
}

function add(sev, mod, title, msg, ref){
  findings.push({sev, mod, title, msg, ref:ref||''});
}

function analyzeCC(){
  const j=loadJSON('cc_state3');
  if(!j||!j.boards||!j.boards.length){
    add('warn','cc','Sin cuadros de carga','No hay tableros guardados en Cuadros de carga. Diseñe circuitos allí para validar ampacidad, breakers y balance.','NTC 2050 Art. 210 / 220 / 240 / 310');
    return;
  }
  const R3=Math.sqrt(3);
  j.boards.forEach((b,bi)=>{
    const name=b.name||('Tablero '+(bi+1));
    const sys=b.sys||3;
    const V=(b.v==='120'?120:b.v==='120240'?240:b.v==='220'?220:b.v==='220127'?220:b.v==='240'?240:b.v==='380'?380:b.v==='440'?440:b.v==='480'?480:208);
    const Vn=b.v==='208'?120:b.v==='220127'?127:b.v==='380'?220:b.v==='480'?277:V/R3;
    const aisl=b.aisl||'90';
    const mat=b.mat||'cu';
    let IA=0,IB=0,IC=0;
    const used={};
    (b.rows||[]).forEach((r,ri)=>{
      const P=(r.P||0)*(r.nInst||1), fp=r.fp||1, Sva=P/fp;
      let Iline=0;
      if(sys===1) Iline=Sva/V;
      else if(sys===2) Iline=Sva/V;
      else Iline=Sva/(R3*V);
      const ph=String(r.phases||'ABC').toUpperCase();
      let a=0,bb=0,c=0;
      if(sys===1) a=Iline;
      else if(sys===2){
        if(ph.indexOf('A')>=0||ph==='AB'||ph==='ABC') a=Iline;
        if(ph.indexOf('B')>=0||ph==='AB'||ph==='ABC') bb=Iline;
      } else {
        if(ph==='ABC'){a=bb=c=Iline;}
        else if(ph==='A') a=Sva/(Vn||V);
        else if(ph==='B') bb=Sva/(Vn||V);
        else if(ph==='C') c=Sva/(Vn||V);
        else if(ph==='AB'){a=bb=Sva/V;}
        else if(ph==='BC'){bb=c=Sva/V;}
        else if(ph==='AC'){a=c=Sva/V;}
        else {a=bb=c=Iline;}
      }
      IA+=a; IB+=bb; IC+=c;
      const Imax=Math.max(a,bb,c);
      // circuit occupancy
      const circN=parseInt(r.circN)|| (ri+1);
      const poles=parseInt(r.poles)||1;
      for(let k=0;k<poles;k++){
        const n=circN+k;
        if(used[n]) add('bad','cc', name+': circuito '+n+' duplicado',
          'El espacio de circuito '+n+' aparece en más de una carga («'+(r.desc||'')+'» y otra). Revise N° circ. y polos.',
          'NTC 2050 Art. 408 — Tableros');
        used[n]=true;
      }
      const nCirc=b.nCirc||12;
      if(circN+poles-1>nCirc) add('warn','cc', name+': excede circuitos del tablero',
        'La carga «'+(r.desc||'')+'» usa hasta el circuito '+(circN+poles-1)+' pero el tablero solo tiene '+nCirc+' espacios.',
        'Dimensionamiento del tablero');
      // ampacity vs breaker
      const w=WIRES[r.wire];
      if(w){
        const amp=w[(mat==='cu'?'cu':'al')+aisl]||w.cu90||0;
        if(amp>0 && Imax>amp*1.01) add('bad','cc', name+': conductor insuficiente',
          '«'+(r.desc||'')+'»: I≈'+es(Imax,1)+' A supera ampacidad orientativa del '+r.wire+' AWG ('+amp+' A @ '+aisl+' °C).',
          'NTC 2050 Tabla 310-16 / Art. 210-19');
        if(r.brk && amp>0 && r.brk>amp && !(r.wire==='14'||r.wire==='12'||r.wire==='10')){
          // simplified 240-4 check
        }
        if(r.brk && Imax>0 && r.brk < Imax) add('bad','cc', name+': breaker subdimensionado',
          '«'+(r.desc||'')+'»: breaker '+r.brk+' A < corriente de carga '+es(Imax,1)+' A.',
          'NTC 2050 Art. 240');
        if(r.brk && Imax>0 && r.brk < Imax*1.25 && (String(r.circ||'').toLowerCase().indexOf('motor')>=0||String(r.circ||'').toLowerCase().indexOf('aire')>=0))
          add('warn','cc', name+': factor 125 % motores/AC',
            '«'+(r.desc||'')+'»: revise protección al 125 % de la corriente a plena carga (Art. 430 / 440). Breaker actual '+r.brk+' A, I='+es(Imax,1)+' A.',
            'NTC 2050 Art. 430 / 440');
      }
    });
    if(sys>=2){
      const mx=Math.max(IA,IB,sys>=3?IC:IB), mn=Math.min(IA,IB,sys>=3?IC:IB);
      const unbal=mx>0?((mx-mn)/mx*100):0;
      if(unbal>15) add('warn','cc', name+': desequilibrio de fases',
        'Corrientes A/B'+(sys>=3?'/C':'')+': '+es(IA,1)+' / '+es(IB,1)+(sys>=3?(' / '+es(IC,1)):'')+' A → desequilibrio ≈ '+es(unbal,0)+' %. Use Balance de cargas.',
        'Buena práctica / calidad de energía');
      else if(unbal>5) add('ok','cc', name+': balance aceptable',
        'Desequilibrio ≈ '+es(unbal,1)+' % (A '+es(IA,1)+', B '+es(IB,1)+(sys>=3?', C '+es(IC,1):'')+' A).',
        '');
      else add('ok','cc', name+': bien equilibrado',
        'Desequilibrio ≈ '+es(unbal,1)+' %.', '');
    }
    add('ok','cc', name+': datos leídos',
      (b.rows||[]).length+' circuitos · sistema '+(sys===1?'1φ':sys===2?'2φ':'3φ')+' · '+es(V,0)+' V · tablero '+(b.nCirc||12)+' espacios.',
      '');
  });
}

function analyzeCasa(){
  const j=loadJSON('casa_state4')||loadJSON('casa_state');
  if(!j||!j.rooms||!j.rooms.length){
    add('warn','casa','Sin diseño Casa/Apto','No hay cuartos guardados en Casa / Apto tipo.', 'NTC 2050 Art. 210-52');
    return;
  }
  let tomas=0, switches=0, lums=0, tubM=0, doors=0;
  j.rooms.forEach(rm=>{
    const items=rm.items||[];
    const L=rm.L||0, W=rm.W||0;
    const perim=2*(L+W);
    let nTomas=0;
    items.forEach(it=>{
      const t=it.type||'';
      if(t.indexOf('toma')>=0){nTomas++; tomas++;}
      if(t.indexOf('switch')>=0) switches++;
      if(t.indexOf('lum')>=0) lums++;
      if(t.indexOf('puerta')>=0) doors++;
      if(t.indexOf('tub')>=0||t.indexOf('tuber')>=0) tubM+=(Number(it.w)||0);
    });
    // 210-52: rough check — perimeter / 3.6 m minimum outlets for habitable rooms
    const tipo=(rm.type||'').toLowerCase();
    if(['sala','alcoba','dormitorio','comedor','estudio','otro'].some(x=>tipo.indexOf(x)>=0) && L>0 && W>0){
      const useful=Math.max(0, perim - doors*0.9);
      const minTomas=Math.max(1, Math.ceil(useful/3.6));
      if(nTomas < minTomas) add('warn','casa', (rm.name||'Cuarto')+': posibles tomas insuficientes',
        'Área '+es(L,1)+'×'+es(W,1)+' m. Orientativo: ≥ '+minTomas+' tomas para cubrir perímetro útil (sep. máx. ~3,6 m). Hay '+nTomas+'.',
        'NTC 2050 Art. 210-52(A)');
      else add('ok','casa', (rm.name||'Cuarto')+': tomas',
        nTomas+' toma(s) en el cuarto (mín. orientativo '+minTomas+').', 'NTC 2050 Art. 210-52');
    }
    if(tipo.indexOf('baño')>=0 && nTomas<1)
      add('bad','casa', (rm.name||'Baño')+': falta toma',
        'Baño: al menos una toma cerca del lavamanos con protección GFCI.',
        'NTC 2050 Art. 210-52(D) / 210-8');
    if(tipo.indexOf('cocina')>=0 && nTomas<2)
      add('warn','casa', (rm.name||'Cocina')+': tomas de mesón',
        'Cocina: revise tomas de mesón (separación ≤ 1,2 m en mostrador) y circuitos dedicados.',
        'NTC 2050 Art. 210-52(C)');
  });
  add('ok','casa','Inventario Casa/Apto',
    j.rooms.length+' cuartos · '+tomas+' tomas · '+switches+' interruptores · '+lums+' luminarias · tubería ≈ '+es(tubM,1)+' m.',
    '');
}

function analyzeSub(){
  const j=loadJSON('sub_state');
  if(!j||!j.items||!j.items.length){
    add('warn','sub','Sin celdas/tableros','No hay equipos en Celdas y tableros.', 'RETIE / NTC distancias de servicio');
    return;
  }
  const room=j.room||{L:8,W:5,H:3.5,pas:1.0};
  const pas=room.pas||1.0;
  let nMT=0,nBT=0,nAR=0;
  j.items.forEach(it=>{
    const t=it.type||'';
    if(t.indexOf('puerta')>=0||t.indexOf('ventana')>=0) nAR++;
    else if(t.indexOf('tab')>=0||t.indexOf('ccm')>=0||t.indexOf('bt')>=0||t.indexOf('transf')>=0) nBT++;
    else nMT++;
  });
  // clearance rough: equipment to wall
  j.items.forEach(it=>{
    if((it.type||'').indexOf('puerta')>=0) return;
    if((it.type||'').indexOf('ventana')>=0) return;
    const w=it.rot%180===0?it.w:it.d, d=it.rot%180===0?it.d:it.w;
    const x0=it.x, z0=it.z, x1=it.x+w, z1=it.z+d;
    const toWall=Math.min(x0,z0,(room.L||8)-x1,(room.W||5)-z1);
    if(toWall>=0 && toWall<pas-0.05)
      add('warn','sub', (it.name||it.type)+': pasillo reducido',
        'Distancia a pared ≈ '+es(toWall,2)+' m < pasillo configurado '+es(pas,2)+' m. Verificar espacio de trabajo (Art. 110).',
        'NTC 2050 Art. 110-26');
  });
  add('ok','sub','Sala de equipos',
    'Sala '+es(room.L,1)+'×'+es(room.W,1)+' m · '+j.items.length+' elementos (MT/BT/vanos: '+nMT+'/'+nBT+'/'+nAR+') · pasillo mín. '+es(pas,2)+' m.',
    'NTC 2050 Art. 110');
}

function analyzeGen(){
  add('ok','gen','Referencias transversales',
    'Acometida BT: ampacidad T310-16, cortocircuito Art. 110-9, alimentador 125 % Art. 215-3. Puesta a tierra IEEE 80 / Art. 250. SIPRA NTC 4552. Canalizaciones Cap. 9.',
    'NTC 2050 · RETIE 2024');
  add('warn','gen','Documentación de obra',
    'Conserve memorias de cálculo, unifilares, cuadros de carga, planos de puesta a tierra y SIPRA firmados por el responsable del diseño.',
    'RETIE · buenas prácticas');
}

function scan(){
  findings=[];
  analyzeCC();
  analyzeCasa();
  analyzeSub();
  analyzeGen();
  render();
}

function render(){
  const list=findings.filter(f=>filter==='all'||f.mod===filter);
  const nOk=findings.filter(f=>f.sev==='ok').length;
  const nW=findings.filter(f=>f.sev==='warn').length;
  const nB=findings.filter(f=>f.sev==='bad').length;
  $("sum").innerHTML=
    '<div class="box"><div class="n" style="color:var(--green)">'+nOk+'</div><div class="l">Cumple / info</div></div>'+
    '<div class="box"><div class="n" style="color:var(--amber)">'+nW+'</div><div class="l">Revisar</div></div>'+
    '<div class="box"><div class="n" style="color:var(--red)">'+nB+'</div><div class="l">No conforme</div></div>'+
    '<div class="box"><div class="n">'+findings.length+'</div><div class="l">Total hallazgos</div></div>';
  if(!list.length){
    $("list").innerHTML='<div class="empty">Sin hallazgos en este filtro. Analice el proyecto o cambie de sección.</div>';
    return;
  }
  const order={bad:0,warn:1,ok:2};
  list.sort((a,b)=>order[a.sev]-order[b.sev]);
  $("list").innerHTML=list.map(f=>{
    const lab=f.sev==='ok'?'OK':f.sev==='warn'?'Revisar':'No conforme';
    const mod=f.mod==='cc'?'Cuadros':f.mod==='casa'?'Casa/Apto':f.mod==='sub'?'Celdas':'General';
    return '<div class="item"><div class="hd"><span class="badge '+f.sev+'">'+lab+'</span><span class="badge ok">'+mod+'</span><b>'+f.title+'</b></div>'+
      '<div class="msg">'+f.msg+'</div>'+
      (f.ref?'<div class="ref">'+f.ref+'</div>':'')+'</div>';
  }).join('');
}

$("tabs").onclick=e=>{
  const b=e.target.closest('button[data-s]'); if(!b)return;
  filter=b.getAttribute('data-s');
  $("tabs").querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  render();
};
$("btnScan").onclick=scan;
$("themeBtn").onclick=function(){
  const d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';
  d.dataset.theme=t; this.textContent=t==='dark'?'☀️':'🌙';
  try{localStorage.setItem('ntc_theme',t);}catch(e){}
};
$("themeBtn").textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';
scan();
})();

<body>
<div class="toolbar">
  <h1>Informe de proyecto</h1>
  <span style="font-size:11px;opacity:.9">Vistas · cálculos · normas · materiales</span>
  <div class="sp"></div>
  <button type="button" id="btnRefresh">↻ Actualizar</button>
  <button type="button" id="btnPrint">🖨 Imprimir / PDF</button>
</div>
<div class="wrap" id="report"></div>
<script>
(function(){
const es=(x,d=2)=>{const n=Number(x);if(!isFinite(n))return '—';return n.toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});};
function load(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const VOLT={120:120,120240:240,208:208,220:220,220127:220,240:240,380:380,440:440,480:480};
const WIRES={'14':20,'12':25,'10':35,'8':50,'6':65,'4':85,'2':115,'1':130,'1/0':150,'2/0':175,'3/0':200,'4/0':230,'250':255,'300':285,'350':310,'400':335,'500':380,'600':420,'750':475};

function boardKva(b){
  let S=0;
  (b.rows||[]).forEach(r=>{
    const P=(Number(r.P)||0)*(Number(r.nInst)||1);
    S+=(P/(Number(r.fp)||1));
  });
  return (S/1000)*Math.max(1,Number(b.qty)||1);
}

function section(title, desc, body){
  return `<section class="sec"><h3>${esc(title)}</h3>${desc?`<div class="desc">${desc}</div>`:''}${body||'<div class="empty">Sin datos en este módulo.</div>'}</section>`;
}

function buildCC(){
  const j=load('cc_state3');
  if(!j||!j.boards||!j.boards.length) return section('5. Cuadros de carga','NTC 2050 Art. 210 / 220 / 240 / 310',null);
  let body='', totKva=0;
  j.boards.forEach((b,bi)=>{
    const kva=boardKva(b); totKva+=kva;
    const sys=b.sys===1?'Monofásico':b.sys===2?'Bifásico':'Trifásico';
    const V=VOLT[b.v]||208;
    body+=`<h4 style="margin:12px 0 4px">${esc(b.name||('Tablero '+(bi+1)))} ×${b.qty||1}</h4>`;
    body+=`<div class="kpi"><div class="b"><div class="n">${es(kva,2)}</div><div class="l">kVA</div></div>
      <div class="b"><div class="n">${sys}</div><div class="l">Sistema</div></div>
      <div class="b"><div class="n">${es(V,0)} V</div><div class="l">Tensión</div></div>
      <div class="b"><div class="n">${b.nCirc||12}</div><div class="l">Espacios</div></div></div>`;
    body+=`<table><thead><tr><th>#</th><th>Descripción</th><th class="n">W</th><th class="n">FP</th><th>Fases</th><th>Circ.</th><th>Polos</th><th>Conductor</th><th>Breaker</th><th>Norma</th></tr></thead><tbody>`;
    (b.rows||[]).forEach((r,i)=>{
      const spaces=[];
      const cn=parseInt(r.circN)||(i+1), pol=parseInt(r.poles)||1;
      for(let k=0;k<pol;k++) spaces.push(cn+k);
      body+=`<tr><td>${i+1}</td><td>${esc(r.desc)}</td><td class="n">${es((r.P||0)*(r.nInst||1),0)}</td>
        <td class="n">${es(r.fp,2)}</td><td>${esc(r.phases)}</td><td>${spaces.join('-')}</td><td>${pol}P</td>
        <td>${esc(r.wire||'—')}</td><td>${r.brk||'—'} A</td><td style="font-size:10px">${esc((r.norm||'').slice(0,40))}</td></tr>`;
    });
    body+='</tbody></table>';
  });
  body=`<div class="kpi"><div class="b"><div class="n">${es(totKva,2)}</div><div class="l">Σ kVA conectados</div></div></div>`+body;
  body+=`<div class="norm"><b>Referencia normativa:</b> NTC 2050 Art. 210 (derivados), 215 (alimentadores), 220 (cargas), 240 (protección), 310 (conductores), 408 (tableros). Espacios de circuito exclusivos por carga.</div>`;
  return section('5. Cuadros de carga','Cálculos de corriente, conductores, breakers y circuitos',body);
}


function buildAisl(){
  const a=load('aisl_state');
  const P=load('suite_proyecto')||{};
  let body='';
  if(a){
    body+='<div class="kpi"><div class="b"><div class="n">'+es(a.vMT,1)+'</div><div class="l">kV MT</div></div>'
      +'<div class="b"><div class="n">'+es(a.kva,1)+'</div><div class="l">kVA trafo</div></div>'
      +'<div class="b"><div class="n">'+es(a.bil,0)+'</div><div class="l">BIL kV</div></div>'
      +'<div class="b"><div class="n">'+es(a.vBT,0)+'</div><div class="l">V BT</div></div></div>';
    body+='<p>Tipo SE: <b>'+esc(a.tipo||'—')+'</b> · Altitud: <b>'+es(a.alt||0,0)+'</b> m</p>';
  } else body='<div class="empty">Ejecute el Paso 3 · Coordinación de aislamiento.</div>';
  body+='<div class="norm"><b>Referencia:</b> NTC 4552-1 Anexo E · RETIE 2024 Cap. 13 · NTC 2050 Secc. 110. Tablas de BIL, distancias e IP en el módulo.</div>';
  return section('3. Coordinación de aislamiento','Niveles de aislamiento MT/BT',body);
}
function buildDem(){
  const dem=load('dem_state')||{};
  const cc=load('cc_state3');
  let sum=0;
  if(cc&&cc.boards) cc.boards.forEach(b=>sum+=boardKva(b));
  const fd=dem.fd!=null?dem.fd:0.85;
  const dmax=dem.dmax!=null?dem.dmax:(sum*fd);
  const kvaTx=dem.kvaTx!=null?dem.kvaTx:null;
  const tri=dem.tipo!=='1';
  let body=`<div class="kpi">
    <div class="b"><div class="n">${es(sum,2)}</div><div class="l">kVA cuadros</div></div>
    <div class="b"><div class="n">${es(fd,2)}</div><div class="l">F. demanda</div></div>
    <div class="b"><div class="n">${es(dmax,2)}</div><div class="l">DMAX kVA</div></div>
    <div class="b"><div class="n">${kvaTx!=null?es(kvaTx,1):'—'}</div><div class="l">Transformador kVA</div></div>
    <div class="b"><div class="n">${tri?'3φ':'1φ'}</div><div class="l">Tipo</div></div>
    <div class="b"><div class="n">${tri?'DYn5':'Ii0'}</div><div class="l">Conexión</div></div>
    <div class="b"><div class="n">${dem.uz!=null?es(dem.uz,1)+' %':'—'}</div><div class="l">Z% (NTC 818)</div></div>
    <div class="b"><div class="n">${dem.io!=null?es(dem.io,1)+' %':'—'}</div><div class="l">Io vacío</div></div>
    <div class="b"><div class="n">${dem.sector==='rur'?'Rural':'Urbano'}</div><div class="l">Sector</div></div>
    <div class="b"><div class="n">${({poste:'Poste',piso:'Piso',pedestal:'Pedestal',seco:'Seco'})[dem.montaje]||dem.montaje||'—'}</div><div class="l">Montaje</div></div>
  </div>`;
  if(kvaTx) body+=`<p>Cargabilidad ≈ <b>${es(dmax/kvaTx*100,0)} %</b>${dem.urbOpen==='1'?' · criterio urbanización abierta ≤70 %':''}.</p>`;
  body+=`<div class="norm"><b>Cadena:</b> Cuadros de carga → DMAX → Tabla 15 DF 2020 → kVA y Z% alimentan Cortocircuito y Canalizaciones/Postes.<br><b>Referencia:</b> NTC 2050 Art. 220 · EMCALI DF 2020 Cap. 5 · NTC 818.</div>`;
  return section('2. Demanda y transformador','DMAX, kVA, Z% y montaje',body);
}

function buildCasa(){
  const j=load('casa_state4')||load('casa_state');
  if(!j||!j.rooms||!j.rooms.length) return section('6. Casa / Apto tipo','Planta, 3D, puntos eléctricos, tuberías',null);
  let body=`<p><b>Proyecto:</b> ${esc(j.projName||'—')} · <b>${j.rooms.length}</b> cuarto(s)</p>`;
  const tub={}, otros={}, pts={toma:0,switch:0,lum:0};
  j.rooms.forEach(rm=>{
    body+=`<h4 style="margin:10px 0 4px">${esc(rm.name)} (${esc(rm.type||'')}) — ${es(rm.L,1)}×${es(rm.W,1)}×${es(rm.H,1)} m · pos (${es(rm.gx,1)}, ${es(rm.gz,1)})</h4>`;
    body+=`<table><thead><tr><th>Elemento</th><th>Tipo</th><th class="n">X</th><th class="n">Z</th><th class="n">Y</th><th class="n">w</th><th>Props</th></tr></thead><tbody>`;
    (rm.items||[]).forEach(it=>{
      const t=it.type||'';
      if(t.indexOf('toma')>=0) pts.toma++;
      if(t.indexOf('switch')>=0) pts.switch++;
      if(t.indexOf('lum')>=0) pts.lum++;
      let props='';
      if(t.indexOf('tub')>=0){
        const key=(it.material||'PVC')+' · '+(it.calibre||'3/4"');
        let L=Number(it.w)||0;
        if(it.bend&&it.bend!=='recta'){
          const ang=it.bend==='curva90'?90:(it.bend==='curva45'?45:180);
          L+=ang/180*Math.PI*(Number(it.rad)||0.25);
        }
        if(!tub[key]) tub[key]=0; tub[key]+=L;
        props=`${it.calibre||''} ${it.material||''} ${it.bend||'recta'}`;
      } else if(it.categoria){ props=it.categoria+(it.note?(' · '+it.note):''); }
      body+=`<tr><td>${esc(it.name||t)}</td><td>${esc(t)}</td><td class="n">${es(it.x,2)}</td><td class="n">${es(it.z,2)}</td>
        <td class="n">${es(it.y,2)}</td><td class="n">${es(it.w,2)}</td><td>${esc(props)}</td></tr>`;
    });
    body+='</tbody></table>';
  });
  body+=`<div class="kpi"><div class="b"><div class="n">${pts.toma}</div><div class="l">Tomas</div></div>
    <div class="b"><div class="n">${pts.switch}</div><div class="l">Interruptores</div></div>
    <div class="b"><div class="n">${pts.lum}</div><div class="l">Luminarias</div></div></div>`;
  const tk=Object.keys(tub);
  if(tk.length){
    body+='<h4>Materiales — tuberías</h4><table><thead><tr><th>Material · calibre</th><th class="n">Longitud (m)</th></tr></thead><tbody>';
    tk.forEach(k=>body+=`<tr><td>${esc(k)}</td><td class="n">${es(tub[k],2)}</td></tr>`);
    body+='</tbody></table>';
  }
  body+=`<div class="norm"><b>Referencia:</b> NTC 2050 Art. 210-52 (tomas), 210-8 (GFCI), Cap. 3 canalizaciones. Vistas: planta por cuarto, planta general y 3D general (imprimir desde el módulo para planos gráficos).</div>`;
  return section('6. Casa / Apto tipo','Inventario de espacios y materiales',body);
}

function buildSub(){
  const j=load('sub_state');
  if(!j||!j.items) return section('4. Celdas y tableros','Sala de equipos · planta y 3D',null);
  const R=j.room||{};
  let body=`<div class="kpi">
    <div class="b"><div class="n">${es(R.L,1)}×${es(R.W,1)}</div><div class="l">Sala (m)</div></div>
    <div class="b"><div class="n">${es(R.H,1)}</div><div class="l">Alto (m)</div></div>
    <div class="b"><div class="n">${es(R.pas,2)}</div><div class="l">Pasillo (m)</div></div>
    <div class="b"><div class="n">${(j.items||[]).length}</div><div class="l">Elementos</div></div>
  </div>`;
  body+=`<table><thead><tr><th>Nombre</th><th>Tipo</th><th class="n">X</th><th class="n">Z</th><th class="n">Y</th><th class="n">w×d×h</th><th>Rot</th></tr></thead><tbody>`;
  (j.items||[]).forEach(it=>{
    body+=`<tr><td>${esc(it.name||it.type)}</td><td>${esc(it.type)}</td><td class="n">${es(it.x,2)}</td><td class="n">${es(it.z,2)}</td>
      <td class="n">${es(it.y,2)}</td><td class="n">${es(it.w,2)}×${es(it.d,2)}×${es(it.h,2)}</td><td>${it.rot||0}°</td></tr>`;
  });
  body+='</tbody></table>';
  body+=`<div class="norm"><b>Referencia:</b> NTC 2050 Art. 110-26 (espacios de trabajo), Art. 408, RETIE subestaciones. Vistas planta/3D: imprimir desde el módulo Celdas.</div>`;
  return section('4. Celdas y tableros','Equipos de media/baja tensión',body);
}

function buildSipra(){
  const j=load('rs3_state');
  if(!j||!j.blocks) return section('3. SIPRA (protección contra rayos)','NTC 4552 / IEC 62305',null);
  const body=`<div class="kpi">
    <div class="b"><div class="n">${(j.blocks||[]).length}</div><div class="l">Estructuras</div></div>
    <div class="b"><div class="n">${j.level||'—'}</div><div class="l">Nivel de riesgo</div></div>
    <div class="b"><div class="n">${j.norm||'—'}</div><div class="l">Norma</div></div>
    <div class="b"><div class="n">${(j.masts||[]).length}</div><div class="l">Mástiles</div></div>
  </div>
  <div class="norm"><b>Referencia:</b> NTC 4552-1/2/3 · IEC 62305. Método de la esfera rodante, anillos, bajantes y varillas. Materiales según módulo SIPRA (lista de materiales allí).</div>`;
  return section('3. SIPRA','Sistema de protección contra rayos',body);
}

function buildSpt(){
  const j=load('spt_state');
  if(!j||!j.p){
    return section('3. Puesta a tierra (malla IEEE 80)','RETIE · IEEE 80 · IEEE 81',
      `<div class="empty">Abra <b>Puesta a tierra</b>, configure la malla (como el Excel) y actualice el informe.</div>
      <div class="norm">IEEE Std 80 · IEEE 81 (medición ρ) · RETIE R≤10 Ω · calibre mín. 2/0 AWG.</div>`);
  }
  const p=j.p, g=j.g||{};
  const body=`<div class="kpi">
    <div class="b"><div class="n">${es(p.kva,1)}</div><div class="l">kVA</div></div>
    <div class="b"><div class="n">${es(p.Ik_kA,2)} kA</div><div class="l">Ik conexión</div></div>
    <div class="b"><div class="n">${es(p.L,1)}×${es(p.W,1)} m</div><div class="l">Malla</div></div>
    <div class="b"><div class="n">${es(p.rho,0)}</div><div class="l">ρ Ω·m</div></div>
    <div class="b"><div class="n">${es(g.LT,1)} m</div><div class="l">L total</div></div>
    <div class="b"><div class="n">${p.cal||'—'}</div><div class="l">Conductor</div></div>
    <div class="b"><div class="n">${p.NR||0}×${es(p.Lr,1)} m</div><div class="l">Electrodos</div></div>
  </div>
  <div class="norm"><b>Cadena:</b> Demanda/Cortocircuito (kVA, Ik, Z) → malla. Verificar Rm, GPR, Em, Es en el módulo.<br>
  <b>Referencia:</b> IEEE Std 80 · IEEE 81 · RETIE · NTC 2050 Art. 250.</div>`;
  return section('3. Puesta a tierra (malla IEEE 80)','Entradas y geometría del diseño',body);
}

function buildAcc(){
  const a=load('acc_state');
  const dem=load('dem_state')||{};
  if(!a){
    return section('1. Cortocircuito y protecciones','Acometida BT / MT',
      `<div class="empty">Abra el módulo <b>Cortocircuito y protecciones</b>, ejecute el cálculo (se guardan Ik, Icc, fusible e interruptor) y pulse Actualizar aquí.</div>
      <div class="norm"><b>Cadena:</b> Demanda (kVA, Z%) → este módulo (Icc, brk, fusible). Ref: NTC 2050 Art. 110-9, 240 · RETIE.</div>`);
  }
  const ph=a.ph===1?'Monofásico':'Trifásico';
  const body=`<div class="kpi">
    <div class="b"><div class="n">${es(a.kVA,1)}</div><div class="l">kVA trafo</div></div>
    <div class="b"><div class="n">${es(a.Vsec,0)} V</div><div class="l">V secundario</div></div>
    <div class="b"><div class="n">${es(a.Vmt,1)} kV</div><div class="l">V primario</div></div>
    <div class="b"><div class="n">${ph}</div><div class="l">Tipo</div></div>
    <div class="b"><div class="n">${es(a.Zpct,1)} %</div><div class="l">Z trafo</div></div>
    <div class="b"><div class="n">${es(a.Ibase,1)} A</div><div class="l">I nominal sec.</div></div>
    <div class="b"><div class="n">${es(a.Icc,0)} A</div><div class="l">Icc simétrico</div></div>
    <div class="b"><div class="n">${es(a.Iasim,0)} A</div><div class="l">Icc asimétrico</div></div>
    <div class="b"><div class="n">${es(a.brk,1)} kA</div><div class="l">Interruptor mín.</div></div>
    <div class="b"><div class="n">${es(a.Iprim,2)} A</div><div class="l">I prim. MT</div></div>
    <div class="b"><div class="n">${es(a.fus,0)} K</div><div class="l">Fusible MT</div></div>
    <div class="b"><div class="n">${a.Icc_red!=null?es(a.Icc_red,2):'—'}</div><div class="l">Ik OR (kA)</div></div>
  </div>
  <p style="font-size:12px;line-height:1.45">Z total = ${es(a.Ztot,4)} p.u. · Ztrafo = ${es(a.Ztr,4)} · Zc red = ${es(a.Zc,5)} · k asim = ${es(a.kAsim,2)} · fs fusible = ${es(a.fs,2)}.
  ${dem.kvaTx?(' <b>Origen kVA:</b> demanda/selección trafo ('+es(dem.kvaTx,1)+' kVA).'):''}
  ${dem.uz?(' <b>Z% demandado:</b> '+es(dem.uz,1)+' %.'):''}</p>
  <div class="norm"><b>Referencia:</b> NTC 2050 Art. 110-9, 215-3, 240 · coordinación de protecciones · dato Ik del operador de red · RETIE.</div>`;
  return section('1. Cortocircuito y protecciones','Icc, interruptor y fusible MT',body);
}

function buildVd(){
  const body=`<div class="empty">Caída de tensión por tramos: imprimir desde el módulo con canalización PVC / aluminio / acero / bandeja.</div>
  <div class="norm"><b>Referencia:</b> NTC 2050 Cap. 9 (impedancias), Art. 210-19 / 215-2 (límites de regulación).</div>`;
  return section('7. Caída de tensión','Regulación de conductores',body);
}

function buildCan(){
  const cfg=load('can_cfg');
  const wires=load('can_wires');
  const dem=load('dem_state')||{};
  let body='';
  if(cfg||wires){
    body+=`<div class="kpi">
      <div class="b"><div class="n">${cfg&&cfg.type?esc(cfg.type):'—'}</div><div class="l">Tipo canalización</div></div>
      <div class="b"><div class="n">${cfg&&cfg.size?esc(String(cfg.size)):'—'}</div><div class="l">Tamaño</div></div>
      <div class="b"><div class="n">${wires&&wires.length?wires.length:'—'}</div><div class="l">Grupos de conductores</div></div>
      <div class="b"><div class="n">${dem.kvaTx!=null?es(dem.kvaTx,1)+' kVA':'—'}</div><div class="l">Trafo (ref.)</div></div>
    </div>`;
    body+=`<p style="font-size:12px">Incluye selección EMCALI de conductores MT/BT y postes (Anexo 1) en el módulo Canalizaciones. Detalle de % llenado y EGC: ver captura o módulo.</p>`;
  } else {
    body=`<div class="empty">Configure canalizaciones / conductores EMCALI / postes y actualice.</div>`;
  }
  body+=`<div class="norm"><b>Cadena:</b> Demanda (kVA, sistema) → calibres Tabla 2.4/2.5 COND 2020 → postes LT 2020 · llenado Cap. 9 NTC 2050 · EGC Art. 250-122.</div>`;
  return section('9. Canalizaciones, conductores y postes EMCALI','Llenado · MT/BT · apoyos',body);
}

function buildNtc(){
  const body=`<div class="empty">Ejecute «Analizar proyecto» en Recomendaciones NTC 2050 e imprima desde ese módulo para el detalle de hallazgos.</div>
  <div class="norm"><b>Referencia:</b> NTC 2050 completo · RETIE. Hallazgos coordinados con cuadros, casa y celdas.</div>`;
  return section('10. Recomendaciones NTC 2050','Cumplimiento y sugerencias',body);
}


function snapBlock(title, key){
  const ser=localStorage.getItem(key);
  if(!ser) return '';
  let svg=ser;
  if(!/width=/.test(svg)) svg=svg.replace('<svg', '<svg width="100%" height="300"');
  else {
    svg=svg.replace(/\swidth="[^"]*"/, ' width="100%"');
    svg=svg.replace(/\sheight="[^"]*"/, ' height="300"');
  }
  return '<div style="margin:10px 0;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fafbfc">'
    +'<div style="font-size:11px;font-weight:800;margin-bottom:6px;color:var(--blue)">'+esc(title)+'</div>'
    +'<div style="overflow:auto;max-height:340px">'+svg+'</div></div>';
}
function buildViews(){
  let body='';
  const pairs=[
    ['sub_snap_planta','Celdas · Planta'],['sub_snap_v3d','Celdas · 3D'],['sub_snap_lista','Celdas · Lista'],['sub_snap_main','Celdas'],
    ['casa_snap_planta','Casa · Cuarto'],['casa_snap_general','Casa · General'],['casa_snap_v3d','Casa · 3D'],['casa_snap_main','Casa'],
    ['sipra_snap_planta','SIPRA · Planta'],['sipra_snap_v3d','SIPRA · 3D'],['sipra_snap_main','SIPRA'],
    ['spt_snap_main','Puesta a tierra'],['spt_snap_3d','Puesta a tierra · 3D']
  ];
  const seen={};
  pairs.forEach(([k,title])=>{
    if(seen[k]) return;
    if(localStorage.getItem(k)){ body+=snapBlock(title,k); seen[k]=1; }
  });
  if(!body) body='<div class="empty">Aún no hay capturas. Abra <b>Celdas</b>, <b>Casa/Apto</b>, <b>SIPRA</b>, etc., mire planta y 3D (unos segundos) y pulse <b>Actualizar</b> aquí.</div>';
  body+='<div class="norm"><b>Nota:</b> Cada captura es la última vista renderizada en ese módulo. Cambie a planta y a 3D en cada uno para guardar ambas.</div>';
  return section('0. Vistas gráficas del proyecto','Capturas SVG embebidas',body);
}

function buildSummary(){
  const P=load('suite_proyecto')||{};
  const dem=load('dem_state')||{};
  const acc=load('acc_state')||{};
  const cc=load('cc_state3');
  const spt=load('spt_state');
  const rs=load('rs3_state');
  let nTab=0, sumKva=0;
  if(cc&&cc.boards){ nTab=cc.boards.length; cc.boards.forEach(b=>sumKva+=boardKva(b)); }
  const Vsec=acc.Vsec||208, Vmt=acc.Vmt||13.2;
  const body=`<div class="kpi">
    <div class="b"><div class="n">${nTab||'—'}</div><div class="l">Tableros</div></div>
    <div class="b"><div class="n">${es(sumKva,1)}</div><div class="l">kVA conectados</div></div>
    <div class="b"><div class="n">${dem.dmax!=null?es(dem.dmax,1):'—'}</div><div class="l">DMAX kVA</div></div>
    <div class="b"><div class="n">${dem.kvaTx!=null?es(dem.kvaTx,1):'—'}</div><div class="l">Trafo kVA</div></div>
    <div class="b"><div class="n">${es(Vsec,0)} V</div><div class="l">Tensión BT</div></div>
    <div class="b"><div class="n">${es(Vmt,1)} kV</div><div class="l">Tensión MT</div></div>
    <div class="b"><div class="n">${acc.Icc!=null?es(acc.Icc,0)+' A':'—'}</div><div class="l">Icc simétrico</div></div>
    <div class="b"><div class="n">${acc.brk!=null?es(acc.brk,1)+' kA':'—'}</div><div class="l">Interruptor</div></div>
    <div class="b"><div class="n">${rs&&rs.level?esc(String(rs.level)):'—'}</div><div class="l">Nivel SIPRA</div></div>
    <div class="b"><div class="n">${spt?'OK':'—'}</div><div class="l">SPT</div></div>
  </div>
  <div class="norm" style="line-height:1.55">
    <b>Flujo de datos del proyecto (cadena):</b><br>
    1. <b>Datos del proyecto</b> (nombre, cliente, ingeniero) → encabezado e impresión.<br>
    2. <b>Cuadros de carga</b> (tensión, sistema, circuitos) → kVA por tablero.<br>
    3. <b>Demanda / transformador</b> (F. demanda → DMAX → Tabla 15 → kVA, Z%, montaje) → alimenta cortocircuito y EMCALI.<br>
    4. <b>Cortocircuito</b> (kVA + Z% + Ik OR + V) → Icc, interruptor, fusible MT.<br>
    5. <b>Canalizaciones / conductores / postes</b> (kVA, sistema, zona) → calibres COND 2020 y apoyos LT 2020.<br>
    6. <b>SIPRA / SPT / aislamiento / VD</b> → según diseño y normas asociadas.<br>
    <i>Abra cada módulo, calcule y pulse «Actualizar» en este informe para consolidar.</i>
  </div>`;
  return section('Resumen ejecutivo y datos básicos del sistema','Valores que alimentan el resto del diseño',body);
}

function build(){
  const now=new Date().toLocaleString('es-CO');
  const P=load('suite_proyecto')||{};
  const firmImg=P.sigData?('<img src="'+P.sigData+'" alt="Firma" style="max-height:64px;display:block;margin:0 auto 6px">'):'';
  let h=`<div class="cover">
    <h2>${esc(P.projName||'Informe técnico de proyecto eléctrico')}</h2>
    <div class="meta">
      <b>Código:</b> ${esc(P.projCode||'—')} &nbsp;·&nbsp; <b>Fecha:</b> ${esc(P.projDate||now)}<br>
      <b>Cliente:</b> ${esc(P.client||'—')}<br>
      <b>Ubicación:</b> ${esc(P.location||'—')}<br>
      ${P.desc?('<b>Alcance:</b> '+esc(P.desc)+'<br>'):''}
      Generado: ${esc(now)} · Suite eléctrica — memoria consolidada de cálculos, normas y vistas
    </div>
  </div>`;
  h+=buildSummary();
  h+=buildViews();
  h+=buildCC();
  h+=buildDem();
  h+=buildAcc();
  h+=buildCan();
  h+=buildVd();
  h+=buildAisl();
  h+=buildSpt();
  h+=buildSipra();
  h+=buildSub();
  h+=buildCasa();
  h+=buildNtc();
  h+=`<section class="sec" id="bloque-firma"><h3>Responsable del diseño</h3>
    <div style="display:flex;justify-content:flex-end;margin-top:12px">
      <div style="text-align:center;min-width:220px">
        ${firmImg}
        <div style="border-top:1px solid #333;margin-top:8px;padding-top:6px;font-size:12px">
          <b>${esc(P.engName||'Ingeniero responsable')}</b><br>
          ${P.engTP?('TP / Matrícula: '+esc(P.engTP)+'<br>'):''}
          ${P.engCo?esc(P.engCo)+'<br>':''}
          ${P.engMail?esc(P.engMail)+'<br>':''}
          Firma y sello
        </div>
      </div>
    </div>
  </section>`;
  h+=`<div class="foot">Documento de asistencia al diseño. No sustituye memorias firmadas ni revisión oficial RETIE/NTC 2050.</div>`;
  document.getElementById('report').innerHTML=h;
}

document.getElementById('btnRefresh').onclick=build;
document.getElementById('btnPrint').onclick=()=>{build();setTimeout(()=>window.print(),200);};
build();
})();

</script>
<script type="text/html" id="src-graf">
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gráficos y estilo</title>
<style>
  :root{--bg:#eef1f6;--panel:#fff;--ink:#12233d;--mut:#5a6b85;--line:#dbe3ee;--blue:#123a63;--blue2:#1f5fd0;--font:"Times New Roman",Times,serif}

  h1,h2{font-weight:700} .sub,.desc,label{font-weight:700;font-style:italic}

  select,button.opt{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;background:#f4f7fb;cursor:pointer}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .swatch{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Gráficos y estilo</h1>
    <div class="sub">Fuente · colores · grosor de línea · se aplica a toda la suite</div>
  </header>

  <section class="card">
    <h2>Fuente</h2>
    <div class="desc">Títulos en negrita; subtítulos en negrita cursiva.</div>
    <div class="f">
      <label>Familia tipográfica</label>
      <select id="font">
        <option value="times">Times New Roman (actual)</option>
        <option value="sans">Anterior (Inter / Segoe / system-ui)</option>
        <option value="serif">Serif genérica (Georgia)</option>
        <option value="mono">Monoespaciada (Consolas)</option>
      </select>
    </div>
  </section>

  <section class="card">
    <h2>Tema de color</h2>
    <div class="desc">Paleta de la interfaz (módulos al recargar la pestaña).</div>
    <div class="f">
      <label>Tema</label>
      <select id="theme">
        <option value="light">Claro profesional</option>
        <option value="dark">Oscuro</option>
        <option value="blueprint">Plano / blueprint</option>
        <option value="sand">Arena / técnico</option>
      </select>
    </div>
    <div class="swatch" id="swatches"></div>
  </section>

  <section class="card">
    <h2>Grosor de línea (planta y 3D)</h2>
    <div class="desc">Antes estaba en el menú lateral; ahora se controla aquí.</div>
    <div class="row2">
      <button class="opt" type="button" id="lwThick">━ Línea gruesa</button>
      <button class="opt" type="button" id="lwThin">┄ Línea fina</button>
    </div>

  <section class="card">
    <h2>Referencia normativa de esta sección</h2>
    <div class="desc" style="font-style:normal;font-weight:400;line-height:1.55">
      La presentación gráfica de planos y modelos 3D es una ayuda de diseño. Las dimensiones, distancias de seguridad y simbología deben confrontarse con la <b>NTC 2050</b>, el <b>RETIE</b> y las normas de producto aplicables. El grosor de línea y el estilo visual no modifican los resultados de cálculo ni sustituyen los planos oficiales firmados.
    </div>
  </section>
</div>
<script>
(function(){
const KEY='suite_style';
const $=id=>document.getElementById(id);
function load(){

(function(){
const $=id=>document.getElementById(id);
const R3=Math.sqrt(3);
const es=(x,d=2)=>Number(x).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});

/* Ampacidad base 30°C, ≤3 conductores — NTC 2050 T310-16 orientativa */
const WIRES={
  '14': {awg:'14 AWG',  cu75:20, cu90:25,  al75:0,  al90:0,   rCu:10.2, xPVC:0.19, xAl:0.205, xAcero:0.24, xBan:0.18, rAl:16.6},

  '8':  {awg:'8 AWG',   cu75:50, cu90:55,  al75:40, al90:45,  rCu:2.55, xPVC:0.171, xAl:0.185, xAcero:0.213, xBan:0.162, rAl:4.10},
  '6':  {awg:'6 AWG',   cu75:65, cu90:75,  al75:50, al90:55,  rCu:1.61, xPVC:0.158, xAl:0.171, xAcero:0.197, xBan:0.15, rAl:2.58},
  '4':  {awg:'4 AWG',   cu75:85, cu90:95,  al75:65, al90:75,  rCu:1.01, xPVC:0.151, xAl:0.163, xAcero:0.187, xBan:0.143, rAl:1.62},
  '2':  {awg:'2 AWG',   cu75:115,cu90:130, al75:90, al90:100, rCu:0.637,xPVC:0.144, xAl:0.156, xAcero:0.177, xBan:0.137, rAl:1.02},
  '1':  {awg:'1 AWG',   cu75:130,cu90:145, al75:100,al90:115, rCu:0.505,xPVC:0.144, xAl:0.156, xAcero:0.177, xBan:0.137, rAl:0.808},
  '1/0':{awg:'1/0 AWG', cu75:150,cu90:170, al75:120,al90:135, rCu:0.400,xPVC:0.138, xAl:0.149, xAcero:0.171, xBan:0.131, rAl:0.641},
  '2/0':{awg:'2/0 AWG', cu75:175,cu90:195, al75:135,al90:150, rCu:0.318,xPVC:0.135, xAl:0.146, xAcero:0.167, xBan:0.128, rAl:0.508},
  '3/0':{awg:'3/0 AWG', cu75:200,cu90:225, al75:155,al90:175, rCu:0.252,xPVC:0.131, xAl:0.141, xAcero:0.161, xBan:0.124, rAl:0.403},
  '4/0':{awg:'4/0 AWG', cu75:230,cu90:260, al75:180,al90:205, rCu:0.200,xPVC:0.128, xAl:0.138, xAcero:0.157, xBan:0.122, rAl:0.319},
  '250':{awg:'250 kcmil',cu75:255,cu90:290,al75:205,al90:230, rCu:0.169,xPVC:0.128, xAl:0.138, xAcero:0.157, xBan:0.122, rAl:0.269},
  '300':{awg:'300 kcmil',cu75:285,cu90:320,al75:230,al90:260, rCu:0.141,xPVC:0.125, xAl:0.135, xAcero:0.151, xBan:0.119, rAl:0.226},
  '350':{awg:'350 kcmil',cu75:310,cu90:350,al75:250,al90:280, rCu:0.121,xPVC:0.122, xAl:0.132, xAcero:0.148, xBan:0.116, rAl:0.193},
  '400':{awg:'400 kcmil',cu75:335,cu90:380,al75:270,al90:305, rCu:0.106,xPVC:0.122, xAl:0.132, xAcero:0.148, xBan:0.116, rAl:0.169},
  '500':{awg:'500 kcmil',cu75:380,cu90:430,al75:310,al90:350, rCu:0.085,xPVC:0.118, xAl:0.127, xAcero:0.141, xBan:0.112, rAl:0.135},
  '600':{awg:'600 kcmil',cu75:420,cu90:475,al75:340,al90:385, rCu:0.071,xPVC:0.115, xAl:0.124, xAcero:0.138, xBan:0.109, rAl:0.113},
  '750':{awg:'750 kcmil',cu75:475,cu90:535,al75:385,al90:435, rCu:0.057,xPVC:0.112, xAl:0.121, xAcero:0.131, xBan:0.106, rAl:0.090}
};
/* R Ω/km orientativo @75°C; X Ω/km: PVC, aluminio, acero, bandeja (orientativo Cap.9 / práctica) */

const CF_TEMP_90={30:1.00,35:0.96,40:0.91,45:0.87,50:0.82};
const CF_TEMP_75={30:1.00,35:0.94,40:0.88,45:0.82,50:0.75};

function cfGroup(n){
  n=parseInt(n)||3;
  if(n<=3) return 1;
  if(n<=6) return 0.80;
  if(n<=9) return 0.70;
  if(n<=20) return 0.50;
  if(n<=30) return 0.45;
  if(n<=40) return 0.40;
  return 0.35;
}
function cfTemp(tamb, taisl){
  const t=parseInt(tamb)||40;
  const map=taisl==='75'?CF_TEMP_75:CF_TEMP_90;
  // nearest
  const keys=Object.keys(map).map(Number).sort((a,b)=>a-b);
  let best=keys[0];
  for(const k of keys) if(Math.abs(k-t)<=Math.abs(best-t)) best=k;
  return map[best];
}
function ampBase(cal, mat, taisl){
  const w=WIRES[cal]; if(!w) return 0;
  const key=(mat==='al'?'al':'cu')+taisl;
  return w[key]||0;
}
function RX(cal, mat, canal){
  const w=WIRES[cal]; if(!w) return {R:1,X:0.15};
  const R = mat==='al' ? (w.rAl||w.rCu*1.6) : w.rCu;
  let X = w.xPVC;
  if(canal==='acero' || canal==='steel') X = w.xAcero;
  else if(canal==='al' || canal==='aluminio') X = w.xAl != null ? w.xAl : w.xPVC*1.08;
  else if(canal==='bandeja' || canal==='tray') X = w.xBan != null ? w.xBan : w.xPVC*0.95;
  else X = w.xPVC; // pvc / no magnético
  return {R,X};
}

function defaultRows(){
  return [
    {id:1, desc:'Alimentador principal', tipo:'alimentador', conf:'3F', V:208, mat:'cu', cal:'2/0', canal:'pvc', I:150, L:45, fp:0.90, nCond:4, parallel:1},
    {id:2, desc:'Derivado tablero 1', tipo:'derivado', conf:'3F', V:208, mat:'cu', cal:'6', canal:'pvc', I:40, L:25, fp:0.92, nCond:4, parallel:1},
    {id:3, desc:'Derivado monofásico', tipo:'derivado', conf:'1F', V:120, mat:'cu', cal:'12', canal:'pvc', I:16, L:30, fp:0.95, nCond:2, parallel:1}
  ];
}

let rows=[];
try{const j=JSON.parse(localStorage.getItem('vd_rows')); if(j&&j.length) rows=j;}catch(e){}
if(!rows.length) rows=defaultRows();

function save(){try{localStorage.setItem('vd_rows',JSON.stringify(rows));}catch(e){}}
function toggleTheme(){
  const d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';
  d.dataset.theme=t;$("themeBtn").textContent=t==='dark'?'☀️':'🌙';
  try{localStorage.setItem('vd_theme',t);}catch(e){}
}

function calcRow(r){
  const taisl=$("Taisl").value;
  const tamb=$("Tamb").value;
  const base=ampBase(r.cal, r.mat, taisl);
  const cfT=cfTemp(tamb, taisl);
  const cfG=cfGroup(r.nCond);
  const ampAdj=base*cfT*cfG*(r.parallel||1);
  const {R,X}=RX(r.cal, r.mat, r.canal);
  // parallel conductors: R and X divide by parallel
  const Rp=R/(r.parallel||1), Xp=X/(r.parallel||1);
  const Lkm=(r.L||0)/1000;
  const I=r.I||0, fp=Math.min(1,Math.max(0.1,r.fp||0.9));
  const sen=Math.sqrt(Math.max(0,1-fp*fp));
  const conf=r.conf||'3F';
  let dV=0;
  if(conf==='1F'||conf==='2F'){
    dV = 2 * I * Lkm * (Rp*fp + Xp*sen);
  } else {
    dV = R3 * I * Lkm * (Rp*fp + Xp*sen);
  }
  const V=r.V||208;
  const pct = V>0 ? (dV/V)*100 : 0;
  const lim = r.tipo==='alimentador' ? parseFloat($("limTotal").value)||5 : parseFloat($("limBranch").value)||3;
  // For alimentador alone often 2-3%, but we use limTotal as reference for feeder rows; branch uses limBranch
  const limUse = r.tipo==='alimentador' ? (parseFloat($("limTotal").value)||5) : (parseFloat($("limBranch").value)||3);
  const okAmp = I <= ampAdj + 1e-6;
  const okVD = pct <= limUse + 1e-6;
  return {base, cfT, cfG, ampAdj, R:Rp, X:Xp, dV, pct, limUse, okAmp, okVD};
}

function wireOpts(sel){
  return Object.keys(WIRES).map(k=>`<option value="${k}" ${k===sel?'selected':''}>${WIRES[k].awg}</option>`).join('');
}

function addRow(){
  const id=Date.now();
  rows.push({id, desc:'Nuevo circuito', tipo:'derivado', conf:'3F', V:208, mat:'cu', cal:'10', canal:'pvc', I:20, L:20, fp:0.9, nCond:4, parallel:1});
  render();
}
function delRow(i){rows.splice(i,1);render();}
function upd(i,k,v){
  const r=rows[i];
  if(['I','L','fp','V','nCond','parallel'].includes(k)) r[k]=parseFloat(v)||0;
  else r[k]=v;
  render();
}

function render(){
  let h=`<thead><tr>
    <th>Descripción</th><th>Tipo</th><th>Conf.</th><th>Vn (V)</th><th>Material</th><th>Calibre</th><th>Canalización</th>
    <th>I (A)</th><th>L (m)</th><th>F.P.</th><th>N° cond.</th><th>Paralelos</th>
    <th>Amp. corr. (A)</th><th>ΔV (V)</th><th>% ΔV</th><th>Límite</th><th>Estado</th><th></th>
  </tr></thead><tbody>`;

  let sumBranch=0, sumFeed=0;
  rows.forEach((r,i)=>{
    const c=calcRow(r);
    if(r.tipo==='derivado') sumBranch+=c.pct; else sumFeed+=c.pct;
    const stAmp=c.okAmp?'':' ⚠I';
    const stVD=c.okVD?'OK':'ALTO';
    const cls=c.okAmp&&c.okVD?'ok':(!c.okVD?'bad':'warn');
    h+=`<tr>
      <td><input value="${(r.desc||'').replace(/"/g,'&quot;')}" onchange="upd(${i},'desc',this.value)"></td>
      <td><select onchange="upd(${i},'tipo',this.value)">
        <option value="derivado" ${r.tipo==='derivado'?'selected':''}>Derivado</option>
        <option value="alimentador" ${r.tipo==='alimentador'?'selected':''}>Alimentador</option>
      </select></td>
      <td><select onchange="upd(${i},'conf',this.value)">
        <option value="1F" ${r.conf==='1F'?'selected':''}>1φ</option>
        <option value="2F" ${r.conf==='2F'?'selected':''}>2φ</option>
        <option value="3F" ${r.conf==='3F'?'selected':''}>3φ</option>
      </select></td>
      <td><input type="number" step="1" value="${r.V}" style="width:64px;text-align:right" onchange="upd(${i},'V',this.value)"></td>
      <td><select onchange="upd(${i},'mat',this.value)">
        <option value="cu" ${r.mat==='cu'?'selected':''}>Cu</option>
        <option value="al" ${r.mat==='al'?'selected':''}>Al</option>
      </select></td>
      <td><select onchange="upd(${i},'cal',this.value)">${wireOpts(r.cal)}</select></td>
      <td><select onchange="upd(${i},'canal',this.value)">
        <option value="pvc" ${r.canal==='pvc'?'selected':''}>PVC (no magnético)</option>
        <option value="al" ${r.canal==='al'?'selected':''}>Aluminio</option>
        <option value="acero" ${r.canal==='acero'?'selected':''}>Acero (magnético)</option>
        <option value="bandeja" ${r.canal==='bandeja'?'selected':''}>Bandeja portacables</option>
      </select></td>
      <td><input type="number" step="0.1" value="${r.I}" style="width:58px;text-align:right" onchange="upd(${i},'I',this.value)"></td>
      <td><input type="number" step="0.1" value="${r.L}" style="width:58px;text-align:right" onchange="upd(${i},'L',this.value)"></td>
      <td><input type="number" step="0.01" min="0.1" max="1" value="${r.fp}" style="width:52px;text-align:center" onchange="upd(${i},'fp',this.value)"></td>
      <td><input type="number" step="1" min="1" value="${r.nCond}" style="width:48px;text-align:center" onchange="upd(${i},'nCond',this.value)"></td>
      <td><input type="number" step="1" min="1" value="${r.parallel||1}" style="width:48px;text-align:center" onchange="upd(${i},'parallel',this.value)"></td>
      <td class="num ${c.okAmp?'ok':'bad'}">${es(c.ampAdj,1)}</td>
      <td class="num">${es(c.dV,2)}</td>
      <td class="num ${c.okVD?'ok':'bad'}">${es(c.pct,2)} %</td>
      <td class="num">${es(c.limUse,1)} %</td>
      <td class="${cls}" style="font-weight:800;text-align:center">${stVD}${stAmp}</td>
      <td><button class="btn red" style="padding:4px 8px" onclick="delRow(${i})">✕</button></td>
    </tr>`;
  });

  const limB=parseFloat($("limBranch").value)||3;
  const limT=parseFloat($("limTotal").value)||5;
  const totalPct=sumFeed+sumBranch;
  h+=`<tr class="tot"><td colspan="12">Suma % (alimentadores + derivados de la tabla)</td>
    <td></td><td></td><td class="num ${totalPct<=limT?'ok':'bad'}">${es(totalPct,2)} %</td>
    <td class="num">${es(limT,1)} %</td><td class="${totalPct<=limT?'ok':'bad'}" style="font-weight:800;text-align:center">${totalPct<=limT?'OK':'ALTO'}</td><td></td></tr>`;
  h+='</tbody>';
  $("tbl").innerHTML=h;

  $("notes").innerHTML=`<b>Resumen:</b> % alimentadores ≈ <b>${es(sumFeed,2)} %</b> · % derivados ≈ <b>${es(sumBranch,2)} %</b> · total ≈ <b>${es(totalPct,2)} %</b>
    (límite total ${es(limT,1)} % · límite derivado ${es(limB,1)} %).
    Ampacidad corregida = base × Cf temperatura × Cf agrupamiento × paralelos. ΔV con R–X del conductor y tipo de canalización.`;
  save();
}

window.upd=upd; window.delRow=delRow; window.addRow=addRow;
$("themeBtn").textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';
render();
})();
@@CLOSE_SCRIPT@@
</body>
