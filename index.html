<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suite eléctrica — Ing. Alexander Espinosa</title>
<style>
  :root {
    --sidebar-w: 268px;
    --bg: #0b1120;
    --panel: #111a2c;
    --panel2: #0c1526;
    --ink: #e8eefb;
    --mut: #96a3ba;
    --faint: #5d6b83;
    --line: #22304a;
    --blue: #5b90e6;
    --blue2: #3b74d0;
    --green: #34d399;
    --amber: #f2b530;
    --violet: #a78bfa;
    --cyan: #22d3ee;
    --sans: "Times New Roman", Times, serif;
    --sh: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: var(--sans); background: var(--bg); color: var(--ink); }
  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: 100vh;
  }
  /* ===== SIDEBAR ===== */
  .sidebar {
    background: linear-gradient(180deg, #0e1628 0%, #0b1120 100%);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    overflow-y: auto;
    z-index: 20;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 6px 8px 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
  }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, var(--blue), var(--violet));
    display: grid; place-items: center; flex: none;
  }
  .brand .logo svg { width: 22px; height: 22px; }
  .brand h1 { font-size: 14px; font-weight: 800; line-height: 1.2; margin: 0; }
  .brand .sub { font-size: 10px; color: var(--mut); font-weight: 600; margin-top: 2px; }
  .brand .nm { font-size: 10px; color: var(--amber); font-weight: 800; margin-top: 1px; }

  .nav-label {
    font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint); font-weight: 800; margin: 8px 8px 7px;
  }
  .nav {
    display: flex; flex-direction: column; gap: 5px;
  }
  .nav button {
    display: flex; align-items: flex-start; gap: 11px;
    width: 100%; text-align: left;
    border: 1px solid transparent;
    background: transparent;
    color: var(--mut);
    padding: 11px 12px;
    border-radius: 11px;
    cursor: pointer;
    transition: .14s;
    font-family: inherit;
  }
  .nav button:hover { background: rgba(255,255,255,.04); color: var(--ink); border-color: var(--line); }
  .nav button.on {
    background: linear-gradient(120deg, rgba(91,144,230,.18), rgba(167,139,250,.12));
    border-color: rgba(91,144,230,.35);
    color: var(--ink);
  }
  .nav button .num {
    width: 24px; height: 24px; border-radius: 7px;
    background: var(--panel); border: 1px solid var(--line);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 800; color: var(--mut); flex: none;
  }
  .nav button.on .num {
    background: linear-gradient(135deg, var(--blue), var(--violet));
    border-color: transparent; color: #fff;
  }
  .nav button .txt { flex: 1; min-width: 0; }
  .nav button .txt b { display: block; font-size: 12.5px; font-weight: 800; line-height: 1.25; }
  .nav button .txt span { display: block; font-size: 10.5px; color: var(--faint); font-weight: 600; margin-top: 2px; line-height: 1.3; }
  .nav button.on .txt span { color: var(--mut); }

  .sidebar .foot {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 10.5px;
    color: var(--faint);
    line-height: 1.45;
    padding-left: 6px;
  }
  .sidebar .foot b { color: var(--mut); }

  /* ===== MAIN ===== */
  .main {
    position: relative;
    background: #05080f;
    overflow: hidden;
  }
  .frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: #0b1120;
  }
  .frame.on { display: block; }

  /* Mobile */
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      width: min(86vw, 300px);
      transform: translateX(-100%);
      transition: transform .22s ease;
      box-shadow: var(--sh);
    }
    .sidebar.open { transform: translateX(0); }
    .burger {
      position: fixed; top: 12px; left: 12px; z-index: 30;
      width: 42px; height: 42px; border-radius: 11px;
      border: 1px solid var(--line); background: var(--panel);
      color: var(--ink); font-size: 18px; cursor: pointer;
      display: grid; place-items: center;
    }
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 19; display: none;
    }
    .overlay.show { display: block; }
  }
  @media (min-width: 821px) {
    .burger, .overlay { display: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>

      <div>
        <h1>Suite Eléctrica</h1>

<div class="nav-label">Flujo del proyecto</div>
    <nav class="nav">

      </button>

          <span>Paso 2 · carga diversificada · kVA</span>
        </span>
      </button>
      <button data-tool="aisl" onclick="showTool('aisl')">
        <span class="num">3</span>
        <span class="txt">

          <span>Paso 3 · NTC 4552 · RETIE · tablas</span>
        </span>
      </button>
      <button data-tool="acc" onclick="showTool('acc')">
        <span class="num">4</span>

          <b>Cortocircuito y protecciones</b>

      <button data-tool="sipra" onclick="showTool('sipra')">
        <span class="num">7</span>
        <span class="txt">
          <b>Diseño SIPRA</b>
          <span>Esfera · cobertura · bajantes</span>

      </button>
      <button data-tool="sub" onclick="showTool('sub')">

        <span class="txt">
          <b>Celdas y tableros</b>
          <span>Sala · planta · 3D</span>

      </button>
      <button data-tool="casa" onclick="showTool('casa')">
        <span class="num">9</span>

          <span>Planta · puntos · tuberías</span>

      </button>
      <button data-tool="vd" onclick="showTool('vd')">
        <span class="num">10</span>
        <span class="txt">
          <b>Caída de tensión</b>
          <span>Regulación · canalización</span>
        </span>
      </button>
      <button data-tool="can" onclick="showTool('can')">
        <span class="num">11</span>
        <span class="txt">
          <b>Canalizaciones</b>
          <span>Llenado · EMCALI · Postes aéreos</span>

      <button data-tool="ntc" onclick="showTool('ntc')">
        <span class="num">12</span>
        <span class="txt">
          <b>Recomendaciones NTC 2050</b>
          <span>Cumplimiento · sugerencias</span>
        </span>
      </button>
      <button data-tool="inf" onclick="showTool('inf')">
        <span class="num">13</span>
        <span class="txt">
          <b>Informe / Imprimir</b>
          <span>Vistas · cálculos · normas · materiales</span>
        </span>
      </button>
      <button data-tool="graf" onclick="showTool('graf')">
        <span class="num">14</span>
        <span class="txt">
          <b>Gráficos</b>
          <span>Fuente · colores · grosor de línea</span>
        </span>
      </button>
    </nav>

    <div class="foot">
      <b>NTC 2050 · RETIE 2024</b><br>
      IEEE 80 · NTC 4552 · IEC 62305<br>
      Herramientas de asistencia técnica.<br>
      Verificar y firmar por ingeniero responsable.
    </div>
  </aside>

  <main class="main">
    <iframe class="frame on" id="frame-proj" title="Datos del proyecto"></iframe>
    <iframe class="frame" id="frame-acc" title="Calculadoras de Acometida BT"></iframe>

    <iframe class="frame" id="frame-inf" title="Informe de proyecto"></iframe>
    <iframe class="frame" id="frame-graf" title="Gráficos y estilo"></iframe>
  </main>
</div>

<button class="burger" id="burger" onclick="toggleSide()">☰</button>

<!doctype html>

<head>

<script>(function(){try{var t=localStorage.getItem('proj_theme')||'light';document.documentElement.dataset.theme=t;}catch(e){}})();@@CLOSE_SCRIPT@@
<style>

  /* Tipografía global suite */
  :root, body, button, input, select, textarea {
    font-family: "Times New Roman", Times, serif !important;
  }
  h1, h2, h3, h4, .nav button .txt b, header.top h1, .logo + div b {
    font-weight: 700 !important;
    font-style: normal !important;
  }
  .nav button .txt span, header.top .sub, .sub, .desc, .nav-label, .hint {
    font-weight: 700 !important;
    font-style: italic !important;
  }

  :root{--bg:#eef1f6;--panel:#fff;--panel2:#f4f7fb;--ink:#12233d;--mut:#5a6b85;--line:#dbe3ee;--blue:#123a63;--blue2:#1f5fd0;--amber:#c07d00;
    --sans:Inter,Segoe UI,system-ui,Arial,sans-serif}
  [data-theme="dark"]{--bg:#0b1120;--panel:#111a2c;--panel2:#0c1526;--ink:#e8eefb;--mut:#96a3ba;--line:#22304a;--blue:#8fb4e8;--blue2:#5b90e6}
  *{box-sizing:border-box}body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13px}
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 48px}
  header.top{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff;padding:14px 18px;border-radius:14px}
  header.top h1{margin:0;font-size:16px;font-weight:800}
  header.top .sub{font-size:11px;opacity:.9;margin-top:2px}
  .sp{flex:1}
  .htbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
  .card h2{margin:0 0 10px;font-size:14px;font-weight:800;color:var(--blue)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .f label{display:block;font-size:10px;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase}
  .f input,.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font-size:13px;font-weight:600}
  .f textarea{min-height:70px;resize:vertical}
  .f.full{grid-column:1/-1}
  .hint{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.45}
  .sigbox{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;background:var(--panel2);min-height:120px}
  .sigbox img{max-height:80px;max-width:100%}
  .btn{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--ink)}
  .btn.pri{background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff;border:0}
  .preview{border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:10px;background:#fff;color:#12233d}
  .preview .title{font-size:15px;font-weight:800;margin-bottom:8px}
  .preview .row{font-size:12px;margin:3px 0;color:#334}
  .preview .firm{margin-top:28px;display:flex;justify-content:flex-end}
  .preview .firm .b{text-align:center;min-width:200px}
  .preview .firm .line{border-top:1px solid #333;margin-top:48px;padding-top:6px;font-size:11px}
  @media print{.htbtn{display:none!important}body{background:#fff}.card{border:0;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Datos del proyecto</h1>
      <div class="sub">Portada · responsable · firma · aparecen en el informe e impresiones</div>
    </div>
    <div class="sp"></div>
    <button class="htbtn" type="button" id="btnSave">💾 Guardar</button>
    <button class="htbtn" type="button" id="themeBtn">🌙</button>
  </header>

  <section class="card">
    <h2>Identificación del proyecto</h2>
    <div class="grid">
      <div class="f full"><label>Nombre del proyecto</label><input id="projName" placeholder="Ej. Subestación y redes apto tipo Calle 5"></div>
      <div class="f"><label>Código / referencia</label><input id="projCode" placeholder="Ej. PROY-2026-014"></div>
      <div class="f"><label>Fecha</label><input id="projDate" type="date"></div>
      <div class="f full"><label>Cliente / propietario</label><input id="client" placeholder="Nombre o razón social"></div>
      <div class="f full"><label>Ubicación / dirección</label><input id="location" placeholder="Ciudad, dirección o predio"></div>
      <div class="f full"><label>Descripción breve</label><textarea id="desc" placeholder="Alcance del diseño eléctrico…"></textarea></div>
    </div>
  </section>

  <section class="card">
    <h2>Ingeniero responsable</h2>
    <div class="grid">
      <div class="f"><label>Nombre completo</label><input id="engName" placeholder="Ing. …"></div>
      <div class="f"><label>Matrícula / tarjeta profesional</label><input id="engTP" placeholder="TP …"></div>
      <div class="f"><label>Empresa / estudio</label><input id="engCo" placeholder="Opcional"></div>
      <div class="f"><label>Correo / contacto</label><input id="engMail" placeholder="opcional@"></div>
      <div class="f full"><label>Firma (imagen PNG/JPG, fondo transparente recomendado)</label>
        <input id="sigFile" type="file" accept="image/*">
      </div>
    </div>
    <div class="sigbox" id="sigPrev">
      <div class="hint" id="sigHint">Sin firma cargada. Puede subir una imagen de su firma.</div>
    </div>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" type="button" id="btnClearSig">Quitar firma</button>
      <button class="btn pri" type="button" id="btnSave2">Guardar datos</button>
    </div>
    <div class="hint">Estos datos se guardan en el navegador y salen en <b>todas las impresiones</b> de cada módulo (encabezado + firma) y en el Informe completo.</div>
  </section>

  <section class="card">
    <h2>Vista previa de portada</h2>
    <div class="preview" id="preview"></div>
  </section>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const KEY='suite_proyecto';
let S={projName:'',projCode:'',projDate:'',client:'',location:'',desc:'',engName:'Ing. Alexander Espinosa',engTP:'',engCo:'',engMail:'',sigData:''};

try{
  const j=JSON.parse(localStorage.getItem(KEY));
  if(j) S=Object.assign(S,j);
}catch(e){}
if(!S.projDate){
  const d=new Date();
  S.projDate=d.toISOString().slice(0,10);
}

function fill(){
  $("projName").value=S.projName||'';
  $("projCode").value=S.projCode||'';
  $("projDate").value=S.projDate||'';
  $("client").value=S.client||'';
  $("location").value=S.location||'';
  $("desc").value=S.desc||'';
  $("engName").value=S.engName||'';
  $("engTP").value=S.engTP||'';
  $("engCo").value=S.engCo||'';
  $("engMail").value=S.engMail||'';
  renderSig();
  renderPrev();
}
function read(){
  S.projName=$("projName").value.trim();
  S.projCode=$("projCode").value.trim();
  S.projDate=$("projDate").value;
  S.client=$("client").value.trim();
  S.location=$("location").value.trim();
  S.desc=$("desc").value.trim();
  S.engName=$("engName").value.trim();
  S.engTP=$("engTP").value.trim();
  S.engCo=$("engCo").value.trim();
  S.engMail=$("engMail").value.trim();
}
function save(){
  read();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  renderPrev();
  toast('Datos del proyecto guardados');
}
function renderSig(){
  const box=$("sigPrev");
  if(S.sigData){
    box.innerHTML='<img src="'+S.sigData+'" alt="Firma">';
  } else {
    box.innerHTML='<div class="hint" id="sigHint">Sin firma cargada. Puede subir una imagen de su firma.</div>';
  }
}
function renderPrev(){
  read();
  const firmImg=S.sigData?('<img src="'+S.sigData+'" alt="Firma" style="max-height:56px">'):'';
  $("preview").innerHTML=
    '<div class="title">'+(S.projName||'Nombre del proyecto')+'</div>'+
    '<div class="row"><b>Código:</b> '+(S.projCode||'—')+' · <b>Fecha:</b> '+(S.projDate||'—')+'</div>'+
    '<div class="row"><b>Cliente:</b> '+(S.client||'—')+'</div>'+
    '<div class="row"><b>Ubicación:</b> '+(S.location||'—')+'</div>'+
    '<div class="row"><b>Alcance:</b> '+(S.desc||'—')+'</div>'+
    '<div class="firm"><div class="b">'+firmImg+
    '<div class="line"><b>'+(S.engName||'Ingeniero responsable')+'</b><br>'+
    (S.engTP?('TP / Matrícula: '+S.engTP+'<br>'):'')+
    (S.engCo?(S.engCo+'<br>'):'')+
    'Responsable del diseño</div></div></div>';
}
function toast(msg){
  let el=document.getElementById('t');
  if(!el){el=document.createElement('div');el.id='t';
    el.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#12233d;color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;z-index:9;opacity:0;transition:.2s';
    document.body.appendChild(el);}
  el.textContent=msg;el.style.opacity='1';
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.opacity='0',1800);
}

$("sigFile").onchange=function(){
  const f=this.files&&this.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{S.sigData=r.result;renderSig();save();};
  r.readAsDataURL(f);
};
$("btnClearSig").onclick=()=>{S.sigData='';renderSig();save();};
$("btnSave").onclick=$("btnSave2").onclick=save;
['projName','projCode','projDate','client','location','desc','engName','engTP','engCo','engMail'].forEach(id=>{
  $(id).addEventListener('change',()=>{read();renderPrev();});
});
$("themeBtn").onclick=function(){
  const d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';
  d.dataset.theme=t;this.textContent=t==='dark'?'☀️':'🌙';
  try{localStorage.setItem('proj_theme',t);}catch(e){}
};
$("themeBtn").textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';
fill();
})();
@@CLOSE_SCRIPT@@
</body>
</html>

</script>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadoras de Acometida BT · Ing. Alexander Espinosa</title>
<script>(function(){try{var t=localStorage.getItem('acc_theme')||'light';document.documentElement.dataset.theme=t;}catch(e){}})();@@CLOSE_SCRIPT@@
<style>
  :root{--bg:#eef1f6;--panel:#fff;--panel2:#f4f7fb;--ink:#12233d;--mut:#5a6b85;--faint:#8a97ac;
    --line:#dbe3ee;--line2:#eef2f7;--blue:#123a63;--blue2:#1f5fd0;--sky:#3b74d0;--amber:#c07d00;--amberbg:#fff6e2;--amberln:#f0c257;
    --green:#0f9d63;--greenbg:#e7f7ef;--red:#d8434f;--redbg:#fdeced;
    --mono:'SFMono-Regular',ui-monospace,Consolas,monospace;--sans:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    --sh:0 1px 2px rgba(20,35,61,.06),0 12px 32px -18px rgba(20,35,61,.28)}
  [data-theme="dark"]{--bg:#0b1120;--panel:#111a2c;--panel2:#0c1526;--ink:#e8eefb;--mut:#96a3ba;--faint:#5d6b83;
    --line:#22304a;--line2:#182338;--blue:#8fb4e8;--blue2:#5b90e6;--sky:#6fa2e6;--amber:#f2b530;--amberbg:#2a2410;--amberln:#5c4a13;
    --green:#3ddc97;--greenbg:#0f2a20;--red:#f4626f;--redbg:#2c1417;--sh:0 1px 2px rgba(0,0,0,.4),0 16px 38px -20px rgba(0,0,0,.7)}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:20px 18px 60px}
  header.top{display:flex;align-items:center;gap:13px;background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff;padding:15px 20px;border-radius:15px;box-shadow:var(--sh)}
  .logo{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}.logo svg{width:26px;height:26px}
  header.top h1{margin:0;font-size:17px;font-weight:800;line-height:1.2}
  header.top .sub{font-size:11.5px;opacity:.9;font-weight:500;margin-top:2px}header.top .nm{font-size:11px;font-weight:800;color:#ffd873;margin-top:1px}
  .sp{flex:1}
  .htbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:15px}
  .htbtn.txt{width:auto;padding:0 13px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
  .tabbar{display:flex;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:5px;margin-top:14px;overflow-x:auto;box-shadow:var(--sh)}
  .tabbar button{border:0;background:transparent;color:var(--mut);font-weight:800;font-size:13px;padding:11px 17px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.12s;display:flex;align-items:center;gap:8px}
  .tabbar button .n{width:20px;height:20px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--mut)}
  .tabbar button.on{background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff}
  .tabbar button.on .n{background:rgba(255,255,255,.2);border-color:transparent;color:#fff}
  .tabpane{display:none}.tabpane.on{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--sh);padding:18px 20px;margin-top:16px}
  .card h2{margin:0 0 3px;font-size:14.5px;font-weight:800;color:var(--blue)}
  .card h2 .tag{font-size:10px;font-weight:700;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle}
  .card .desc{font-size:11.5px;color:var(--mut);margin-bottom:14px}
  .params{border-color:var(--amberln);background:linear-gradient(180deg,var(--amberbg),var(--panel) 60%)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .f label{display:block;font-size:10.5px;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
  .f input,.f select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .f input:focus,.f select:focus{outline:0;border-color:var(--blue2);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue2) 18%,transparent)}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;width:100%}
  .seg button{flex:1;border:0;background:transparent;color:var(--mut);font-weight:700;font-size:12px;padding:8px 6px;border-radius:7px;cursor:pointer}
  .seg button.on{background:var(--blue2);color:#fff}
  .presetbtn{border:1px solid var(--amberln);background:var(--amberbg);color:var(--amber);font-weight:800;font-size:12.5px;padding:9px 14px;border-radius:9px;cursor:pointer;width:100%}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:820px){.cols{grid-template-columns:1fr}}
  .subst{font-family:var(--mono);font-size:12px;line-height:1.9;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:4px;overflow-x:auto}
  .subst .op{color:var(--mut)}.subst b{color:var(--blue2)}
  table.calc{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px}
  table.calc td{padding:8px 10px;border-bottom:1px solid var(--line2)}
  table.calc td.lbl{color:var(--ink)}table.calc td.lbl small{color:var(--faint);font-family:var(--mono);font-size:10.5px}
  table.calc td.val{text-align:right;font-family:var(--mono);font-weight:800;white-space:nowrap}
  table.calc td.un{width:60px;color:var(--mut);font-size:11px}
  table.calc tr.hi td{background:var(--blue);color:#fff;font-weight:800;border:0}table.calc tr.hi td.lbl{color:#fff}table.calc tr.hi td.un{color:rgba(255,255,255,.8)}
  .result{margin-top:14px;display:flex;align-items:center;gap:14px;border-radius:12px;padding:13px 16px}
  .result.g{background:var(--greenbg);border:1px solid color-mix(in srgb,var(--green) 40%,var(--line))}
  .result.r{background:var(--redbg);border:1px solid color-mix(in srgb,var(--red) 40%,var(--line))}
  .result .big{font-family:var(--mono);font-size:26px;font-weight:900;line-height:1}.result.g .big{color:var(--green)}.result.r .big{color:var(--red)}
  .result .txt{font-size:12px;color:var(--mut);font-weight:600}.result .txt b{color:var(--ink)}
  .toggle2{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:12px}
  .chk{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:10px;cursor:pointer}
  .sw{position:relative;width:40px;height:22px;background:var(--line);border-radius:99px;cursor:pointer;transition:.15s;flex:none}.sw.on{background:var(--blue2)}
  .sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}.sw.on i{left:20px}
  table.comp{width:100%;border-collapse:collapse;font-size:12px}
  table.comp th{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:700;text-align:right;padding:8px 9px;border-bottom:1.5px solid var(--line)}
  table.comp th:first-child{text-align:left}
  table.comp td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:right;font-family:var(--mono);font-weight:600}
  table.comp td:first-child{text-align:left;font-family:var(--sans);font-weight:700}
  table.comp tr.cur td{background:color-mix(in srgb,var(--blue2) 12%,transparent)}
  table.comp .b{color:var(--blue2);font-weight:800}
  .rev{border-color:var(--amberln)}.rev h2{color:var(--amber)}
  .revitem{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12px;line-height:1.5}.revitem:last-child{border-bottom:0}
  .revitem .ico{flex:none;width:22px;height:22px;border-radius:6px;background:var(--amberbg);color:var(--amber);display:grid;place-items:center;font-weight:900;font-size:12px}
  .revitem b{color:var(--ink)}.revitem .mono{font-family:var(--mono);color:var(--blue2);font-weight:700}
  .notes{font-size:11.5px;color:var(--mut);line-height:1.6}.notes b{color:var(--ink)}.notes ul{margin:6px 0 0;padding-left:18px}.notes li{margin-bottom:5px}
  .disc{margin-top:16px;font-size:11px;color:var(--mut);background:var(--amberbg);border-left:3px solid var(--amberln);border-radius:0 9px 9px 0;padding:11px 14px;line-height:1.55}
  .foot{text-align:center;font-size:10.5px;color:var(--faint);margin-top:20px}
  @media print{body{background:#fff}.htbtn,.tabbar,.presetbtn{display:none!important}header.top{box-shadow:none}.card{box-shadow:none;break-inside:avoid}.wrap{max-width:none;padding:0}.tabpane{display:block!important;page-break-before:always}.tabpane:first-of-type{page-break-before:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg></div>
    <div>
      <h1>Calculadoras de Acometida — Baja Tensión</h1>
      <div class="sub">Paso 4 · Ik3/Ik1 del operador de red · Icc en trafo · capacidad de corte · fusible MT · NTC 2050 / RETIE</div>
      <div class="nm">Ing. Alexander Espinosa</div>
    </div>
    <div class="sp"></div>
    <button class="htbtn txt" onclick="window.print()">⭳ PDF</button>
    <button class="htbtn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </header>

  <nav class="tabbar" id="tabbar">
    <button data-t="cc" class="on" onclick="showTab('cc')"><span class="n">1</span>Cortocircuito y fusible</button>
    <button data-t="pa" onclick="showTab('pa')"><span class="n">2</span>Pérdidas y ampacidad</button>
    <button data-t="ik" onclick="showTab('ik')"><span class="n">3</span>Interruptor y área económica</button>
</nav>

  <!-- ==================== TAB 1: CORTOCIRCUITO ==================== -->
  <section class="tabpane on" id="pane-cc">
    <section class="card params">
      <h2>Parámetros de cálculo</h2>
      <div class="desc">Cambia la capacidad y los datos; las tablas se recalculan en vivo. Campos en ámbar dependen de la red / criterio del diseñador.</div>
      <div class="grid">
        <div class="f"><label>Capacidad (kVA)</label><input id="c_pKva" type="number" step="0.5" list="c_kvaList" value="112.5">
          <datalist id="c_kvaList"><option value="15"><option value="30"><option value="45"><option value="75"><option value="112.5"><option value="150"><option value="225"><option value="300"><option value="400"><option value="500"><option value="630"><option value="750"><option value="1000"><option value="1250"><option value="1500"></datalist>
        </div>
        <div class="f"><label>Tipo de transformador</label><select id="c_pPh"><option value="3" selected>Trifásico (√3)</option><option value="1">Monofásico (sin √3)</option></select></div>
        <div class="f"><label>V secundario (V)</label><input id="c_pVsec" type="number" step="1" value="208"></div>
        <div class="f"><label>V primario / MT (kV)</label><input id="c_pVmt" type="number" step="0.1" value="13.2"></div>
        <div class="f"><label>Z transformador (%)</label><input id="c_pZ" type="number" step="0.1" value="4.5"></div>
        <div class="f"><label>Factor asimetría</label><input id="c_pAsim" type="number" step="0.01" value="1.25"></div>
        <div class="f"><label>Factor seguridad fusible</label><input id="c_pFs" type="number" step="0.1" value="1.5"></div>
      </div>
      <div class="grid" style="margin-top:12px">
        <div class="f" style="grid-column:span 2"><label>Impedancia de la red (fuente)</label>
          <div class="seg" id="c_modeSeg"><button data-m="inf">Barra infinita</button><button data-m="icc" class="on">Icc de red (MT)</button><button data-m="zc">Zc manual</button></div>
        </div>
        <div class="f" id="c_fIcc"><label>Icc de red en MT (kA)</label><input id="c_pIcc" type="number" step="0.1" value="10"></div>
        <div class="f" id="c_fZc" style="display:none"><label>Zc red (p.u.)</label><input id="c_pZc" type="number" step="0.00001" value="0.00057"></div>
        <div class="f" style="display:flex;align-items:flex-end"><button class="presetbtn" id="c_presetDoc">↺ Cargar ejemplo de cálculo</button></div>
      </div>
    </section>
    <div class="cols">
      <section class="card">
        <h2>Cálculo de cortocircuito <span class="tag">Corte de protección</span></h2>
        <table class="calc" id="c_tCC"></table>
        <div class="result g" id="c_resCC"></div>
      </section>
      <section class="card">
        <h2>Cálculo de fusible <span class="tag">Distribución / ramal MT</span></h2>
        <table class="calc" id="c_tFus"></table>
        <div class="result g" id="c_resFus"></div>
        <div class="desc" style="margin:12px 0 0">El fusible se dimensiona en el <b>lado primario (MT)</b>: corriente nominal del primario × factor de seguridad → <b>tipo K</b> comercial inmediato superior.</div>
      </section>
    </div>
    <section class="card">
      <h2>Comparativa por capacidad</h2>
      <div class="desc">Mismos criterios del panel aplicados a las capacidades estándar. La fila de tu capacidad queda resaltada.</div>
      <div class="toggle2"><span>Z% del panel</span><div class="sw on" id="c_swZ"><i></i></div><span>Z% típico por capacidad</span></div>
      <div style="overflow-x:auto"><table class="comp" id="c_tComp"></table></div>
    </section>
    <section class="card">
      <h2>Notas técnicas</h2>
      <div class="notes"><ul>
        <li><b>Datos del operador de red:</b> la <b>Ik3</b> (falla simétrica trifásica) y la <b>Ik1</b> (falla monofásica / a tierra) en el punto de conexión MT las entrega el OR. No se inventan: se usan como dato de entrada.</li>
        <li><b>Capacidad interruptiva (NTC 2050 Art. 110-9 / 110-10):</b> el interruptor en BT debe tener capacidad de interrupción ≥ corriente de falla en sus bornes; se elige el comercial inmediato superior al <b>Icc asimétrico</b> calculado en el secundario del trafo.</li>
        <li><b>Fusible de distribución / ramal MT:</b> se dimensiona con la corriente nominal del primario del transformador × factor de seguridad → tipo K comercial inmediato superior (práctica de distribución).</li>
        <li><b>Impedancia de red:</b> en el secundario BT el Icc lo limita principalmente la Z del trafo. «Barra infinita» (Zc=0) es lo más común. El doc usó Zc=0,00057 p.u. (P<sub>cc</sub> con ≈11,4 kV); con 13,2 kV daría 0,00049 — diferencia despreciable.</li>
        <li><b>Fusible tipo K:</b> además de la corriente, verificar coordinación con la curva de daño del trafo y la corriente de energización (inrush ≈ 8–12·I<sub>n</sub>, ~0,1 s).</li>
      </ul></div>
    </section>
  </section>

  <!-- ==================== TAB 2: PÉRDIDAS Y AMPACIDAD ==================== -->
  <section class="tabpane" id="pane-pa">
    <section class="card params">
      <h2>Conductor y acometida</h2>
      <div class="desc">Datos comunes a ambos cálculos.</div>
      <div class="grid">
        <div class="f"><label>Material</label><select id="p_mat"><option value="al" selected>Aluminio</option><option value="cu">Cobre</option></select></div>
        <div class="f"><label>Calibre</label><select id="p_cal"></select></div>
        <div class="f"><label>Sección S (mm²)</label><input id="p_sec" type="number" step="0.1" readonly></div>
        <div class="f"><label>Longitud L (m)</label><input id="p_len" type="number" step="1" value="30"></div>
        <div class="f"><label>Conduct. // por fase</label><input id="p_npar" type="number" step="1" min="1" value="3"></div>
        <div class="f"><label>Fases</label><select id="p_ph"><option value="3" selected>3 (trifásico)</option><option value="1">1 (monofásico)</option></select></div>
        <div class="f"><label>Corriente de fase (A)</label><input id="p_iph" type="number" step="0.1" value="312.27"></div>
      </div>
    </section>
    <div class="cols">
      <section class="card">
        <h2>Pérdidas económicas <span class="tag">E = ρ·(L/S)·I²·t</span></h2>
        <div class="grid" style="margin-bottom:12px">
          <div class="f"><label>Precio energía ($/kWh)</label><input id="p_price" type="number" step="1" value="700"></div>
          <div class="f"><label>Factor de pérdidas (0–1)</label><input id="p_flp" type="number" step="0.01" min="0" max="1" value="1"></div>
          <div class="f"><label>T° operación (°C)</label><input id="p_top" type="number" step="1" value="20"></div>
        </div>
        <div class="subst" id="p_subst"></div>
        <table class="calc" id="p_tPerd"></table>
        <div class="result g" id="p_resPerd"></div>
      </section>
      <section class="card">
        <h2>Verificación por ampacidad <span class="tag">NTC 2050 Tabla 310-16</span></h2>
        <div class="grid" style="margin-bottom:12px">
          <div class="f"><label>Columna aislamiento</label><select id="p_col"><option value="90" selected>90 °C (RHW-2/THHN)</option><option value="75">75 °C (THW)</option></select></div>
          <div class="f"><label>Factor temperatura</label><input id="p_ftemp" type="number" step="0.01" value="0.94"></div>
          <div class="f"><label>Factor agrupamiento</label><input id="p_fagr" type="number" step="0.01" value="1.0"></div>
        </div>
        <table class="calc" id="p_tAmp"></table>
        <div class="result g" id="p_resAmp"></div>
        <div class="desc" id="p_term75" style="margin:12px 0 0"></div>
      </section>
    </div>
    <section class="card rev">
      <h2>⚠ Revisión del cálculo económico original</h2>
      <div class="desc">El procedimiento del documento subestima la pérdida. Para que sea defendible conviene corregir:</div>
      <div class="revitem"><div class="ico">1</div><div><b>Unidades.</b> ρ = 28,26·10⁻⁹ Ω·m debe usarse con S en <b>m²</b>, o ρ = <span class="mono">0,02826 Ω·mm²/m</span> con S en mm². Mezclarlas dejó el resultado ~<b>1000× bajo</b> (una barra a 312 A disipa ≈ <span class="mono">770 Wh/h</span>).</div></div>
      <div class="revitem"><div class="ico">2</div><div><b>Reparto en paralelo.</b> Con 3 conductores/fase cada uno lleva <span class="mono">≈104 A</span>, no 312 A.</div></div>
      <div class="revitem"><div class="ico">3</div><div><b>Las tres fases.</b> La acometida tiene <b>9 conductores</b> (3×3); el ×3 del documento cubre una sola fase.</div></div>
      <div class="revitem"><div class="ico">✓</div><div><b>Corregido</b> (carga plena, $700/kWh): ≈ <span class="mono">771 W → 18,5 kWh/día → $12.950/día</span>. Con factor de pérdidas real baja proporcionalmente.</div></div>
    </section>
  </section>

  <!-- ==================== TAB 3: INTERRUPTOR Y ÁREA ECONÓMICA ==================== -->
  <section class="tabpane" id="pane-ik">
    <section class="card params">
      <h2>Datos del sistema</h2>
      <div class="desc">Comunes a los dos cálculos.</div>
      <div class="grid">
        <div class="f"><label>Potencia (VA)</label><input id="k_pow" type="number" step="100" value="112500"></div>
        <div class="f"><label>V (L-L)</label><input id="k_v" type="number" step="1" value="208"></div>
        <div class="f"><label>Fases</label><select id="k_ph"><option value="3" selected>3 (trifásico)</option><option value="1">1 (monofásico)</option></select></div>
        <div class="f"><label>Conduct. // por fase</label><input id="k_npar" type="number" step="1" min="1" value="3"></div>
      </div>
    </section>
    <div class="cols">
      <section class="card">
        <h2>Interruptor totalizador <span class="tag">125 % carga continua</span></h2>
        <div class="grid" style="margin-bottom:6px"><div class="f"><label>Factor de seguridad</label><input id="k_fs" type="number" step="0.05" value="1.25"></div></div>
        <table class="calc" id="k_tBrk"></table>
        <div class="result g" id="k_resBrk"></div>
        <div class="desc" id="k_brkNote" style="margin:12px 0 0"></div>
      </section>
      <section class="card">
        <h2>Área económica del conductor <span class="tag">Ley de Kelvin</span></h2>
        <div class="grid" style="margin-bottom:12px">
          <div class="f"><label>Material</label><select id="k_mat"><option value="al" selected>Aluminio</option><option value="cu">Cobre</option></select></div>
          <div class="f"><label>Calibre escogido</label><select id="k_cal"></select></div>
          <div class="f"><label>Tarifa energía ($/kWh)</label><input id="k_ce" type="number" step="1" value="700"></div>
          <div class="f"><label>Costo conductor ($/kg)</label><input id="k_cc" type="number" step="100" value="18000"></div>
          <div class="f"><label>Horas servicio (h/año)</label><input id="k_tau" type="number" step="1" value="2515"></div>
          <div class="f"><label>Interés anual (%)</label><input id="k_i" type="number" step="1" value="22"></div>
          <div class="f"><label>Factor de potencia</label><input id="k_fp" type="number" step="0.01" value="0.95"></div>
          <div class="f"><label>% de carga estimada</label><input id="k_load" type="number" step="1" value="65"></div>
        </div>
        <div class="subst" id="k_substK"></div>

<!-- ===== MÓDULO 1: CORTOCIRCUITO ===== -->
<script>
(function(){
  const P='c_', $=id=>document.getElementById(P+id);
  const R3=Math.sqrt(3);
  
  // Sincroniza kVA y tipo (1φ/3φ) desde Paso 2 (demanda / transformador)
  try{
    var _dem=JSON.parse(localStorage.getItem('dem_state')||'{}');
    if(_dem && _dem.kvaTx && document.getElementById('c_pKva')){
      document.getElementById('c_pKva').value=_dem.kvaTx;
    }
    if(_dem && (_dem.tipo==='1'||_dem.tipo==='3') && document.getElementById('c_pPh')){
      document.getElementById('c_pPh').value=_dem.tipo;
    }
    if(_dem && _dem.uz && document.getElementById('c_pZ')){
      document.getElementById('c_pZ').value=_dem.uz;
    }
  }catch(e){}

  const BRK=[5,7.5,10,15,18,22,25,35,42,50,65,85,100,125];
  const FUS=[1,2,3,6,8,10,12,15,20,25,30,40,50,65,80,100,140,200];
  const KVAS=[15,30,45,75,112.5,150,225,300,400,500,630,750,1000,1250,1500];
  let mode='icc', useZtyp=true;
  function ztyp(k){if(k<=30)return 2.5;if(k<=75)return 3.5;if(k<=150)return 4.5;if(k<=300)return 5;if(k<=630)return 5.5;if(k<=1000)return 5.75;return 6.5;}
  /** Factor de fases: trifásico √3; monofásico 1 (S=V·I). NTC 2050 / práctica IEC. */
  function phaseK(){
    const ph=parseInt(($("pPh")&&$("pPh").value)||3,10);
    return ph===1 ? 1 : R3;
  }
  function calc(kVA,Zpct){
    const Vsec=parseFloat($("pVsec").value)||208, Vmt=parseFloat($("pVmt").value)||13.2;
    const kAsim=parseFloat($("pAsim").value)||1.25, fs=parseFloat($("pFs").value)||1.5;
    const ph=parseInt(($("pPh")&&$("pPh").value)||3,10);
    const k=ph===1?1:R3; // mono: sin √3 · tri: √3
    const Ibase=kVA*1000/(k*Vsec), Vbase=Vsec/1000, Ztr=Zpct/100;
    let Zc=0,Pcc=null,Icc_red=null;
    // Potencia de cortocircuito de red: en 3φ Pcc=√3·V·Ik; en 1φ Pcc=V·Ik (misma tensión de referencia)
    if(mode==='icc'){Icc_red=parseFloat($("pIcc").value)||0; Pcc=k*Vmt*Icc_red*1000; Zc=Pcc>0?kVA/Pcc:0;}
    else if(mode==='zc'){Zc=parseFloat($("pZc").value)||0;}
    const Ztot=Ztr+Zc, Icc=Ibase/Ztot, Iasim=Icc*kAsim, brk=nextComm(Iasim/1000,BRK);
    const Iprim=kVA/(k*Vmt), IfusCalc=Iprim*fs, fus=nextComm(IfusCalc,FUS);
    return {Vsec,Vmt,kAsim,fs,Ibase,Vbase,Ztr,Zc,Pcc,Icc_red,Ztot,Icc,Iasim,brk,Iprim,IfusCalc,fus,ph,k};
  }
  function render(){
    const kVA=parseFloat($("pKva").value)||112.5, Zpct=parseFloat($("pZ").value)||4.5, r=calc(kVA,Zpct);
    const row=(l,s,v,u,cls='')=>`<tr class="${cls}"><td class="lbl">${l}${s?` <small>${s}</small>`:''}</td><td class="val">${v}</td><td class="un">${u}</td></tr>`;
    const formI=r.ph===1?'kVA/V':'kVA/(√3·V)';
    const formP=r.ph===1?'V·Ik':'√3·V·Ik';
    let cc='';
    cc+=row(r.ph===1?'Ik simétrica (OR · MT)':'Ik3 simétrica trifásica (OR · MT)','Dato operador de red', mode==='inf'?'∞ (barra infinita)':(mode==='icc'?es(r.Icc_red,2)+' kA':'—'), '');
    const ik1=parseFloat($('c_pIk1')&&$('c_pIk1').value)||0;
    cc+=row('Ik1 monofásica / tierra (OR · MT)','Dato operador de red', mode==='icc'?es(ik1,2)+' kA':'—','');
    cc+=row('Ik1 usada en chequeo tierra','Informativa (OR)', mode==='icc'?es(ik1*1000,0):'—', mode==='icc'?'A':'');
    cc+=row('Tipo de transformador','', r.ph===1?'Monofásico (S = V·I)':'Trifásico (S = √3·V·I)','');
    cc+=row('kVA Base','', es(kVA,kVA%1?1:0),'kVA');
    cc+=row('I Base',formI, es(r.Ibase,2),'A');
    cc+=row('Z Transformador','', es(r.Ztr,3),'p.u.');
    cc+=row('V Base','', es(r.Vbase,3),'kV');
    cc+=row('Zc red','= kVA/Pcc ('+formP+')'+(r.Pcc?` (Pcc ${es(r.Pcc/1000,1)} MVA)`:''), es(r.Zc,5),'p.u.');
    cc+=row('Z total','= Ztrafo + Zc', es(r.Ztot,5),'p.u.');
    cc+=row('Icc simétrico','= I Base / Z total', es(r.Icc,0),'A');
    cc+=row('Icc asimétrico','= Icc × '+es(r.kAsim,2), es(r.Iasim,0),'A');
    cc+=row('Capacidad mínima del interruptor','', es(r.brk,r.brk%1?1:0),'kA C.I.','hi');
    $("tCC").innerHTML=cc;
    $("resCC").innerHTML=`<div class="big">${es(r.brk,r.brk%1?1:0)} kA</div><div class="txt">Interruptor con <b>capacidad ≥ ${es(r.Iasim,0)} A</b> (Icc asimétrico). Comercial inmediato superior.</div>`;
    let fu='';
    fu+=row('Potencia','', es(kVA*1000,0),'VA');
    fu+=row('Corriente primario', formI.replace('V', es(r.Vmt,1)+' kV'), es(r.Iprim,2),'A');
    fu+=row('Amp × Fact. Seg. ('+es(r.fs,1)+')','', es(r.IfusCalc,1),'A');
    fu+=row('Fusible escogido','tipo K', es(r.fus,0),'A','hi');
    $("tFus").innerHTML=fu;
    $("resFus").innerHTML=`<div class="big">${es(r.fus,0)} K</div><div class="txt">Cortacircuito <b>${es(r.fus,0)} A tipo K</b> en el primario (${es(r.Vmt,1)} kV). Verificar coordinación con el trafo.</div>`;
    let c=`<thead><tr><th>Capacidad</th><th>Z%</th><th>I Base</th><th>Icc sim</th><th>Icc asim</th><th>Interruptor</th><th>I prim</th><th>Fusible</th></tr></thead><tbody>`;
    const list=[...new Set([...KVAS,kVA])].sort((a,b)=>a-b);
    for(const k of list){const z=useZtyp?ztyp(k):Zpct, rr=calc(k,z), cur=Math.abs(k-kVA)<1e-6;
      c+=`<tr class="${cur?'cur':''}"><td>${es(k,k%1?1:0)} kVA</td><td>${es(z,1)}</td><td>${es(rr.Ibase,0)} A</td><td>${es(rr.Icc,0)} A</td><td>${es(rr.Iasim,0)} A</td><td class="b">${es(rr.brk,rr.brk%1?1:0)} kA</td><td>${es(rr.Iprim,1)} A</td><td class="b">${es(rr.fus,0)} K</td></tr>`;}
    c+=`</tbody>`;$("tComp").innerHTML=c;
    // Persistir resultados para informe y otros módulos
    try{
      const ik1=parseFloat(($("pIk1")&&$("pIk1").value)||0)||0;
      localStorage.setItem('acc_state', JSON.stringify({
        kVA: kVA, Zpct: Zpct, Vsec: r.Vsec, Vmt: r.Vmt, ph: r.ph,
        Ibase: r.Ibase, Icc: r.Icc, Iasim: r.Iasim, brk: r.brk,
        Iprim: r.Iprim, fus: r.fus, IfusCalc: r.IfusCalc,
        Icc_red: r.Icc_red, Ztot: r.Ztot, Ztr: r.Ztr, Zc: r.Zc,
        kAsim: r.kAsim, fs: r.fs, mode: mode, ik1: ik1,
        ts: Date.now()
      }));
    }catch(e){}
  }
  function setMode(m){mode=m;$("modeSeg").querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$("fIcc").style.display=m==='icc'?'':'none';$("fZc").style.display=m==='zc'?'':'none';render();}
  function toggleZtyp(){useZtyp=!useZtyp;$("swZ").classList.toggle('on',useZtyp);render();}
  function loadDoc(){$("pKva").value=112.5;$("pVsec").value=208;$("pVmt").value=13.2;$("pZ").value=4.5;$("pAsim").value=1.25;$("pFs").value=1.5;setMode('zc');$("pZc").value=0.00057;render();}
  $("modeSeg").querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
  $("presetDoc").addEventListener('click',loadDoc);
  $("swZ").addEventListener('click',toggleZtyp);
  ['pKva','pVsec','pVmt','pZ','pAsim','pFs','pIcc','pIk1','pZc'].forEach(id=>{if($(id))$(id).addEventListener('input',render);});
  if($('pPh'))$('pPh').addEventListener('change',render);
  render();
})();
@@CLOSE_SCRIPT@@

<!-- ===== MÓDULO 2: PÉRDIDAS Y AMPACIDAD ===== -->
<script>
(function(){
  const P='p_', $=id=>document.getElementById(P+id);
  const R3=Math.sqrt(3);
  const CB={'8':[8.37,40,45,50,55],'6':[13.3,50,60,65,75],'4':[21.15,65,75,85,95],'3':[26.67,75,85,100,110],
   '2':[33.62,90,100,115,130],'1':[42.41,100,115,130,145],'1/0':[53.48,120,135,150,170],'2/0':[67.43,135,150,175,195],
   '3/0':[85.01,155,175,200,225],'4/0':[107.2,180,205,230,260],'250':[126.7,205,230,255,290],'300':[152,230,260,285,320],
   '350':[177.3,250,280,310,350],'400':[202.7,270,305,335,380],'500':[253.4,310,350,380,430],'600':[304,340,385,420,475],'750':[380,385,435,475,535]};
  const RHO20={al:0.02826,cu:0.0172}, ALPHA={al:0.00403,cu:0.00393};
  function fillCal(){$("cal").innerHTML=Object.keys(CB).map(k=>`<option value="${k}" ${k==='4/0'?'selected':''}>${k} AWG${['250','300','350','400','500','600','750'].includes(k)?' kcmil':''}</option>`).join('');}
  function amp(cal,mat,col){const d=CB[cal];if(!d)return 0;return col==='75'?(mat==='al'?d[1]:d[3]):(mat==='al'?d[2]:d[4]);}
  function render(){
    const mat=$("mat").value, cal=$("cal").value, d=CB[cal]||CB['4/0'], S=d[0]; $("sec").value=es(S,1);
    const L=parseFloat($("len").value)||0, n=Math.max(1,parseFloat($("npar").value)||1), ph=parseInt($("ph").value), Iph=parseFloat($("iph").value)||0;
    const price=parseFloat($("price").value)||0, flp=parseFloat($("flp").value)||0, Top=parseFloat($("top").value)||20;
    const rho=RHO20[mat]*(1+ALPHA[mat]*(Top-20));
    const Ic=Iph/n, Rc=rho*L/S, Rph=Rc/n, Pc=Ic*Ic*Rc, Pph=Iph*Iph*Rph, Ptot=Pph*ph;
    const Eday=Ptot/1000*24*flp, Emonth=Eday*30, Eyear=Eday*365;
    $("subst").innerHTML=
      `ρ(${mat==='al'?'Al':'Cu'}, ${es(Top,0)}°C) <span class="op">=</span> <b>${es(rho,5)}</b> Ω·mm²/m<br>`+
      `R_c <span class="op">= ρ·L/S =</span> ${es(rho,5)}·${es(L,0)}/${es(S,1)} <span class="op">=</span> <b>${es(Rc,5)}</b> Ω<br>`+
      `I_c <span class="op">= I/n =</span> ${es(Iph,1)}/${es(n,0)} <span class="op">=</span> <b>${es(Ic,2)}</b> A<br>`+
      `P_c <span class="op">= I_c²·R_c =</span> ${es(Ic,1)}²·${es(Rc,5)} <span class="op">=</span> <b>${es(Pc,1)}</b> W<br>`+
      `P_total <span class="op">= P_c · n · fases =</span> ${es(Pc,1)}·${es(n,0)}·${ph} <span class="op">=</span> <b>${es(Ptot,1)}</b> W`;
    const rp=(l,s,v,u,cls='')=>`<tr class="${cls}"><td class="lbl">${l}${s?` <small>${s}</small>`:''}</td><td class="val">${v}</td><td class="un">${u}</td></tr>`;
    let tp='';
    tp+=rp('Pérdida por conductor','',es(Pc,1),'W');
    tp+=rp('Pérdida por fase','('+es(n,0)+' // )',es(Pph,1),'W');
    tp+=rp('Pérdida total','('+ph*n+' conductores)',es(Ptot,1),'W');
    tp+=rp('Energía por día','×24 h ×'+es(flp,2),es(Eday,2),'kWh');
    tp+=rp('Energía por mes','',es(Emonth,1),'kWh');
    tp+=rp('Energía por año','',es(Eyear,0),'kWh');
    $("tPerd").innerHTML=tp;
    $("resPerd").innerHTML=`<div class="big">${money(Eday*price)}/día</div><div class="txt">Costo de pérdidas: <b>${money(Emonth*price)}/mes</b> · <b>${money(Eyear*price)}/año</b> — a ${money(price)}/kWh, factor ${es(flp,2)}.</div>`;
    const col=$("col").value, ft=parseFloat($("ftemp").value)||0, fa=parseFloat($("fagr").value)||0;
    const base=amp(cal,mat,col), corr=base*ft*fa, tot=corr*n, ok=tot>=Iph, marg=Iph>0?((tot-Iph)/Iph*100):0;
    let ta='';
    ta+=rp('Ampacidad base',cal+' '+(mat==='al'?'Al':'Cu')+' @'+col+'°C',es(base,0),'A');
    ta+=rp('× Factor temperatura','',es(ft,2),'');
    ta+=rp('× Factor agrupamiento','',es(fa,2),'');
    ta+=rp('Ampacidad corregida','por conductor',es(corr,1),'A');
    ta+=rp('Ampacidad total','× '+es(n,0)+' en paralelo',es(tot,1),'A','hi');
    $("tAmp").innerHTML=ta;
    $("resAmp").className='result '+(ok?'g':'r');
    $("resAmp").innerHTML=`<div class="big">${ok?'✓':'✗'} ${es(tot,0)} A</div><div class="txt">${ok?'Cumple':'NO cumple'}: ${es(tot,0)} A ${ok?'≥':'<'} ${es(Iph,1)} A de carga${ok?` · margen +${es(marg,0)}%`:''}.</div>`;
    const b75=amp(cal,mat,'75'),tot75=b75*ft*fa*n;
    $("term75").innerHTML=`<b>Límite terminal 75 °C (Art. 110-14(c)):</b> ${cal} ${mat==='al'?'Al':'Cu'} @75°C = ${es(b75,0)} A → ×${es(n,0)} = ${es(tot75,0)} A ${tot75>=Iph?'≥':'<'} ${es(Iph,0)} A ${tot75>=Iph?'(también cumple)':'(revisar)'}.`;
  }
  fillCal();
  ['mat','cal','len','npar','ph','iph','price','flp','top','col','ftemp','fagr'].forEach(id=>$(id).addEventListener('input',render));
  render();
})();

<!-- ===== MÓDULO 3: INTERRUPTOR Y ÁREA ECONÓMICA ===== -->
<script>
(function(){
  const P='k_', $=id=>document.getElementById(P+id);
  const R3=Math.sqrt(3);
  const BRK=[15,20,25,30,40,50,60,70,80,90,100,110,125,150,160,175,200,225,250,300,350,400,450,500,600,630,700,800,1000,1200,1250,1600,2000,2500];
  const CB={'8':8.37,'6':13.3,'4':21.15,'2':33.62,'1':42.41,'1/0':53.48,'2/0':67.43,'3/0':85.01,'4/0':107.2,'250':126.7,'300':152,'350':177.3,'400':202.7,'500':253.4,'600':304,'750':380};

    $("resBrk").innerHTML=`<div class="big">${es(brk,0)} A</div><div class="txt">Totalizador comercial ≥ <b>${es(Iseg,0)} A</b> (125 % de ${es(Iph,0)} A).</div>`;

      `num <span class="op">= ρ·τ·c_e =</span> ${es(M.rho,5)}·${es(tau,0)}·${es(ce,4)} <span class="op">=</span> <b>${es(num,3)}</b><br>`+
      `den <span class="op">= δ·c_c·(1+i) =</span> ${es(deltaLin,5)}·${es(cc,0)}·${es(1+i,2)} <span class="op">=</span> <b>${es(den,3)}</b><br>`+
      `A_c <span class="op">= I_c·√(num/den) =</span> ${es(Ic,1)}·√(${es(num/den,4)}) <span class="op">=</span> <b>${es(Ac,2)}</b> mm²`;
    $("tKel").innerHTML=
      rb('Conductor escogido',cal+' '+(mat==='al'?'Al':'Cu'),es(Ae,1),'mm²')+
      rb('Corriente por conductor','',es(Ic,2),'A')+
      rb('Área mínima económica (Ac)','Kelvin',es(Ac,1),'mm²')+

    $("resKel").innerHTML=`<div class="big">${ok?'✓':'✗'} ${es(Ae,1)} mm²</div><div class="txt">${ok?'CUMPLE':'NO cumple'}: Ae ${ok?'≥':'<'} Ac (${es(Ac,1)} mm²)${ok?` · margen +${es(marg,0)}%`:` · conviene subir de calibre`}.</div>`;
  }
  function toggleLoad(){useLoad=!useLoad;$("swLoad").classList.toggle('on',useLoad);render();}
  $("loadLbl").addEventListener('click',toggleLoad);
  fillCal();
  ['pow','v','ph','npar','fs','mat','cal','ce','cc','tau','i','fp','load'].forEach(id=>$(id).addEventListener('input',render));
  render();
})();

<script>
const $=id=>document.getElementById(id);const PI=Math.PI;
const VBW=1040,VBH=600;
const cv=$("cv");
// calibres cobre desnudo: [mm², diámetro m]
const CU={'4':[21.2,0.00519],'2':[33.6,0.00654],'1/0':[53.5,0.00825],'2/0':[67.4,0.00927],'3/0':[85.0,0.0104],'4/0':[107.2,0.01168],'250':[126.7,0.0127],'350':[177.3,0.01503],'500':[253.0,0.0179]};
let S={tab:'v3d', cam:{az:34,el:24,s:26}, viewP:{x0:-2,y0:-2,s:34}, drag:null};
try{const j=JSON.parse(localStorage.getItem('spt_state'));if(j){S=Object.assign(S,j);S.drag=null;}}catch(e){}
function save(){try{const p=P(),g=geom(p);localStorage.setItem('spt_state',JSON.stringify({tab:S.tab,cam:S.cam,viewP:S.viewP,p,g,ts:Date.now()}));}catch(e){}}
const es=(x,d)=>Number(x).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});
function cvar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';}

function P(){
  const Ik_kA=+$("eIk").value||0, Fc=+$("eFc").value||1.25;
  const tms=+$("eTms").value||300, ts=Math.max(0.05, tms/1000);
  const IG=Ik_kA*1000*Fc;
  return {
    kva:+$("eKva").value||112.5, Zt:+$("eZt").value||0.04,
    Vat:+$("eVat").value||13200, Vbt:+$("eVbt").value||208,
    Ik_kA, Fc, Pmot:+$("ePmot").value||0, tms, ts, join:($("eJoin")&&$("eJoin").value)||'sold',
    L:+$("gL").value||4, W:+$("gW").value||4, D:+$("gD").value||1, h:+$("gH").value||0.6,
    cola:+$("gCola").value||0, cont:+$("gCont").value||0, cal:$("gCal").value||'2/0',
    NR:Math.max(0,+$("gNR").value||0), Lr:+$("gLr").value||2.4,
    rho:+$("sRho").value||20, rhos:+$("sRhos").value||10000, hs:+$("sHs").value||0.1,
    IG, kg:($("fKg")&&$("fKg").value)||'70', Rlim:+$("fRlim").value||10
  };
}
function geom(p){
  const nx=Math.max(2,Math.round(p.W/p.D)+1), ny=Math.max(2,Math.round(p.L/p.D)+1);
  const Lgrid=nx*p.L+ny*p.W;
  const LC=Lgrid+(p.cola||0)+(p.cont||0);
  const LR=p.NR*p.Lr, LT=LC+LR, A=p.L*p.W;
  return {nx,ny,Lgrid,LC,LR,LT,A};
}
function seccionTermica(I, tc, join){
  const TCAP=3.42, K0=234.5, Ta=40, Tm=join==='pern'?250:1084;
  const ar=0.00393, rr=1.72;
  const lnTerm=Math.log((K0+Tm)/(K0+Ta));
  return I*Math.sqrt(tc*(ar*rr)/(TCAP*1e-4*lnTerm));
}
function pickCalibre(mm2){
  const order=['4','2','1/0','2/0','3/0','4/0','250','350','500'];
  let chosen='2/0';
  for(const k of order){
    const a=(CU[k]||[0])[0];
    if(a>=Math.max(mm2,67.4)){ chosen=k; break; }
  }
  if((CU[chosen]||[0])[0]<67.4) chosen='2/0';
  return chosen;
}
function calc(){
  const p=P(), g=geom(p);
  const d=(CU[p.cal]||CU['2/0'])[1], Lp=2*(p.L+p.W);
  const Rg=p.rho*(1/g.LT + 1/Math.sqrt(20*g.A)*(1+1/(1+p.h*Math.sqrt(20/g.A))));
  const GPR=p.IG*Rg;
  const na=2*g.LC/Lp, nb=Math.sqrt(Lp/(4*Math.sqrt(g.A))), n=na*nb, Ki=0.644+0.148*n;
  const Kh=Math.sqrt(1+p.h), Kii=1;
  const Km=(1/(2*PI))*(Math.log(p.D*p.D/(16*p.h*d)+(p.D+2*p.h)**2/(8*p.D*d)-p.h/(4*d))+(Kii/Kh)*Math.log(8/(PI*(2*n-1))));
  const LM=g.LC+(1.55+1.22*(p.Lr/Math.sqrt(p.L*p.L+p.W*p.W)))*g.LR;
  const Em=p.rho*p.IG*Km*Ki/LM;
  const Ks=(1/PI)*(1/(2*p.h)+1/(p.D+p.h)+(1/p.D)*(1-0.5**Math.max(0,n-2)));
  const LS=0.75*g.LC+0.85*g.LR;
  const Es=p.rho*p.IG*Ks*Ki/LS;
  const Cs=1-0.09*(1-p.rho/p.rhos)/(2*p.hs+0.09);
  const k=p.kg==='50'?0.116:0.157;
  const Etouch=(1000+1.5*Cs*p.rhos)*k/Math.sqrt(p.ts);
  const Estep=(1000+6*Cs*p.rhos)*k/Math.sqrt(p.ts);
  const seccS=seccionTermica(p.IG,p.ts,'sold'), seccP=seccionTermica(p.IG,p.ts,'pern');
  const secc=p.join==='pern'?seccP:seccS;
  const calCalc=pickCalibre(secc);
  const calArea=(CU[p.cal]||CU['2/0'])[0];
  const okSec=calArea+1e-6>=Math.max(secc,67.4);
  const okR=Rg<=p.Rlim, okM=Em<=Etouch, okS=Es<=Estep, okGPR=GPR<=Etouch;
  const okSimp=n<25 && p.h>0.25 && p.h<2.5 && d<0.25*p.h && p.D<=3.0;
  return {p,g,Rg,GPR,n,Ki,Km,Em,Ks,Es,Cs,Etouch,Estep,secc,seccS,seccP,calCalc,okSec,okR,okM,okS,okGPR,okSimp};
}
// posiciones de varillas — distribución simétrica respecto a ambos ejes
function rods(p){
  const N=Math.max(0,Math.round(p.NR)), L=p.L, W=p.W, set=[];
  const add=(x,z)=>{if(!set.some(q=>Math.abs(q[0]-x)<1e-6&&Math.abs(q[1]-z)<1e-6))set.push([x,z]);};
  if(N<=0) return set;
  if(N===1){add(L/2,W/2);return set;}
  if(N===2){add(L/2,0);add(L/2,W);return set;}
  if(N===3){add(L/2,W/2);add(L/2,0);add(L/2,W);return set;}
  // N>=4: esquinas + repartición uniforme y simétrica por bordes; varilla central si es impar
  const center=(N%2===1)?1:0, Np=N-center, sum=Np/2+2; // 2·mL+2·mW-4 = Np
  let mL=Math.round(sum*L/(L+W)), mW=sum-mL;             // rods por borde (incluye esquinas), ∝ longitud
  if(mL<2){mW-=(2-mL);mL=2;} if(mW<2){mL-=(2-mW);mW=2;}
  for(let i=0;i<mL;i++){const x=L*i/(mL-1);add(x,0);add(x,W);}  // bordes largos (simétrico en x)
  for(let j=0;j<mW;j++){const z=W*j/(mW-1);add(0,z);add(L,z);}  // bordes cortos (simétrico en z)
  if(center)add(L/2,W/2);
  return set;
}

/* ===== proyección 3D ===== */
function proj(x,y,z){const p=P(),cx=p.L/2,cz=p.W/2,cy=-(p.h+p.Lr)/2;
  const az=S.cam.az*PI/180,el=S.cam.el*PI/180,s=S.cam.s;
  let X=x-cx,Y=y-cy,Z=z-cz;
  let x1=X*Math.cos(az)+Z*Math.sin(az), z1=-X*Math.sin(az)+Z*Math.cos(az), y1=Y;
  let y2=y1*Math.cos(el)-z1*Math.sin(el), depth=y1*Math.sin(el)+z1*Math.cos(el);
  return [VBW/2+x1*s, VBH/2+40-y2*s, depth];}

/* ===== RENDER ===== */
function render(){
  $("tabs").querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  const c=calc();
  $("rBadge").textContent='Rg '+es(c.Rg,2)+' Ω';
  // resultados
  const pill=ok=>`<span class="pill ${ok?'ok':'bad'}">${ok?'CUMPLE':'REVISAR'}</span>`;
  $("resBox").innerHTML=
    `<div class="kv"><span class="k">If asimétrica (Fc·Ik)</span><span class="v">${es(c.p.IG,0)} A</span></div>`+
    `<div class="kv"><span class="k">L cable sin electrodos</span><span class="v">${es(c.g.LC,1)} m</span></div>`+
    `<div class="kv"><span class="k">L total (c/electrodos)</span><span class="v">${es(c.g.LT,1)} m</span></div>`+
    `<div class="kv"><span class="k">Sección térmica calc.</span><span class="v">${es(c.secc,1)} mm²</span></div>`+
    `<div class="kv"><span class="k">Calibre calc. → sel.</span><span class="v">${c.calCalc} → ${c.p.cal} ${pill(c.okSec)}</span></div>`+
    `<div class="kv"><span class="k">Rm (Sverak)</span><span class="v">${es(c.Rg,2)} Ω ${pill(c.okR)}</span></div>`+
    `<div class="kv"><span class="k">GPR = If·Rm</span><span class="v">${es(c.GPR,0)} V ${pill(c.okGPR)}</span></div>`+
    `<div class="kv"><span class="k">E paso / tolerable</span><span class="v">${es(c.Es,0)} / ${es(c.Estep,0)} V ${pill(c.okS)}</span></div>`+
    `<div class="kv"><span class="k">E malla / contacto tol.</span><span class="v">${es(c.Em,0)} / ${es(c.Etouch,0)} V ${pill(c.okM)}</span></div>`+
    `<div class="kv"><span class="k">Método simplificado</span><span class="v">${c.okSimp?'Válido':'Revisar n,h,D'}</span></div>`;
  const all=c.okR&&c.okM&&c.okS&&c.okSec;
  $("statusBox").innerHTML=`<div class="stat ${all?'ok':'bad'}"><span class="dot"></span>${all?'¡¡¡Cumple requisitos!!! IEEE 80 + RETIE ✓':'REVISAR: no cumple alguna verificación'}</div>`+
    (c.p.rho<50?`<div class="stat bad" style="margin-top:6px"><span class="dot"></span>ρ&lt;50 Ω·m: anexar registros de medición (IEEE 81 / RETIE)</div>`:'')+
    (!c.okGPR?`<div class="stat bad" style="margin-top:6px"><span class="dot"></span>GPR &gt; E contacto: validar paso y malla (criterio Excel)</div>`:'');
  if(S.tab==='v3d')render3D(c);else renderPlan(c);
  renderHud(c);save();
}
function renderHud(c){
  let h;
  if(S.tab==='v3d')h=`Rg <b>${es(c.Rg,2)} Ω</b><br>varillas <b>${c.p.NR}×${es(c.p.Lr,1)}m</b><br>prof <b>${es(c.p.h,1)} m</b><br>az <b>${Math.round(S.cam.az)}°</b> el <b>${Math.round(S.cam.el)}°</b>`;
  else h=`malla <b>${es(c.p.L,1)}×${es(c.p.W,1)}m</b><br>sep <b>${es(c.p.D,1)} m</b><br>nodos <b>${c.g.nx}×${c.g.ny}</b>`;
  $("hud").innerHTML=h;
}

/* ---------- 3D ---------- */
function render3D(c){
  $("viewHelp").innerHTML=`<b>Vista 3D.</b> Arrastra para rotar. Malla de cobre enterrada a ${es(c.p.h,1)} m + ${c.p.NR} varillas de ${es(c.p.Lr,1)} m. El bloque muestra el volumen de suelo.`;
  $("legend").innerHTML=`<div class="row"><span class="lg-l" style="border-color:var(--copper)"></span>Conductor de malla (Cu)</div><div class="row"><span class="lg-l" style="border-color:var(--amber)"></span>Varilla / electrodo</div><div class="row"><span class="lg-d" style="background:var(--surf);opacity:.5"></span>Superficie tratada</div><div class="row"><span class="lg-d" style="background:var(--soil);opacity:.3"></span>Suelo</div>`;
  const p=c.p, L=p.L,W=p.W,h=p.h,Lr=p.Lr, botY=-(h+Lr+0.6);
  let g='';
  // grilla de superficie (referencia)
  const pad=Math.max(1.5,L*0.2);
  for(let x=-pad;x<=L+pad;x+=Math.max(1,Math.round(L/6))){const a=proj(x,0,-pad),b=proj(x,0,W+pad);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--grid')}" stroke-width="1"/>`;}
  for(let z=-pad;z<=W+pad;z+=Math.max(1,Math.round(W/5))){const a=proj(-pad,0,z),b=proj(L+pad,0,z);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--grid')}" stroke-width="1"/>`;}
  // bloque de suelo (caras traseras + laterales, semitransparente) con painter
  const corners=[[0,0,0],[L,0,0],[L,0,W],[0,0,W],[0,botY,0],[L,botY,0],[L,botY,W],[0,botY,W]];
  const F=[[0,1,2,3,'top'],[4,5,6,7,'bot'],[0,1,5,4,'s'],[1,2,6,5,'s'],[2,3,7,6,'s'],[3,0,4,7,'s']];
  const faces=F.map(f=>{const Pp=f.slice(0,4).map(k=>proj(corners[k][0],corners[k][1],corners[k][2]));return {Pp,depth:(Pp[0][2]+Pp[1][2]+Pp[2][2]+Pp[3][2])/4,kind:f[4]};}).sort((a,b)=>a.depth-b.depth);
  for(const f of faces){if(f.kind==='top')continue;const pts=f.Pp.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');g+=`<polygon points="${pts}" fill="${cvar('--soil')}" fill-opacity="${f.kind==='bot'?.12:.16}" stroke="${cvar('--soil')}" stroke-width="1" stroke-opacity=".5"/>`;}
  // capa superficial (losa fina en y=0)
  if(p.hs>0){const sc=[[0,0,0],[L,0,0],[L,0,W],[0,0,W]].map(q=>proj(q[0],0,q[2]));g+=`<polygon points="${sc.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="${cvar('--surf')}" fill-opacity=".28" stroke="${cvar('--surf')}" stroke-width="1.3"/>`;}
  // malla enterrada (y=-h)
  const nx=c.g.nx, ny=c.g.ny;
  for(let i=0;i<nx;i++){const z=W*i/(nx-1),a=proj(0,-h,z),b=proj(L,-h,z);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--copper')}" stroke-width="2" stroke-opacity=".95"/>`;}
  for(let j=0;j<ny;j++){const x=L*j/(ny-1),a=proj(x,-h,0),b=proj(x,-h,W);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--copper')}" stroke-width="2" stroke-opacity=".95"/>`;}
  // varillas (de -h hacia abajo)
  for(const [x,z] of rods(p)){const a=proj(x,-h,z),b=proj(x,-h-Lr,z);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--amber')}" stroke-width="3.2"/><circle cx="${b[0]}" cy="${b[1]}" r="3.4" fill="${cvar('--amber')}"/>`;}
  // cota de profundidad
  const t0=proj(0,0,0),t1=proj(0,-h,0);g+=`<line x1="${t0[0]}" y1="${t0[1]}" x2="${t1[0]}" y2="${t1[1]}" stroke="${cvar('--mut')}" stroke-width="1" stroke-dasharray="3 3"/><text x="${t1[0]-6}" y="${(t0[1]+t1[1])/2}" text-anchor="end" font-size="10" fill="${cvar('--mut')}" font-family="var(--mono)">h=${es(h,1)}m</text>`;
  // ejes
  const o=proj(0,0,0),ax=proj(Math.min(L,3)+0.5,0,0),az=proj(0,0,Math.min(W,3)+0.5);
  g+=`<text x="${ax[0]}" y="${ax[1]}" font-size="10" fill="${cvar('--red')}" font-weight="800">L</text><text x="${az[0]}" y="${az[1]}" font-size="10" fill="${cvar('--cyan')}" font-weight="800">W</text>`;
  cv.innerHTML=g;
  try{applyLineWeight();}catch(e){}
}

/* ---------- PLANTA ---------- */
function W2S(x,z){const v=S.viewP;return [40+(x-v.x0)*v.s, VBH-40-(z-v.y0)*v.s];}
function S2W(px,pz){const v=S.viewP;return [v.x0+(px-40)/v.s, v.y0+(VBH-40-pz)/v.s];}
function renderPlan(c){
  $("viewHelp").innerHTML=`<b>Planta (vista superior).</b> Retícula ${es(c.p.L,1)}×${es(c.p.W,1)} m, separación ${es(c.p.D,1)} m (${c.g.nx}×${c.g.ny} conductores). Puntos = varillas.`;
  $("legend").innerHTML=`<div class="row"><span class="lg-l" style="border-color:var(--copper)"></span>Conductor Cu</div><div class="row"><span class="lg-d" style="background:var(--amber);border-radius:50%"></span>Varilla ${es(c.p.Lr,1)} m</div>`;
  const p=c.p, nx=c.g.nx, ny=c.g.ny;
  let g='';
  // área
  const A=W2S(0,0),B=W2S(p.L,p.W);g+=`<rect x="${Math.min(A[0],B[0])}" y="${Math.min(A[1],B[1])}" width="${Math.abs(B[0]-A[0])}" height="${Math.abs(B[1]-A[1])}" fill="${cvar('--soil')}" fill-opacity=".08" stroke="none"/>`;
  // conductores
  for(let i=0;i<nx;i++){const z=p.W*i/(nx-1),a=W2S(0,z),b=W2S(p.L,z);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--copper')}" stroke-width="2"/>`;}
  for(let j=0;j<ny;j++){const x=p.L*j/(ny-1),a=W2S(x,0),b=W2S(x,p.W);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cvar('--copper')}" stroke-width="2"/>`;}
  // varillas
  for(const [x,z] of rods(p)){const q=W2S(x,z);g+=`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="${cvar('--amber')}" stroke="${cvar('--panel')}" stroke-width="1.5"/>`;}
  // cotas
  const c0=W2S(0,0),cL=W2S(p.L,0),cW=W2S(0,p.W);
  g+=`<line x1="${c0[0]}" y1="${c0[1]+22}" x2="${cL[0]}" y2="${cL[1]+22}" stroke="${cvar('--mut')}" stroke-width="1"/><text x="${(c0[0]+cL[0])/2}" y="${c0[1]+36}" text-anchor="middle" font-size="11" fill="${cvar('--mut')}" font-family="var(--mono)">L = ${es(p.L,1)} m</text>`;
  g+=`<line x1="${c0[0]-22}" y1="${c0[1]}" x2="${cW[0]-22}" y2="${cW[1]}" stroke="${cvar('--mut')}" stroke-width="1"/><text x="${c0[0]-28}" y="${(c0[1]+cW[1])/2}" text-anchor="end" font-size="11" fill="${cvar('--mut')}" font-family="var(--mono)">W = ${es(p.W,1)} m</text>`;
  cv.innerHTML=g;
  try{applyLineWeight();}catch(e){}
}

/* ===== interacción ===== */
cv.addEventListener('mousedown',down);cv.addEventListener('touchstart',down,{passive:false});
window.addEventListener('mousemove',move);window.addEventListener('touchmove',move,{passive:false});
window.addEventListener('mouseup',()=>{S.drag=null;cv.classList.remove('grabbing');});window.addEventListener('touchend',()=>{S.drag=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();if(S.tab==='v3d'){S.cam.s=Math.max(6,Math.min(90,S.cam.s*(e.deltaY<0?1.1:1/1.1)));}else{S.viewP.s=Math.max(8,Math.min(120,S.viewP.s*(e.deltaY<0?1.1:1/1.1)));}render();},{passive:false});
function evt(e){const r=cv.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX),cy=(e.touches?e.touches[0].clientY:e.clientY);return [(cx-r.left)/r.width*VBW,(cy-r.top)/r.height*VBH];}
function down(e){const[vx,vy]=evt(e);if(S.tab==='v3d'){S.drag={t:'rot',sx:vx,sy:vy,az:S.cam.az,el:S.cam.el};}else{S.drag={t:'pan',sx:vx,sy:vy,x0:S.viewP.x0,y0:S.viewP.y0};}cv.classList.add('grabbing');e.preventDefault();}
function move(e){if(!S.drag)return;e.preventDefault();const[vx,vy]=evt(e);
  if(S.drag.t==='rot'){S.cam.az=S.drag.az+(vx-S.drag.sx)*0.4;S.cam.el=Math.max(2,Math.min(84,S.drag.el+(vy-S.drag.sy)*0.4));render();}
  else{const[ox,oy]=S2W(S.drag.sx,S.drag.sy),[wx,wy]=S2W(vx,vy);S.viewP.x0=S.drag.x0+(ox-wx);S.viewP.y0=S.drag.y0+(oy-wy);render();}}

/* ===== acciones ===== */
function setTab(t){S.tab=t;render();fitView();}
function zoom(f){if(S.tab==='v3d')S.cam.s=Math.max(6,Math.min(90,S.cam.s*f));else S.viewP.s=Math.max(8,Math.min(120,S.viewP.s*f));render();}
function fitView(){const p=P();if(S.tab==='v3d'){S.cam.s=Math.max(8,Math.min(70,(VBW*0.5)/Math.max(p.L,p.W,p.h+p.Lr,3)));}else{const pad=1.5,span=Math.max(p.L,p.W)+2*pad;S.viewP.s=Math.min((VBW-140)/(p.L+2*pad),(VBH-120)/(p.W+2*pad));S.viewP.x0=-pad;S.viewP.y0=-pad;}render();}
function toggleTheme(){const d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=t;$("themeBtn").textContent=t==='dark'?'🌙':'☀️';try{localStorage.setItem('spt_theme',t);}catch(e){}render();}
let tt;function toast(m){const e=$("toast");e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1600);}

/* ===== materiales ===== */
function openMat(){
  const c=calc(),p=c.p,cal=p.cal,mm2=(CU[cal]||CU['2/0'])[0];
  const nx=c.g.nx,ny=c.g.ny, uniones=nx*ny, conCu=Math.round(c.g.LC*1.05);
  $("matSub").textContent=`Malla ${es(p.L,1)}×${es(p.W,1)} m · ${cal} AWG Cu · ${p.NR} varillas ${es(p.Lr,1)} m · IEEE 80`;
  const G=t=>`<tr class="grp"><td colspan="4">${t}</td></tr>`;
  const row=(d,sub,q,u)=>`<tr><td>${d}${sub?`<br><small style="color:var(--mut)">${sub}</small>`:''}</td><td></td><td class="n">${q}</td><td>${u}</td></tr>`;
  let h=`<table class="mt"><thead><tr><th>Descripción</th><th></th><th class="n">Cant.</th><th>Un</th></tr></thead><tbody>`;
  h+=G('Conductores y electrodos');
  h+=row('Cable de cobre desnudo '+cal+' AWG ('+es(mm2,1)+' mm²)','malla enterrada a '+es(p.h,1)+' m',conCu,'m');
  h+=row('Varilla de puesta a tierra Cu-bonded 5/8"×'+es(p.Lr,1)+' m','electrodos verticales',p.NR,'Un');
  h+=G('Conexiones (soldadura exotérmica)');
  h+=row('Soldadura exotérmica cable-cable (cruz/T)','uniones de retícula',uniones,'Un');
  h+=row('Soldadura exotérmica cable-varilla','conexión a electrodos',p.NR,'Un');
  h+=row('Molde y cartuchos / conector certificado','Cadweld (nVent) o equivalente','1','glb');
  h+=G('Obra civil y tratamiento');
  h+=row('Mejorador de suelo (GEM / carbón mineral)','para ρ='+es(p.rho,0)+' Ω·m',Math.max(1,p.NR),'sacos');
  h+=row('Cámara de inspección 30×30 cm con tapa','medición y mantenimiento',Math.max(1,Math.round(p.NR/3)),'Un');
  h+=row('Excavación de zanja','profundidad '+es(p.h,1)+' m',Math.round(c.g.LC),'m');
  h+=row('Capa superficial (grava/concreto) ρ='+es(p.rhos,0),'espesor '+es(p.hs,2)+' m',Math.round(p.L*p.W),'m²');
  h+=`</tbody></table>`;
  $("matBody").innerHTML=h;
  $("matNote").innerHTML=`Cantidades <b>estimadas para presupuesto preliminar</b> según la geometría de la malla. Verificar la resistividad real del terreno (Wenner, RETIE Art. 3.12.4.1), la corriente de falla con el operador de red, y ejecutar todas las uniones con <b>soldadura exotérmica</b> sin medios de desconexión (RETIE Art. 3.12.2). El conductor del electrodo y de tierra debe ser de cobre (NTC 2050 Art. 250-64/250-70).`;
  $("matov").classList.add('show');
}
function closeMat(){$("matov").classList.remove('show');}

/* init */
$("gCal").innerHTML=Object.keys(CU).map(k=>`<option value="${k}" ${k==='2/0'?'selected':''}>${k} AWG · ${es(CU[k][0],1)} mm²</option>`).join('');
$("themeBtn").textContent=document.documentElement.dataset.theme==='dark'?'🌙':'☀️';
const IDS=['eKva','eZt','eVat','eVbt','eIk','eFc','ePmot','eTms','eJoin','gL','gW','gD','gH','gCola','gCont','gCal','gNR','gLr','sRho','sRhos','sHs','fKg','fRlim'];
IDS.forEach(id=>{const el=$(id); if(el){el.addEventListener('input',render); el.addEventListener('change',render);}});
function seedFromSuite(){
  try{
    const dem=JSON.parse(localStorage.getItem('dem_state')||'{}');
    const acc=JSON.parse(localStorage.getItem('acc_state')||'{}');
    if(dem.kvaTx && $('eKva')) $('eKva').value=dem.kvaTx;
    if(dem.uz!=null && $('eZt')) $('eZt').value=(Number(dem.uz)/100).toFixed(3);
    if(acc.Vmt && $('eVat')) $('eVat').value=Math.round(Number(acc.Vmt)*1000);
    if(acc.Vsec && $('eVbt')) $('eVbt').value=acc.Vsec;
    if(acc.Icc_red!=null && $('eIk')) $('eIk').value=acc.Icc_red;
    else if(acc.Icc!=null && $('eIk')) $('eIk').value=(Number(acc.Icc)/1000).toFixed(2);
    if(acc.kAsim && $('eFc')) $('eFc').value=acc.kAsim;
    if(typeof toast==='function') toast('Datos traídos de Demanda / Cortocircuito');
    render();
  }catch(e){ if(typeof toast==='function') toast('No hay datos previos'); }
}
window.seedFromSuite=seedFromSuite;
(function(){
  const sel=$('gCal'); if(!sel) return;
  sel.innerHTML=Object.keys(CU).map(k=>'<option value="'+k+'"'+(k==='2/0'?' selected':'')+'>'+k+' AWG ('+CU[k][0]+' mm²)</option>').join('');
})();
render();fitView();

@@CLOSE_SCRIPT@@
</body>
